      - total'' confirmed there among 1,938 total codes -- but ''A2''/''A3''/''A5''/''A6''/''A7''/''A14''
      do NOT appear in it under any description, despite being common real values
      here (checked directly, not just absent from a sample). A real discrepancy between
      this archive''s own PARAM usage and icesVocab''s published list, not investigated
      further -- candidate for DATRAS-known-issues.yaml once that registry exists
      (see AGENTS.md). Not retyped enum regardless: 1,938 codes is far past the seed''s
      VOCAB_CODE_LIMIT of 20. 50 distinct values, 2 of 79,451 rows unpopulated. Verified
      2026-07-29 against the full LT archive.'
  - name: LTSZC
    type: string
    examples:
    - A
    - B
    - C
    - D
    - '13'
    details: 'Litter size class code (mix of letter and numeric codes), no description
      present. icesVocab''s LTSZC list confirms all five (checked 2026-07-29): ''A''=''squared
      centimetre <5*5cm=25cm2'' through ''D''=''<50*50cm=2500cm2'' (area-based classes),
      ''13''=''centimetre 15-49.99cm'' (a length-based class) -- two different measurement
      bases coexisting under one code list. 23 of 41 official codes observed here;
      not retyped enum since 41 exceeds the seed''s VOCAB_CODE_LIMIT of 20. 16,508
      of 79,451 rows unpopulated. Verified 2026-07-29 against the full LT archive.'
  - name: UnitWeight
    type: string
    examples:
    - kg/haul
    - g/haul
    details: Unit of the sibling LT_Weight field (see LT_Weight's own details below);
      exactly 2 values observed across the full archive (48,758 kg/haul, 26,437 g/haul),
      4,256 of 79,451 rows unpopulated. No description present to confirm this is
      the complete valid unit set. Verified 2026-07-29 against the full LT archive.
  - name: LT_Weight
    type: number(quantity)
    description: Weight of the litter category in units specified by the previous
      field
    range:
    - 0.0
    - 1600000.0
    details: 'Unit varies by the sibling UnitWeight field (kg/haul for 46,673 rows,
      g/haul for 24,383, unspecified for 276), so no fixed units here. Two exclusions,
      2026-07-29: -99 (3 rows, kg/haul) as an isolated sentinel-like anomaly, and
      46,318,000 (1 row, g/haul) as a lone outlier roughly 29x the next-highest real
      value (1,600,000) -- an implausible ~46 tonnes of litter in one haul, almost
      certainly a data-entry error. The rest of the g/haul group''s own large values
      (up to 1,600,000g = 1.6 tonnes) are kept: rare, but large litter catches (e.g.
      old fishing gear, major debris items) are plausible.'
    label: Total Litter Weight (kg)
  - name: UnitItem
    type: string
    examples:
    - items/haul
    details: Unit of the sibling LT_Items field (see LT_Items's own details below);
      only one value ever observed (79,415 of 79,451 rows), 36 unpopulated -- a single
      example, not five, because no second real value exists in the archive to show.
      Verified 2026-07-29 against the full LT archive.
  - name: LT_Items
    type: number(quantity)
    description: '"Number of items within the given litter category (by type, size,
      and additional parameters) in units specified by the previous field"'
    range:
    - 0.0
    - 2323.0
    details: 'UnitItem is ''items/haul'' for all but 36 of 76,882 populated rows --
      effectively a fixed count, no exclusions needed: no isolated outlier or repeating
      marker pattern, just a smooth decline from the max.'
    label: Total Item Count
