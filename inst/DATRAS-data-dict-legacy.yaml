  - name: StomSamp
    type: enum
    description: >-
      Flag whether stomach sampling was performed
    values:
    - '-9'
    - 'Y'
    - 'N'
    details: >-
      Field's own description ('Flag whether stomach sampling was performed')
      confirms boolean intent. Of the full CA archive: -9 is present and dominant
      (4,861,583 rows, 82.9%); N: 964,090 (16.4%); Y: 39,403 (0.67%); zero other values.
