    type: enum
    description: Biological sample type
    values:
    - '-9'
    - LB
    - OT
    - SC
    - VR
    label: Age Determination Method
  - name: AgePrepMet
    type: enum
    description: Preparation method of the sampled tissue
    values:
    - '-9'
    - BK
    - BR
    - CP
    - 'NO'
    - WA
    - WO
    label: Specimen Preparation for Aging
  - name: OtGrading
    type: enum
    description: Grading of the otolith reading
    values:
    - '-9'
    - '1'
    - '2'
    - '3'
    - '4'
  - name: ParSamp
    type: enum
    description: Flag whether parasites sampling was performed
    values:
    - 'Y'
    - 'N'
    details: |-
      Field's own description ('Flag whether parasites sampling was performed')
      confirms boolean intent; verified 100% clean two-value split against the full
      archive, 2026-07-29 (N: 893,790 rows; Y: 76,620; zero other values across
      970,410 non-null rows, 4,996,540 unpopulated).
  - name: MaturityScale
    type: enum
    description: |-
      Maturity scale type used in the Maturity field. From 2021 only M6 and SMSF will
      be accepted for new submissions.
    values:
    - '-9'
    - M1
    - M10
    - M4
    - M5
    - M6
    - MRF6
    - R1
    - R2
    - S6
    - SMSF
  - name: DateofCalculation
    type: number(ordinal)
    range:
    - 20120419
    - .inf
    details: |-
      8-digit YYYYMMDD stamp, digit order (month before day) verified consistent
      across all four Tier 1 tables. Upper bound deliberately left open: a live,
      continuously-advancing ICES Datacenter 'last recalculated' stamp, not submitted
      by data providers, so a fixed max would go stale immediately. Lower bound is
      this table's own verified minimum -- NOT forced identical across tables the way
      SweepLngt/HaulNo/Year are, since a genuine table-specific difference is
      plausible here (confirmed: LT's own minimum is years later).
  - name: Valid_Aphia
    type: number(id)
    details: |-
      See known issue valid_aphia_type_mismatch (DATRAS-known-issues.yaml, not yet
      filed): ICES's WSDL declares this field character, but the live service always
      returns it numeric -- it's a WoRMS AphiaID (an identifier, hence number(id), not
      a quantity). CA's own instance was missed when HL's Valid_Aphia was originally
      filled (found 2026-07-29 via validate-spec's S07 check) -- same concept as HL's
      Valid_Aphia (ICES Datacenter's validated AphiaID) but a different sampling
      population (aged individuals only), so queried independently rather than assumed
      identical (Working principles, rule 12). 667 distinct values, 0 unpopulated
      (always present). Verified 2026-07-29 against the full CA archive.
    examples:
    - 213
    - 105872
    - 126412
    - 141452
    - 1667212
  label: Age Composition (Individual)
  description: Each row is one aged fish specimen from a haul. Contains individual-level
    biological measurements (length, weight, age, sex, maturity) on a subsample of
    the catch; linked to HH via the composite haul identifier.
  details: 'Grain: each row is one biological specimen (a single aged fish) from a
    haul. Population: individual organisms sampled and measured from hauls within
    covered surveys, not the full catch <U+2014> a subsample. Linked to HH via the composite
    haul identifier (Survey + Year + Quarter + Country + Platform/Ship + Gear + StationName/StNo
    + HaulNumber). Critical note (corrected 2026-08-07; see DATRAS-known-issues.yaml
    issue ca_haulno_unlinkable_to_hh): HaulNumber/HaulNo contains 0 true nulls --
    288,581 rows (4.92% of 5,865,076) instead carry a -9 sentinel, which violates
    the column''s declared range ([0, 82483]; a D04_range violation, confirmed via
    op_flag_violations()), not the required constraint (D01 never fires here). These
    rows match no HH haul on the full 8-field composite key, or on the 7 non-HaulNumber
    fields alone -- not a join-key problem, but genuinely orphaned CA records. A separate,
    much smaller residual (700 rows, 0.01%) with a plausible HaulNumber also fails
    to match HH; cause not yet diagnosed.'
