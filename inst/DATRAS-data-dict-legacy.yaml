    range:
    - 1
    - 218
    details: >-
      Distinct population from HL's own NumberAtLength (HLNoAtLngt): this
      counts aged individuals only, not the whole catch, hence the much smaller scale
      -- not assumed identical.
    constraints:
    - required
  - name: IndWgt
