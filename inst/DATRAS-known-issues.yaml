# DATRAS Known Issues & Sentinel Values Registry
#
# Opus-specific extension to data-dict.yaml spec v0.1.0
# Documents: sentinels, known violations, data quality issues
#
# Version: 0.1.0 (draft)
# Last updated: 2026-08-05

# Sentinel values that mean "missing/not recorded"
# Applied during Phase 2 parsing before type casting
sentinels:
  global:
    - value: "-9"
      meaning: "Not recorded / not applicable"
      context: "Default DATRAS sentinel for numeric columns"

  field_specific:
    - field: HaulDuration
      table: "HH"
      values: ["-9", "0"]
      meaning: "Zero or negative time indicates missing/invalid"

    - field: AgeSource
      table: "CA"
      values: ["-1", "-5", "-95"]
      meaning: "Not determined age source"

# Known Data Quality Issues (Tier 1 validation, 2026-07-29)
known_violations:
  - id: "haul_number_nullable"
    severity: "D"
    field: "HaulNumber"
    table: "CA"
    constraint: "required"
    extent: "305,276 null values (5.12% of 5.97M rows)"
    implication: "Use composite 8-field haul key for joins, not HaulNumber alone"
    discovered: "2026-07-29"

  - id: "swell_height_numeric"
    severity: "D"
    field: "SwellHeight"
    table: "HH"
    issue: "Possible encoding issues"
    discovered: "2026-07-29"

  - id: "icesVocab_gaps"
    severity: "C"
    issue: "DATRAS enum codes don't fully match icesVocab vocabulary"
    examples: ["GearExceptions (only 'B' in vocab)", "PARAM in LT (1,938 vocab codes, 50 real values)"]
    discovered: "2026-07-29"

# Processing directives
processing:
  phase2:
    apply_sentinels: true
    strict_type_casting: true
    record_issues: true

  phase3:
    known_violations_baseline: true
    expect_haul_number_nulls: true
    expect_vocab_gaps: true
