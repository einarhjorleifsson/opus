# DATRAS Known Issues & Sentinel Values Registry
#
# Opus-specific extension to data-dict.yaml spec v0.1.0
# Documents: sentinels, known violations, data quality issues
#
# Version: 0.1.0 (draft)
# Last updated: 2026-08-18
#
# `scope` (added 2026-08-17, one TODO.md item overdue -- see DEVLOG.md's
# same-date entry for the concrete findings this restructure was designed
# around, not guessed at in the abstract): every known_violations entry is
# now tagged with the level of escalation it actually represents --
#   "field-level"  -- one specific field/table finding (e.g. one column's
#                     own -9 orphan rate). The common case.
#   "systemic"     -- a recurring pattern spanning multiple, otherwise-
#                     unrelated fields via one shared root cause (e.g.
#                     icesvocab_key_resolution_hazard, datras_field_list_type_divergence).
#                     Escalate these with higher priority: fixing the
#                     pattern's cause resolves every instance at once,
#                     unlike a field-level fix.
#   "opus-internal" -- not ICES's issue at all; opus's own pipeline bug,
#                     tracked here for institutional memory, never a
#                     candidate for ICES escalation.
# Lets a future escalation-candidate pass (TODO.md) filter on this
# directly instead of re-reading every entry's prose to classify it.

# Sentinel values that mean "missing/not recorded"
# Applied during Phase 2 parsing before type casting
sentinels:
  global:
    - value: "-9"
      meaning: "Not recorded / not applicable"
      context: "Default DATRAS sentinel for numeric columns"

  field_specific:
    - field: HaulDuration
      table: "HH"
      values: ["-9", "0"]
      meaning: "Zero or negative time indicates missing/invalid"

    - field: AgeSource
      table: "CA"
      values: ["-1", "-5", "-95"]
      meaning: "Not determined age source"

    - field: Tickler
      table: "HH, LT"
      values: ["-9"]
      meaning: "No ticklers are allowed (icesVocab TS_Tickler code -- a real, meaningful answer, not a missing value). Dominant, not rare: 113,645 of 145,958 HH rows (78%) and 30,690 of 75,310 LT rows (41%)."

    - field: Age
      table: "CA"
      values: ["-9", "-1", "-5", "-95"]
      meaning: "'-9' (1,995,814 rows, 34% of all CA rows) is the dominant, standard 'not recorded' case -- not visible until 2026-08-16 (see known_violations: sentinel_replacement_data_loss). '-1' (1,757 rows) is a smaller, systematic 'not determined' sentinel, undocumented by ICES; '-5'/'-95' (1 row each) are isolated anomalies."

  # Resolution policy for the XML -> parquet conversion (op_strip_sentinels()).
  #
  # The published parquet must carry no sentinel: Parquet has native NULL, and
  # "-9" is an artifact of a fixed-width text format that cannot express
  # missingness. Carrying it forward makes every naive mean() silently wrong.
  #
  # But "-9" cannot be stripped blindly, because ICES overloads it. Of the 29
  # Tier 1 enum fields whose `values:` map documents a "-9" code, 24 label it
  # as absence ("Not known", "Not available", ...) and 5 label it as a real
  # answer ("No ticklers are allowed", "No plus group", "Invalid hauls").
  # Presence in the vocabulary is therefore NOT the discriminator; the label
  # is. That overloading is an ICES-side defect -- see known_violations:
  # ices_sentinel_code_overloading.
  #
  # Resolution order, per column:
  #   1. field_specific `action` below, if one names this table+field.
  #   2. enum column whose `values:` documents the sentinel -> KEEP if its
  #      label is not in labels_meaning_absent, else STRIP.
  #   3. anything else -> STRIP.
  # An unrecognised label defaults to KEEP: never silently destroy a
  # documented code (see known_violations: sentinel_replacement_data_loss for
  # what that costs).
  resolution:
    # Compared case-insensitively, after trimming. Covers all 24 absence
    # labels ICES currently uses across Tier 1.
    labels_meaning_absent:
      - "not known"
      - "not know"          # ICES's own typo, present in all four GearExceptions
      - "not available"
      - "not provided"
      - "not sampled"
      - "missing value"
      - "no information"
      - "unknown"
      - "na"

    # Documented codes that are real answers, kept as-is. Their meaning is
    # published to users through the catalog's enum_labels table.
    keep:
      - field: Tickler
        table: "HH, LT"
        values: ["-9"]
        label: "No ticklers are allowed"
        reason: "A real answer: the gear was rigged with no ticklers. Dominant rather than rare -- 117,290 of 150,217 HH rows (78.08%) and 31,536 of 79,451 LT rows (39.69%)."
      - field: AgePlusGroup
        table: "CA"
        values: ["-9"]
        label: "No plus group"
        reason: "A real answer: the age reading has no plus group. 5,963,393 of 5,968,027 CA rows (99.92%) -- prevalence is not evidence of missingness, which is exactly why the label decides."
      - field: DataType
        table: "HH, LT"
        values: ["-9"]
        label: "Invalid hauls"
        reason: "A real classification: the haul was flagged invalid. Nulling it would erase the only marker distinguishing a haul known to be invalid from one whose DataType was never recorded."

# Known Data Quality Issues (Tier 1 validation, 2026-07-29)
known_violations:
  - id: "sentinel_replacement_data_loss"
    severity: "opus-internal"
    scope: "opus-internal"
    field: "all numeric columns"
    table: "HH, HL, CA, LT"
    issue: "Archive-building pipeline (data-raw/archive_04_parse_phase2.R, archive_05_backfill_lt_partitions.R) applied a blanket -9/-99/-999/-1/-5/-95/-100/-900/88888888 -> NA conversion, unconditionally, across every column, before any curation could see the real values."
    extent: "101 (table, column, sentinel) combinations found with real, non-zero counts in a full re-scan of .datras/*.parquet after the fix. Confirmed materially destructive for at least: HH.Tickler (113,645 of 145,958 rows, 78% -- icesVocab's own '-9 = No ticklers are allowed' code, not a missing value), LT.Tickler (30,690 of 75,310, 41%), and CA's composite-key fields HaulNo/StNo (the sentinel this pipeline bug directly caused to be misdocumented below as a null in the interim, see ca_haulno_unlinkable_to_hh)."
    implication: "This is not an ICES-side issue -- it was opus's own archive-building code, introduced between 2026-08-05 and 2026-08-08 (confirmed via git history), after several curation passes (e.g. the 2026-08-10 Tickler/CatIdentifier vocab-coverage 'zero gaps' finding) had already run against the silently-scrubbed archive. Fixed 2026-08-16 by removing the blanket conversion entirely (same architectural reasoning as the enum-detection fix: sentinel meaning is a curation conclusion, not a type-casting one, and can't be decided at the parsing stage without erasing the evidence needed to decide it correctly downstream). Full archive rebuilt from raw XML afterward. See vignettes/articles/technical-notes.md section 4 for the full discovery/fix/verification story and the quantity-vs-ordinal/id/enum triage for telling 'standard missing' fields apart from 'field-specific meaning' ones."
    discovered: "2026-08-16"
    resolved: "2026-08-16"

  - id: "ca_haulno_unlinkable_to_hh"
    severity: "D"
    scope: "field-level"
    field: "HaulNo"
    table: "CA"
    issue: "-9 sentinel (not null); affected rows unlinkable to HH via any key"
    extent: "288,581 rows (4.92% of 5,865,076) carry HaulNo == -9; 0 true nulls in either table"
    implication: "Rows do not match any HH haul on the documented composite key (Survey, Year, Quarter, Country, Ship, Gear, StNo, HaulNo), even with HaulNo dropped -- not a join-key problem, genuinely orphaned CA records. Surfaces as a D04_range violation (declared range [0, 82483] excludes -9), not D01_required (confirmed via op_flag_violations(), 2026-08-07). ICES's own field-description spreadsheet (found 2026-08-17, data-raw/build_field_description_snapshot.R) confirms -9 as the ICES-wide sanctioned 'no information' convention for any field with a header, even ones marked Mandatory -- so -9 itself is not an anomaly here, sharpening the real question to why so many mandatory composite-key values are missing at all, not whether -9 is a valid value for this field. Filed as data-raw/ICES_ISSUE_REPORT.md Issue 14."
    verified: "2026-08-07, against full local archive (.datras/parquet/{HH,CA}.parquet). Re-verified 2026-08-16 against the rebuilt .datras/{HH,CA}.parquet after fixing sentinel_replacement_data_loss above -- this exact sentinel had been silently misrepresented as a null in the archive between ~2026-08-08 and 2026-08-16 (the pipeline bug's own doing); the underlying fact (4.92%, -9, not null) is unchanged from the original finding, only the interim archive's own representation of it was ever wrong."
    discovered: "2026-07-29 (mechanism corrected 2026-08-07; originally miscategorized as 305,276 null values / D01_required)"

  - id: "lt_bts_2025_q1_orphaned"
    severity: "D"
    scope: "field-level"
    field: "composite key (Survey, Year, Quarter, Country, Platform, Gear, StationName, HaulNumber)"
    table: "LT"
    issue: "2,026 of 75,310 LT rows (2.7%) do not match any HH haul on the composite key"
    extent: "2,010 of the 2,026 (99.2%) are Survey=BTS, Year=2025, Quarter=1; the remaining 16 are Survey=NS-IBTS (10 at Year=2026/Quarter=1, 6 at Year=2025/Quarter=3), diagnosed 2026-08-16."
    implication: "Two distinct causes, not one. BTS/2025/Q1: HH's own submission is genuinely empty (0 rows -- matches the EMPTY_RECORDS issue already recorded for that exact cell during the 2026-08-16 archive rebuild), while LT independently has real litter-assessment records for that same survey/year/quarter -- a genuine ICES-side submission gap on HH's side, not an LT or opus data-quality problem. The 16 NS-IBTS rows are NOT the same mechanism: HH has abundant real data for both exact cells (357 rows for 2025/Q3, 331 for 2026/Q1), so this isn't a missing-submission gap -- cause not yet diagnosed, same class of open question as ca_haulno_tail_mismatch below. Filed as data-raw/ICES_ISSUE_REPORT.md Issue 15."
    discovered: "2026-08-16"

  - id: "ca_haulno_tail_mismatch"
    severity: "D"
    scope: "field-level"
    field: "HaulNo"
    table: "CA"
    issue: "Small residual of non-sentinel HaulNo values that still fail to match HH on the composite key"
    extent: "700 rows (0.01% of 5,865,076)"
    implication: "Cause not yet diagnosed; distinct from the -9 sentinel issue above."
    discovered: "2026-08-07"

  - id: "swell_height_type_mismatch"
    severity: "D"
    scope: "field-level"
    field: "SwellHeight"
    table: "HH, LT"
    issue: "icesVocab declares this field an enum (codes H/L/M/N/NR/VH, an unprefixed 'SwellHeight' key); real archive data in both tables is continuous numeric, not categorical codes."
    extent: "HH: 0 true nulls; 108,698 of 145,958 rows (74.47%) carry the standard -9 'not recorded' sentinel; 37,260 are real measurements (0-60m). LT: 17,370 true nulls; 19,005 of 57,940 non-null (32.80%) carry -9; 38,935 are real measurements (0-25m). LT's SwellHeight is confirmed a byte-for-byte copy of HH's own value for the same haul (55,113 of 55,113 matched non-null rows identical, 2026-08-16, denominator corrected 2026-08-18 -- the original 55,914 was already stale by the time this was re-checked)."
    implication: "opus's own spec retyped both as number(quantity), range 0-13m (WindSpeed used as an independent co-parameter check: median WindSpeed rises smoothly with SwellHeight through 13m, consistent with genuine rough-weather readings, but breaks down sharply above it -- e.g. 15m/5 m/s, 20m/4 m/s -- matching the wind speeds already seen at the values these look like decimal-shifted versions of, e.g. 1.5m, 2.0m). 23 rows above 13m excluded as data-entry errors on this evidence."
    verified: "2026-08-16, against full local archive (.datras/{HH,LT}.parquet, rebuilt after fixing sentinel_replacement_data_loss above)"
    discovered: "2026-07-29 (HH only); LT's own instance never independently checked until 2026-08-12"
    resolved: "2026-08-16"

  - id: "hl_subsamplingfactor_missing_but_reconstructible"
    severity: "D"
    scope: "field-level"
    field: "SubsamplingFactor"
    table: "HL"
    issue: "A required field is absent in real submissions, and the absence is not recoverable from the field itself -- but it IS recoverable from two other fields in the same record. The spec (DATRAS-data-dict.yaml) declares SubsamplingFactor required with a range floor of 1.0, and its description commits only to 'if DataType is R, the SubFactor is = 1 or >1 for different species depending on whether they were subsampled'. Nothing in it licenses reading a missing value as 1: the -9 these nulls came from means 'not recorded', which is a different claim from 'not subsampled'. Consumers that default the absence to 1 therefore assert something the archive does not say, and the data shows they assert it wrongly about 40% of the time."
    extent: "144,663 of 14,423,771 HL rows (1.00%) carry a null SubsamplingFactor, all of them stripped -9 sentinels (op_sentinel_policy('HL') resolves this field to strip); 0 literal -9 remain, and 372 rows (0.0026%) carry a genuine sub-1 value, minimum 0.24, contradicting the field's own documented floor. Restricting to rows where the missingness actually costs a count -- NumberAtLength > 0 -- leaves 24,298 rows, and every one of them is DataType R: Can-Mar 23,782, DYFS 479, NS-IBTS 37. 23,707 of the 24,298 sit in hauls HH marks valid ('V'), so a HaulValidity filter does not dispose of them. Of those 24,298, TotalNumber / SubsampledNumber is computable for 24,261: 14,547 imply exactly 1, 9,632 (39.7%) imply a factor above 1 (median 2, maximum ~147), and 82 imply a sub-1 value. Defaulting the whole set to 1 would discard roughly 19,929 fish against the 26,624 the rows carry as written, a ~43% under-count of the affected records, in the direction that reads as fewer fish rather than as an error."
    implication: "The identity SubsamplingFactor == TotalNumber / SubsampledNumber can be validated independently, on the rows that do carry all three, and it holds well exactly where it is needed: DataType R 88.8% within 1% (7,294,803 of 8,210,643), S 99.9% (33,305), P 91.8% (319,458). It does NOT hold for DataType C -- 3.3% of 3,198,897 -- which is expected for the bulk of C, where the submitted NumberAtLength is already a rate per hour and the ratio is not the same quantity. That is NOT a complete explanation, and this entry previously offered it as one: on the 113 groups covered by hl_datatype_c_with_subfactor_gt1 the premise is false, because NumberAtLength there is a measured subsample and the ratio does hold. Do not read the 3.3% as uniformly benign. Every affected row here is DataType R, so the reconstruction applies to the whole population at its 88.8% validation rate. Recommended handling, in opus rather than downstream: expose the reconstruction as a derived field (or repair the column on read) for DataType R/S/P only, carrying provenance so a reconstructed factor is never silently indistinguishable from a submitted one, and leave the residual ~37 non-computable rows null. Explicitly NOT recommended: coalescing a missing factor to 1, which obus_retired did and which the 39.7% figure above shows to be wrong far too often to be a safe default -- current obus propagates the null instead, which is correct and consistent with this registry's own count_at_length definition. The underlying defect is still ICES-side: a mandatory field is missing in 144,663 rows, and an escalation would ask why, not merely how to patch around it. Candidate for the IMBUS_FISHMAP#29 batch."
    verified: "2026-09-02, against the full published archive (raw HL joined to HH for DataType and HaulValidity). The 88.8% R figure is the full-population number; an earlier 92.1% came from a 400,000-row head sample and was biased -- do not reuse it."
    discovered: "2026-09-02, from outside opus: datrasdoodle2's CPUEL appendix noticed that 24,298 rows arrive in obus's published HL_length with a null n_haul, went looking for whether obus's raising arithmetic was at fault, and found the question was really about what the spec says a missing required field means"

  - id: "hl_datatype_c_with_subfactor_gt1"
    severity: "C"
    scope: "field-level"
    field: "DataType, SubsamplingFactor"
    table: "HH, HL"
    issue: "A submission declares DataType 'C' -- already raised to one hour, with SubFactor reported as 1, per the DATRAS FAQ's 'DataType C' block -- while reporting SubFactor > 1. The two claims are incompatible, and the archive shows the label is the wrong one: HLNoAtLngt in these records is the measured subsample, exactly as under DataType R. No ICES publication says how to handle them. WKABSENS 2021 (3.3, step 17) gives a single multiplier ('Multiplier = HaulDur/60 if DataType in (C)'), which understates them; the DATRAS R package applied exactly that rule until commit 880b553 (2023-04-11, Casper Berg, DTU Aqua) replaced it with two multipliers over the source note 'some BITS hauls (all LT and some DK) have dataType C but SubFactor>1 - two multipliers needed!'. The only correct treatment on record therefore lives in a third-party code comment, not in an ICES document."
    extent: "1,832 HL length rows over 36 hauls, all BITS: LT 2008-2016 (35 hauls) and DK 2018 (1 haul), forming 113 haul x species x sex x category groups. SubsamplingFactor reaches 167.939. Across those 113 groups, TotalNo equals sum(HLNoAtLngt) in 0, equals sum(HLNoAtLngt) x SubFactor in 102, and sum(HLNoAtLngt) equals NoMeas in 108 -- so HLNoAtLngt is the measured subsample and TotalNo its raised total. 35 of the 36 hauls carry HaulValidity 'V'; only the DK 2018 haul is 'N'. Separately 2,261 'C' rows carry a null SubsamplingFactor, but every one is a bulk record with no LengthClass, so no length product is affected by those."
    implication: "Following WKABSENS understates these records by up to 167.9x. obus applies both multipliers (dr_add_n_and_cpue) and flags them per record as CNT_C_SUBFACTOR_CONFLICT. ICES identified this inconsistency CLASS at WKDATR 2013, section 3.2.2.1 -- 'ICES Data Centre performed several cross-checks on the DATRAS database, displaying non-constistent input for the DataType-Subfactor combination. ICES Data Centre is to supply a list by survey-year-quarter-country containing datatype and subfactor' -- and actioned WGBIFS, IBTSWG and WGBEAM to analyse it. No such list has been found; LT continued submitting this way in 2015 and 2016, after that workshop, and DK did so in 2018. ICES's own upload validation still carries a SubFactor range rule for DataType 'S' and none for 'C', so these submissions pass validation by design. ICES's own CPUEL product settles which treatment is correct, and sharpens the escalation. All 36 hauls appear in CPUEL; over 1,721 matched haul x species x length cells the median ratio of CPUEL's CPUE_number_per_hour to the two-multiplier figure is exactly 1.000, while the ratio to a one-multiplier figure reproduces the declared SubFactor in every stratum (2.000 at SubFactor 2, 3.400 at 3.4, 9.678 at 9.68). So this is not a DTU Aqua workaround at all: the ICES Data Centre applies both multipliers in production, and WKABSENS -- an ICES publication -- documents a recipe the Data Centre's own product does not follow. Escalation is therefore about ICES's internal consistency, not about a third-party convention: the production code, the published recipe, and the upload validation disagree with each other, and only the production code is right. Ask for the 'C' SubFactor rule to be added to validation, for WKABSENS's step 17 to be corrected, and for the affected hauls to be reclassified."
    verified: "2026-09-07, against the full published archive (raw HL joined to HH); the counts above are at haul x species x sex x category grain."
    discovered: "2026-09-07, from outside opus: obus had just changed n_haul to follow WKABSENS's single-multiplier recipe, and reading the DATRAS package source to check that change surfaced the 2023 commit and its note. The obus change was reverted."

  - id: "swell_height_vocab_unused"
    severity: "C"
    scope: "field-level"
    field: "SwellHeight"
    issue: "icesVocab's own single 'SwellHeight' code list (H/L/M/N/NR/VH height classes) is used by neither HH's nor LT's real submissions."
    extent: "0 of 37,260 real (non-sentinel) HH values and 0 of 38,935 real LT values use any of the vocab's 6 codes; both tables submit a continuous metric measurement instead. Exhaustively confirmed no second, differently-named vocab key exists for this concept: checked all 580 registered icesVocab keys by substring match on both Key and Description, 2026-08-16."
    implication: "Not a data-quality problem on ICES's side -- a candidate for institutional-governance escalation: either this vocabulary is aspirational/unused for DATRAS's own Tier 1 exchange, or it is genuinely used by some other DATRAS table or submission context not covered here. Filed as data-raw/ICES_ISSUE_REPORT.md Issue 10."
    discovered: "2026-08-16"

  - id: "icesvocab_key_resolution_hazard"
    severity: "C"
    scope: "systemic"
    field: "HaulValidity, SpeciesValidity, GearExceptions, LengthCode, AgeSource, AgePreparationMethod, Ship, Country"
    table: "HH, HL, CA, LT (varies by field)"
    issue: "icesVocab has no machine-readable way to tell an authoritative code-list key apart from one that collides with an unrelated domain, or one that is a bare redirect to a different key -- resolving a vocab key by field-name match alone can silently pick the wrong key and read as a coverage gap that isn't real."
    extent: "Two independent flavors of the same hazard, both found by resolving a field's *current* DATRAS name into a vocab key without also checking the *legacy* name and the resolved key's own description text. (1) Prefix collision, found 2026-08-08: current-name lookups for HaulValidity/SpeciesValidity/GearExceptions/LengthCode resolve to AC_-prefixed (acoustic-survey domain) keys with 1-2 codes each, producing false '5 of 7 missing' / '8 of 10 missing' / 'only B in vocab' / '43% coverage' findings from the 2026-08-02 enum audit; legacy-name lookups resolve to the correct TS_-prefixed (trawl-survey) keys, all four a full match (re-verified directly against real archive data 2026-08-18: HH.GearEx's 9 real values -9/S/SB/B/I2/DB/R/S2/D all match TS_GearEx's 13 codes exactly). (2) Redirect-only keys, found 2026-08-16: TS_AgeSource and TS_AgePrepMet each exist and name-match correctly, but their own icesVocab Description field is a bare cross-reference ('see SampleType', 'see PreparationMethod') to a different, non-TS_-prefixed key -- not a code list in its own right. Both keys' own codes have zero overlap with CA's real AgeSource/AgePrepMet values (re-verified 2026-08-18: AgeSource is only -9/otolith, AgePrepMet only -9/Se/SS/AL/BB/ALR/Br/ALEt); the redirect targets (SampleType, PreparationMethod) match exactly, including a literal lowercase 'otolith' code in SampleType. Two more confirmed redirect instances, found 2026-08-18 while auditing ICES_ISSUE_REPORT.md's own Issue 9 (which had used the redirect keys directly and mischaracterized both as 'false leads'): TS_Ship -> SHIPC (109 of 112 real distinct Ship values match, across HH/HL/CA/LT combined) and TS_Country -> ISO_3166 (22 of 23 real distinct Country values match, incl. historical entries like SUHH=USSR). Neither caused a live opus-side bug, since Ship/Country are typed as open strings, not enums -- but Issue 9's own report text was wrong until corrected the same day."
    implication: "Not a data-quality problem in DATRAS's real submissions -- every field above is, once resolved correctly, a full match. It is a governance gap in icesVocab's own structure: no field declares which collection(s) a key applies to, and nothing distinguishes an authoritative key from an alias/redirect. Fixed on opus's own side both times (2026-08-08: R/vocab.R + R/field_names.R dual legacy/current-name lookup; 2026-08-16: inst/DATRAS-vocab-correction.csv + op_vocab_resolve_datras_key() repointed to the redirect targets), but the underlying ambiguity is ICES's to fix for any other consumer. Filed with ICES as data-raw/ICES_ISSUE_REPORT.md Issues 7 (recommendation: structured scope/alias fields) and 8 (the concrete collision and redirect findings). Supersedes the former icesVocab_gaps entry's GearExceptions example, which was this exact hazard, not a real gap -- see param_vocab_incomplete below for the one example from that entry that held up. A third original 2026-07-29 finding, LTSRC (LT), was investigated the same day as this correction and found to be a plain false lead, not an instance of this hazard: real archive codes (incl. a lone lowercase 'sba' case variant) all match the vocab's own un-prefixed 'LTSRC' key exactly, no prefix collision or redirect involved -- the original check was simply wrong or stale, not superseded by a specific later fix. Not given its own registry entry since there was never an actual violation to record; see DEVLOG.md 2026-08-18 for the closure note."
    discovered: "2026-08-02 (prefix collision suspected via HaulValidity/SpeciesValidity); confirmed 2026-08-08 (systematic 52-field audit, both names checked for every one); redirect-only variant found 2026-08-16; Ship/Country instances found 2026-08-18"
    resolved: "2026-08-08 (prefix collision, opus's own resolution); 2026-08-16 (redirect-only keys, opus's own resolution); 2026-08-18 (Ship/Country: no opus-side fix needed, corrected ICES_ISSUE_REPORT.md's own Issue 9 text instead) -- opus never had a live bug for Ship/Country; the underlying icesVocab ambiguity itself remains open with ICES"

  - id: "param_vocab_incomplete"
    severity: "C"
    scope: "field-level"
    field: "PARAM"
    table: "LT"
    issue: "6 real codes (A2, A3, A5, A6, A7, A14) do not appear in icesVocab's own PARAM code list under any description, despite being common real values."
    extent: "49 distinct values across 75,308 of 75,310 non-null rows (2 unpopulated). icesVocab's PARAM list carries 1,938 total codes -- 'LT-TOT'='Litter - total' confirmed present, but the 6 codes above were checked directly against the full list, not a sample, and are genuinely absent. Not a name-key artifact like icesvocab_key_resolution_hazard above: PARAM has no legacy/current name split and no redirect involved -- this is the one example from the former icesVocab_gaps entry that held up under closer checking."
    implication: "Not retyped enum in opus's own spec regardless of vocab status: 1,938 codes is far past the seed's VOCAB_CODE_LIMIT of 20, so this doesn't surface as a live validation failure. Flagged as a todo in data-raw/spec_02_curate_dict.R since curation; filed as data-raw/ICES_ISSUE_REPORT.md Issue 16."
    discovered: "2026-07-29; re-confirmed 2026-08-18 during known-issues registry refinement"

  - id: "datras_field_list_type_divergence"
    severity: "C"
    scope: "systemic"
    field: "Year, SpecCode, Distance"
    table: "HH, HL, CA, LT (Year); HL, CA (SpecCode); HH (Distance)"
    issue: "ICES's own documentation-side metadata sources disagree with the live WSDL contract (and real submitted data) about these fields' physical type."
    extent: "Year: live WSDL declares int; getDatrasFieldList and the DATRAS field-description spreadsheet (data-raw/build_field_description_snapshot.R) both independently say char, across all four tables. SpecCode: live WSDL declares int (it's a WoRMS AphiaID, a numeric species identifier); the same spreadsheet says char, in both HL and CA. Distance: getDatrasFieldList declares float, while the live WSDL and the spreadsheet say int and the archive stores INT32 integers."
    implication: "opus seeds types from WSDL only (Working Principle 1: real data is ground truth, and WSDL is the auto-generated, authoritative source -- see AGENTS.md's Data Sources), so opus's own spec already correctly types both fields as numeric (Year: number(ordinal); SpecCode: number(id)) and this is not a bug in opus's spec to fix. It IS a real, persistent gap in ICES's own institutional metadata: two independently-maintained ICES documentation sources (getDatrasFieldList, and now the field-description spreadsheet -- built and maintained separately, years apart) have both been wrong about these fields' type in the same direction, for as long as opus has been checking. First noted 2026-08-02 (Year only, WSDL vs getDatrasFieldList) but never actually written into this registry until now -- DEVLOG.md's own narrative had described it as 'documented in known-issues #10', which was true of intent, not of this file. See data-raw/ICES_ISSUE_REPORT.md Issue 12 for the ICES-facing writeup."
    discovered: "2026-08-02 (Year, WSDL vs getDatrasFieldList); corroborated 2026-08-17 (both fields, vs the field-description spreadsheet)"

  - id: "dateofcalculation_cross_product_inconsistency"
    severity: "C"
    scope: "systemic"
    field: "DateofCalculation"
    table: "HH, LT"
    issue: "DateofCalculation disagrees between HH's and LT's own copy of the same haul in most cases, despite sharing one field name with no documentation suggesting per-product variation is expected."
    extent: "30,364 distinct hauls carry a DateofCalculation value on both sides (HH, LT); 19,193 (63.21%) disagree. Median gap when disagreeing: 120 days; max 2,557 days (~7 years); runs both directions (LT later in 11,224 cases, HH later in 7,969). LT's own value is internally consistent across a haul's own multiple LT rows where more than one exists (0 of 14,059 such hauls show internal disagreement). Verified 2026-08-18 against the full .datras/{HH,LT}_legacy.parquet archive."
    implication: "Consistent with an independently-documented finding from a related internal downstream project for a different product (FL/FlexFile): getFlexFile() returns duplicate rows per haul differing only in DateofCalculation, confirmed reprocessing revisions rather than submission duplicates (739 of 53,859 distinct FL haul keys) -- that project's own finding, not independently re-verified by opus, cited here for corroboration only. Together these suggest DateofCalculation is a per-product reprocessing timestamp, not a single per-haul fact, but nothing in ICES's own documentation says so. Filed as data-raw/ICES_ISSUE_REPORT.md Issue 13."
    discovered: "2026-08-18, during the relationships/conflicts work -- corroborated same day against a related project's separate, independent FL-side finding"

  - id: "absent_value_encoding_inconsistency"
    severity: "C"
    scope: "systemic"
    field: "GearEx (both products); EEZ, LTREF, MSFDArea, NMArea, OSPARArea, PARAM (LT only)"
    table: "HH, LT"
    issue: "DATRAS encodes an absent value two different ways depending on the product, and for one field both ways inside the same product. HH, CA and HL always use the documented -9 'no information' sentinel; LT also returns an empty XML element for the same meaning."
    extent: "Verified 2026-08-29 against the full local XML archive (.datras/xml/, 3,892 files, 19.3 GB). Empty elements appear in 207 of 973 LT files and in 0 of 973 files for each of HH, CA and HL. GearEx is the sharpest case because it exists in both products and uses both encodings: HH is 0 empty / 95,743 -9 / 54,474 real of 150,217 rows; LT is 19,296 empty / 26,856 -9 / 33,299 real of 79,451. The other six fields are empty-element-only in LT, with zero -9 values: NMArea 53,303; OSPARArea 14,498; MSFDArea 4,295; EEZ 162; LTREF 2; PARAM 2. Note the empty element is valid XML and semantically identical to <Tag></Tag> -- this is an encoding-consistency issue, not malformed output."
    implication: "Nothing in ICES's own documentation says which encoding to expect where, and the -9 convention is documented as the ICES-wide answer (data-raw/build_field_description_snapshot.R), so a consumer reasonably coding to it will silently miss LT's empty elements -- or, if it parses XML by hand rather than with a real parser, mis-read them. opus is not affected in its output: both encodings reach the archive as null, so LT's null counts already equal empty + -9 (GearExceptions 19,296 + 26,856 = 46,152, matching the archive exactly). But they reach it by two different routes -- an empty element becomes null during parsing, while -9 becomes null via op_strip_sentinels() -- so op_sentinel_policy() describes only one of the two paths, and for the six empty-element-only LT fields the strip step it declares never fires. Candidate for the IMBUS_FISHMAP#29 batch alongside the -9 overloading entry."
    discovered: "2026-08-29, while benchmarking XML parsers: a hand-written scanner that treated <NMArea /> as an opening tag produced 570 rows where LT has 423, which is how the encoding difference surfaced at all"

  - id: "csv_xml_endpoint_rowset_divergence"
    severity: "C"
    scope: "systemic"
    field: "(row sets, not a field)"
    table: "HH, HL, CA (the three tables both endpoints serve)"
    issue: "ICES's two distribution endpoints do not serve the same row set for the same survey/year/quarter. The ASMX XML service (getHLdata etc.) and the CSV download API (DATRASDownloadAPI.aspx, behind icesDatras::getDatrasUnaggregated) diverge in BOTH directions."
    extent: "Verified 2026-09-14 on NS-IBTS HL, archive vs live whole-survey CSV pull (4,164,330 vs 4,101,389 rows, gap 62,941). Direction 1 -- the CSV extract lags recent submissions: 2026 Q1 (48,070 rows) absent from the CSV API entirely (its NS-IBTS range ends at 2025), 2025 Q3 partial (34,296 vs 47,288), smaller lags at 2024 Q3 (+740) and 2025 Q1 (+1,081). Same failure class as the already-documented CODS-Q4 absence: the download product is a periodic extract, not a live view. Direction 2 -- the CSV serves rows the XML service withholds: 1985/86/87/91/92 Q1 each carry exactly 2 extra rows in the CSV (10 total), the anonymized records (blank Country/Platform, StNo/HaulNo=999). Verified NOT a vintage difference: the archive's copy of 1985 Q1 carries the same DateofCalculation (2024-01-16) as the anonymized rows, and a fresh live XML pull of that cell returns 45,054 records (the archive's count), not the CSV's 45,056 -- same database, same reprocessing, different row sets per endpoint."
    implication: "A consumer pulling 'the same data' from the two endpoints gets different data, in both directions, with no documentation saying so. opus's archive is XML-derived and therefore lacks the anonymized rows; nothing in the archive signals their absence. For consumers needing those rows (they are real, if anonymized, length-frequency records), only the CSV route sees them."
    discovered: "2026-09-14, while benchmarking a DuckDB-based live reader against the archive (see DEVLOG.md 2026-09-14 and data-raw/read_datras_benchmarks_2026-09-14.md)"

  - id: "datras_field_list_fa_descriptions_shifted"
    severity: "C"
    scope: "field-level"
    field: "StationName, HaulNumber, Year"
    table: "FA"
    issue: "In ICES's getDatrasFieldList, three descriptions of the FA (fish attributes) record sit one row below the field they describe."
    extent: "StationName carries HaulNumber's description ('Sequential numbering of hauls during cruise.'), HaulNumber carries Year's ('Cruise year (YYYY)'), and Year carries SpeciesCodeType's ('Type of species code used for species definition at the record...'). The rows before and after are correct (Survey and SpeciesCode carry their own descriptions). Checked on the live service response of 2026-10-05; opus's cached field-list snapshot shows the same."
    implication: "A consumer reading field meanings from the field list gets the wrong description for three FA fields, with nothing to signal it. opus serves no FA table, so the archive is unaffected; the defect is in ICES's documentation. Candidate for the IMBUS_FISHMAP#29 batch."
    discovered: "2026-10-05, comparing the live field list with opus's dictionary"

# Processing directives
processing:
  phase2:
    apply_sentinels: false  # removed 2026-08-16 (see sentinel_replacement_data_loss above) --
                             # this stage now preserves raw values unchanged; sentinel
                             # interpretation happens downstream, per-field, in curation
    strict_type_casting: true
    record_issues: true

  phase3:
    known_violations_baseline: true
    expect_ca_haulno_sentinel: true
    expect_vocab_gaps: true
