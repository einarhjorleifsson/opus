$version: 0.1.0
$learn_more: http://data-dict.tidyverse.org/
name: datras_exchange
label: ICES DATRAS Exchange Data (Tier 1 -- raw haul-grain submissions)
description: 'Direct per-haul submissions to ICES DATRAS: HH (haul), HL (length),
  CA (age), LT (litter). Curated from data-raw/seed/DATRAS-exchange-dict-seed.yaml
  -- see data-raw/spec_02_curate_dict.R for the corrections and field-spec fills applied
  and why. Keyed by ICES''s own legacy (real, on-the-wire) field names -- see data-raw/spec_03_translate_new_names.R
  for the curated/new-named version this package actually ships.'
origin: data-raw/spec_01_seed_dict.R <U+2192> data-raw/spec_02_curate_dict.R
version:
  date: '2026-08-10'
tables:
- name: HH
  columns:
  - name: RecordType
    type: enum
    description: |-
      Definition of the data type recorded, affecting the layout of the data fields
      included on that record. HH=Haul Information, HL=Length Frequency Distribution,
      CA=individual fish recordings with biological information, LT= Litter data
      records
    values:
      HH: Haul Information
    label: Record Type
  - name: Survey
    type: string
    examples:
    - NS-IBTS
    - BTS
    - BITS
    - 'DYFS'
    - Can-Mar
    details: |-
      29 distinct values in HH's archive (verified 2026-07-29); ICES DATRAS survey
      acronym, an open list, not a fixed enum. icesVocab DOES resolve a 'Survey' key
      by name (checked 2026-07-29, data-raw/datras_vocabulary.R) but it's a false
      lead, not this field's source: its 133 codes are ICES's own cross-domain
      internal survey IDs (e.g. 'A1012'), a completely different scheme from DATRAS's
      own short acronyms -- confirmed by checking real codes against it directly, not
      assumed. Not used.
  - name: Quarter
    type: enum
    description: |-
      Cruise quarter. Hauls outside of the calendar quarter can be reported with the
      same quarter reference, if agreed by the survey group.
    values:
    - '1'
    - '2'
    - '3'
    - '4'
  - name: Country
    type: string
    description: ISO 3166 country codes and region codes used by ICES
    examples:
    - NL
    - 'DE'
    - GB
    - 'DK'
    - GB-SCT
    details: |-
      22 distinct values in HH's archive (verified 2026-07-29); 'GB-SCT' illustrates
      that this is ISO 3166 codes PLUS ICES's own sub-national region codes (per the
      field's own description), not plain ISO 3166 alone. icesVocab DOES resolve a
      'TS_Country' key by name (checked 2026-07-29) but it's a false lead too, same as
      Survey above: its 25 codes are 3-letter (e.g. 'BEL', 'DEN', 'ENG'), a different
      scheme entirely from this field's own 2-letter-plus-region codes -- confirmed by
      checking real codes against it directly. Not used.
  - name: Ship
    type: string
    description: SeaDataNet Ship and Platform Codes
    examples:
    - '74E9'
    - '26D4'
    - 748S
    - 64SS
    - 18NE
    details: |-
      110 distinct values in HH's archive (verified 2026-07-29); SeaDataNet
      ship/platform codes, an open list, not a fixed enum.
  - name: Gear
    type: enum
    description: Gear type code
    values:
      AAL: Bottom trawl net Aalhopser
      ABD: Aberdeen 18 ft trawl
      BAK: Baka trawl
      BLACK854: Pelagic trawl Blacksprutte 854#
      BMT: Beam trawl
      BOT: Bottom Trawl
      BOX: Boris 'Goshawk' Box Trawl
      BT12: Beam Trawl 12 meters
      BT2: Beam trawl 2 meters
      BT3: Beam trawl 3 meters
      BT4: Beam Trawl 4 m
      BT4A: Four m Beam trawl, aft
      BT4AI: Four m Beam trawl, aft - in IrishSea q3 BTS
      BT4P: Four m Beam Trawl, port
      BT4S: Four m Beam Trawl, starboard
      BT6: Beam trawl 6 meters
      BT7: Seven m Beam trawl
      BT8: Eight m Beam trawl
      CAM: Unspecified Gear
      CAR: Bottom trawl FGAV019
      CHP: Cod Hopper
      COM: Commercial trawl with sprat bag
      D40: Dutch Herring Trawl 40 feet
      D45: Dutch Herring Trawl 45 feet
      D48: Dutch Herring Trawl 48 feet
      D63: Dutch Herring Trawl 63 feet
      D73: Dutch Herring Trawl 73 feet
      D8: Dutch Herring Trawl 8 feet
      DBT: Danish bottom trawl
      DHT: Dutch Herring Trawl
      DIV: Collected by diver
      DSD: Danish Sandeel dredge, used at the Danish Sandeel survey
      DT: Russian bottom trawl
      EGY: Unspecified Gear
      ENG1600: Pelagic trawl gear Engelnetz 1600#
      ESB: Estonian small bottom trawl
      EXP: EXPO trawl - winged midwater trawl
      FIN1600: Pelagic trawl Finflyder combi 1600'
      FOT: Foto midwater trawl
      FOT32: Pelagic trawl Fotoe 3.2
      GIL: Gill nets
      GOS: GOV small
      GOV: GOV Trawl
      GRT: Granton trawl
      H12: Herring Bottom Trawl 120 feet
      H18: Herring Bottom Trawl 180 feet
      H20: Herring ground trawl (HG20/25)
      HAK: Hake-4M
      HAN: Collected by hand
      HOB: High Opening Bottom Trawl
      HT: Herring Bottom Trawl
      INT: Industrial Trawl
      JDT: Jackson Trawl, modified otter trawl
      JTDS: Jackson Trawl Downscaled
      JTFS: Jackson Trawl Full Scale
      KAB: Pelagic trawl net Kabeljaubomber
      LBT: Latvian Bottom Trawl
      LCT: Lithuanian Cod Trawl
      LPT: Latvian Pelagic Trawl
      MACRO5A: Pelagic trawl Macro 5A:1
      MWT: Mid water trawl 664
      NCT: Norwegian Campell Trawl 1800/96
      P20: Herring Bottom Trawl (P20/25)
      PAR: Pair trawl
      PEL: Pelagic midwater trawl
      PG1: Pelagic trawl Gloria 1024 SW
      PG2: Pelagic trawl Gloria 2048 HO
      PG3: Pelagic trawl Gloria 2560 HO
      PG4: Pelagic trawl Gloria  4096
      PG5: Pelagic Trawl Gloria Helix 358
      PG6: Pelagic Trawl Gloria Helix 224
      PHT: Potuguese High Headline Trawl
      PMT_57x52: Pelagic midwater trawl 57x52
      PMT_76x70: Pelagic midwater trawl 76x70
      PORB: Porcupine Baka
      PRL: Pelagic trawl Red Lion 3072
      PRS: Purse seines
      PRT: Russian pelagic trawl (75/448)
      PSN205: PSN205 pelagic trawl gear applied on Walther Herwig III
      PSN388: Pelagic trawl PSN388 Krake
      PT154: Young Gadoid Pelagic Trawl PT154
      RAPIA: Modified beam trawl with a rigid mouth (Width-3.5 m Weight-225 kg Four
        120-mm wide skids 46-mm codend mesh size)
      ROT: Rock hopper otter trawl
      RTA: Pelagic trawl 70/300 project 0495
      RTM33S: Pelagic trawl RTM33S
      SCT: Scraping tool
      SON: Sonderborg trawl
      SOV: SOV-NET
      SRN: Seines and ring nets
      TV3: Bottom trawl TV-3 930#
      TVCOD: Trawl model TV112-24-646
      TVL: Large TV trawl
      TVM: Bottom trawl TV3-280x80
      TVS: Small TV trawl
      US4: US 4 Seam 3 Bridle
      VIN: Vinge trawl
      W2A: Western IIA
      WP53: Pelagic trawl WP35/64x4
      Y36: 'Yankee #36'
    details: |-
      All 99 active icesVocab Gear Type codes (deprecated code OTG excluded,
      2026-08-02). 55 confirmed used in DATRAS archive; 44 additional codes are valid
      ICES definitions (may be used in future submissions or by other surveys). Each
      code has a full description in icesVocab. Validation: enum restricts submissions
      to these codes.
  - name: SweepLngt
    type: number(quantity)
    description: |-
      Length of sweep in metres. Recommended values depend on survey and quarter, see
      survey manuals for further details
    units: m
    range:
    - 0.0
    - 850.0
  - name: GearEx
    type: enum
    description: |-
      Deviations of the standard gear. Depends on survey, see survey manuals for
      further details.
    values:
    - '-9'
    - B
    - D
    - DB
    - I2
    - MN
    - MY
    - R
    - S
    - S1
    - S2
    - SB
    - ST
  - name: DoorType
    type: enum
    description: Type of door used
    values:
    - '-9'
    - F
    - K
    - P
    - PE
    - PI
    - R
    - T
    - T4
    - T6
    - V
    - WR
  - name: StNo
    type: string
    description: Station number. National coding system, not defined by ICES.
    examples:
    - '1'
    - '2'
    - '22'
    - '9'
    - '17'
    details: |-
      Field's own description says this is a national coding system, not defined by
      ICES -- examples show the common shape (short numeric-looking strings), not an
      exhaustive domain. 24,130 distinct values in HH's archive (verified 2026-07-29),
      the highest cardinality of any Tier 1 string field; 6,899 of 150,262 rows
      unpopulated.
  - name: HaulNo
    type: number(ordinal)
    description: Sequential numbering of hauls during cruise.
    range:
    - 0.0
    - 82483.0
    constraints:
    - required
    details: |-
      Sequential per-cruise numbering, but countries vary in whether it resets each
      cruise or runs continuously -- the archive-wide range spans many cruises' own
      counts pooled together, not one cruise's own haul tally.
  - name: Year
    type: number(ordinal)
    description: Cruise year (YYYY)
    range:
    - 1965.0
    - 2026.0
    constraints:
    - required
  - name: Month
    type: enum
    description: Sampling month, as part of the calendar date.
    values:
    - '1'
    - '10'
    - '11'
    - '12'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
    - '8'
    - '9'
  - name: Day
    type: number(ordinal)
    description: Sampling day, as part of the calendar date
    range:
    - 1.0
    - 31.0
    constraints:
    - required
  - name: TimeShot
    type: string
    description: Start time (GMT) of haul (HHMM), 4 digits. E.g. 10:15=1015
    examples:
    - '730'
    - '715'
    - '1300'
    - '900'
    - '700'
    details: |-
      1,440 distinct values in HH's archive (verified 2026-07-29), always populated
      (150,262/150,262). Field's own description implies a fixed 4-digit HHMM ('E.g.
      10:15=1015'), but real values are NOT zero-padded (e.g. '730', not '0730') --
      documented here rather than silently assumed. Only present in HH and LT
      (confirmed 2026-07-29), same as StatRec above.
  - name: DepthStratum
    type: string
    description: |-
      Depth stratum in classes. Depth strata are survey specific, see survey manuals
      for details.
    examples:
    - 'D2'
    - '10'
    - '9'
    - '11'
    - 'D1'
    details: |-
      Field's own description says depth strata are survey-specific, not an ICES-wide
      vocabulary -- examples illustrate the shape seen in practice (mix of
      letter-prefixed and bare-number codes), not an exhaustive domain. Verified
      2026-07-29 against the full HH archive: 194 distinct values, only 75,753 of
      150,262 rows populated (roughly half of surveys don't report it).
    label: Depth Stratum
  - name: HaulDur
    type: number(quantity)
    description: |-
      Haul duration in minutes. Start time is the moment when the gear settles at the
      bottom at the stated towing speed. Stop is defined as the start of hauling of
      the gear.
    units: min
    range:
    - 1.0
    - 120.0
    details: |-
      A haul cannot take zero or negative time; 217 rows recorded as exactly 0 and 2
      as negative (-514, -238) are excluded, most likely unrecorded/placeholder rather
      than a genuine instantaneous haul. Upper bound set at 2 hours: DATRAS carries no
      passive/soak gear, so a longer tow is highly suspect -- observed values run as
      high as 1470 min with no repeating marker pattern (i.e. not a clean sentinel,
      just unreliable). Verified 2026-07-29 against the full archive.
    label: Haul Duration (minutes)
  - name: DayNight
    type: enum
    description: |-
      Timing of sampling: at daytime or at night. See survey manuals for further
      details
    values:
    - D
    - 'N'
  - name: ShootLat
    type: number(quantity)
    description: Decimal latitude position on the shooting location
    units: decimal degrees
    range:
    - 36.0013
    - 76.2117
  - name: ShootLong
    type: number(quantity)
    description: Decimal longitude position on the shooting location
    units: decimal degrees
    range:
    - -67.7115
    - 24.4333
    details: |-
      A genuine value of exactly -9.0000 degrees (9 deg W, an ordinary DATRAS
      longitude off Ireland/Iberia) would be indistinguishable from missing here:
      icesDatras's fetch pipeline scrubs literal -9 to NA for every numeric column,
      not just where -9 is a documented sentinel -- see data-raw/tier1_field_stats.R's
      header.
  - name: HaulLat
    type: number(quantity)
    description: Decimal latitude position on the hauling location
    units: decimal degrees
    range:
    - 36.0013
    - 65.0
    details: |-
      3 rows record exactly 0 degrees (the equator), categorically outside any DATRAS
      survey area -- excluded; the lower bound instead matches ShootLat's own clean
      minimum for the same archive.
  - name: HaulLong
    type: number(quantity)
    description: Decimal longitude position on the hauling location
    units: decimal degrees
    range:
    - -67.6762
    - 45.8753
    details: |-
      Same -9-as-missing caveat as ShootLong above (0 degrees, the Prime Meridian, is
      a genuine North Sea value here and is kept).
  - name: StatRec
    type: string
    description: |-
      Intended ICES statistical area rectangle (0.5 degrees latitude, 1 degree
      longitude)
    examples:
    - '37F8'
    - '35F5'
    - '36F7'
    - '32F3'
    - '36F6'
    details: |-
      701 distinct values in HH's archive (verified 2026-07-29); real ICES statistical
      rectangle codes (0.5 deg lat x 1 deg lon grid), not a fixed enum given the size
      of the grid. 12,235 of 150,262 HH rows unpopulated. Only present in HH and LT
      (confirmed 2026-07-29) -- consistent with the Open items note that LT's
      assessment output joins in a set of HH-style columns.
  - name: Depth
    type: number(quantity)
    description: Sampling depth in metres, measured from the water surface.
    units: m
    range:
    - 1.0
    - 3098.0
  - name: HaulVal
    type: enum
    description: Haul validity code
    values:
    - A
    - C
    - I
    - M
    - 'N'
    - S
    - V
  - name: HydroStNo
    type: string
    description: |-
      The national hydrographic station number. If possible, align with information
      submitted to ocean.ices.dk
    examples:
    - 74SC0000
    - '88888888'
    - '1'
    - '0'
    - '3'
    details: |-
      National station numbering (field's own description), so examples are
      illustrative only, not an exhaustive domain -- 18,373 distinct values, only
      79,371 of 150,262 rows populated. '88888888' recurs 1,635 times and reads like
      an undocumented all-8s placeholder/sentinel (the same kind of pattern seen
      elsewhere in HH, e.g. HaulDuration's zeros) rather than a real station ID, but
      is kept in `examples` (unlike a `range` exclusion, `examples` isn't a validity
      gate) since a reader should know it's a real recurring value. Verified
      2026-07-29 against the full archive.
  - name: StdSpecRecCode
    type: enum
    description: |-
      Information on the whether standard species have been recorded. Standard species
      depend on survey, see survey manuals for details.
    values:
    - '0'
    - '1'
    - '2'
    - '3'
    - '4'
  - name: BySpecRecCode
    type: enum
    description: Information on which bycatch species have been recorded.
    values:
    - '0'
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
  - name: DataType
    type: enum
    description: |-
      Specification of the data aggregation in the HL record. C: CPUE (per hour) data;
      TotalNo and CatCatchWgt are adjusted per hour trawling. R (raw), S (subsample of
      the entire catch): data as recorded during the cruise, and P (pseudocategory
      sampling, only used by Scotland).
    values:
    - '-9'
    - C
    - P
    - R
    - S
  - name: Netopening
    type: number(quantity)
    description: |-
      Mean value in metres of vertical net opening measurements. For details see the
      survey manual.
    units: m
    range:
    - 0.0
    - 76.0
  - name: Rigging
    type: enum
    description: |-
      The way the gear is rigged. Rigging depends on survey, see survey manuals for
      further details.
    values:
    - '-9'
    - BC
    - BM
    - BN
    - D
    - F
    - FB
    - FM
    - FT
    - FW
    - M
    - S
    - T
    - TS
    - TT
  - name: Tickler
    type: number(quantity)
    description: Amount of ticklers connected to the gear.
    range:
    - 0.0
    - 27.0
  - name: Distance
    type: number(quantity)
    description: Distance in metres between haul start and haul end point.
    units: m
    range:
    - 0.0
    - 59995.0
  - name: Warplngt
    type: number(quantity)
    description: |-
      Length of warp in metres. Defined by fishing depth. Warp/depth ratio is depends
      on survey, for further details see survey manuals.
    units: m
    range:
    - 0.0
    - 4065.0
  - name: Warpdia
    type: number(quantity)
    description: Warp diametre in millimetres.
    units: mm
    range:
    - 16.0
    - 30.0
    details: |-
      A dense, well-populated cluster runs 16-21mm and 27-30mm; isolated
      single-occurrence values below (1mm x2, 5mm x10, 12mm) and above (39, 56, 85,
      88mm) sit apart from it with no comparable support and are treated as data-entry
      errors, excluded here.
  - name: WarpDen
    type: number(quantity)
    description: |-
      Warp weight in kg per linear meter of warp. See survey manuals for more
      information.
    units: kg/m
    range:
    - 0.0
    - 26.0
  - name: DoorSurface
    type: number(quantity)
    description: Door surface area in square metres.
    units: m2
    range:
    - 0.0
    - 20.2
  - name: DoorWgt
    type: number(quantity)
    description: Door weight in kilograms.
    units: kg
    range:
    - 0.0
    - 1720.0
  - name: DoorSpread
    type: number(quantity)
    description: Mean value in metres of door spread measurements.
    units: m
    range:
    - 1.0
    - 250.0
    details: |-
      0m (9 rows) is excluded as a placeholder -- a rigged, towing trawl cannot have
      zero door spread. Three single-occurrence values (762, 767, 778m) sit far above
      everything else in the archive (next highest is 250m) and are treated as
      data-entry errors, excluded; a real, well-populated value at 3.6m (1128 rows,
      likely a fixed beam-trawl spread) is kept.
  - name: WingSpread
    type: number(quantity)
    description: |-
      Mean value in metres of wing spread measurements. For more details see the
      manual.
    units: m
    range:
    - 4.0
    - 50.0
    details: |-
      0m (9 rows), 1.8m and 2m (1 row each) are excluded as below any value with real
      support -- a well-populated cluster starts at 4m (1074 rows, likely a fixed
      beam-trawl spread). 142m (1 row) sits far above the next-highest real value
      (50m) and is treated as a data-entry error, excluded.
  - name: Buoyancy
    type: number(quantity)
    description: |-
      Total buoyancy of the net floats in kilograms. Recommended values depend on
      survey, see survey manuals for further details.
    units: kg
    range:
    - 0.0
    - 398.0
  - name: KiteDim
    type: number(quantity)
    description: Kite area in square metres.
    units: m2
    range:
    - 0.0
    - 1.0
    details: |-
      Coarse, equipment-spec values (0, 0.5, 0.7, 0.72, 0.8, 1) rather than a
      continuously measured quantity -- only 6 distinct values across 30,116 rows.
  - name: WgtGroundRope
    type: number(quantity)
    description: |-
      Total weight of the ground rope in kilograms. Recommended weight depends on
      survey, see survey manuals for further details.
    units: kg
    range:
    - 0.0
    - 2212.0
  - name: TowDir
    type: number(quantity)
    description: Direction of towing in degrees. 360=direction from south to north.
    units: degrees
    range:
    - 0.0
    - 360.0
    details: |-
      999 (3 rows) reads as an undocumented out-of-domain 'not recorded' marker, the
      same pattern confirmed for WindDir below. A further cluster -- 450 deg (62
      rows), 520(5), 460(5), 540(3), 510, 564, 702 (1 each) -- divided by 10 becomes
      ordinary bearings (45.0, 52.0, 46.0, 54.0, 51.0, 56.4, 70.2 deg); plausible but
      not investigated further (would need correlating with Country/Survey). Both
      groups are outside the documented 0-360 domain and excluded here.
  - name: GroundSpeed
    type: number(quantity)
    description: |-
      Ground speed of towing in knots. Recommended speed depends on survey, see survey
      manuals for more details
    units: knots
    range:
    - 0.0
    - 10.0
    details: |-
      Ceiling is a domain judgment (real trawling ground speed), not an observed
      cluster boundary -- observed values run 10.8 up to a 99.9 marker with no clean
      gap, all excluded.
  - name: SpeedWater
    type: number(quantity)
    description: Trawl speed on water in knots.
    units: knots
    range:
    - 0.0
    - 22.0
  - name: SurCurDir
    type: number(quantity)
    description: |-
      Surface current direction in degrees. No movement = 0, 360=direction from south
      to north.
    units: degrees
    range:
    - 0.0
    - 360.0
    details: |-
      Two single-occurrence values just above 360 (392, 390) excluded; the rest of the
      archive is densely populated right up to 360.
  - name: SurCurSpeed
    type: number(quantity)
    description: Surface current speed in m/sec.
    units: m/s
    range:
    - 0.0
    - 9.3
    details: |-
      99 (marker) and 46.3 and 16 (each a single, isolated occurrence with no support
      nearby) excluded; a smoother, better-populated tail resumes at 9.3 (3 rows) and
      below.
  - name: BotCurDir
    type: number(quantity)
    description: |-
      Bottom current direction in degrees. No movement = 0, 360=direction from south
      to north.
    units: degrees
    range:
    - 0.0
    - 359.0
  - name: BotCurSpeed
    type: number(quantity)
    description: Bottom current speed in metres/sec.
    units: m/s
    range:
    - 0.0
    - 9.9
    details: |-
      9.9 (1 row) is unusually high for a bottom current and resembles the '9-family'
      marker pattern seen elsewhere in HH, but a genuinely fast tidal-race reading
      can't be ruled out -- kept in range rather than excluded, unlike the more
      clear-cut cases above.
  - name: WindDir
    type: number(quantity)
    description: |-
      Direction of wind in degrees. Calm = 0,  direction from north to south = 360,
      varying direction = -1
    units: degrees
    range:
    - -1.0
    - 360.0
    details: |-
      -1 is documented ('varying direction'). 999 (57 rows) reads as an undocumented
      out-of-domain 'not recorded' marker; a handful of further single-occurrence
      values just above 360 (711, 504, 420, 365, 361) are also excluded.
  - name: WindSpeed
    type: number(quantity)
    description: Speed of wind in metres/sec.
    units: m/s
    range:
    - 0.0
    - 28.0
    details: |-
      Ceiling follows the Beaufort 10 upper bound (28.4 m/s, storm force) -- no vessel
      would be actively trawling above this. 1,641 of 109,012 populated rows (~1.5%)
      exceed it, tailing off smoothly with no clean gap up to 342 m/s; the count jumps
      from a thin 1-7-row-per-value tail above 28 to 357 rows right at 28, consistent
      with a real distribution below and noise above.
  - name: SwellDir
    type: number(quantity)
    description: |-
      Direction of swell in degrees. No movement=0, direction from south to north =
      360, varying direction = -1
    units: degrees
    range:
    - 0.0
    - 360.0
  - name: SwellHeight
    type: number(quantity)
    description: Height of (swell) waves, in metres
    units: m
    range:
    - 0.0
    - 3.0
    details: |-
      See known issue swell_height_type_mismatch (DATRAS-known-issues.yaml, not yet
      filed): icesVocab declares this an enum (codes H/L/M/N/NR/VH for height
      classes). Real HH archive data (verified 2026-07-30) contains continuous numeric
      values (0.0-2.0+ metres), not categorical codes. Archive and ICES specification
      disagree on whether this is a measured quantity or a categorized class.
      Candidate for DATRAS-known-issues.yaml formal escalation to imbus/ICES.
  - name: SurTemp
    type: number(quantity)
    description: Temperature at the surface water layer in Celsius degrees.
    units: degC
    range:
    - -1.5
    - 36.0
  - name: BotTemp
    type: number(quantity)
    description: Temperature at the bottom water layer in degrees Celsius
    units: degC
    range:
    - -1.0
    - 35.4
  - name: SurSal
    type: number(quantity)
    description: Salinity at the surface water layer in Practical Salinity Units (PSU).
    units: PSU
    range:
    - 0.0
    - 38.52
  - name: BotSal
    type: number(quantity)
    description: Salinity at the bottom water layer in Practical Salinity Units (PSU).
    units: PSU
    range:
    - 3.13
    - 39.93
  - name: ThermoCline
    type: enum
    description: |-
      Indication whether thermocline (min. 2 degrees temperature changes over 10
      metres depth) was observed
    values:
    - '-9'
    - 'N'
    - 'Y'
  - name: ThClineDepth
    type: number(quantity)
    description: |-
      Depth (metres, measured from water surface) at which the thermocline was found.
      Requires Y in Thermocline field.
    units: m
    range:
    - 0.0
    - 90.0
  - name: CodendMesh
    type: number(quantity)
    description: Codend mesh size in mm
    units: mm
    range:
    - 9.0
    - 100.0
    details: |-
      0mm (202 rows) excluded as a placeholder -- a codend by definition has some mesh
      size. 250mm (1 row) sits far above the next-highest real value (100mm, 644 rows)
      and is treated as a data-entry error, excluded.
  - name: SecchiDepth
    type: number(quantity)
    description: Secchi depth in metres
    units: m
    range:
    - 0.0
    - 9.0
  - name: Turbidity
    type: number(quantity)
    description: Turbidity in NTU
    units: NTU
    range:
    - 0.0
    - 0.0
    details: |-
      Only 202 of 150,262 hauls carry a value at all, and every one of them is exactly
      0 -- too sparse to characterize a real range; this reflects what was actually
      observed, not a claim that Turbidity never varies.
  - name: TidePhase
    type: number(quantity)
    description: Tidal phase in minutes before the next high tide
    units: min
    range:
    - -540.0
    - 780.0
    details: |-
      Strong clustering at exact-hour multiples (e.g. 660 min: 1095 rows, 600 min:
      1093, 540 min: 949) versus sparse off-hour values reads as providers rounding to
      the nearest hour, not an error. Separately: a genuine reading of exactly -9
      minutes (9 minutes before high tide) would be indistinguishable from missing,
      since icesDatras's fetch pipeline scrubs literal -9 to NA for every numeric
      column regardless of whether -9 is that field's own sentinel -- see
      data-raw/tier1_field_stats.R's header.
  - name: TideSpeed
    type: number(quantity)
    description: Speed of tide in m/s
    units: m/s
    range:
    - 0.0
    - 7.0
  - name: PelSampType
    type: enum
    description: Pelagic trawl sampling type
    values:
    - '-9'
    - '1'
    - '2'
    - '3'
  - name: MinTrawlDepth
    type: number(quantity)
    description: Highest point of the pelagic trawling
    units: m
    range:
    - 0.0
    - 699.0
    details: |-
      Unit is inferred, not stated in ICES's own field description ('Highest point of
      the pelagic trawling') -- assumed metres by convention with the rest of HH's
      depth fields.
  - name: MaxTrawlDepth
    type: number(quantity)
    description: Lowest point of the pelagic trawling
    units: m
    range:
    - 0.0
    - 712.0
    details: Same inferred-unit caveat as MinTrawlDepth above.
  - name: DateofCalculation
    type: number(ordinal)
    range:
    - 20120419
    - .inf
    details: |-
      8-digit YYYYMMDD stamp, digit order (month before day) verified consistent
      across all four Tier 1 tables. Upper bound deliberately left open: a live,
      continuously-advancing ICES Datacenter 'last recalculated' stamp, not submitted
      by data providers, so a fixed max would go stale immediately. Lower bound is
      this table's own verified minimum -- NOT forced identical across tables the way
      SweepLngt/HaulNo/Year are, since a genuine table-specific difference is
      plausible here (confirmed: LT's own minimum is years later).
  label: Haul Information
  description: 'Each row is one haul (trawl deployment). Contains haul-level metadata:
    geography, timing, gear deployment, environmental conditions, and performance
    flags.'
  details: 'Grain: each row represents one discrete haul deployment (one trawl operation).
    Population: all hauls submitted to ICES DATRAS within the covered survey/region/timeframe.
    Join key: HL, CA, and LT tables reference haul-level data via a composite identifier
    constructed from eight fields: Survey, Year, Quarter, Country, {Platform or Ship},
    Gear, {StationName or StNo}, and HaulNumber. The naming convention differs by
    era: newer submissions use Platform/StationName/HaulNumber (new style); older
    submissions use Ship/StNo/HaulNo (old style). Note: HaulNumber alone is NOT a
    valid join key and must be paired with all seven other fields -- but even the
    full composite key doesn''t recover everything: 288,581 CA rows (4.92%) carry
    a -9 sentinel (not a null; verified 2026-08-07) in HaulNumber/HaulNo and match
    no HH haul on any subset of the 8 fields. See DATRAS-known-issues.yaml (ca_haulno_unlinkable_to_hh)
    and obus::dr_add_id for the composite ID construction logic.'
