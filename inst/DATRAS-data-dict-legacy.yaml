      confirms boolean intent. Of 5,865,076 rows: -9 is present and dominant (5,021,736
      rows, 85.6%); N: 829,547 (14.1%); Y: 13,793 (0.24%); zero other values. No icesVocab
      entry exists for this field under either name -- -9 reads as the standard generic-missing
