    type: enum
    description: |-
      Type of species code used for species definition at the record. Use 'W' for
      WoRMS AphiaID
    values:
    - T
    - W
  - name: SpecCode
    type: number(id)
    description: Official WoRMS AphiaID code of species reported at the record.
    examples:
    - 213
    - 126326
    - 127118
    - 158513
    - 1667212
    constraints:
    - required
    details: |-
      Official WoRMS AphiaID as submitted by the data provider -- contrast with
      Valid_Aphia, the ICES Datacenter's own validated/corrected version of the same
      concept, inserted server-side (see Valid_Aphia's own details below).
    label: Species (WoRMS AphiaID)
  - name: AreaType
    type: string
    description: Age sampling aggregation level
    examples:
    - '0'
    - '13'
    - '2'
    - '12'
    - '6'
    details: |-
      Field's own description ('Age sampling aggregation level') doesn't explain what
      the codes themselves mean, but icesVocab's TS_AreaType resolves them (checked
      2026-07-29, data-raw/datras_vocabulary.R): '0'=ICES Statistical Rectangles,
      '2'=Standard NS Roundfish Areas, '6'=EVHOE areas, '12'=Spanish North Areas,
      '13'=ICES Divisions. Not retyped enum because TS_AreaType has 27 official codes
      total, over the seed's own VOCAB_CODE_LIMIT (20, data-raw/spec_01_seed_dict.R)
      for a usable `values` map -- and confirms the true domain genuinely is wider
      than what's observed here (17 of 27 codes appear in this archive). Verified
      2026-07-29 against the full CA archive.
  - name: AreaCode
    type: string
    description: Area coding according to AreaType
    examples:
    - VIa
    - 38G3
    - 43G1
    - 37G1
    - 44G0
    details: |-
      Field's own description says coding is 'according to AreaType' (its sibling
      field) -- meaning depends on that field's own value, same pattern as
      LngtClass/LngtCode. Codes mix ICES-area style (VIIg) and rectangle-like style
      (38G3). 635 distinct values, 1,898,151 of 5,966,950 rows unpopulated. Verified
      2026-07-29 against the full CA archive.
  - name: LngtCode
    type: enum
    description: |-
      Measurement accuracy used for the LngtClass (mm, 0.5 cm, cm, 5 cm). Survey and
      species specific, see survey manuals for further details. When measured to the
      mm or 0.5 below: report LngtClass as mm (10.1=101), for cm and 5 cm report cm in
      LngtClass
    values:
    - '-9'
    - '.'
    - '0'
    - '1'
    - '2'
    - '5'
    - '9'
  - name: LngtClass
    type: number(quantity)
    description: |-
      Lower length boundary of the Length class. In cm or mm depending on the
      LngtCode. E.g. 10-11 cm=10
    range:
    - 0.0
    - 5630.0
    details: |-
      Unit varies by the sibling LngtCode field (mm or cm; see LngtCode's own values
      map), so no fixed units here. One isolated outlier excluded, 2026-07-29: 932
      (LngtCode '1', i.e. 9.32m) -- a lone occurrence with a 2.3x gap to the
      next-highest value (405). Curated separately from HL's own LngtClass: CA's
      population is aged individuals only, a different (and differently distributed)
      subset from HL's whole-catch length-frequency tally, so the two are not assumed
      identical (Working principles, rule 12).
    label: Length Class (cm)
  - name: Sex
    type: enum
    description: |-
      Gender of the described species category. In CA-records should be defined by
      dissection. If no determination was performed, report '-9'. If determination
      failed, report 'U'.
    values:
    - '-9'
    - B
    - F
    - M
    - 'N'
    - T
    - U
  - name: Maturity
    type: string
    description: |-
      Sexual maturation of the individual(s) measured. Often needs dissection, but not
      for e.g. male elasmobranchs. MaturityScale should be filled in when filling in
      Maturity.
    examples:
    - '61'
    - '62'
    - '1'
    - '2'
    - 'B'
    details: |-
      Field's own description says the scheme depends on the sibling MaturityScale
      field ('MaturityScale should be filled in when...') -- explains the observed mix
      of numeric (61, 62, 1, 2) and letter (B, A) codes, different maturity scales
      using different code sets, not an inconsistency. 48 distinct values, 3,173,580
      of 5,966,950 rows unpopulated. Verified 2026-07-29 against the full CA archive.
  - name: PlusGr
    type: enum
    description: |-
      Records with high age categories can be grouped into the Plus group. If the plus
      group age is specified, no higher ages can be reported for the species in the
      haul.
    values:
    - +
    - '-9'
  - name: Age
    type: number(quantity)
    units: years
    range:
    - 0.0
    - 99.0
    details: |-
      -1 (1757 rows) reads as a systematic, undocumented 'not determined' sentinel; -5
      and -95 (1 row each) are isolated anomalies -- all three excluded. 99 (54 rows)
      is kept: real, repeated support, not a fluke -- reads like a plus-group/max-age
      reporting convention, though that mechanism isn't confirmed here, just noted as
      an observation. ICES's getDatrasFieldList documents a field 'IndividualAge' for
      CA, paired with old-name 'AgeRings' -- but 'AgeRings' is not a real CA field
      (verified 2026-08-06 against both the archive and getCAdata's own live ASMX
      response; the real field is 'Age', used here). Since that row's old-name half is
      already wrong, its proposed new name isn't trusted either. Filed with ICES; not
      yet resolved upstream.
  - name: CANoAtLngt
    type: number(quantity)
    description: |-
      Amount of fish at the given category (per haul, species, length class, sex,
      maturity, age).
    range:
    - 1.0
    - 218.0
    details: |-
      Distinct population from HL's own NumberAtLength (HLNoAtLngt): this counts aged
      individuals only, not the whole catch, hence the much smaller scale -- not
      assumed identical (Working principles, rule 12).
  - name: IndWgt
    type: number(quantity)
    description: Measured individual weight of the fish (grams)
    units: g
    range:
    - 0.0
    - 97000.0
  - name: FishID
    type: string
    description: Fish identification number - running sampling number of the specimen
    examples:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    details: |-
      Reads as a sequential per-sample identifier (dense run of small
      integers-as-strings), open-ended and illustrative only, not an exhaustive domain
      -- 170,774 distinct values, only 1,118,002 of 5,966,950 rows populated (~18.7%).
      Verified 2026-07-29 against the full CA archive.
  - name: GenSamp
    type: enum
    description: Flag whether genetic sample was taken
    values:
    - 'Y'
    - 'N'
    details: |-
      Field's own description ('Flag whether genetic sample was taken') confirms
      boolean intent; verified 100% clean two-value split against the full archive,
      2026-07-29 (N: 829,547 rows; Y: 13,793; zero other values across 843,340
      non-null rows, 5,123,610 unpopulated).
  - name: StomSamp
    type: enum
    description: Flag whether stomach sampling was performed
    values:
    - 'Y'
    - 'N'
    details: |-
      Field's own description ('Flag whether stomach sampling was performed') confirms
      boolean intent; verified 100% clean two-value split against the full archive,
      2026-07-29 (N: 1,018,036 rows; Y: 39,403; zero other values across 1,057,439
      non-null rows, 4,909,511 unpopulated).
