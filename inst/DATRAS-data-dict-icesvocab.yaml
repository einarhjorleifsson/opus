    - 97000.0
  - name: FishID
    type: string
    description: Fish identification number - running sampling number of the specimen
    examples:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    details: Reads as a sequential per-sample identifier (dense run of small integers-as-strings),
      open-ended and illustrative only, not an exhaustive domain -- 170,774 distinct
      values, only 1,118,002 of 5,966,950 rows populated (~18.7%). Verified 2026-07-29
      against the full CA archive.
  - name: GeneticSamplingFlag
    type: enum
    description: Flag whether genetic sample was taken
    values:
    - 'Y'
    - 'N'
    details: 'Field''s own description (''Flag whether genetic sample was taken'')
      confirms boolean intent; verified 100% clean two-value split against the full
      archive, 2026-07-29 (N: 829,547 rows; Y: 13,793; zero other values across 843,340
      non-null rows, 5,123,610 unpopulated).'
  - name: StomachSamplingFlag
    type: enum
    description: Flag whether stomach sampling was performed
    values:
    - 'Y'
    - 'N'
    details: 'Field''s own description (''Flag whether stomach sampling was performed'')
      confirms boolean intent; verified 100% clean two-value split against the full
      archive, 2026-07-29 (N: 1,018,036 rows; Y: 39,403; zero other values across
      1,057,439 non-null rows, 4,909,511 unpopulated).'
  - name: AgeSource
    type: enum
    description: Biological sample type
    values:
      Otolith: Otolith
      Scale: Scale
      Operculum: Operculum
      Vertebra: Vertebra
      Finray: Finray
    label: Age Determination Method
  - name: AgePreparationMethod
    type: enum
    description: Preparation method of the sampled tissue
    values:
      Burnt: Burnt
      Thin section: Thin section
      Break and burn: Break and burn
    label: Specimen Preparation for Aging
  - name: OtolithGrading
    type: enum
    description: Grading of the otolith reading
    values:
    - '-9'
    - '1'
    - '2'
    - '3'
    - '4'
  - name: ParasiteSamplingFlag
    type: enum
    description: Flag whether parasites sampling was performed
    values:
    - 'Y'
    - 'N'
    details: 'Field''s own description (''Flag whether parasites sampling was performed'')
      confirms boolean intent; verified 100% clean two-value split against the full
      archive, 2026-07-29 (N: 893,790 rows; Y: 76,620; zero other values across 970,410
      non-null rows, 4,996,540 unpopulated).'
  - name: MaturityScale
    type: enum
    description: Maturity scale type used in the Maturity field. From 2021 only M6
      and SMSF will be accepted for new submissions.
    values:
    - '-9'
    - M1
    - M10
    - M4
    - M5
    - M6
    - MRF6
    - R1
    - R2
    - S6
    - SMSF
  - name: DateofCalculation
    type: number(ordinal)
    range:
    - 20120419
    - .inf
    details: '8-digit YYYYMMDD stamp, digit order (month before day) verified consistent
      across all four Tier 1 tables. Upper bound deliberately left open: a live, continuously-advancing
      ICES Datacenter ''last recalculated'' stamp, not submitted by data providers,
      so a fixed max would go stale immediately. Lower bound is this table''s own
      verified minimum -- NOT forced identical across tables the way SweepLength/HaulNumber/Year
      are, since a genuine table-specific difference is plausible here (confirmed:
      LT''s own minimum is years later).'
  - name: Valid_Aphia
    type: number(id)
    details: 'See known issue valid_aphia_type_mismatch (DATRAS-known-issues.yaml,
      not yet filed): ICES''s WSDL declares this field character, but the live service
      always returns it numeric -- it''s a WoRMS AphiaID (an identifier, hence number(id),
      not a quantity). CA''s own instance was missed when HL''s Valid_Aphia was originally
      filled (found 2026-07-29 via validate-spec''s S07 check) -- same concept as
      HL''s Valid_Aphia (ICES Datacenter''s validated AphiaID) but a different sampling
      population (aged individuals only), so queried independently rather than assumed
      identical (Working principles, rule 12). 667 distinct values, 0 unpopulated
      (always present). Verified 2026-07-29 against the full CA archive.'
    examples:
    - 213
    - 105872
    - 126412
    - 141452
    - 1667212
  label: Age Composition (Individual)
  description: Each row is one aged fish specimen from a haul. Contains individual-level
    biological measurements (length, weight, age, sex, maturity) on a subsample of
    the catch; linked to HH via the composite haul identifier.
  details: 'Grain: each row is one biological specimen (a single aged fish) from a
    haul. Population: individual organisms sampled and measured from hauls within
    covered surveys, not the full catch <U+2014> a subsample. Linked to HH via the composite
    haul identifier (Survey + Year + Quarter + Country + Platform/Ship + Gear + StationName/StNo
    + HaulNumber). Critical note: HaulNumber contains 305,276 null values (5.12% of
    5.97M rows), violating the constraint marked in DATRAS-data-dict.yaml. This nullability
    breaks assumptions about HaulNumber as a join key; the composite 8-field identifier
    is required instead. See DATRAS-known-issues.yaml (issue: ca_haul_number_nullable)
    for full details on the constraint violation and preprocessing caveat (icesDatras
    converts literal -9 to NA).'
  origin: data-raw/DATASET_curate_dict.R
  source:
    parquet: CA.parquet
- name: LT
  columns:
  - name: Survey
    type: string
    examples:
    - NS-IBTS
    - BTS
    - BITS
    - DYFS
    - Can-Mar
    details: '29 distinct values in HH''s archive (verified 2026-07-29); ICES DATRAS
      survey acronym, an open list, not a fixed enum. icesVocab DOES resolve a ''Survey''
      key by name (checked 2026-07-29, data-raw/datras_vocabulary.R) but it''s a false
      lead, not this field''s source: its 133 codes are ICES''s own cross-domain internal
      survey IDs (e.g. ''A1012''), a completely different scheme from DATRAS''s own
      short acronyms -- confirmed by checking real codes against it directly, not
      assumed. Not used.'
  - name: Quarter
    type: enum
    description: Cruise quarter. Hauls outside of the calendar quarter can be reported
      with the same quarter reference, if agreed by the survey group.
    values:
    - '1'
    - '2'
    - '3'
    - '4'
  - name: Year
    type: number(ordinal)
    description: Cruise year (YYYY)
    range:
    - 1965.0
    - 2026.0
    constraints:
    - required
  - name: Platform
    type: string
    description: SeaDataNet Ship and Platform Codes
    examples:
    - 74E9
    - 26D4
    - 748S
    - 64SS
    - 18NE
    details: 110 distinct values in HH's archive (verified 2026-07-29); SeaDataNet
      ship/platform codes, an open list, not a fixed enum.
  - name: Gear
    type: string
    description: Gear type code
    examples:
    - GOV
    - BT3
    - W2A
    - TVL
    - BT6
    details: '55 of 99 official codes observed in HH''s archive (verified 2026-07-29).
      icesVocab''s Gear list confirms all five real examples used here (checked 2026-07-29,
      data-raw/datras_vocabulary.R): GOV=''GOV Trawl'', BT3=''Beam trawl 3 meters'',
      BT6=''Beam trawl 6 meters'', TVL=''Large TV trawl'', W2A=''Western IIA''. Not
      retyped enum: 99 codes is far past the seed''s VOCAB_CODE_LIMIT of 20.'
  - name: Country
    type: string
    description: ISO 3166 country codes and region codes used by ICES
    examples:
    - NL
    - DE
    - GB
    - DK
    - GB-SCT
    details: '22 distinct values in HH''s archive (verified 2026-07-29); ''GB-SCT''
      illustrates that this is ISO 3166 codes PLUS ICES''s own sub-national region
      codes (per the field''s own description), not plain ISO 3166 alone. icesVocab
      DOES resolve a ''TS_Country'' key by name (checked 2026-07-29) but it''s a false
      lead too, same as Survey above: its 25 codes are 3-letter (e.g. ''BEL'', ''DEN'',
      ''ENG''), a different scheme entirely from this field''s own 2-letter-plus-region
      codes -- confirmed by checking real codes against it directly. Not used.'
  - name: StationName
    type: string
    description: Station number. National coding system, not defined by ICES.
    examples:
    - '1'
    - '2'
    - '22'
    - '9'
    - '17'
    details: Field's own description says this is a national coding system, not defined
      by ICES -- examples show the common shape (short numeric-looking strings), not
      an exhaustive domain. 24,130 distinct values in HH's archive (verified 2026-07-29),
      the highest cardinality of any Tier 1 string field; 6,899 of 150,262 rows unpopulated.
  - name: HaulNumber
    type: number(ordinal)
    description: Sequential numbering of hauls during cruise.
    range:
    - 0.0
    - 82483.0
    constraints:
    - required
    details: Sequential per-cruise numbering, but countries vary in whether it resets
      each cruise or runs continuously -- the archive-wide range spans many cruises'
      own counts pooled together, not one cruise's own haul tally.
  - name: ShootLatitude
    type: number(quantity)
    description: Decimal latitude position on the shooting location
    units: decimal degrees
    range:
    - 36.0013
    - 76.2117
  - name: ShootLongitude
    type: number(quantity)
    description: Decimal longitude position on the shooting location
    units: decimal degrees
    range:
    - -67.7115
    - 24.4333
    details: 'A genuine value of exactly -9.0000 degrees (9 deg W, an ordinary DATRAS
      longitude off Ireland/Iberia) would be indistinguishable from missing here:
      icesDatras''s fetch pipeline scrubs literal -9 to NA for every numeric column,
      not just where -9 is a documented sentinel -- see data-raw/tier1_field_stats.R''s
      header.'
  - name: HaulLatitude
    type: number(quantity)
    description: Decimal latitude position on the hauling location
    units: decimal degrees
    range:
    - 36.0013
    - 65.0
    details: 3 rows record exactly 0 degrees (the equator), categorically outside
      any DATRAS survey area -- excluded; the lower bound instead matches ShootLatitude's
      own clean minimum for the same archive.
  - name: HaulLongitude
    type: number(quantity)
    description: Decimal longitude position on the hauling location
    units: decimal degrees
    range:
    - -67.6762
    - 45.8753
    details: Same -9-as-missing caveat as ShootLongitude above (0 degrees, the Prime
      Meridian, is a genuine North Sea value here and is kept).
  - name: OSPARArea
    type: string
    examples:
    - II
    - III
    - IV
    - V
    details: OSPAR maritime area code (Roman-numeral regions); 4 distinct values observed,
      14,498 of 79,451 rows unpopulated. No description present to confirm whether
      this is the complete official OSPAR region set. Verified 2026-07-29 against
      the full LT archive.
  - name: MSFDArea
    type: string
    examples:
    - North-east Atlantic Ocean
    - Baltic Sea
    details: Marine Strategy Framework Directive region name; only 2 distinct values
      observed, 4,295 of 79,451 rows unpopulated. The EU MSFD framework has more than
      two regions overall -- DATRAS's own survey coverage may simply never reach the
      others, so not treated as a closed/exhaustive set. Verified 2026-07-29 against
      the full LT archive.
  - name: BottomDepth
    type: number(quantity)
    description: Sampling depth in metres, measured from the water surface.
    units: m
    range:
    - 1.0
    - 3098.0
  - name: Distance
    type: number(quantity)
    description: Distance in metres between haul start and haul end point.
    units: m
    range:
    - 0.0
    - 59995.0
  - name: DoorSpread
    type: number(quantity)
    description: Mean value in metres of door spread measurements.
    units: m
    range:
    - 1.0
    - 250.0
    details: 0m (9 rows) is excluded as a placeholder -- a rigged, towing trawl cannot
      have zero door spread. Three single-occurrence values (762, 767, 778m) sit far
      above everything else in the archive (next highest is 250m) and are treated
      as data-entry errors, excluded; a real, well-populated value at 3.6m (1128 rows,
      likely a fixed beam-trawl spread) is kept.
  - name: WingSpread
    type: number(quantity)
    description: Mean value in metres of wing spread measurements. For more details
      see the manual.
    units: m
    range:
    - 4.0
    - 50.0
    details: 0m (9 rows), 1.8m and 2m (1 row each) are excluded as below any value
      with real support -- a well-populated cluster starts at 4m (1074 rows, likely
      a fixed beam-trawl spread). 142m (1 row) sits far above the next-highest real
      value (50m) and is treated as a data-entry error, excluded.
  - name: LTREF
    type: enum
    description: Reference code of the list used for categorizing litter. See LTREF
