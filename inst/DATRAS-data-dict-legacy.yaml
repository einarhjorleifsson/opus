      PORB: Porcupine Baka
      PRL: Pelagic trawl Red Lion 3072
      PRS: Purse seines
      PRT: Russian pelagic trawl (75/448)
      PSN205: PSN205 pelagic trawl gear applied on Walther Herwig III
      PSN388: Pelagic trawl PSN388 Krake
      PT154: Young Gadoid Pelagic Trawl PT154
      RAPIA: Modified beam trawl with a rigid mouth (Width-3.5 m Weight-225 kg Four
        120-mm wide skids 46-mm codend mesh size)
      ROT: Rock hopper otter trawl
      RTA: Pelagic trawl 70/300 project 0495
      RTM33S: Pelagic trawl RTM33S
      SCT: Scraping tool
      SON: Sonderborg trawl
      SOV: SOV-NET
      SRN: Seines and ring nets
      TV3: Bottom trawl TV-3 930#
      TVCOD: Trawl model TV112-24-646
      TVL: Large TV trawl
      TVM: Bottom trawl TV3-280x80
      TVS: Small TV trawl
      US4: US 4 Seam 3 Bridle
      VIN: Vinge trawl
      W2A: Western IIA
      WP53: Pelagic trawl WP35/64x4
      Y36: 'Yankee #36'
    details: >-
      All 99 active icesVocab Gear Type codes (deprecated code OTG excluded).
      55 confirmed used in DATRAS archive; 44 additional codes are valid ICES definitions
      (may be used in future submissions or by other surveys). Each code has a full
      description in icesVocab. Validation: enum restricts submissions to these codes.
    constraints:
    - required
    - foreign_key
  - name: SweepLngt
    type: number(quantity)
    description: >-
      Length of sweep in metres. Recommended values depend on survey and
      quarter, see survey manuals for further details
    units: m
    range:
    - 0
    - 850
  - name: GearEx
    type: enum
    description: >-
      Deviations of the standard gear. Depends on survey, see survey manuals
      for further details.
    values:
      '-9': Not know
      B: Bobbins
      D: Double sweeps
      DB: Double beam, catch from two beam trawls put together
      I2: Groundgear D with 16" bobbins
      MN: Without multisampler
      MY: With multisampler
      R: Rockhopper
      S: Standard
      S1: Groundgear with 21" hoppers
      S2: Groundgear with 16" hoppers
      SB: Single beam, catch from one beam trawl
      ST: Strapping
    details: >-
      icesVocab's TS_GearEx resolves this as a controlled 13-code gear-exception
      list (AC_GearExceptions also registered, a 1-code subset -- never the right
      prefix for a DATRAS field, Issue 8). Against the real archive: CA uses 11 of
      13 codes, HH and HL 9 of 13 each, LT 8 of 13; 0 real values fall outside the
      vocab in any table.
  - name: DoorType
    type: enum
    description: >-
      Type of door used
    values:
      '-9': Not known
      F: Flat
      K: Karm waco
      P: Polyvalent
      PE: Portuguese Euronete round nose
      PI: Poly Ice Oval
      R: Rectangle
      T: Thyboroen Trawl Doors Type 2
      T4: Thyboroen Trawl Doors Type 4
      T6: Thyboroen Type 16 straight oval doors
      V: Vee
      WR: Wooden rectangular doors
    details: >-
      icesVocab's TS_DoorType resolves this as a controlled 12-code gear-door-type
      list (AC_DoorType also registered, never the right prefix for a DATRAS field
      -- Issue 8). Against the real archive: CA and HH each use 11 of 12 codes, HL
      11 of 12, LT 6 of 12; 0 real values fall outside the vocab in any table.
  - name: StNo
    type: string
    description: >-
      Station number. National coding system, not defined by ICES.
    examples:
    - '1'
    - '2'
    - '22'
    - '9'
    - '17'
    details: >-
      Field's own description says this is a national coding system, not
      defined by ICES -- examples show the common shape (short numeric-looking strings),
      not an exhaustive domain; not a coded field, so no icesVocab entry is expected
      (none of the 580 registered vocab keys match). Of 145,958 HH rows (20,319 distinct
      values), -9 accounts for exactly 6,899, not a null. ICES's own field-description
      spreadsheet confirms the ICES-wide '-9 = no information' convention applies
      here, same as HaulNo above. Unlike HaulNo's own -9 sentinel, this isn't an
      orphaning problem: CA's own matching StNo=-9 rows for these same hauls (191,893
      rows) join HH successfully via the other 7 composite-key fields, since both
      sides consistently carry -9 for the same haul rather than disagreeing.
    constraints:
    - required
    - foreign_key
  - name: HaulNo
    type: number(ordinal)
    description: >-
      Sequential numbering of hauls during cruise.
    range:
    - 0
    - 82483
    constraints:
    - required
    - foreign_key
    details: >-
      Sequential per-cruise numbering, but countries vary in whether it resets
      each cruise or runs continuously -- the archive-wide range spans many cruises'
      own counts pooled together, not one cruise's own haul tally. No icesVocab entry
      exists under any name or prefix (none of the 580 registered vocab keys match)
      -- expected for a plain sequential identifier, not a coded field. ICES's own
      field-description spreadsheet confirms Mandatory: Yes and documents an ICES-wide
      convention applicable to any field with a header: submit -9 for 'no information'
      -- so the -9 sentinel seen in CA (see known-issues.yaml: ca_haulno_unlinkable_to_hh)
      is a sanctioned value, not an undocumented one.
  - name: Year
    type: number(ordinal)
    description: >-
      Cruise year (YYYY)
    range:
    - 1965
    - 2026
    constraints:
    - required
    - foreign_key
  - name: SpecCodeType
    type: enum
    description: >-
      Type of species code used for species definition at the record. Use
      'W' for WoRMS AphiaID
    values:
      T: TSN code - should not be used for data submissions
      W: WoRMS AphiaID code
    details: >-
      icesVocab's TS_SpecCodeType resolves this as a controlled 2-code species-code-type
      list. Against the real archive: both CA and HL use both codes, a clean bidirectional
      match.
    constraints:
    - required
  - name: SpecCode
    type: number(id)
    description: >-
      Official WoRMS AphiaID code of species reported at the record.
    examples:
    - 55
    - 122388
    - 127196
    - 159048
    - 1789435
    constraints:
    - required
    details: >-
      Official WoRMS AphiaID as submitted by the data provider -- contrast
      with Valid_Aphia, the ICES Datacenter's own validated/corrected version of the
      same concept, inserted server-side (see Valid_Aphia's own details below).
    label: Species (WoRMS AphiaID)
  - name: SpecVal
    type: enum
    description: >-
      Validity of species records, e.g. to specify if species has only
      been counted, measured, weighed, etc.
    values:
      '0': 'Invalid information. Use in data products: no.'
      '1': 'Representative length information (length measurements, numbers and category
        catch weights). Use in data products: yes.'
      '10': 'Length measurements and numbers only. No category catch weights. Use
        in data products: yes.'
      '2': 'Representative length information only for commercial/assessed species.
        Full set of species to be completed next year after a two-years ban to allow
        national data use. Use in data products: yes, only for commercial/assessed
        species.'
      '4': 'Total number only. No length measurements or category catch weight. Use
        in data products: yes.'
      '5': 'Presence/absence only. No length measurements, numbers or category catch
        weights. Use in DATRAS products: yes.'
      '6': 'Category catch weight only. No length measurements or numbers. Use in
        DATRAS products: yes.'
      '7': 'Numbers and category catch weights only. No length measurements. Use in
        DATRAS products: yes.'
      '8': 'Volume only. No length measurements, numbers or category catch weights.
        Use in DATRAS products: yes.'
      '9': 'Representative length information (length measurements, numbers and category
        catch weights). Use in DATRAS products: no.'
    details: >-
      icesVocab's TS_SpecVal resolves this as a controlled 10-code species-validity
      list. Against the real HL archive: 8 of 10 codes in use, 0 real values outside
      the vocab.
    constraints:
    - required
  - name: Sex
    type: enum
    description: >-
      Gender of the described species category. In CA-records should be
      defined by dissection. If no determination was performed, report '-9'. If determination
      failed, report 'U'.
    values:
      '-9': not sampled
      B: Berried
      F: Female
      M: Male
      'N': Not included when calculating data
      T: Neutral
      U: Unidentified
    details: >-
      icesVocab's TS_Sex resolves this as a controlled 7-code list (AC_Sex
      also registered, never the right prefix for a DATRAS field -- Issue 8). Against
      the real archive: both CA and HL use 5 of the 7 codes; 0 real values fall outside
      the vocab in either table.
  - name: TotalNo
    type: number(quantity)
    description: >-
      Total number of specimens per category (unique combination of cruise
      haul, species, sex, devstage and subsampling category identifier). For data
      type C, values should be standardised to 60 minutes. TotalNo=SUM(HLNoAtLngt).
    range:
    - 0.0
    - 3581592.0
    details: >-
      Per the field's own description, TotalNo=SUM(HLNoAtLngt); values in the
      hundreds of thousands and non-integer values (7.7% of populated rows) both trace
      to the same documented mechanism -- DataType C records are standardised to 60
      minutes, which can inflate very abundant small-bodied catches to large, non-integer
      counts. Top values all have real support (9-30 occurrences each, a smooth tail),
      not isolated errors.
  - name: CatIdentifier
    type: enum
    description: >-
      Subsampling category by size for same species in the haul. If DataType
      is C, CatIdentifier is always 1. Further details on survey specific subsampling
      categories are available in the survey manuals.
    values:
      '-9': Unknown
      '1': 1. Level
      '10': 10. Level
      '11': 11. Level
      '12': 12. Level
      '13': 13. Level
      '14': 14. Level
      '15': 15. Level
      '16': 16. Level
      '17': 17. Level
      '18': 18. Level
      '19': 19. Level
      '2': 2. Level
      '20': 20. Level
      '21': 21. Level
      '22': 22. Level
      '23': 23. Level
      '24': 24. Level
      '25': 25. Level
      '26': 26. Level
      '27': 27. Level
      '28': 28. Level
      '29': 29. Level
      '3': 3. Level
      '30': 30. Level
      '31': 31. Level
      '32': 32. Level
      '33': 33. Level
      '34': 34. Level
      '35': 35. Level
      '36': 36. Level
      '37': 37. Level
      '38': 38. Level
      '39': 39. Level
      '4': 4. Level
      '40': 40. Level
      '41': 41. Level
      '42': 42. Level
      '43': 43. Level
      '44': 44. Level
      '45': 45. Level
      '46': 46. Level
      '47': 47. Level
      '48': 48. Level
      '49': 49. Level
      '5': 5. Level
      '50': 50. Level
      '51': 51. Level
      '52': 52. Level
      '53': 53. Level
      '54': 54. Level
      '55': 55. Level
      '6': 6. Level
      '7': 7. Level
      '8': 8. Level
      '9': 9. Level
    details: >-
      icesVocab's TS_CatIdentifier resolves this as a controlled, leveled
      code list (56 active codes: '1. Level' through '55. Level', plus a '-9'/'Unknown'
      sentinel) -- not an open numeric ID, confirming this field's own already-documented
      shape (a coded scheme, not a sequence). 14 real distinct values (-9, 1-5, 11-14,
      21-23, 31), zero gaps against the vocab's 56 codes either direction; 42 of
      the 56 are valid ICES definitions not yet observed in this archive. Live WSDL
      (getHLdata) declares this field int, not string -- an accepted, permanent M01
      divergence between the WSDL-driven archive and this curated enum spec (see Valid_Aphia's
      own note for the general pattern), not a bug to fix by changing either side.
    label: Species Category
    constraints:
    - required
  - name: NoMeas
    type: number(quantity)
    description: |-
      Number of measured specimens per category (unique combination of cruise haul, species, sex, and subsampling category identifier and devstage). For data type C, values should be standardised to 60 minutes.
      NoMeas=Sum(HLNoAtLngt).
    range:
    - 0
    - 578731
    details: >-
      Same DataType C standardisation basis as TotalNo above; top values are
      all well-supported (4-10 occurrences each), not isolated errors.
    constraints:
    - required
  - name: SubFactor
    type: number(quantity)
    description: >-
      Sub-sampling factor. If 1/6 of the catch was measured, report 6.
      If DataType is C, it should be reported as 1. If DataType is S, it is always
      &gt;1. If DataType is R, the SubFactor is = 1 or &gt;1 for different species
      depending on whether they were subsampled.
    range:
    - 1.0
    - 10997.1834
    details: >-
      144,395 of 13,754,042 rows (1.05%) show values below 1 at face value,
      but 144,041 of those are the -9 sentinel, not a genuine sub-1 measurement --
      leaving 354 real anomalies (0.0026%), contradicting the field's own description
      (documented as always >=1, for every DataType) -- excluded. The high end is
      genuine, not an error: top values cluster at power-of-2-like numbers (4096 recurs
      133 times; 8192, 5120, 6144 also recur with real support), consistent with repeatedly
      halving a very abundant catch to reach a manageable subsample.
    constraints:
    - required
  - name: SubWgt
    type: number(quantity)
    description: >-
      Weight of the subsample in grams.
    units: g
    range:
    - 0
    - 3519200
  - name: CatCatchWgt
    type: number(quantity)
    description: >-
      For datatype R or S: Catch weight in grams per category (for the
      unique combination of cruise haul, species, sex, devstage and subsampling category
      identifier). For datatype C, values should be standardised to 60 minutes.
    units: g
    range:
    - 0
    - 35568000
    details: >-
      -900 (2562 rows) and -100 (1 row) are excluded as a 'not weighed'
      placeholder, the same pattern seen in several HH fields. The high end is genuine:
      top values all have real support (3-18 occurrences each).
    constraints:
    - required
  - name: LngtCode
    type: enum
    description: >-
      Measurement accuracy used for the LngtClass (mm, 0.5 cm, cm, 5 cm).
      Survey and species specific, see survey manuals for further details. When measured
      to the mm or 0.5 below: report LngtClass as mm (10.1=101), for cm and 5 cm report
      cm in LngtClass
    values:
      '-9': Missing Value
      '.': '1 mm length class, reporting units: mm'
      '0': '0.5 cm length class, reporting units: mm'
      '1': '1 cm length class, reporting units: cm'
      '2': '2 cm length class, reporting units: cm'
      '5': '5 cm length class, reporting units: cm'
      '9': + group
    todo: Confirm whether -9 (2.69% of non-null rows) is a genuine LengthCode code
      or just the generic missing-value sentinel -- no icesVocab key resolves for
      this field under either name, so nothing external confirms it either way.
    details: >-
      icesVocab's TS_LngtCode resolves this as a controlled 7-code length-measurement-type
      list. Against the real archive: CA uses 4 of 7 codes, HL uses 5 of 7; 0 real
      values fall outside the vocab in either table.
    constraints:
    - required
  - name: LngtClass
    type: number(quantity)
    description: >-
      Lower length boundary of the Length class. In cm or mm depending
      on the LngtCode. E.g. 10-11 cm=10
    range:
    - 0
    - 4500
    details: >-
      Unit varies by the sibling LngtCode field (mm or cm; see LngtCode's
      own values map), so no fixed units here. Two isolated outliers excluded: 11930
      (LngtCode '.', i.e. 11.93m) and 900 (LngtCode '1', i.e. 9m) -- each a lone
      occurrence far above the next-highest real value. Everything else, including
      a cluster around 420-460 under LngtCode '1' (4.2-4.6m -- large but not implausible
      for occasional large elasmobranch/tuna bycatch), is kept as-is: this is a first
      curation pass from data patterns alone, not a domain-expert review, and a tighter
      bound wasn't asserted without one. CA's own LngtClass is curated separately
      (a different sampling population, not assumed identical -- see CA's own pass).
    todo: Confirm with a domain expert whether the 420-460 (4.2-4.6m) cluster is genuinely
      plausible occasional large elasmobranch/tuna bycatch, or should be excluded
      like the two isolated outliers above it.
    label: Length Class (cm)
    constraints:
    - required
  - name: HLNoAtLngt
    type: number(quantity)
    description: >-
      Number of measured fish for the length class per category (unique
      combination of cruise haul, species, sex, devstage and category identifier).
      For data type C, values should be standardised to 60 minutes.
    range:
    - 0.0
    - 940339.35
    details: >-
      Same DataType C standardisation basis as TotalNo above. Top values are
      each a unique one-off but decline smoothly with no marker/gap pattern, consistent
      with genuine (if rare) very large hauls of abundant small-bodied species. CA's
      own NumberAtLength (CANoAtLngt) is curated separately (a different sampling
      population -- aged individuals only, not the whole catch -- so not assumed identical).
    label: Count at Length
    constraints:
    - required
  - name: DevStage
    type: enum
    description: >-
      Development or maturity stage defined by non-invasive observations
    values:
      '-9': No information
      B: Berried
      E: Egg
      J: Juvenile
    todo: Confirm whether -9 (99.80% of non-null rows) is a genuine DevelopmentStage
      code or just the generic missing-value sentinel -- no icesVocab key resolves
      for this field under either name, so nothing external confirms it either way.
    details: >-
      icesVocab's TS_DevStage resolves this as a controlled 4-code development-stage
      list. Against the real HL archive: all 4 codes in use, a clean bidirectional
      match.
  - name: LenMeasType
    type: enum
    description: >-
      Type of length measurement
    values:
      '-9': Not known
      '1': Total Length, linear
      '10': Shell Width
      '11': Wing Width
      '12': Total length, curved
      '13': Pinched tail Length
      '2': Standard Length
      '3': Pre Supra-Caudal Fin Length
      '4': Pre Anal-Fin Length
      '5': Mantle Length
      '6': Carapace Length
      '7': Carapace Width
      '8': Second Dorsal Fin Length
      '9': Shell Height
    todo: Confirm whether -9 (71.59% of non-null rows) is a genuine LengthType code
      or just the generic missing-value sentinel -- no icesVocab key resolves for
      this field under either name, so nothing external confirms it either way.
    details: >-
      icesVocab's TS_LenMeasType resolves this as a controlled 14-code length-measurement-type
      list. Against the real HL archive: 11 of 14 codes in use, 0 real values outside
      the vocab.
  - name: DateofCalculation
    type: date
    range:
    - '2012-04-19'
    - .inf
    details: >-
      8-digit YYYYMMDD stamp, digit order (month before day) verified consistent
      across all four Tier 1 tables. Upper bound deliberately left open: a live, continuously-advancing
      ICES Datacenter 'last recalculated' stamp, not submitted by data providers,
      so a fixed max would go stale immediately. Lower bound is this table's own
      verified minimum -- NOT forced identical across tables the way SweepLngt/HaulNo/Year
      are, since a genuine table-specific difference is plausible here (confirmed:
      LT's own minimum is years later). A -9 sentinel (1,050,496 rows, 7.64% of non-null;
      already excluded by the lower bound above) reads as the standard DATRAS 'not
      recorded' convention for this server-computed field -- not yet (re)calculated
      for this record.
  - name: Valid_Aphia
    type: number(id)
    details: >-
      See known issue valid_aphia_type_mismatch (DATRAS-known-issues.yaml,
      not yet filed): ICES's WSDL declares this field character, but the live service
      always returns it numeric -- it's a WoRMS AphiaID (an identifier, hence number(id),
      not a quantity).
    examples:
    - 55
    - 117258
    - 126757
    - 140474
    - 1895010
  label: Length Frequency Distribution
  description: >-
    Each row is a length class within a haul's catch. Contains the count
    of fish in each length bin, without individual-level age/sex data; the length-aggregated
    summary layer of Tier 1.
  details: >-
    Grain: each row is a (haul, species, length class) combination with a
    count of fish in that length bin. Population: length-frequency summaries for all
    species caught in surveyed hauls, aggregated by length class. Linked to HH via
    the composite haul identifier (Survey + Year + Quarter + Country + Platform/Ship
    + Gear + StationName/StNo + HaulNumber). Note: CA (not HL) has a verified HaulNumber/HaulNo
    linkage gap -- 4.92% of CA rows carry a -9 sentinel and match no HH haul even
    via the full composite key (see HH table details). The full 8-field composite
    key is required for correct joins regardless.
  origin: data-raw/spec_02_curate_dict.R
- name: CA
  columns:
  - name: RecordType
    type: enum
    description: >-
      Definition of the data type recorded, affecting the layout of the
      data fields included on that record. HH=Haul Information, HL=Length Frequency
      Distribution, CA=individual fish recordings with biological information, LT=
      Litter data records
    values:
      CA: individual fish recordings with biological information
    label: Record Type
    constraints:
    - required
  - name: Survey
    type: string
    examples:
    - NS-IBTS
    - BTS
    - BITS
    - 'DYFS'
    - Can-Mar
    details: >-
      29 distinct values in HH's archive; ICES DATRAS survey acronym, an
      open list, not a fixed enum. icesVocab DOES resolve a 'Survey' key by name
      but it's a false lead, not this field's source: its 133 codes are ICES's
      own cross-domain internal survey IDs (e.g. 'A1012'), a completely different
      scheme from DATRAS's own short acronyms -- confirmed by checking real codes
      against it directly, not assumed. Not used.
    constraints:
    - required
    - foreign_key
  - name: Quarter
    type: number(ordinal)
    range: [1, 4]
    description: >-
      Cruise quarter. Hauls outside of the calendar quarter can be reported
      with the same quarter reference, if agreed by the survey group.
    details: >-
      Retyped from enum to number(ordinal) 2026-08-29, mirroring the same change in
      inst/DATRAS-data-dict.yaml so the two dictionaries stay a pure positional
      rename of each other (op_field_spec() depends on that). The live WSDL declares
      this int, the archive stores it int, and an enum's underlying data must be
      string-like (data-dict validation.md, "Enum membership"). The former values:
      map ('1' -> '1. quarter') carried nothing the number itself does not -- unlike
      Tickler and CatIdentifier, whose code labels are load-bearing and which stay
      enums stored as strings. icesVocab's TS_Quarter also resolves this field.
      Against the real archive: CA, HH, and HL each use all 4 codes; LT uses 3 of 4.
    constraints:
    - required
    - foreign_key
  - name: Country
    type: string
    description: >-
      ISO 3166 country codes and region codes used by ICES
    examples:
    - NL
    - 'DE'
    - GB
    - 'DK'
    - GB-SCT
    details: >-
      22 distinct values in HH's archive; 'GB-SCT' illustrates that this
      is ISO 3166 codes PLUS ICES's own sub-national region codes (per the field's
      own description), not plain ISO 3166 alone. icesVocab DOES resolve a 'TS_Country'
      key by name but it's a false lead too, same as Survey above: its 25 codes are
      3-letter (e.g. 'BEL', 'DEN', 'ENG'), a different scheme entirely from
      this field's own 2-letter-plus-region codes -- confirmed by checking real codes
      against it directly. Not used.
    constraints:
    - required
    - foreign_key
  - name: Ship
    type: string
    description: >-
      SeaDataNet Ship and Platform Codes
    examples:
    - '74E9'
    - '26D4'
    - 748S
    - 64SS
    - 18NE
    details: >-
      110 distinct values in HH's archive; SeaDataNet ship/platform codes,
      an open list, not a fixed enum.
    constraints:
    - required
    - foreign_key
  - name: Gear
    type: enum
    description: >-
      Gear type code
    values:
      AAL: Bottom trawl net Aalhopser
      ABD: Aberdeen 18 ft trawl
      BAK: Baka trawl
      BLACK854: Pelagic trawl Blacksprutte 854#
      BMT: Beam trawl
      BOT: Bottom Trawl
      BOX: Boris 'Goshawk' Box Trawl
      BT12: Beam Trawl 12 meters
      BT2: Beam trawl 2 meters
      BT3: Beam trawl 3 meters
      BT4: Beam Trawl 4 m
      BT4A: Four m Beam trawl, aft
      BT4AI: Four m Beam trawl, aft - in IrishSea q3 BTS
      BT4P: Four m Beam Trawl, port
      BT4S: Four m Beam Trawl, starboard
      BT6: Beam trawl 6 meters
      BT7: Seven m Beam trawl
      BT8: Eight m Beam trawl
      CAM: Unspecified Gear
      CAR: Bottom trawl FGAV019
      CHP: Cod Hopper
      COM: Commercial trawl with sprat bag
      D40: Dutch Herring Trawl 40 feet
      D45: Dutch Herring Trawl 45 feet
      D48: Dutch Herring Trawl 48 feet
      D63: Dutch Herring Trawl 63 feet
      D73: Dutch Herring Trawl 73 feet
      D8: Dutch Herring Trawl 8 feet
      DBT: Danish bottom trawl
      DHT: Dutch Herring Trawl
      DIV: Collected by diver
      DSD: Danish Sandeel dredge, used at the Danish Sandeel survey
      DT: Russian bottom trawl
