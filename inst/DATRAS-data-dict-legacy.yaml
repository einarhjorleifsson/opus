      US4: US 4 Seam 3 Bridle
      VIN: Vinge trawl
      W2A: Western IIA
      WP53: Pelagic trawl WP35/64x4
      Y36: 'Yankee #36'
    details: |-
      All 99 active icesVocab Gear Type codes (deprecated code OTG excluded,
      2026-08-02). 55 confirmed used in DATRAS archive; 44 additional codes are valid
      ICES definitions (may be used in future submissions or by other surveys). Each
      code has a full description in icesVocab. Validation: enum restricts submissions
      to these codes.
  - name: Country
    type: string
    description: ISO 3166 country codes and region codes used by ICES
    examples:
    - NL
    - 'DE'
    - GB
    - 'DK'
    - GB-SCT
    details: |-
      22 distinct values in HH's archive (verified 2026-07-29); 'GB-SCT' illustrates
      that this is ISO 3166 codes PLUS ICES's own sub-national region codes (per the
      field's own description), not plain ISO 3166 alone. icesVocab DOES resolve a
      'TS_Country' key by name (checked 2026-07-29) but it's a false lead too, same as
      Survey above: its 25 codes are 3-letter (e.g. 'BEL', 'DEN', 'ENG'), a different
      scheme entirely from this field's own 2-letter-plus-region codes -- confirmed by
      checking real codes against it directly. Not used.
  - name: StNo
    type: string
    examples:
    - '1'
    - '2'
    - '22'
    - '9'
    - '17'
    details: |-
      Field's own description says this is a national coding system, not defined by
      ICES -- examples show the common shape (short numeric-looking strings), not an
      exhaustive domain. 24,130 distinct values in HH's archive (verified 2026-07-29),
      the highest cardinality of any Tier 1 string field; 6,899 of 150,262 rows
      unpopulated.
    description: Station number. National coding system, not defined by ICES.
  - name: HaulNo
    type: number(ordinal)
    range:
    - 0.0
    - 82483.0
    constraints:
    - required
    details: |-
      Sequential per-cruise numbering, but countries vary in whether it resets each
      cruise or runs continuously -- the archive-wide range spans many cruises' own
      counts pooled together, not one cruise's own haul tally.
    description: Sequential numbering of hauls during cruise.
  - name: ShootLat
    type: number(quantity)
    units: decimal degrees
    range:
    - 36.0013
    - 76.2117
    description: Decimal latitude position on the shooting location
  - name: ShootLong
    type: number(quantity)
    units: decimal degrees
    range:
    - -67.7115
    - 24.4333
    details: |-
      A genuine value of exactly -9.0000 degrees (9 deg W, an ordinary DATRAS
      longitude off Ireland/Iberia) would be indistinguishable from missing here:
      icesDatras's fetch pipeline scrubs literal -9 to NA for every numeric column,
      not just where -9 is a documented sentinel -- see data-raw/tier1_field_stats.R's
      header.
    description: Decimal longitude position on the shooting location
  - name: HaulLat
    type: number(quantity)
    units: decimal degrees
    range:
    - 36.0013
    - 65.0
    details: |-
      3 rows record exactly 0 degrees (the equator), categorically outside any DATRAS
      survey area -- excluded; the lower bound instead matches ShootLat's own clean
      minimum for the same archive.
    description: Decimal latitude position on the hauling location
  - name: HaulLong
    type: number(quantity)
    units: decimal degrees
    range:
    - -67.6762
    - 45.8753
    details: |-
      Same -9-as-missing caveat as ShootLong above (0 degrees, the Prime Meridian, is
      a genuine North Sea value here and is kept).
    description: Decimal longitude position on the hauling location
  - name: OSPARArea
    type: string
    examples:
    - II
    - III
    - IV
    - V
    details: |-
      OSPAR maritime area code (Roman-numeral regions); 4 distinct values observed,
      14,498 of 79,451 rows unpopulated. No description present to confirm whether
      this is the complete official OSPAR region set. Verified 2026-07-29 against the
      full LT archive.
  - name: MSFDArea
    type: string
    examples:
    - North-east Atlantic Ocean
    - Baltic Sea
    details: |-
      Marine Strategy Framework Directive region name; only 2 distinct values
      observed, 4,295 of 79,451 rows unpopulated. The EU MSFD framework has more than
      two regions overall -- DATRAS's own survey coverage may simply never reach the
      others, so not treated as a closed/exhaustive set. Verified 2026-07-29 against
      the full LT archive.
  - name: BottomDepth
    type: number(quantity)
    units: m
    range:
    - 1.0
    - 3098.0
    description: Sampling depth in metres, measured from the water surface.
    details: |-
      Not a rename -- BottomDepth is already the raw ICES field name in LT's archive.
      It sits alongside this table's own separate Depth field, byte-for-byte identical
      to it (see Depth's own details): a known ICES-side redundancy, not a rename
      relationship, filed with ICES 2026-08-06 (data-raw/ICES_ISSUE_REPORT.md, Issue
      6).
  - name: Distance
    type: number(quantity)
    units: m
    range:
    - 0.0
    - 59995.0
    description: Distance in metres between haul start and haul end point.
  - name: DoorSpread
    type: number(quantity)
    units: m
    range:
    - 1.0
    - 250.0
    details: |-
      0m (9 rows) is excluded as a placeholder -- a rigged, towing trawl cannot have
      zero door spread. Three single-occurrence values (762, 767, 778m) sit far above
      everything else in the archive (next highest is 250m) and are treated as
      data-entry errors, excluded; a real, well-populated value at 3.6m (1128 rows,
      likely a fixed beam-trawl spread) is kept.
    description: Mean value in metres of door spread measurements.
  - name: WingSpread
    type: number(quantity)
    units: m
    range:
    - 4.0
    - 50.0
    details: |-
      0m (9 rows), 1.8m and 2m (1 row each) are excluded as below any value with real
      support -- a well-populated cluster starts at 4m (1074 rows, likely a fixed
      beam-trawl spread). 142m (1 row) sits far above the next-highest real value
      (50m) and is treated as a data-entry error, excluded.
    description: |-
      Mean value in metres of wing spread measurements. For more details see the
      manual.
  - name: LTREF
    type: enum
    description: |-
      Reference code of the list used for categorizing litter. See LTREF in ICES
      vocabulary for options
    values:
    - C-TS
    - C-TS-REV
    - C-TS-REV2
    - H01
    - JCODELIST
    - LT-FM
    - MEDITS
    - OSPAR-LT
    - RECO-LT
    - TSG-ML
    - UNEP
    - UNEP-RLC
  - name: PARAM
    type: string
    examples:
    - 'A2'
    - LT-TOT
    - 'A5'
    - 'A7'
    - 'A14'
    details: |-
      Litter parameter/category code, no description present. icesVocab resolves a
      PARAM list (checked 2026-07-29, data-raw/datras_vocabulary.R) --
      'LT-TOT'='Litter - total' confirmed there among 1,938 total codes -- but
      'A2'/'A3'/'A5'/'A6'/'A7'/'A14' do NOT appear in it under any description,
      despite being common real values here (checked directly, not just absent from a
      sample). A real discrepancy between this archive's own PARAM usage and
      icesVocab's published list, not investigated further -- candidate for
      DATRAS-known-issues.yaml once that registry exists (see AGENTS.md). Not retyped
      enum regardless: 1,938 codes is far past the seed's VOCAB_CODE_LIMIT of 20. 50
      distinct values, 2 of 79,451 rows unpopulated. Verified 2026-07-29 against the
      full LT archive.
  - name: LTSZC
    type: string
    examples:
    - 'A'
    - 'B'
    - 'C'
    - 'D'
    - '13'
    details: |-
      Litter size class code (mix of letter and numeric codes), no description
      present. icesVocab's LTSZC list confirms all five (checked 2026-07-29):
      'A'='squared centimetre <5*5cm=25cm2' through 'D'='<50*50cm=2500cm2' (area-based
      classes), '13'='centimetre 15-49.99cm' (a length-based class) -- two different
      measurement bases coexisting under one code list. 23 of 41 official codes
      observed here; not retyped enum since 41 exceeds the seed's VOCAB_CODE_LIMIT of
      20. 16,508 of 79,451 rows unpopulated. Verified 2026-07-29 against the full LT
      archive.
  - name: UnitWgt
    type: string
    examples:
    - kg/haul
    - g/haul
    details: |-
      Unit of the sibling LT_Weight field (see LT_Weight's own details below); exactly
      2 values observed across the full archive (48,758 kg/haul, 26,437 g/haul), 4,256
      of 79,451 rows unpopulated. No description present to confirm this is the
      complete valid unit set. Verified 2026-07-29 against the full LT archive.
  - name: LT_Weight
    type: number(quantity)
    description: Weight of the litter category in units specified by the previous
      field
    range:
    - 0.0
    - 1600000.0
    details: |-
      Unit varies by the sibling UnitWgt field (kg/haul for 46,673 rows, g/haul for
      24,383, unspecified for 276), so no fixed units here. Two exclusions,
      2026-07-29: -99 (3 rows, kg/haul) as an isolated sentinel-like anomaly, and
      46,318,000 (1 row, g/haul) as a lone outlier roughly 29x the next-highest real
      value (1,600,000) -- an implausible ~46 tonnes of litter in one haul, almost
      certainly a data-entry error. The rest of the g/haul group's own large values
      (up to 1,600,000g = 1.6 tonnes) are kept: rare, but large litter catches (e.g.
      old fishing gear, major debris items) are plausible.
    label: Total Litter Weight (kg)
  - name: UnitItem
    type: string
    examples:
    - items/haul
    details: |-
      Unit of the sibling LT_Items field (see LT_Items's own details below); only one
      value ever observed (79,415 of 79,451 rows), 36 unpopulated -- a single example,
      not five, because no second real value exists in the archive to show. Verified
      2026-07-29 against the full LT archive.
  - name: LT_Items
    type: number(quantity)
    description: |-
      "Number of items within the given litter category (by type, size, and additional
      parameters) in units specified by the previous field"
    range:
    - 0.0
    - 2323.0
    details: |-
      UnitItem is 'items/haul' for all but 36 of 76,882 populated rows -- effectively
      a fixed count, no exclusions needed: no isolated outlier or repeating marker
      pattern, just a smooth decline from the max.
    label: Total Item Count
  - name: LTSRC
    type: enum
    description: |-
      If the source of litter origin is posible to identify, the appropriate option
      should be reported here.
    values:
    - '-9'
    - LB
    - LBF
    - LBI
    - LBM
    - LBS
    - LBT
    - OB
    - RBI
    - SBA
    - SBF
    - SBG
    - SBMR
    - SBR
    - SBS
    - SBT
    - UNK
  - name: TYPPL
    type: string
    examples:
    - PE
    - PP
    - PET
    - PS
    - UPL
    details: |-
      Litter (plastic) type code, no description present. icesVocab's TYPPL list
      confirms all five (checked 2026-07-29): PE=Polyethylene, PET=Polyethylene
      terephthalate, PP=Polypropylene, PS=Polystyrene, UPL=Undefined plastic. 6 of 30
      official codes observed here; not retyped enum since 30 exceeds the seed's
      VOCAB_CODE_LIMIT of 20. Very sparse: only 162 of 79,451 rows populated. Verified
      2026-07-29 against the full LT archive.
  - name: LTPRP
    type: string
    description: |-
      Litter properties that may be deemed important for reporting. Reporting of
      multiple codes in this field is allowed.
    examples:
    - AO
    - CL1
    - CL5
    - CL2
    - CL4
    details: |-
      Litter property code, no description present. icesVocab's LTPRP list confirms
      all five as BASE codes (checked 2026-07-29): AO=Attached organisms,
      CL1=Colour-None(clear), CL2=Colour-Black, CL4=Colour-Blue, CL5=Colour-White --
      only 22 official base codes, but composite codes like 'CL1~AO' also appear in
      real data (a colour code plus an attached-organisms flag, tilde-joined), which
      is why 79 distinct values are observed here despite only 22 base codes existing
      -- a combinable/multi-value scheme, not a flat single-select list, confirming
      the earlier guess. Not retyped enum: even the 22-code base list is past the
      seed's VOCAB_CODE_LIMIT of 20, and the combinable form isn't a plain enum shape
      regardless. 58,349 of 79,451 rows unpopulated. Verified 2026-07-29 against the
      full LT archive.
  - name: SweepLngt
    type: number(quantity)
    units: m
    range:
    - 0.0
    - 850.0
    description: |-
      Length of sweep in metres. Recommended values depend on survey and quarter, see
      survey manuals for further details
  - name: GearEx
    type: enum
    values:
    - '-9'
    - B
    - D
    - DB
    - I2
    - MN
    - MY
    - R
    - S
    - S1
    - S2
    - SB
    - ST
  - name: DoorType
    type: enum
    values:
    - '-9'
    - F
    - K
    - P
    - PE
    - PI
    - R
    - T
    - T4
    - T6
    - V
    - WR
    description: Type of door used
  - name: Month
    type: enum
    values:
    - '1'
    - '10'
    - '11'
    - '12'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
    - '8'
    - '9'
    description: Sampling month, as part of the calendar date.
  - name: Day
    type: number(ordinal)
    range:
    - 1.0
    - 31.0
    constraints:
    - required
    description: Sampling day, as part of the calendar date
  - name: TimeShot
    type: string
    examples:
    - '730'
    - '715'
    - '1300'
    - '900'
    - '700'
    details: |-
      1,440 distinct values in HH's archive (verified 2026-07-29), always populated
      (150,262/150,262). Field's own description implies a fixed 4-digit HHMM ('E.g.
      10:15=1015'), but real values are NOT zero-padded (e.g. '730', not '0730') --
      documented here rather than silently assumed. Only present in HH and LT
      (confirmed 2026-07-29), same as StatRec above.
    description: Start time (GMT) of haul (HHMM), 4 digits. E.g. 10:15=1015
  - name: HaulDur
    type: number(quantity)
    units: min
    range:
    - 1.0
    - 120.0
    details: |-
      A haul cannot take zero or negative time; 217 rows recorded as exactly 0 and 2
      as negative (-514, -238) are excluded, most likely unrecorded/placeholder rather
      than a genuine instantaneous haul. Upper bound set at 2 hours: DATRAS carries no
      passive/soak gear, so a longer tow is highly suspect -- observed values run as
      high as 1470 min with no repeating marker pattern (i.e. not a clean sentinel,
      just unreliable). Verified 2026-07-29 against the full archive.
    description: |-
      Haul duration in minutes. Start time is the moment when the gear settles at the
      bottom at the stated towing speed. Stop is defined as the start of hauling of
      the gear.
  - name: StatRec
    type: string
    examples:
    - '37F8'
    - '35F5'
    - '36F7'
    - '32F3'
    - '36F6'
    details: |-
      701 distinct values in HH's archive (verified 2026-07-29); real ICES statistical
      rectangle codes (0.5 deg lat x 1 deg lon grid), not a fixed enum given the size
      of the grid. 12,235 of 150,262 HH rows unpopulated. Only present in HH and LT
      (confirmed 2026-07-29) -- consistent with the Open items note that LT's
      assessment output joins in a set of HH-style columns.
    description: |-
      Intended ICES statistical area rectangle (0.5 degrees latitude, 1 degree
      longitude)
  - name: Depth
    type: number(quantity)
    units: m
    range:
    - 1.0
    - 3098.0
    details: |-
      Re-verified 2026-08-06 (originally 2026-07-29, against an older LT archive
      snapshot whose row count differs from the current one -- re-checked here to
      avoid repeating a stale figure): byte-for-byte identical to this table's own
      BottomDepth across all 75,310 rows (100% populated in both, 0 differences, 0
      one-sided nulls) -- a known ICES-side redundancy (also documented in obus's own
      download-stage comments), not an opus/obus naming quirk. Filed with ICES
      2026-08-06 (see data-raw/ICES_ISSUE_REPORT.md, Issue 6). Given the same
      type/units/range as BottomDepth here rather than re-derived independently, since
      it is BottomDepth.
  - name: HaulVal
    type: enum
    values:
    - A
    - C
    - I
    - M
    - 'N'
    - S
    - V
    description: Haul validity code
  - name: DataType
    type: enum
    values:
    - '-9'
    - C
    - P
    - R
    - S
    description: |-
      Specification of the data aggregation in the HL record. C: CPUE (per hour) data;
      TotalNo and CatCatchWgt are adjusted per hour trawling. R (raw), S (subsample of
      the entire catch): data as recorded during the cruise, and P (pseudocategory
      sampling, only used by Scotland).
  - name: Netopening
    type: number(quantity)
    units: m
    range:
    - 0.0
    - 76.0
    description: |-
      Mean value in metres of vertical net opening measurements. For details see the
      survey manual.
  - name: Rigging
    type: enum
    values:
    - '-9'
    - BC
    - BM
    - BN
    - D
    - F
    - FB
    - FM
    - FT
    - FW
    - M
    - S
    - T
    - TS
    - TT
    description: |-
      The way the gear is rigged. Rigging depends on survey, see survey manuals for
      further details.
  - name: Tickler
    type: number(quantity)
    range:
    - 0.0
    - 27.0
    description: Amount of ticklers connected to the gear.
  - name: Warplngt
    type: number(quantity)
    units: m
    range:
    - 0.0
    - 4065.0
    description: |-
      Length of warp in metres. Defined by fishing depth. Warp/depth ratio is depends
      on survey, for further details see survey manuals.
  - name: Warpdia
    type: number(quantity)
    units: mm
    range:
    - 16.0
    - 30.0
    details: |-
      A dense, well-populated cluster runs 16-21mm and 27-30mm; isolated
      single-occurrence values below (1mm x2, 5mm x10, 12mm) and above (39, 56, 85,
      88mm) sit apart from it with no comparable support and are treated as data-entry
      errors, excluded here.
    description: Warp diametre in millimetres.
  - name: WarpDen
    type: number(quantity)
    units: kg/m
    range:
    - 0.0
    - 26.0
    description: |-
      Warp weight in kg per linear meter of warp. See survey manuals for more
      information.
  - name: DoorSurface
    type: number(quantity)
    units: m2
    range:
    - 0.0
    - 20.2
    description: Door surface area in square metres.
  - name: DoorWgt
    type: number(quantity)
    units: kg
    range:
    - 0.0
    - 1720.0
    description: Door weight in kilograms.
  - name: TowDir
    type: number(quantity)
    units: degrees
    range:
    - 0.0
    - 360.0
    details: |-
      999 (3 rows) reads as an undocumented out-of-domain 'not recorded' marker, the
      same pattern confirmed for WindDir below. A further cluster -- 450 deg (62
      rows), 520(5), 460(5), 540(3), 510, 564, 702 (1 each) -- divided by 10 becomes
      ordinary bearings (45.0, 52.0, 46.0, 54.0, 51.0, 56.4, 70.2 deg); plausible but
      not investigated further (would need correlating with Country/Survey). Both
      groups are outside the documented 0-360 domain and excluded here.
    description: Direction of towing in degrees. 360=direction from south to north.
  - name: GroundSpeed
    type: number(quantity)
    units: knots
    range:
    - 0.0
    - 10.0
    details: |-
      Ceiling is a domain judgment (real trawling ground speed), not an observed
      cluster boundary -- observed values run 10.8 up to a 99.9 marker with no clean
      gap, all excluded.
    description: |-
      Ground speed of towing in knots. Recommended speed depends on survey, see survey
      manuals for more details
  - name: SpeedWater
    type: number(quantity)
    units: knots
    range:
    - 0.0
    - 22.0
    description: Trawl speed on water in knots.
  - name: WindDir
    type: number(quantity)
    units: degrees
    range:
    - -1.0
    - 360.0
    details: |-
      -1 is documented ('varying direction'). 999 (57 rows) reads as an undocumented
      out-of-domain 'not recorded' marker; a handful of further single-occurrence
      values just above 360 (711, 504, 420, 365, 361) are also excluded.
    description: |-
      Direction of wind in degrees. Calm = 0,  direction from north to south = 360,
      varying direction = -1
  - name: WindSpeed
    type: number(quantity)
    units: m/s
    range:
    - 0.0
    - 28.0
    details: |-
      Ceiling follows the Beaufort 10 upper bound (28.4 m/s, storm force) -- no vessel
      would be actively trawling above this. 1,641 of 109,012 populated rows (~1.5%)
      exceed it, tailing off smoothly with no clean gap up to 342 m/s; the count jumps
      from a thin 1-7-row-per-value tail above 28 to 357 rows right at 28, consistent
      with a real distribution below and noise above.
    description: Speed of wind in metres/sec.
  - name: SwellDir
    type: number(quantity)
    units: degrees
    range:
    - 0.0
    - 360.0
    description: |-
      Direction of swell in degrees. No movement=0, direction from south to north =
      360, varying direction = -1
  - name: SwellHeight
    type: enum
    values:
    - H
    - L
    - M
    - 'N'
    - NR
    - VH
    description: Height of (swell) waves, in metres
  - name: CodendMesh
    type: number(quantity)
    units: mm
    range:
    - 9.0
    - 100.0
    details: |-
      0mm (202 rows) excluded as a placeholder -- a codend by definition has some mesh
      size. 250mm (1 row) sits far above the next-highest real value (100mm, 644 rows)
      and is treated as a data-entry error, excluded.
    description: Codend mesh size in mm
  - name: EEZ
    type: string
    examples:
    - United Kingdom Exclusive Economic Zone
    - 'Danish Exclusive Economic Zone'
    - French Exclusive Economic Zone
    - Spanish Exclusive Economic Zone
    - Swedish Exclusive Economic Zone
    details: |-
      Exclusive Economic Zone name, no description present. 20 distinct values, 162 of
      79,451 rows unpopulated. Not treated as a closed set -- EEZ coverage in a wider
      archive could plausibly include zones absent from this one. Verified 2026-07-29
      against the full LT archive.
  - name: NMArea
    type: string
    examples:
    - United Kingdom 12 NM
    - Swedish 12 NM
    - Spanish 12 NM
    - French 12 NM
    - 'Danish 12 NM'
    details: |-
      National 12-nautical-mile zone name (sibling concept to EEZ above), no
      description present. 18 distinct values, 53,303 of 79,451 rows unpopulated. Not
      treated as a closed set, same reasoning as EEZ. Found 2026-07-29 only after
      fixing the Y/N-enum crash above -- validate-spec had never actually reached this
      field before, since it's the table's last column and everything upstream of it
      kept dying first (ThermoCline, then the flag enums). Verified 2026-07-29 against
      the full LT archive.
  - name: DateofCalculation
    type: number(ordinal)
    details: |-
      See known issue dateofcalculation_type_mismatch (DATRAS-known-issues.yaml, not
      yet filed): ICES's WSDL declares this field character for LT's own retrieval
      operation (getLitterAssessmentOutput), while HH/HL/CA's own operations all
      declare it int/decimal -- but real LT data (verified 2026-07-29) is the
      identical 8-digit YYYYMMDD stamp (e.g. "20260625"), just returned as a string by
      that one operation. Digit order (month before day) confirmed consistent with
      HH/HL/CA. Same open-upper-bound, ICES-Datacenter-inserted basis as HH/HL/CA's
      DateofCalculation, but this table's OWN verified minimum (2015-11-27) is
      genuinely years later than theirs (2012-04-19) -- consistent with LT/litter
      reporting being a newer addition to DATRAS than the main haul/length/age
      exchange.
    range:
    - 20151127
    - .inf
  label: Litter Assessment
  description: Each row is one litter observation from a haul. Contains types and
    counts of marine debris (plastics, fishing gear, natural/organic material) recorded
    during the catch review; a separate thematic addition to the HH/HL/CA exchange.
  details: 'Grain: each row is one litter assessment/observation recorded during a
    haul''s catch review. Population: litter records from hauls in covered surveys;
    a thematic addition to the HH/HL/CA core exchange tables with a separate collection
    protocol and scope. Linked to HH via the composite haul identifier (Survey + Year
    + Quarter + Country + Platform/Ship + Gear + StationName/StNo + HaulNumber). Note:
    CA has a verified HaulNumber/HaulNo linkage gap via a -9 sentinel (see CA table
    details); whether LT''s own HaulNumber has a similar issue has not been separately
    checked. The full 8-field composite key is required for correct joins regardless.'
