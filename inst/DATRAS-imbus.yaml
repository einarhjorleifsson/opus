      convention (data-raw/audit/build_field_description_snapshot.R): HH 25,874/150,217
      rows (17.22%), LT 2,707/79,451 rows (3.41%), 0 true nulls as submitted, so these
      counts are the -9s, stripped to null in the published archive.
    todo: ICES's field-description spreadsheet marks this Mandatory, but 17.2% of
      HH's real archive rows are null -- a genuine gap between documented and actual
      submission behavior, not yet added as `required` pending review (see data-raw/audit/build_field_gap_audit.R).
