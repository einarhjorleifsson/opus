      -- Issue 8). Against the real archive: CA and HH each use 11 of 12 codes, HL
      11 of 12, LT 6 of 12; 0 real values fall outside the vocab in any table.
  - name: StNo
    type: string
    description: >-
      Station number. National coding system, not defined by ICES.
    examples:
    - '1'
    - '2'
    - '22'
    - '9'
    - '17'
    details: >-
      Field's own description says this is a national coding system, not
      defined by ICES -- examples show the common shape (short numeric-looking strings),
      not an exhaustive domain; not a coded field, so no icesVocab entry is expected
      (none of the 580 registered vocab keys match). Of 145,958 HH rows (20,319 distinct
      values), -9 accounts for exactly 6,899, not a null. ICES's own field-description
      spreadsheet confirms the ICES-wide '-9 = no information' convention applies
      here, same as HaulNo above. Unlike HaulNo's own -9 sentinel, this isn't an
      orphaning problem: CA's own matching StNo=-9 rows for these same hauls (191,893
      rows) join HH successfully via the other 7 composite-key fields, since both
      sides consistently carry -9 for the same haul rather than disagreeing.
    constraints:
    - required
    - foreign_key
  - name: HaulNo
    type: number(ordinal)
    description: >-
      Sequential numbering of hauls during cruise.
    range:
    - 0
    - 82483
    constraints:
    - required
    - foreign_key
    details: >-
      Sequential per-cruise numbering, but countries vary in whether it resets
      each cruise or runs continuously -- the archive-wide range spans many cruises'
      own counts pooled together, not one cruise's own haul tally. No icesVocab entry
      exists under any name or prefix (none of the 580 registered vocab keys match)
      -- expected for a plain sequential identifier, not a coded field. ICES's own
      field-description spreadsheet confirms Mandatory: Yes and documents an ICES-wide
      convention applicable to any field with a header: submit -9 for 'no information'
      -- so the -9 sentinel seen in CA (see known-issues.yaml: ca_haulno_unlinkable_to_hh)
      is a sanctioned value, not an undocumented one.
