    range:
    - 0.0
    - 1720.0
  - name: TowDirection
    type: number(quantity)
    description: Direction of towing in degrees. 360=direction from south to north.
    units: degrees
    range:
    - 0.0
    - 360.0
    details: 999 (3 rows) reads as an undocumented out-of-domain 'not recorded' marker,
      the same pattern confirmed for WindDirection below. A further cluster -- 450
      deg (62 rows), 520(5), 460(5), 540(3), 510, 564, 702 (1 each) -- divided by
      10 becomes ordinary bearings (45.0, 52.0, 46.0, 54.0, 51.0, 56.4, 70.2 deg);
      plausible but not investigated further (would need correlating with Country/Survey).
      Both groups are outside the documented 0-360 domain and excluded here.
  - name: SpeedGround
    type: number(quantity)
    description: Ground speed of towing in knots. Recommended speed depends on survey,
      see survey manuals for more details
    units: knots
    range:
    - 0.0
    - 10.0
    details: Ceiling is a domain judgment (real trawling ground speed), not an observed
      cluster boundary -- observed values run 10.8 up to a 99.9 marker with no clean
      gap, all excluded.
  - name: SpeedWater
    type: number(quantity)
    description: Trawl speed on water in knots.
    units: knots
    range:
    - 0.0
    - 22.0
  - name: WindDirection
    type: number(quantity)
    description: Direction of wind in degrees. Calm = 0,  direction from north to
      south = 360, varying direction = -1
    units: degrees
    range:
    - -1.0
    - 360.0
    details: -1 is documented ('varying direction'). 999 (57 rows) reads as an undocumented
      out-of-domain 'not recorded' marker; a handful of further single-occurrence
      values just above 360 (711, 504, 420, 365, 361) are also excluded.
  - name: WindSpeed
    type: number(quantity)
    description: Speed of wind in metres/sec.
    units: m/s
    range:
    - 0.0
    - 28.0
    details: Ceiling follows the Beaufort 10 upper bound (28.4 m/s, storm force) --
      no vessel would be actively trawling above this. 1,641 of 109,012 populated
      rows (~1.5%) exceed it, tailing off smoothly with no clean gap up to 342 m/s;
      the count jumps from a thin 1-7-row-per-value tail above 28 to 357 rows right
      at 28, consistent with a real distribution below and noise above.
  - name: SwellDirection
    type: number(quantity)
    description: Direction of swell in degrees. No movement=0, direction from south
      to north = 360, varying direction = -1
    units: degrees
    range:
    - 0.0
    - 360.0
  - name: SwellHeight
    type: enum
    description: Height of (swell) waves, in metres
    values:
    - H
    - L
    - M
    - 'N'
    - NR
    - VH
  - name: CodendMesh
    type: number(quantity)
    description: Codend mesh size in mm
    units: mm
    range:
    - 9.0
    - 100.0
    details: 0mm (202 rows) excluded as a placeholder -- a codend by definition has
      some mesh size. 250mm (1 row) sits far above the next-highest real value (100mm,
      644 rows) and is treated as a data-entry error, excluded.
  - name: EEZ
    type: string
    examples:
    - United Kingdom Exclusive Economic Zone
    - Danish Exclusive Economic Zone
    - French Exclusive Economic Zone
    - Spanish Exclusive Economic Zone
    - Swedish Exclusive Economic Zone
    details: Exclusive Economic Zone name, no description present. 20 distinct values,
      162 of 79,451 rows unpopulated. Not treated as a closed set -- EEZ coverage
      in a wider archive could plausibly include zones absent from this one. Verified
      2026-07-29 against the full LT archive.
  - name: NMArea
    type: string
    examples:
    - United Kingdom 12 NM
    - Swedish 12 NM
    - Spanish 12 NM
    - French 12 NM
    - Danish 12 NM
    details: National 12-nautical-mile zone name (sibling concept to EEZ above), no
      description present. 18 distinct values, 53,303 of 79,451 rows unpopulated.
      Not treated as a closed set, same reasoning as EEZ. Found 2026-07-29 only after
      fixing the Y/N-enum crash above -- validate-spec had never actually reached
      this field before, since it's the table's last column and everything upstream
      of it kept dying first (ThermoCline, then the flag enums). Verified 2026-07-29
      against the full LT archive.
  - name: DateofCalculation
    type: number(ordinal)
    details: 'See known issue dateofcalculation_type_mismatch (DATRAS-known-issues.yaml,
      not yet filed): ICES''s WSDL declares this field character for LT''s own retrieval
      operation (getLitterAssessmentOutput), while HH/HL/CA''s own operations all
      declare it int/decimal -- but real LT data (verified 2026-07-29) is the identical
      8-digit YYYYMMDD stamp (e.g. "20260625"), just returned as a string by that
      one operation. Digit order (month before day) confirmed consistent with HH/HL/CA.
      Same open-upper-bound, ICES-Datacenter-inserted basis as HH/HL/CA''s DateofCalculation,
      but this table''s OWN verified minimum (2015-11-27) is genuinely years later
      than theirs (2012-04-19) -- consistent with LT/litter reporting being a newer
      addition to DATRAS than the main haul/length/age exchange.'
    range:
    - 20151127
    - .inf
  label: Litter Assessment
  description: Each row is one litter observation from a haul. Contains types and
    counts of marine debris (plastics, fishing gear, natural/organic material) recorded
    during the catch review; a separate thematic addition to the HH/HL/CA exchange.
  details: 'Grain: each row is one litter assessment/observation recorded during a
    haul''s catch review. Population: litter records from hauls in covered surveys;
    a thematic addition to the HH/HL/CA core exchange tables with a separate collection
    protocol and scope. Linked to HH via the composite haul identifier (Survey + Year
    + Quarter + Country + Platform/Ship + Gear + StationName/StNo + HaulNumber). Note:
    like CA, LT''s own HaulNumber may be nullable; the full 8-field composite key
    is required for correct joins.'
  origin: data-raw/DATASET_curate_dict.R
  source:
    parquet: LT.parquet
glossary:
  Haul: 'A single deployment of a trawl net. The primary unit of observation in DATRAS:
    one haul''s catch (HH record) is subsampled and analyzed into length frequencies
    (HL) and aged individuals (CA).'
  Length-stratified subsample: A subset of fish taken from a haul's catch, selected
    across the full range of observed length classes. Used in CA for cost-efficient
    age sampling without exhaustively aging every fish.
  Valid_Aphia: The ICES Datacenter's server-inserted, validated WoRMS AphiaID for
    each species. May differ from SpeciesCode (submitted value) due to ICES corrections
    or updates to the WoRMS taxonomy.
  DateofCalculation: The timestamp (YYYYMMDD) when the ICES Datacenter last recalculated
    and reprocessed this record. Not submitted by data providers; inserted and updated
    server-side as part of ICES's QC workflow.
  Litter Assessment: A qualitative and quantitative survey of marine debris (plastics,
    metal, rubber, natural materials, fishing gear) observed in the trawl catch. LT
    records are a thematic extension beyond HH/HL/CA's focus on fishery target species.
  Tier 1: 'The raw, per-haul exchange layer of ICES DATRAS: HH (haul), HL (length
    frequency), CA (aged individuals), and LT (litter). The primary submission format
    from national institutes to ICES.'
  Survey: 'A coordinated research program that conducts regular sampling (e.g., NS-IBTS:
    North Sea International Bottom Trawl Survey). DATRAS is the archive of submissions
    from many regional surveys with different spatial/temporal coverage.'
