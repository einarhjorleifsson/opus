  - name: SweepLngt
    type: number(quantity)
    description: |-
      Length of sweep in metres. Recommended values depend on survey and quarter, see
      survey manuals for further details
    units: m
    range:
    - 0.0
    - 850.0
  - name: GearEx
    type: enum
    description: |-
      Deviations of the standard gear. Depends on survey, see survey manuals for
      further details.
    values:
    - '-9'
    - B
    - D
    - DB
    - I2
    - MN
    - MY
    - R
    - S
    - S1
    - S2
    - SB
    - ST
  - name: DoorType
    type: enum
    description: Type of door used
    values:
    - '-9'
    - F
    - K
    - P
    - PE
    - PI
    - R
    - T
    - T4
    - T6
    - V
    - WR
  - name: StNo
    type: string
    description: Station number. National coding system, not defined by ICES.
    examples:
    - '1'
    - '2'
    - '22'
    - '9'
    - '17'
    details: |-
      Field's own description says this is a national coding system, not defined by
      ICES -- examples show the common shape (short numeric-looking strings), not an
      exhaustive domain. 24,130 distinct values in HH's archive (verified 2026-07-29),
      the highest cardinality of any Tier 1 string field; 6,899 of 150,262 rows
      unpopulated.
  - name: HaulNo
    type: number(ordinal)
    description: Sequential numbering of hauls during cruise.
    range:
    - 0.0
    - 82483.0
    constraints:
    - required
    details: |-
      Sequential per-cruise numbering, but countries vary in whether it resets each
      cruise or runs continuously -- the archive-wide range spans many cruises' own
      counts pooled together, not one cruise's own haul tally.
  - name: Year
    type: number(ordinal)
    description: Cruise year (YYYY)
    range:
    - 1965.0
    - 2026.0
    constraints:
    - required
  - name: SpecCodeType
    type: enum
    description: |-
      Type of species code used for species definition at the record. Use 'W' for
      WoRMS AphiaID
    values:
    - T
    - W
  - name: SpecCode
    type: number(id)
    description: Official WoRMS AphiaID code of species reported at the record.
    examples:
    - 55
    - 122388
    - 127196
    - 159048
    - 1789435
    constraints:
    - required
    details: |-
      Official WoRMS AphiaID as submitted by the data provider -- contrast with
      Valid_Aphia, the ICES Datacenter's own validated/corrected version of the same
      concept, inserted server-side (see Valid_Aphia's own details below).
    label: Species (WoRMS AphiaID)
  - name: SpecVal
    type: enum
    description: |-
      Validity of species records, e.g. to specify if species has only been counted,
      measured, weighed, etc.
    values:
    - '0'
    - '1'
    - '10'
    - '2'
    - '4'
    - '5'
    - '6'
    - '7'
    - '8'
    - '9'
  - name: Sex
    type: enum
    description: |-
      Gender of the described species category. In CA-records should be defined by
      dissection. If no determination was performed, report '-9'. If determination
      failed, report 'U'.
    values:
    - '-9'
    - B
    - F
    - M
    - 'N'
    - T
    - U
  - name: TotalNo
    type: number(quantity)
    description: |-
      Total number of specimens per category (unique combination of cruise haul,
      species, sex, devstage and subsampling category identifier). For data type C,
      values should be standardised to 60 minutes. TotalNo=SUM(HLNoAtLngt).
    range:
    - 0.0
    - 3581592.0
    details: |-
      Per the field's own description, TotalNo=SUM(HLNoAtLngt); values in the hundreds
      of thousands and non-integer values (7.7% of populated rows) both trace to the
      same documented mechanism -- DataType C records are standardised to 60 minutes,
      which can inflate very abundant small-bodied catches to large, non-integer
      counts. Top values all have real support (9-30 occurrences each, a smooth tail),
      not isolated errors.
  - name: CatIdentifier
    type: number(id)
    description: |-
      Subsampling category by size for same species in the haul. If DataType is C,
      CatIdentifier is always 1. Further details on survey specific subsampling
      categories are available in the survey manuals.
    examples:
    - 1
    - 4
    - 12
    - 21
    - 31
    details: |-
      Real values are {1-5, 11-14, 21-23, 31} -- a coded scheme (verified 2026-07-29
      against the full archive), not a sequence, despite 'category' sounding ordinal.
    label: Species Category
  - name: NoMeas
    type: number(quantity)
    description: |-
      Number of measured specimens per category (unique combination of cruise haul,
      species, sex, and subsampling category identifier and devstage). For data type
      C, values should be standardised to 60 minutes.
      NoMeas=Sum(HLNoAtLngt).
    range:
    - 0.0
    - 578731.0
    details: |-
      Same DataType C standardisation basis as TotalNo above; top values are all
      well-supported (4-10 occurrences each), not isolated errors.
  - name: SubFactor
    type: number(quantity)
    description: |-
      Sub-sampling factor. If 1/6 of the catch was measured, report 6. If DataType is
      C, it should be reported as 1. If DataType is S, it is always &gt;1. If DataType
      is R, the SubFactor is = 1 or &gt;1 for different species depending on whether
      they were subsampled.
    range:
    - 1.0
    - 10997.1834
    details: |-
      356 of 14,256,091 rows (0.0025%) show values below 1, contradicting the field's
      own description (documented as always >=1, for every DataType) -- excluded. The
      high end is genuine, not an error: top values cluster at power-of-2-like numbers
      (4096 recurs 133 times; 8192, 5120, 6144 also recur with real support),
      consistent with repeatedly halving a very abundant catch to reach a manageable
      subsample.
  - name: SubWgt
    type: number(quantity)
    description: Weight of the subsample in grams.
    units: g
    range:
    - 0.0
    - 3519200.0
  - name: CatCatchWgt
    type: number(quantity)
    description: |-
      For datatype R or S: Catch weight in grams per category (for the unique
      combination of cruise haul, species, sex, devstage and subsampling category
      identifier). For datatype C, values should be standardised to 60 minutes.
    units: g
    range:
    - 0.0
    - 3.5568e+07
    details: |-
      -900 (2562 rows) and -100 (1 row) are excluded as a 'not weighed' placeholder,
      the same pattern seen in several HH fields. The high end is genuine: top values
      all have real support (3-18 occurrences each).
  - name: LngtCode
    type: enum
    description: |-
      Measurement accuracy used for the LngtClass (mm, 0.5 cm, cm, 5 cm). Survey and
      species specific, see survey manuals for further details. When measured to the
      mm or 0.5 below: report LngtClass as mm (10.1=101), for cm and 5 cm report cm in
      LngtClass
    values:
    - '-9'
    - '.'
    - '0'
    - '1'
    - '2'
    - '5'
    - '9'
  - name: LngtClass
    type: number(quantity)
    description: |-
      Lower length boundary of the Length class. In cm or mm depending on the
      LngtCode. E.g. 10-11 cm=10
    range:
    - 0.0
    - 4500.0
    details: |-
      Unit varies by the sibling LngtCode field (mm or cm; see LngtCode's own values
      map), so no fixed units here. Two isolated outliers excluded, 2026-07-29: 11930
      (LngtCode '.', i.e. 11.93m) and 900 (LngtCode '1', i.e. 9m) -- each a lone
      occurrence far above the next-highest real value. Everything else, including a
      cluster around 420-460 under LngtCode '1' (4.2-4.6m -- large but not implausible
      for occasional large elasmobranch/tuna bycatch), is kept as-is: this is a first
      curation pass from data patterns alone, not a domain-expert review, and a
      tighter bound wasn't asserted without one. CA's own LngtClass is curated
      separately (a different sampling population, not assumed identical -- see CA's
      own pass).
    label: Length Class (cm)
  - name: HLNoAtLngt
    type: number(quantity)
    description: |-
      Number of measured fish for the length class per category (unique combination of
      cruise haul, species, sex, devstage and category identifier). For data type C,
      values should be standardised to 60 minutes.
    range:
    - 0.0
    - 940339.35
    details: |-
      Same DataType C standardisation basis as TotalNo above. Top values are each a
      unique one-off but decline smoothly with no marker/gap pattern, consistent with
      genuine (if rare) very large hauls of abundant small-bodied species. CA's own
      NumberAtLength (CANoAtLngt) is curated separately (a different sampling
      population -- aged individuals only, not the whole catch -- so not assumed
      identical).
    label: Count at Length
  - name: DevStage
    type: enum
    description: Development or maturity stage defined by non-invasive observations
    values:
    - '-9'
    - B
    - E
    - J
  - name: LenMeasType
    type: enum
    description: Type of length measurement
    values:
    - '-9'
    - '1'
    - '10'
    - '11'
    - '12'
    - '13'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
    - '8'
    - '9'
  - name: DateofCalculation
    type: number(ordinal)
    range:
    - 20120419
    - .inf
    details: |-
      8-digit YYYYMMDD stamp, digit order (month before day) verified consistent
      across all four Tier 1 tables. Upper bound deliberately left open: a live,
      continuously-advancing ICES Datacenter 'last recalculated' stamp, not submitted
      by data providers, so a fixed max would go stale immediately. Lower bound is
      this table's own verified minimum -- NOT forced identical across tables the way
      SweepLngt/HaulNo/Year are, since a genuine table-specific difference is
      plausible here (confirmed: LT's own minimum is years later).
  - name: Valid_Aphia
    type: number(id)
    details: |-
      See known issue valid_aphia_type_mismatch (DATRAS-known-issues.yaml, not yet
      filed): ICES's WSDL declares this field character, but the live service always
      returns it numeric -- it's a WoRMS AphiaID (an identifier, hence number(id), not
      a quantity).
    examples:
    - 55
    - 117258
    - 126757
    - 140474
    - 1895010
  label: Length Frequency Distribution
  description: Each row is a length class within a haul's catch. Contains the count
    of fish in each length bin, without individual-level age/sex data; the length-aggregated
    summary layer of Tier 1.
  details: 'Grain: each row is a (haul, species, length class) combination with a
    count of fish in that length bin. Population: length-frequency summaries for all
    species caught in surveyed hauls, aggregated by length class. Linked to HH via
    the composite haul identifier (Survey + Year + Quarter + Country + Platform/Ship
    + Gear + StationName/StNo + HaulNumber). Note: CA (not HL) has a verified HaulNumber/HaulNo
    linkage gap -- 4.92% of CA rows carry a -9 sentinel and match no HH haul even
    via the full composite key (see HH table details). The full 8-field composite
    key is required for correct joins regardless.'
