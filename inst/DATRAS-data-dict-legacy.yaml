    - required
  - name: DateofCalculation
    type: date
    range:
    - '2012-04-19'
    - .inf
    details: >-
      8-digit YYYYMMDD stamp, digit order (month before day) verified consistent
      across all four Tier 1 tables. Upper bound deliberately left open: a live, continuously-advancing
      ICES Datacenter 'last recalculated' stamp, not submitted by data providers,
      so a fixed max would go stale immediately. Lower bound is this table's own
      verified minimum -- NOT forced identical across tables the way SweepLngt/HaulNo/Year
      are, since a genuine table-specific difference is plausible here (confirmed:
      LT's own minimum is years later). A -9 sentinel (337,562 rows, 5.76% of non-null;
      already excluded by the lower bound above) reads as the standard DATRAS 'not
      recorded' convention for this server-computed field -- not yet (re)calculated
      for this record.
  - name: Valid_Aphia
    type: number(id)
    details: >-
      See known issue valid_aphia_type_mismatch (DATRAS-known-issues.yaml,
      not yet filed): ICES's WSDL declares this field character, but the live service
      always returns it numeric -- it's a WoRMS AphiaID (an identifier, hence number(id),
      not a quantity). Same concept as HL's Valid_Aphia (ICES Datacenter's validated
      AphiaID) but a different sampling population (aged individuals only), so queried
      independently rather than assumed identical to HL's own. 667 distinct values,
      0 unpopulated (always present).
    examples:
    - 213
    - 105872
    - 126412
    - 141452
    - 1667212
  label: Age Composition (Individual)
  description: >-
    Each row is one aged fish specimen from a haul. Contains individual-level
    biological measurements (length, weight, age, sex, maturity) on a subsample of
    the catch; linked to HH via the composite haul identifier.
  details: >-
    Grain: each row is one biological specimen (a single aged fish) from a
    haul. Population: individual organisms sampled and measured from hauls within
    covered surveys, not the full catch <U+2014> a subsample. Linked to HH via the composite
    haul identifier (Survey + Year + Quarter + Country + Platform/Ship + Gear + StationName/StNo
    + HaulNumber). Note (see DATRAS-known-issues.yaml issue ca_haulno_unlinkable_to_hh):
    HaulNumber/HaulNo contains 0 true nulls -- 288,581 rows (4.92% of 5,865,076) instead
    carry a -9 sentinel, which violates the column's declared range ([0, 82483];
    a D04_range violation, confirmed via op_flag_violations()), not the required constraint
    (D01 never fires here). These rows match no HH haul on the full 8-field composite
    key, or on the 7 non-HaulNumber fields alone -- not a join-key problem, but genuinely
    orphaned CA records. A separate, much smaller residual (700 rows, 0.01%) with
    a plausible HaulNumber also fails to match HH.
