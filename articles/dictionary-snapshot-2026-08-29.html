<style id="dd-css">
/* The page shell and the one palette both apps share. Each colour is defined
   once: `light-dark()` picks by the scheme in use, and the two rules below
   force a scheme when the reader asks for one, so there is no second palette
   to keep in step. */
:root {
  color-scheme: light dark;

  --ink: light-dark(#1c2430, #e3e6ea);
  --ink-soft: light-dark(#5b6675, #a3acb7);
  --ink-faint: light-dark(#66707e, #8d97a2);
  --float: light-dark(#ffffff, #161b21); /* tooltip, search results, controls */
  --rule: light-dark(#d6d0c4, #333b44);
  --row-line: light-dark(#e4e0d7, #2a3138);

  /* The page background and the surface everthing sits on */
  --background: light-dark(#f1eee8, #181d22);
  --paper: light-dark(#f8f6f4, #0e1216);

  /* ---- accents ------------------------------------------------------------
     Solarized's eight. Everything coloured on the page is one of them as it
     stands, or one of them mixed by one of four amounts and nothing in between:

       80%  towards black or white — a colour that has to carry text
       40%  towards the surface    — a fill you are meant to notice
       20%  towards the surface    — an ordinary fill
       10%  towards the surface    — a fill that is on all the time

     Marks that aren't text and aren't a fill — a histogram bar, a border — take
     the Solarized value untouched. Holding to those four is what keeps a
     palette this size from drifting into forty near-identical shades. */
  --yellow: #b58900;
  --orange: #cb4b16;
  --red: #dc322f;
  --magenta: #d33682;
  --violet: #6c71c4;
  --blue: #268bd2;
  --cyan: #2aa198;
  --green: #859900;

  --accent1-hue: var(--blue); /* title, key badges, headings, links, focus, bars */
  --accent2-hue: var(--orange); /* foreign keys, the many end, the hovered bar, search hits */

  --accent1: light-dark(
    color-mix(in oklab, var(--accent1-hue) 80%, black),
    color-mix(in oklab, var(--accent1-hue) 80%, white));
  --accent1-soft: light-dark(
    color-mix(in oklab, var(--accent1-hue) 20%, white),
    color-mix(in oklab, var(--accent1-hue) 20%, var(--background)));
  --on-accent1: light-dark(#ffffff, #14142c); /* text on an accent1 fill */
  --accent2: light-dark(
    color-mix(in oklab, var(--accent2-hue) 80%, black),
    color-mix(in oklab, var(--accent2-hue) 80%, white));
  --accent2-soft: light-dark(
    color-mix(in oklab, var(--accent2-hue) 20%, white),
    color-mix(in oklab, var(--accent2-hue) 20%, var(--background)));
  /* a caveat rather than a fact, which is what the palette's yellow is for and
     what its three tenants have in common: an unresolved todo, a restricted
     column, and a validation warning */
  --warn: light-dark(
    color-mix(in oklab, var(--yellow) 80%, black),
    color-mix(in oklab, var(--yellow) 80%, white));
  --warn-soft: light-dark(
    color-mix(in oklab, var(--yellow) 20%, white),
    color-mix(in oklab, var(--yellow) 20%, var(--background)));
  /* a verdict: green passed, red failed. Only the validation report has
     verdicts to report, so only it uses these. */
  --good: light-dark(
    color-mix(in oklab, var(--green) 80%, black),
    color-mix(in oklab, var(--green) 80%, white));
  --good-soft: light-dark(
    color-mix(in oklab, var(--green) 20%, white),
    color-mix(in oklab, var(--green) 20%, var(--background)));
  --bad: light-dark(
    color-mix(in oklab, var(--red) 80%, black),
    color-mix(in oklab, var(--red) 80%, white));
  --bad-soft: light-dark(
    color-mix(in oklab, var(--red) 20%, white),
    color-mix(in oklab, var(--red) 20%, var(--background)));
  --grid-dot: light-dark(#cdc6b6, #2c343c);
  --scroll-thumb: light-dark(#cdc9c1, #3f4751);
  /* every row that takes part in a relationship wears this, so it is the
     quietest step on the ladder */
  --hover-row: light-dark(
    color-mix(in oklab, var(--accent1-hue) 10%, white),
    color-mix(in oklab, var(--accent1-hue) 10%, var(--background)));
  --focus-ring: color-mix(in oklab, var(--accent1-hue) 20%, transparent);
  --shadow-near: light-dark(rgba(28, 36, 48, 0.06), rgba(0, 0, 0, 0.35));
  --shadow-far: light-dark(rgba(28, 36, 48, 0.25), rgba(0, 0, 0, 0.5));
  --shadow-lift: light-dark(rgba(28, 36, 48, 0.45), rgba(0, 0, 0, 0.7));
  --shadow-inset: light-dark(rgba(28, 36, 48, 0.05), rgba(0, 0, 0, 0.35));

  /* the tables app's vocabulary, mapped onto the same palette */
  --chip: light-dark(#e9ecf2, #21262d);
  --link: var(--accent1); /* a link is the accent doing its plainest job */
  --tag-ink: var(--accent2-hue);
  --mark: color-mix(in oklab, var(--accent2-hue) 40%, transparent);
  --hist-bar: var(--accent1-hue);
  --hist-bar-hot: var(--accent2-hue);
  --hist-band: color-mix(in oklab, var(--accent2-hue) 20%, transparent);
  /* a bar is a mark rather than text or a fill, so it takes the raw value */
  --pass-bar: var(--green);
  --fail-bar: var(--red);
  --null-bar: var(--red);
  --null-fill: light-dark(#e3e3e3, #444c55);
  --null-edge: light-dark(#bcbcbc, #5a626c);
  --modal-shadow: light-dark(rgba(0, 0, 0, 0.32), transparent);
  --modal-glow: light-dark(transparent, rgba(255, 255, 255, 0.07));

  /* The two faces everything on the page wears: sans for prose, mono for
     names, values, and micro-labels. */
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* Type scale, in rem so the whole page follows the browser's font-size
     setting. Pixel comments assume the 16px default. */
  --text-sm: 0.875rem;   /* 14px — the smallest size used anywhere */
  --text-base: 1rem;     /* 16px */
  --text-lg: 1.125rem;   /* 18px */
  --text-xl: 1.5rem;     /* 24px */
  --text-2xl: 2rem;      /* 32px */

  --row-text: var(--text-sm); /* diagram rows and the tooltip share this size */
}

:root[data-theme="light"] { color-scheme: only light; }
:root[data-theme="dark"] { color-scheme: only dark; }

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--background);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.55;
}
main { max-width: 1180px; margin: 0 auto; padding: 40px 44px 90px; }

.pagehead { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 0 18px; }
/* the dataset's name and, once you are inside a table, the way back out */
.head-title { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
.pagehead h1 { color: var(--accent1); font-size: var(--text-2xl); font-weight: 700; margin: 0; }
/* The title as a link keeps the title's own colour and weight: it should read as
   the heading it is, with the chevron the only sign it goes anywhere. Only the
   name underlines on hover, so the chevron isn't struck through. */
.homelink, .title-row { --chev-gap: .34em; display: inline-flex; align-items: center; gap: var(--chev-gap); }
.homelink { color: inherit; text-decoration: none; }
.homelink:hover span:last-child { text-decoration: underline; }
.homelink:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 4px; }
/* The chevron hangs in the page's left margin, so the name sits where it would
   have without it. Pulling the slot back by its own width and gap is what keeps
   the name flush: the home page carries the same empty slot, and both pages
   resolve to the same offset. `main` has the room to hang into (44px). */
.homelink .chev, .title-row .chev {
  --chev-w: .78em; /* the stroke then lands at about the name's cap height */
  /* Height is stated, not left to the content: the home page's slot is empty,
     and a zero-height flex item would sit its baseline on the row's bottom edge
     and grow the heading's line box — the title would drop as you navigated. */
  flex: none; display: flex; width: var(--chev-w); height: var(--chev-w);
  margin-left: calc(-1 * (var(--chev-w) + var(--chev-gap)));
  transition: transform .12s ease;
}
.homelink .chev svg { display: block; width: 100%; height: auto; }
/* nudged towards where it goes, which is the whole affordance at this size */
.homelink:hover .chev { transform: translateX(-.1em); }
.head-actions { display: flex; align-items: center; gap: 10px; }
.icon-btn {
  flex: none; width: 38px; height: 38px; border: 1px solid var(--rule); border-radius: 9px;
  background: var(--paper); color: var(--ink); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
/* The key badges, worn identically by a column in the diagram's tables and by
   the same column on its own page. */
.key {
  font-family: var(--font-sans);
  font-size: var(--text-sm);
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--accent1);
  background: var(--accent1-soft);
  border-radius: 3px;
  padding: 1px 4px;
}
.key.fk { color: var(--accent2); background: var(--accent2-soft); }
.key.restricted { color: var(--warn); background: var(--warn-soft); }

/* The mark an unresolved `todo` leaves on the thing that carries it. Quiet
   until pointed at: it is a note to whoever is still writing the dictionary,
   not something the reader has to act on. The note itself is in the tooltip. */
.todo-flag {
  flex: none;
  display: inline-flex;
  align-items: center;
  padding: 2px;
  border-radius: 4px;
  color: var(--warn);
  cursor: help;
}
.todo-flag svg { display: block; width: 13px; height: 13px; }
.todo-flag:hover, .todo-flag:focus-visible { background: var(--warn-soft); }
.todo-flag:focus-visible { outline: 2px solid var(--warn); outline-offset: 1px; }
/* beside the dataset's name it sits against 29px type, and centres on it
   rather than on the baseline the rest of the head shares */
.head-title .todo-flag { align-self: center; }
.head-title .todo-flag svg { width: 16px; height: 16px; }
/* the index's name cell is text, not a flex row, so the gap is its own */
.tlist .name .todo-flag { margin-left: 5px; vertical-align: -2px; }

.icon-btn:hover { border-color: var(--accent1); color: var(--accent1); }
.icon-btn svg { display: block; width: 19px; height: 19px; }
.icon-btn[hidden] { display: none; }
.lead p { margin: 0 0 16px; max-width: 1000px; color: var(--ink); }

/* One toggle, light or dark; the half-moon icon turns over when dark. With
   nothing chosen the page follows the system. */
.theme-toggle svg { transition: transform .2s ease; }
.theme-toggle.is-dark svg { transform: rotate(180deg); }

/* "name: label" — the name keeps whatever (usually mono) face surrounds it;
   the label reads as plain text beside it. */
.name-label {
  font-family: var(--font-sans);
  font-weight: 400;
  color: var(--ink-soft);
}

#tables { margin-top: 30px; }

/* search hits, wherever they land */
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

/* ---- tooltip -------------------------------------------------------------
   One #tip element for the whole page, above the modals: it follows the
   cursor (wires, rows, histogram bars) or is anchored under an element
   (glossary terms) — shared.js decides which per show. */
#tip {
  position: fixed;
  z-index: 2000;
  max-width: 40ch;
  padding: 7px 9px;
  background: var(--float);
  border: 1px solid var(--rule);
  border-radius: 6px;
  box-shadow: 0 8px 24px -12px var(--shadow-lift);
  font-size: var(--row-text);
  line-height: 1.45;
  pointer-events: none;
}
#tip[hidden] { display: none; }
#tip code {
  font-family: var(--font-mono);
  font-size: var(--row-text);
}
#tip .tip-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--row-line);
  color: var(--ink);
}
#tip .tip-head code { color: var(--accent1); }
/* the aside keeps its line; the code beside it is what wraps */
#tip .tip-sub { color: var(--ink-faint); white-space: nowrap; }
#tip p { margin: 0; color: var(--ink-soft); }
#tip .tip-head + p { margin-top: 5px; }
/* a second relationship behind the same chip, set off from the first */
#tip .tip-head ~ .tip-head { margin-top: 9px; }
#tip .tip-label { font-style: italic; }
#tip .gt-term { font-weight: 700; }

/* A `todo`, whether it is the whole tooltip (hovering the flag) or a note
   under a join's description. Its own colour carries the warning that the
   flag's did, and the list `draft` usually writes is set as a list. */
#tip .tip-todo .tip-head code { color: var(--warn); }
#tip .tip-todo .prose { display: block; margin-top: 5px; color: var(--ink-soft); }
#tip .tip-todo-note { margin-top: 9px; }
#tip .tip-todo-lbl { font-family: var(--font-mono); color: var(--warn); }
#tip .tip-todo :is(p, ul, ol) { margin: 0; }
#tip .tip-todo :is(ul, ol) { padding-left: 1.2em; }
#tip .tip-todo li + li { margin-top: 2px; }

@media (max-width: 720px) {
  main { padding: 26px 18px 60px; }
  /* too little margin left to hang the chevron in, so it takes real space and
     the name indents — on both pages alike, which is what matters */
  .homelink .chev, .title-row .chev { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* The relationships diagram. Shares the page palette in app.css; the metrics
   and tints only the diagram uses live here. */
:root {
  /* rem so the rows grow with the text inside them */
  --row-h: 1.875rem; /* leaves ~8px above and below the text, matching --row-pad */
  --row-pad: 9px;
  /* mixed off the Solarized accents in app.css, towards whatever sits behind */
  --head-bg: light-dark(
    color-mix(in oklab, var(--accent1-hue) 80%, black),
    color-mix(in oklab, var(--accent1-hue) 40%, var(--background)));
  --head-ink: light-dark(#ffffff, #e7f1ef);
  --demo-head: light-dark(#6b7684, #3a434d);
  --demo-rule: light-dark(#c9c4b8, #454e58);
  /* row touched by the hovered relationship */
  --tint-edge: light-dark(
    color-mix(in oklab, var(--accent1-hue) 20%, white),
    color-mix(in oklab, var(--accent1-hue) 20%, var(--background)));
  /* row matching the search */
  --tint-search: light-dark(
    color-mix(in oklab, var(--mark-hue) 20%, white),
    color-mix(in oklab, var(--mark-hue) 20%, var(--background)));
  /* the match you selected */
  --tint-search-on: light-dark(
    color-mix(in oklab, var(--mark-hue) 40%, white),
    color-mix(in oklab, var(--mark-hue) 40%, var(--background)));
}

/* ---- diagram surface ---------------------------------------------------- */

/* One scrollport for the whole board, so the page doesn't grow with the schema.
   Drag anywhere in it to pan. Nothing on the board is prose to be copied, and
   dragging to pan would otherwise select table text. The -webkit- prefix
   matters: Safari before 17 honours only that one. */
#board {
  position: relative;
  margin: 8px 0 18px;
  user-select: none;
  -webkit-user-select: none;
}

#canvas {
  height: min(87.5vh, 775px);
  overflow: auto;
  background-color: var(--background);
  /* faint dot grid, pinned to the board so it pans with it */
  background-image: radial-gradient(circle at 1px 1px, var(--grid-dot) 1.4px, transparent 0);
  background-size: 24px 24px;
  background-attachment: local;
  border: 1px solid var(--rule);
  border-radius: 10px;
  box-shadow: inset 0 1px 3px var(--shadow-inset);
  overscroll-behavior: contain;
}
/* only offer the grab when there is somewhere to pan to */
#canvas.can-pan { cursor: grab; }
#canvas.panning { cursor: grabbing; }
#canvas.panning * { cursor: grabbing !important; }

#stage {
  position: relative;
  margin: 10px;
}

#wires,
#markers {
  position: absolute;
  top: 0;
  left: 0;
  overflow: visible;
}
/* the layer ignores the mouse; the markers in it do not */
#markers { pointer-events: none; }
#markers .markers { pointer-events: auto; }

.node {
  position: absolute;
  top: 0;
  left: 0;
  width: max-content;
  max-width: 340px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 7px;
  box-shadow: 0 1px 2px var(--shadow-near), 0 6px 16px -10px var(--shadow-far);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.node > h2 {
  flex: none;
  cursor: grab;
  touch-action: none;
  margin: 0;
  padding: 7px var(--row-pad);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--text-sm);
  font-weight: 600;
  font-family: var(--font-mono);
  letter-spacing: 0.01em;
  background: var(--head-bg);
  color: var(--head-ink);
}

/* the scroll box: fixed maximum height, rows scroll inside it */
.rows {
  flex: 1 1 auto;
  min-height: 0;
  max-height: var(--max-rows-h);
  overflow-y: auto;
  overscroll-behavior: contain;
  /* the standard properties only: mixing these with ::-webkit-scrollbar makes
     Chrome ignore one of them, and the gutter no longer matches the bar drawn
     in it, leaving a sliver */
  scrollbar-width: thin;
  scrollbar-color: var(--scroll-thumb) transparent;
}
/* Reserve room for the bar only where the list actually scrolls: an unused
   gutter shows through as a pale strip down the right-hand side of the table. */
.node.clipped .rows { scrollbar-gutter: stable; }
.node.clipped::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 14px;
  background: linear-gradient(to top, var(--paper), transparent);
  pointer-events: none;
  transition: opacity 120ms;
}
.node.clipped.at-end::after { opacity: 0; }

.row {
  position: relative;
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 10px;
  height: var(--row-h);
  padding: 0 var(--row-pad);
  font-family: var(--font-mono);
  font-size: var(--row-text);
  white-space: nowrap;
}
.row + .row { border-top: 1px solid var(--row-line); }
.row { background: var(--row-bg, transparent); }
/* primary keys stay put while the rest of the columns scroll under them */
.row.pinned {
  position: sticky;
  z-index: 1;
  --row-bg: var(--paper);
}
.row.pinned.linked { --row-bg: var(--hover-row); }
.row.pin-last { box-shadow: 0 1px 0 var(--rule), 0 3px 6px -4px var(--shadow-far); }
.row.linked { --row-bg: var(--hover-row); }
/* the link to this column's entry on its table page */
.row .name {
  color: var(--ink);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  text-decoration: none;
}
.row .name:hover { color: var(--link); text-decoration: underline; }
.row .name:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; border-radius: 2px; }
.row .type { color: var(--ink-soft); font-size: var(--text-sm); }
.row .keys { display: flex; gap: 4px; }
/* the badges themselves are styled in app.css, shared with the tables app */
/* badges that stand for at least one relationship respond to the mouse */
.row .key.live { cursor: pointer; }
.row .key.live:hover { box-shadow: inset 0 0 0 1px currentColor; }
/* a badge clicked to hold its highlight on */
.row .key.held {
  color: var(--on-accent1);
  background: var(--accent1);
  box-shadow: none;
}
.row .key.fk.held { background: var(--accent2); }

/* ---- wires -------------------------------------------------------------- */

.wire { fill: none; stroke: var(--ink-soft); stroke-width: 1.4px; transition: stroke 90ms, stroke-width 90ms; }
.hit { fill: none; stroke: transparent; stroke-width: 16px; }
.edge { transition: opacity 110ms; }
.edge.hover .wire { stroke: var(--accent1); stroke-width: 2.6px; }

/* hovering one relationship pushes the others back */
#wires.dim .edge:not(.hover),
#markers.dim .markers:not(.hover) { opacity: 0.16; }
#markers .markers { transition: opacity 110ms; }

/* ---- cardinality marker ------------------------------------------------- */

.marker.many {
  fill: var(--ink-soft);
  stroke: none;
}
.marker.one {
  fill: var(--ink-soft);
  stroke: none;
}
.markers.hover .marker.many { fill: var(--accent1); }
.markers.hover .marker.one { fill: var(--accent1); }

.node.dragging {
  box-shadow: 0 2px 4px var(--shadow-near), 0 18px 34px -14px var(--shadow-lift);
}
.node.dragging > h2 { cursor: grabbing; }

.node.demo {
  border-style: dashed;
  border-color: var(--demo-rule);
  box-shadow: none;
}
.node.demo > h2 { background: var(--demo-head); }
.edge.demo .wire { stroke-dasharray: 5 3; }

/* the name takes the space it needs, the size and the eye sit together at the
   right-hand end of the heading */
/* The name and its chevron are one target, opening the table's page. They keep the
   heading's own colour — the chevron is what says it goes anywhere — and the
   pointer only turns from `grab` here, since the heading is still the drag handle
   everywhere else. */
.node > h2 a.tlink {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
  color: inherit;
  text-decoration: none;
  cursor: pointer;
  border-radius: 3px;
}
.node > h2 a.tlink .tn { overflow: hidden; text-overflow: ellipsis; }
.node > h2 a.tlink:hover .tn { text-decoration: underline; }
.node > h2 a.tlink:hover .go { opacity: 1; }
.node > h2 a.tlink:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

/* The chevron sits in the same quiet register as the heading's other marks. */
.node > h2 .go {
  flex: none;
  display: grid;
  place-items: center;
  width: 9px;
  height: 9px;
  opacity: 0.55;
}
.node > h2 .go svg { width: 100%; height: 100%; fill: currentColor; }

.node > h2 .count {
  margin-left: auto;
  font-family: var(--font-sans);
  font-size: var(--text-sm);
  font-weight: 500;
  opacity: 0.85;
}

/* ---- picking tables ------------------------------------------------------ */

/* A table off the board. The attribute alone isn't enough: `.node`'s own
   `display: flex` outranks the user agent's `[hidden] { display: none }`. */
.node[hidden] { display: none; }

.node > h2 .eye {
  flex: none;
  display: grid;
  place-items: center;
  width: 20px;
  height: 18px;
  margin: -3px -4px -3px 0; /* sits in the heading's own padding */
  padding: 0;
  border: 0;
  border-radius: 4px;
  background: none;
  color: var(--head-ink);
  opacity: 0.55;
  cursor: pointer;
}
.node > h2 .eye svg {
  width: 13px;
  height: 13px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.4;
  stroke-linejoin: round;
}
.node > h2 .eye:hover { opacity: 1; }
.node > h2 .eye[aria-pressed="true"] {
  opacity: 1;
  background: color-mix(in oklab, var(--head-ink) 20%, transparent);
}

/* a table the board is being laid out around */
.node.picked {
  border-color: var(--accent1);
  box-shadow: 0 0 0 3px var(--accent1-soft), 0 1px 2px var(--shadow-near),
    0 6px 16px -10px var(--shadow-far);
}

/* Wires between two tables that are only on the board because a picked table
   joins them both. They still light up under the mouse — they just don't compete
   with the relationships you actually asked about. */
#wires .edge.faint:not(.hover) .wire {
  stroke: var(--ink-faint);
  stroke-width: 1px;
  opacity: 0.55;
}
#markers .markers.faint:not(.hover) { opacity: 0.4; }

/* ---- search ------------------------------------------------------------- */

#controls {
  position: absolute;
  top: 10px;
  right: 26px; /* clear of the board's own scrollbar */
  z-index: 400; /* above the tables, including dragged ones */
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

#diagram-search { width: 232px; }

#tidy,
#showall {
  padding: 6px 10px;
  font: inherit;
  font-size: var(--text-sm);
  color: var(--ink);
  background: var(--float);
  border: 1px solid var(--rule);
  border-radius: 6px;
  box-shadow: 0 2px 6px -3px var(--shadow-far);
  cursor: pointer;
  white-space: nowrap;
}
#tidy:hover,
#showall:hover { border-color: var(--accent1); }
/* nothing has been dragged, so there is nothing to tidy */
#tidy[disabled] { opacity: 0.45; cursor: default; }
#tidy[disabled]:hover { border-color: var(--rule); }
/* only there while something is off the board */
#showall[hidden] { display: none; }
#showall { color: var(--accent1); border-color: var(--accent1-soft); }

#find {
  user-select: text;
  -webkit-user-select: text;
  width: 100%;
  padding: 6px 9px;
  font: inherit;
  font-size: var(--text-sm);
  color: var(--ink);
  background: var(--float);
  border: 1px solid var(--rule);
  border-radius: 6px;
  box-shadow: 0 2px 6px -3px var(--shadow-far);
}
#find::placeholder { color: var(--ink-faint); }
#find:focus {
  outline: none;
  border-color: var(--accent1);
  box-shadow: 0 0 0 3px var(--focus-ring);
}

#hits {
  margin-top: 4px;
  max-height: 232px;
  overflow-y: auto;
  overflow-x: hidden; /* long names ellipsise instead of scrolling sideways */
  background: var(--float);
  border: 1px solid var(--rule);
  border-radius: 6px;
  box-shadow: 0 10px 26px -14px var(--shadow-lift);
  font-size: var(--text-sm);
}
#hits[hidden] { display: none; }
#hits .none { padding: 7px 9px; color: var(--ink-faint); }
#hits button {
  display: block;
  width: 100%;
  padding: 5px 9px;
  border: 0;
  background: none;
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}
#hits button + button { border-top: 1px solid var(--row-line); }
#hits button .hit-path {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#hits button:hover { background: var(--hover-row); }
#hits button[aria-current="true"] { background: var(--accent1-soft); }

/* Highlighted rows all speak the same language: a background, no border. The
   pinned variants are spelled out so they outrank .row.pinned.linked above, and
   the combinations come last so they win on source order. */
.row.found,
.row.pinned.found { --row-bg: var(--tint-search); }
.row.current,
.row.pinned.current { --row-bg: var(--tint-search-on); }
.row.hot,
.row.pinned.hot { --row-bg: var(--tint-edge); }

/* both at once: diagonal stripes of the two tints */
.row.hot.found,
.row.hot.current,
.row.pinned.hot.found,
.row.pinned.hot.current {
  --row-bg: repeating-linear-gradient(
    -45deg,
    var(--tint-edge) 0 7px,
    var(--tint-search-on) 7px 14px
  );
}

/* The searchable table index, the table detail page, and the glossary.
   Shares the page palette in app.css. */

/* `details` disclosures: a quiet micro-label toggle, same in the lead and the modal */
details.xdetails { margin: 0 0 18px; }
details.xdetails > summary {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer; list-style: none;
  font-family: var(--font-mono);
  font-size: var(--text-sm); font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-soft);
}
details.xdetails > summary::-webkit-details-marker { display: none; }
details.xdetails > summary::before { content: '\25B8'; font-size: var(--text-sm); }
details.xdetails[open] > summary::before { content: '\25BE'; }
details.xdetails > summary:hover { color: var(--ink); }
details.xdetails > summary:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 3px; }
.xdetails-body { margin-top: 8px; max-width: 1000px; line-height: 1.55; color: var(--ink); }
.tpage-details details.xdetails { margin: 0 0 13px; }
.tpage-details .xdetails-body { font-size: var(--text-sm); max-width: none; }

.toolbar { margin-bottom: 14px; }
.toolbar input[type=search] {
  width: 100%;
  padding: 8px 12px; border: 1px solid var(--rule); border-radius: 8px;
  background: var(--paper); color: var(--ink); font-size: var(--text-sm);
}

/* ---- table index ---- */
.tlist-wrap {
  border: 1px solid var(--rule); border-radius: 10px;
  background: var(--paper); overflow-x: auto;
}
.tlist { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.tlist thead th {
  text-align: left; padding: 8px 14px; white-space: nowrap;
  font-family: var(--font-mono);
  font-size: var(--text-sm); font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-soft); border-bottom: 1px solid var(--rule);
}
.tlist th.num, .tlist td.num { text-align: right; font-variant-numeric: tabular-nums; }
.tlist td { padding: 0 14px; vertical-align: baseline; }

/* one tbody per table: the block shares a border and a hover state */
.tlist tbody.tgroup { border-bottom: 1px solid var(--rule); }
.tlist tr[data-href] { cursor: pointer; }
.tlist tbody.tgroup:last-child { border-bottom: none; }
.tlist tbody.tgroup:hover td, .tlist tbody.tgroup:focus-within td { background: var(--chip); }
.tlist tr.trow td { padding-top: 9px; }
.tlist tr.drow td { padding-bottom: 10px; }
.tlist tbody.tgroup:not(:has(.drow)) tr.trow td { padding-bottom: 10px; }

a.tname {
  font-family: var(--font-mono); font-weight: 650; font-size: var(--text-sm);
  color: var(--ink); text-decoration: none; border-radius: 3px;
}
a.tname:hover { color: var(--link); }
a.tname:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.tlist td.size { font-family: var(--font-mono); font-size: var(--text-sm); color: var(--ink-soft); white-space: nowrap; }
.tlist .stimes { margin: 0 5px; opacity: .55; }
.tlist td.desc { color: var(--ink); font-size: var(--text-sm); line-height: 1.45; }
/* the clamp needs a block of its own; a <td> does not honour -webkit-box */
.tlist td.desc .dclamp {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* the search's receipt: the columns that matched, nested under their table */
.tlist tr.mhead td.mheadcell { padding-top: 5px; padding-bottom: 3px; }
.mlbl {
  font-family: var(--font-mono); font-size: var(--text-sm); font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft);
}
button.showall {
  font: inherit; font-size: var(--text-sm); margin-left: 10px; padding: 0;
  border: none; background: none; color: var(--link); cursor: pointer; text-decoration: underline;
}
button.showall:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

.tlist tr.crow td { padding-top: 2px; padding-bottom: 2px; }
.tlist tbody.tgroup tr.crow:last-child td { padding-bottom: 10px; }
.tlist td.csub { padding-left: 26px; white-space: nowrap; }
a.cpath {
  font-family: var(--font-mono); font-size: var(--text-sm);
  text-decoration: none; border-radius: 3px;
}
a.cpath .cp-tbl { color: var(--ink-soft); }
a.cpath .cp-col { color: var(--ink); font-weight: 650; }
a.cpath:hover .cp-col, a.cpath:hover .cp-tbl { color: var(--link); }
a.cpath:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.cwhere {
  margin-left: 8px;
  font-family: var(--font-mono); font-size: var(--text-sm);
  letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft);
}
.tlist td.csub-desc { font-size: var(--text-sm); color: var(--ink-soft); line-height: 1.4; text-align: left; }
.dclamp1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.tlist tbody.tgroup:not(.expanded) tr.crow.xtra { display: none; }

/* rendered Markdown in prose */
.prose a { color: var(--link); text-underline-offset: 2px; }
.prose a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 3px; }
.prose p { margin: 0 0 10px; }
.prose p:last-child, .prose > :last-child { margin-bottom: 0; }
.prose ul, .prose ol { margin: 6px 0; padding-left: 22px; }

/* glossary terms in prose: dotted underline, definition on hover */
abbr.gterm {
  text-decoration: underline dotted var(--ink-faint);
  text-decoration-thickness: 1px;
  text-underline-offset: 2.5px;
  cursor: help;
}
abbr.gterm:hover { text-decoration-color: var(--accent1); }

.tables-empty { color: var(--ink-soft); font-size: var(--text-sm); padding: 18px 14px; }

@media (max-width: 720px) {
  .tlist td.csub-desc { display: none; }
}
@media (max-width: 620px) {
  .tlist td, .tlist thead th { padding-left: 10px; padding-right: 10px; }
  .tlist td.csub { padding-left: 18px; }
}

/* ---- table detail page ---- */
.tpage-head { padding-bottom: 14px; }
.tpage-title-row { display: flex; align-items: center; gap: 10px; }
.tpage-title-row > h2, .modal-title-row > h2 {
  font-family: var(--font-mono); font-weight: 650; font-size: var(--text-lg); color: var(--ink); margin: 0;
}
.tpage-substat { color: var(--ink-soft); font-size: var(--text-sm); margin: 7px 0 13px; }

/* Each block of the page sits on a card over the background: the dataset's
   lead, the table's header, and the column list. They all share the one
   surface, so the border is what separates them. */
.lead, .tpage-top, .tpage-list {
  border: 1px solid var(--rule);
  border-radius: 10px;
  background: var(--paper);
}
.lead { padding: 14px 16px; margin-bottom: 20px; }
.lead > :last-child, .lead p:last-child { margin-bottom: 0; }
/* The rows bleed 13px outward to let a highlighted one span the full width, so
   the card's padding leaves them just inside its border. */
.tpage-list { padding: 0 14px; }

/* ---- the table list beside a table ---- */

#table-view { display: flex; align-items: flex-start; gap: 16px; }
#table-view #table-page { flex: 1 1 auto; min-width: 0; }

/* The same card as the blocks it sits beside. It follows the page down, since a
   column list runs long and the point of the list is to leave from anywhere; the
   names scroll inside it when there are more than the window holds. */
.tnav {
  flex: none; width: 232px;
  padding: 12px;
  border: 1px solid var(--rule);
  border-radius: 10px;
  background: var(--paper);
  position: sticky; top: 14px;
  max-height: calc(100vh - 28px);
  display: flex; flex-direction: column; gap: 10px;
}
/* Wide screens show the list outright, so the toggle only exists for the
   narrow-width rules in app.css. */
.tnav-toggle { display: none; }
.tnav-filter {
  flex: none; min-width: 0; padding: 7px 11px;
  border: 1px solid var(--rule); border-radius: 8px;
  background: var(--paper); color: var(--ink); font-size: var(--text-sm);
}
.tnav-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
.tnav-item {
  display: block; padding: 5px 8px; border-radius: 6px;
  font-family: var(--font-mono); font-size: var(--text-sm);
  color: var(--ink); text-decoration: none;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tnav-item:hover { background: var(--chip); }
.tnav-item:focus-visible { outline: 2px solid var(--link); outline-offset: -2px; }
/* the table being read, wearing the same fill as a held key badge */
.tnav-item.on { background: var(--accent1); color: var(--on-accent1); font-weight: 650; }
.tnav-none { margin: 0; padding: 4px 8px; color: var(--ink-faint); font-size: var(--text-sm); }

/* The name, its stats and the description on the left; the related-tables box
   set against the card's right edge, its top level with the name. */
.tpage-top {
  display: flex; gap: 28px; align-items: flex-start;
  padding: 12px 16px; margin-bottom: 13px;
}
.tpage-headmain { flex: 1 1 auto; min-width: 0; }
.tpage-headmain > :last-child, .tpage-main > :last-child { margin-bottom: 0; }
.tpage-main { max-width: 76ch; }
.tpage-desc { color: var(--ink); font-size: var(--text-sm); margin: 0 0 13px; }
.tpage-desc:last-child { margin-bottom: 0; }
/* Outlined rather than filled — it is already on the card, so a border is all
   it takes to set it apart. Sized by its chips, so a table with a few relations
   gets a short box and several of them share a line. */
.tpage-related {
  flex: 0 1 auto; max-width: 420px;
  border-left: 1px solid var(--rule);
  padding: 10px 12px;
}
.tpage-related[hidden] { display: none; }
.tpage-related .rel-lbl {
  font-family: var(--font-mono);
  font-size: var(--text-sm); font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-soft); margin-bottom: 8px;
}
.tpage-related .rel-chips { display: flex; flex-wrap: wrap; gap: 6px; }

.tpage-controls { display: flex; gap: 10px; align-items: center; }
.tpage-sort {
  flex: none; padding: 8px 30px 8px 12px; border: 1px solid var(--rule); border-radius: 8px;
  background: var(--paper) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%237a7a7a"/></svg>') no-repeat right 11px center;
  color: var(--ink); font-size: var(--text-sm); cursor: pointer;
  -webkit-appearance: none; appearance: none;
}
.tpage-filter {
  flex: 1 1 auto; min-width: 0; padding: 8px 12px; border: 1px solid var(--rule); border-radius: 8px;
  background: var(--paper); color: var(--ink); font-size: var(--text-sm);
}

.col-item { padding: 11px 13px; border-bottom: 1px solid var(--rule); display: flex; gap: 22px; align-items: flex-start; margin: 0 -13px; }
.col-item:last-child { border-bottom: none; }
/* The permalinked column: "you are here", Lifted off the list. */
.col-item.is-target {
  position: relative;
  z-index: 1;
  margin: 7px -21px;
  padding: 16px 21px;
  border-radius: 10px;
  border: 1px solid var(--rule);
  background: var(--paper);
  box-shadow: 0 1px 2px var(--shadow-near), 0 8px 22px -8px var(--shadow-far);
}
.col-item:has(+ .is-target) { border-bottom-color: transparent; padding-bottom: 5px }

/* ---- glossary modal ---- */
.modal-overlay {
  position: fixed; inset: 0; z-index: 1000; padding: 20px;
  background: rgba(20, 22, 28, .45);
  display: flex; align-items: center; justify-content: center;
}
.modal-overlay[hidden] { display: none; }
.modal {
  background: var(--paper); border: 1px solid var(--rule); border-radius: 14px;
  width: min(760px, 96vw); max-height: 86vh;
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 24px 60px var(--modal-shadow), 0 0 44px var(--modal-glow);
}
.modal-head { flex: none; padding: 18px 22px 14px; border-bottom: 1px solid var(--rule); position: relative; }
.modal-title-row { display: flex; align-items: center; gap: 10px; }
.modal-substat { color: var(--ink-soft); font-size: var(--text-sm); margin: 7px 0 13px; }
.modal-filter {
  width: 100%; padding: 8px 12px; border: 1px solid var(--rule); border-radius: 8px;
  background: var(--background); color: var(--ink); font-size: var(--text-sm);
}
.modal-close {
  position: absolute; top: 12px; right: 15px; border: none; background: transparent;
  font-size: var(--text-xl); line-height: 1; color: var(--ink-soft); cursor: pointer;
}
.modal-close:hover { color: var(--ink); }
.modal-body { flex: 1; overflow-y: auto; padding: 4px 22px 22px; }
.col-main { flex: 1 1 auto; min-width: 0; }
/* wide enough for the 240px histogram plus the panel's padding on both sides */
.col-side { flex: 0 0 auto; width: 262px; }
/* the missing meter, under the histogram and exactly as wide (240px, offset
   by the panel's own padding so the edges line up): the percentage on the
   left, and on the right the missing share in red, anchored left over a grey
   base — each taking half the width */
.miss-meter { display: flex; align-items: center; gap: 8px; width: 240px; margin: 6px 10px 0; }
.missbar { flex: 1 1 0; min-width: 0; height: 9px; background: var(--null-fill); border: 0.5px solid var(--null-edge); box-sizing: border-box; position: relative; overflow: hidden; }
.missfill { position: absolute; top: -0.5px; left: -0.5px; bottom: -0.5px; min-width: 6px; border-radius: 999px 0 0 999px; background: var(--null-bar); box-sizing: border-box; }
.missfill.full { right: -0.5px; min-width: 0; }
.miss-pct { flex: 1 1 0; min-width: 0; color: var(--ink-soft); font-size: var(--text-sm); font-family: var(--font-mono); white-space: nowrap; }
.col-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
/* the heading is the document outline; the anchor inside carries the look */
.col-head h3 { margin: 0; font-size: inherit; font-weight: inherit; font-size: var(--text-base); }
.col-name { font-family: var(--font-mono); font-weight: 650; color: var(--ink); }
a.col-name { text-decoration: none; border-radius: 3px; }
a.col-name:hover { color: var(--link); }
a.col-name:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
/* the anchor mark holds its space, so hovering never nudges the row */
a.col-name .anchor-mark { margin-left: 6px; font-weight: 400; color: var(--ink-soft); opacity: 0; }
a.col-name:hover .anchor-mark, a.col-name:focus-visible .anchor-mark { opacity: 1; }
.col-desc { color: var(--ink); font-size: var(--text-sm); margin-top: 4px; line-height: 1.5; }
.col-meta { color: var(--ink-soft); font-size: var(--text-sm); margin-top: 5px; }
.col-meta .lbl { font-weight: 650; margin-right: 6px; }
.col-meta code { font-family: var(--font-mono); background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; color: var(--ink); }
/* One chip for every value a column reports — allowed, given as an example,
   sampled from the data, or the range and counts read off it — set off from the
   line but in the page's own text face. Join chips share the shell; what sets
   them apart is what they carry (a wire icon, mono names) and that they act. */
.val, .join-chip {
  background: var(--paper); border: 1px solid var(--rule); border-radius: 4px;
  padding: 0 3px; color: var(--ink);
}
.val { display: inline-block; }
/* a chip cut short for its length: click reveals the whole value, wrapped */
button.val { font: inherit; }
.val.cut { cursor: pointer; }
.val.cut.open { white-space: normal; overflow-wrap: anywhere; text-align: left; }
/* an enum whose values are labelled: the value, then what it means */
.val-defs {
  display: grid; grid-template-columns: auto 1fr;
  gap: 3px 10px; margin: 5px 0 0;
}
.val-defs dt, .val-defs dd { margin: 0; }
.val-defs dd { color: var(--ink); }
/* reveals the rest of a column's sampled values, and puts them away again */
.more-less {
  margin-left: 6px; padding: 0; border: none; background: none;
  color: var(--link); font: inherit; cursor: pointer;
}
.more-less:hover { text-decoration: underline; }
.more-less:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 3px; }
.joins-line { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.joins-line .lbl { margin-right: 0; }
.join-chip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); cursor: pointer; transition: border-color .1s ease, color .1s ease; }
.join-chip:hover { border-color: var(--link); color: var(--link); }
.join-chip svg { width: 20px; height: 10px; display: block; color: var(--ink-soft); }
/* a quiet panel behind the bars, so the histogram reads as one thing */
.col-hist {
  margin-top: 2px;
  padding: 9px 10px 8px;
  border-radius: 6px;
  background: var(--paper);
}
.hist-svg { display: block; }
.hist-svg .hist-bar { fill: var(--hist-bar); transition: fill .08s ease; shape-rendering: crispEdges;}
/* off-scale values (-Inf, Inf, NaN), split from the data by a divider */
.hist-svg .hist-bar.special { fill: var(--ink-faint); }
.hist-svg .hist-bar.hot { fill: var(--hist-bar-hot); }
.hist-svg .hist-sep { stroke: var(--ink-faint); stroke-width: 1; stroke-dasharray: 2 2; }
/* full-height backdrop for the hovered column, tinted to match the hot bar */
.hist-svg .hist-band { fill: transparent; transition: fill .08s ease; }
.hist-svg .hist-band.hot { fill: var(--hist-band); }
.hist-svg .hist-hit { fill: transparent; }
.hist-cap { color: var(--ink-soft); font-size: var(--text-sm); margin-top: 4px; font-family: var(--font-mono); }
/* the observed extremes as axis labels: min under the left edge, max under
   the right */
.hist-cap-range { display: flex; justify-content: space-between; gap: 8px; }
.hist-cap-range .cap-mid { color: var(--ink-faint); }
.gloss-item { padding: 12px 0; border-bottom: 1px solid var(--rule); }
.gloss-item:last-child { border-bottom: none; }
.gloss-term { font-weight: 700; font-size: var(--text-base); color: var(--ink); }
.gloss-def { color: var(--ink); font-size: var(--text-sm); margin-top: 3px; line-height: 1.55; }

/* On a narrow window the profiles and the related-tables box come off the
   right-hand side and sit under what they sat beside. Last, so it outranks the
   base rules above at the same specificity. */
@media (max-width: 880px) {
  .col-item { flex-wrap: wrap; row-gap: 10px; }
  .col-main { flex: 1 1 100%; max-width: none; }
  .tpage-top { flex-wrap: wrap; row-gap: 14px; }
  .tpage-headmain { flex: 1 1 100%; }
  .tpage-related { max-width: none; }
}

/* Narrow widths: the list folds behind a toggle, since an open list would
   push the table itself a screen or more down the page. These rules sit at
   the end of the last-concatenated stylesheet so they beat the base rules
   above at equal specificity. */
@media (max-width: 720px) {
  #table-view { display: block; }
  .tnav { width: auto; position: static; max-height: none; margin-bottom: 14px; padding: 0; }
  .tnav-toggle {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 10px 12px; border: 0; background: none; cursor: pointer;
    color: var(--ink); font: inherit; text-align: left;
  }
  .tnav-toggle .chev { display: inline-block; transition: transform 0.15s; color: var(--ink-faint); }
  .tnav.open .tnav-toggle .chev { transform: rotate(90deg); }
  .tnav:not(.open) .tnav-filter, .tnav:not(.open) .tnav-list, .tnav:not(.open) .tnav-none { display: none; }
  .tnav.open { padding: 12px; }
  .tnav.open .tnav-toggle { padding: 0 0 2px; }
  .tnav.open .tnav-list { max-height: 50vh; }
}

</style>

asured from hauls within covered surveys, not the full catch &lt;U+2014&gt; a subsample. Linked to HH via the composite haul identifier (Survey + Year + Quarter + Country + Platform/Ship + Gear + StationName/StNo + HaulNumber). Note (see DATRAS-known-issues.yaml issue ca_haulno_unlinkable_to_hh): HaulNumber/HaulNo contains 0 true nulls -- 288,581 rows (4.92% of 5,865,076) instead carry a -9 sentinel, which violates the column's declared range ([0, 82483]; a D04_range violation, confirmed via op_flag_violations()), not the required constraint (D01 never fires here). These rows match no HH haul on the full 8-field composite key, or on the 7 non-HaulNumber fields alone -- not a join-key problem, but genuinely orphaned CA records. A separate, much smaller residual (700 rows, 0.01%) with a plausible HaulNumber also fails to match HH.\u003c/p>","todo":"\u003cp>Diagnose the 700-row (0.01%) HaulNumber tail-mismatch residual (known-issues.yaml: ca_haulno_tail_mismatch) -- distinct from the -9 sentinel issue above, cause not yet found.\u003c/p>","origin":"data-raw/spec_02_curate_dict.R","source":{"parquet":"/Users/einarhj/R/Pakkar/opus/.datras/to_https/raw/CA.parquet"},"rows":5968027,"columns":[{"name":"RecordHeader","label":"Record Type","description":"\u003cp>Definition of the data type recorded, affecting the layout of the data fields included on that record. HH=Haul Information, HL=Length Frequency Distribution, CA=individual fish recordings with biological information, LT= Litter data records\u003c/p>","type":"enum","constraints":["required"],"values":["CA"],"value_labels":{"CA":"individual fish recordings with biological information"},"profile":{"distinct":{"count":1,"approximate":false},"missing":0,"common_values":{"approximate":false,"values":[{"value":"CA","count":5968027}]}}},{"name":"Survey","details":"\u003cp>29 distinct values in HH's archive; ICES DATRAS survey acronym, an open list, not a fixed enum. icesVocab DOES resolve a 'Survey' key by name but it's a fals e (submitted value) due to ICES corrections or updates to the WoRMS taxonomy.\u003c/p>"},{"term":"DateofCalculation","definition":"\u003cp>The timestamp (YYYYMMDD) when the ICES Datacenter last recalculated and reprocessed this record. Not submitted by data providers; inserted and updated server-side as part of ICES's QC workflow.\u003c/p>"},{"term":"Litter Assessment","definition":"\u003cp>A qualitative and quantitative survey of marine debris (plastics, metal, rubber, natural materials, fishing gear) observed in the trawl catch. LT records are a thematic extension beyond HH/HL/CA's focus on fishery target species.\u003c/p>"},{"term":"Tier 1","definition":"\u003cp>The raw, per-haul exchange layer of ICES DATRAS: HH (haul), HL (length frequency), CA (aged individuals), and LT (litter). The primary submission format from national institutes to ICES.\u003c/p>"},{"term":"Survey","definition":"\u003cp>A coordinated research program that conducts regular sampling (e.g., NS-IBTS: North Sea International Bottom Trawl Survey). DATRAS is the archive of submissions from many regional surveys with different spatial/temporal coverage.\u003c/p>"},{"term":"icesVocab","definition":"\u003cp>ICES's centralized web service for controlled vocabularies (code lists and their meanings), keyed by prefixed/unprefixed 'code-types' (e.g. TS_HaulVal, Gear). Cross-domain -- DATRAS is only one of several ICES data collections it serves, so a key existing under a field's name is not proof it's the right one for DATRAS. See AGENTS.md's Key Facts.\u003c/p>"},{"term":"WSDL","definition":"\u003cp>Web Services Definition Language: the machine-readable contract ICES's DATRASWebService.asmx publishes, describing each operation (getHHdata, getCAdata, etc.) and the field types it actually returns. opus's primary source for field types (Working Principle 1), generated directly from the live service rather than separately maintained.\u003c/p>"},{"term":"WoRMS / AphiaID","definition":"\u003cp>World Register of Marine Species: the taxonomic reference ICES validates submitted species codes against. AphiaID is WoRMS's own numeric species identifier -- HL/CA's Valid_Aphia field carries the ICES Datacenter's server-validated AphiaID, which may differ from the submitter's own SpecCode.\u003c/p>"},{"term":"Rule codes (M01/S24/D01/D04)","definition":"\u003cp>Codes from the external data-dict CLI's own three-tier validation (spec/metadata/data), not opus's invention. S-codes check the YAML spec itself (S24: enum values must be quoted strings); M-codes check a column's declared type against its real data (M01: type mismatch, e.g. WSDL int vs. a curated enum's quoted-string values); D-codes check real data against declared constraints (D01: null in a required column; D04: value outside range, or not in the declared enum). Cited throughout this file's \u003ccode>details:\u003c/code> as justification for an accepted, permanent divergence.\u003c/p>"},{"term":"CPUE","definition":"\u003cp>Catch Per Unit Effort: catch quantity normalized by sampling effort (e.g. per hour towed), enabling comparison across hauls of different duration/gear. A Tier 2 derived product (CPUEL, CPUEA) computed from HH/HL, not part of Tier 1's raw exchange data.\u003c/p>"},{"term":"OSPAR","definition":"\u003cp>The Convention for the Protection of the Marine Environment of the North-East Atlantic, and the regional body it establishes. LT's OSPARArea field records which OSPAR region a haul falls within, for marine-litter reporting under that convention.\u003c/p>"},{"term":"SeaDataNet","definition":"\u003cp>A pan-European marine data infrastructure and common-vocabulary network. Some ICES/DATRAS reference concepts (e.g. certain parameter codes) trace back to SeaDataNet-maintained vocabularies rather than being DATRAS-specific inventions.\u003c/p>"}]}</script>

<script>
// Layout with dagre, then a row-aware ordering pass.
//
// Edges are handed over child -> parent: the table holding the foreign key comes
// first and the table it references follows, so a column of lookups sits after
// whatever refers to them.
//
// dagre only sees table-to-table edges, so it orders tables within a rank without
// knowing which column row each edge will land on. Anchoring the endpoints to rows
// afterwards is what makes wires cross: dagre has no way to know which row a wire
// will arrive at. The sweep below re-sorts each rank by where its wires actually
// want to be, which is the same barycentre idea dagre uses for ordering, applied
// at row granularity instead of node granularity.

const MARGIN = 10;
const NODE_SEP = 40;
const RANK_SEP = 76; // wires only have to carry a small marker, not a text label
const LABEL_W = 24;
const LABEL_H = 18;

window.LAYOUT = function layoutWithDagre(dict, metrics, space = 0, was = null) {
  // Which two tables a relationship runs between. The renderer works this out the
  // same way and hands it over, since every top-level name in these two files
  // shares one scope once they are inlined into a page.
  const joins = window.REL_ENDS;

  // The board holds exactly what was measured, and a relationship needs both of
  // its ends on it. A table is its own id, which is the export's own rule: a name
  // is unique within a dictionary.
  const shown = dict.tables.filter((table) => metrics.has(table.name));
  const links = (dict.relationships ?? []).filter((rel) =>
    joins(rel).every((table) => metrics.has(table))
  );

  // Tables in no relationship are left out of the layered layout: they have
  // nothing to rank against, and dagre would otherwise stack them in the first
  // column, where they push the connected schema off the opening screen. Several
  // of these dictionaries have more unattached tables than attached ones.
  const joined = new Set(links.flatMap(joins));
  const attached = shown.filter((table) => joined.has(table.name));
  const loose = shown.filter((table) => !joined.has(table.name));

  const nodes = {};
  const edges = links.map((rel) => ({ rel }));
  let rows = { moved: [] };

  if (attached.length) {
    const g = new dagre.graphlib.Graph({ multigraph: true });
    g.setGraph({ rankdir: "LR", nodesep: NODE_SEP, ranksep: RANK_SEP, marginx: MARGIN, marginy: MARGIN });
    g.setDefaultEdgeLabel(() => ({}));

    for (const table of attached) {
      const m = metrics.get(table.name);
      g.setNode(table.name, { width: m.width, height: m.height });
    }

    // multigraph + a name per edge: otters is joined to measurements twice, and
    // without the name the second join would overwrite the first.
    for (const [i, rel] of links.entries()) {
      const label = { width: LABEL_W, height: LABEL_H, labelpos: "c", rel };
      g.setEdge(...joins(rel), label, `rel${i}`);
    }

    dagre.layout(g);

    // dagre centres each node in its rank; keep the centre so ranks can still be
    // identified after the boxes are left-aligned within them.
    for (const id of g.nodes()) {
      const n = g.node(id);
      nodes[id] = { x: n.x - n.width / 2, y: n.y - n.height / 2, cx: n.x, width: n.width, height: n.height };
    }
    leftAlignRanks(nodes);

    // dagre's own waypoints are dropped: the renderer routes each wire from the
    // final box positions, since these get left-aligned, reordered and slid about
    // after dagre has had its say.
    rows = orderByRow(metrics, nodes, edges, was);
    normalize(nodes);
  }

  let width = 0;
  let height = 0;
  for (const n of Object.values(nodes)) {
    width = Math.max(width, n.x + n.width + MARGIN);
    height = Math.max(height, n.y + n.height + MARGIN);
  }

  // Then the unattached tables, wrapped across the full width below everything
  // else rather than stacked in one tall column.
  const grid = gridLoose(loose, metrics, Math.max(width, space - MARGIN), height ? height + RANK_SEP : MARGIN);
  Object.assign(nodes, grid.nodes);
  width = Math.max(width, grid.width);
  height = Math.max(height, grid.height);

  const notes = [
    rows.moved.length
      ? `row ordering moved ${rows.moved.join(" and ")}`
      : "row ordering left dagre's order alone",
  ];
  if (loose.length) notes.push(`${loose.length} unattached below`);
  const off = dict.tables.length - shown.length;
  if (off) notes.unshift(`${off} of ${dict.tables.length} tables off the board`);

  return {
    engine: `dagre ${dagre.version ?? "3.1.0"}`,
    width,
    height,
    nodes,
    edges,
    note: notes.join(" · "),
  };
};

// Unattached tables flow left to right and wrap, filling as many columns as the
// board is wide.
function gridLoose(loose, metrics, maxWidth, top) {
  const nodes = {};
  let x = MARGIN;
  let y = top;
  let rowHeight = 0;
  let width = 0;
  for (const table of loose) {
    const m = metrics.get(table.name);
    if (x > MARGIN && x + m.width + MARGIN > maxWidth) {
      x = MARGIN;
      y += rowHeight + NODE_SEP;
      rowHeight = 0;
    }
    nodes[table.name] = { x, y, cx: x + m.width / 2, width: m.width, height: m.height };
    x += m.width + NODE_SEP;
    rowHeight = Math.max(rowHeight, m.height);
    width = Math.max(width, x - NODE_SEP + MARGIN);
  }
  return { nodes, width, height: loose.length ? y + rowHeight + MARGIN : top };
}

// Where a row sits inside its box, unscrolled. Shared with the renderer so the
// layout and the drawing agree on what "the otter_no row" means.
const rowAt = (metrics, table, column) => window.ROW_ANCHOR(metrics.get(table), column);

// Re-orders the tables within each rank so the wires, once anchored to rows,
// cross as little as possible.
//
// A plain barycentre sweep is not enough on its own here: otters is joined to
// measurements twice, and the second wire lands on `pup_number`, which is
// scrolled out of sight and so anchors to the bottom of the box. Averaging the
// two pulls otters below locations even though that makes the wires cross. So
// the barycentre only seeds an order, and adjacent swaps are then accepted only
// when they actually reduce the crossing count.
function orderByRow(metrics, nodes, edges, was) {
  const startY = Object.fromEntries(Object.entries(nodes).map(([id, n]) => [id, n.y]));

  // Every wire, from both ends: "my row, their table, their row".
  const wires = new Map();
  const add = (id, mine, other, theirs) => {
    if (!wires.has(id)) wires.set(id, []);
    wires.get(id).push({ mine, other, theirs });
  };
  for (const { rel } of edges) {
    for (const { left, right } of rel.pairs) {
      add(left.table, left.column, right.table, right.column);
      add(right.table, right.column, left.table, left.column);
    }
  }

  const ranks = rankGroups(nodes);
  const tops = new Map();
  for (const [x, ids] of ranks) {
    ids.sort((a, b) => nodes[a].y - nodes[b].y);
    tops.set(x, Math.min(...ids.map((id) => nodes[id].y)));
  }

  // Stack a rank from its original top, in its current order.
  const repack = (x) => {
    let y = tops.get(x);
    for (const id of ranks.get(x)) {
      nodes[id].y = y;
      y += nodes[id].height + NODE_SEP;
    }
  };

  // Wires as straight row-to-row segments, which is what the eye follows and
  // what the renderer will draw once the endpoints are anchored.
  const segments = () =>
    edges.flatMap(({ rel }) =>
      rel.pairs.map(({ left, right }) => ({
        a: {
          x: nodes[left.table].x + nodes[left.table].width,
          y: nodes[left.table].y + rowAt(metrics, left.table, left.column),
        },
        b: {
          x: nodes[right.table].x,
          y: nodes[right.table].y + rowAt(metrics, right.table, right.column),
        },
      }))
    );

  const side = (p, q, r) => Math.sign((q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x));
  const same = (p, q) => Math.abs(p.x - q.x) < 1 && Math.abs(p.y - q.y) < 1;
  const crossings = () => {
    const segs = segments();
    let n = 0;
    for (let i = 0; i < segs.length; i++) {
      for (let j = i + 1; j < segs.length; j++) {
        const s = segs[i];
        const t = segs[j];
        // Wires leaving the same row fan out from one point; not a crossing.
        if (same(s.a, t.a) || same(s.b, t.b) || same(s.a, t.b) || same(s.b, t.a)) continue;
        if (side(s.a, s.b, t.a) !== side(s.a, s.b, t.b) && side(t.a, t.b, s.a) !== side(t.a, t.b, s.b)) n++;
      }
    }
    return n;
  };

  // Seed: barycentre sweeps, alternating direction so ordering information
  // travels both ways through the graph.
  const wanted = (id) => {
    const rankX = Math.round(nodes[id].cx);
    const pull = (wires.get(id) ?? [])
      .filter(({ other }) => Math.round(nodes[other].cx) !== rankX)
      .map(({ mine, other, theirs }) =>
        nodes[other].y + rowAt(metrics, other, theirs) - rowAt(metrics, id, mine)
      );
    return pull.length ? pull.reduce((a, b) => a + b, 0) / pull.length : nodes[id].y;
  };

  const byX = [...ranks.keys()].sort((a, b) => a - b);
  for (let pass = 0; pass < 4; pass++) {
    for (const x of pass % 2 ? [...byX].reverse() : byX) {
      if (ranks.get(x).length < 2) continue;
      const goal = new Map(ranks.get(x).map((id) => [id, wanted(id)]));
      ranks.get(x).sort((a, b) => goal.get(a) - goal.get(b));
      repack(x);
    }
  }

  // A rank that was already on the board keeps the order it had, so long as that
  // costs no more crossings than the barycentre order just found. Toggling one
  // table on or off otherwise reshuffles the ones that were there all along, and
  // following a relationship somewhere is much harder if everything else moves
  // too. Tables new to the rank sort by where the sweep above wanted them, so
  // they land among the old ones rather than all at one end.
  if (was) {
    for (const x of byX) {
      const ids = ranks.get(x);
      if (ids.length < 2 || !ids.some((id) => was[id])) continue;
      const before = [...ids];
      const cost = crossings();
      ids.sort((a, b) => (was[a]?.y ?? nodes[a].y) - (was[b]?.y ?? nodes[b].y));
      repack(x);
      if (crossings() > cost) {
        ids.splice(0, ids.length, ...before);
        repack(x);
      }
    }
  }

  // Then hill-climb on adjacent swaps, keeping only what helps. Searching every
  // permutation of a rank instead was tried and found nothing better on any of
  // the dictionaries here: what crossings remain come from wires that span two
  // ranks, which no ordering within a rank can undo.
  let best = crossings();
  for (let round = 0; round < 8 && best > 0; round++) {
    let improved = false;
    for (const x of byX) {
      const ids = ranks.get(x);
      for (let i = 0; i + 1 < ids.length; i++) {
        [ids[i], ids[i + 1]] = [ids[i + 1], ids[i]];
        repack(x);
        const now = crossings();
        if (now < best) {
          best = now;
          improved = true;
        } else {
          [ids[i], ids[i + 1]] = [ids[i + 1], ids[i]];
          repack(x);
        }
      }
    }
    if (!improved) break;
  }

  // Finally, a column holding a single table is slid to where its wires want it.
  // Everything above reorders tables *within* a column, so a column of one is
  // never touched at all and keeps whatever y dagre gave it — which is why
  // `orderrows` sat 300px below the level its two wires asked for. A lone table
  // has nothing to collide with, so the move is free. Sliding wider columns the
  // same way was tried and rejected: it flattens wires but adds crossings, and
  // grows the board, since a column's tables want to be in several places at once.
  for (let pass = 0; pass < 4; pass++) {
    for (const x of byX) {
      const ids = ranks.get(x);
      if (ids.length !== 1) continue;
      const deltas = ids.flatMap((id) =>
        (wires.get(id) ?? [])
          .filter(({ other }) => Math.round(nodes[other].cx) !== x)
          .map(({ mine, other, theirs }) =>
            nodes[other].y + rowAt(metrics, other, theirs) - rowAt(metrics, id, mine) - nodes[id].y
          )
      );
      if (!deltas.length) continue;
      const shift = deltas.reduce((a, b) => a + b, 0) / deltas.length;
      for (const id of ids) nodes[id].y += shift;
      tops.set(x, tops.get(x) + shift);
    }
  }

  const shift = Object.fromEntries(Object.keys(nodes).map((id) => [id, nodes[id].y - startY[id]]));
  return { moved: Object.keys(shift).filter((id) => Math.abs(shift[id]) > 1).sort(), crossings: best };
}

// rankdir LR puts one rank per column, so tables sharing a centre x share a rank.
function rankGroups(nodes) {
  const ranks = new Map();
  for (const [id, n] of Object.entries(nodes)) {
    const key = Math.round(n.cx);
    if (!ranks.has(key)) ranks.set(key, []);
    ranks.get(key).push(id);
  }
  return ranks;
}

// Tables in a column read as a column when their left edges line up. The widest
// table already defines the column's left edge, so aligning to it stays inside
// the space dagre set aside for the rank.
function leftAlignRanks(nodes) {
  for (const ids of rankGroups(nodes).values()) {
    const left = Math.min(...ids.map((id) => nodes[id].x));
    for (const id of ids) nodes[id].x = left;
  }
}

// Repacking can push the diagram off the top or left edge; pull it back.
function normalize(nodes) {
  const xs = Object.values(nodes).map((n) => n.x);
  const ys = Object.values(nodes).map((n) => n.y);
  const dx = MARGIN - Math.min(...xs);
  const dy = MARGIN - Math.min(...ys);
  if (!dx && !dy) return;
  for (const n of Object.values(nodes)) {
    n.x += dx;
    n.y += dy;
  }
}

<script>
// Plumbing every page inlines: DOM helpers, the tooltip, and one Escape
// dispatcher. Everything is declared at the top level of a classic script, so
// the bindings are visible to the scripts that follow.
//
// Nothing here reads a page's embedded document, so both the dictionary page
// and the validation report page can carry it as is. The dictionary's own
// plumbing — the glossary and the prose renderer that annotates it — is in
// dict.js.

const el = (tag, cls, txt) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (txt != null) node.textContent = txt;
  return node;
};

// For the few places markup is still assembled as a string: a table or column
// name containing markup would otherwise be parsed as HTML.
const esc = (s) =>
  String(s ?? "").replace(
    /[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]
  );

/* Text with the query occurrence wrapped in <mark>, as a DOM node. The prose
   annotator in dict.js builds real DOM; the vnode twin for component use is
   `Marked` in components.js. */
function marked(text, ql, cls) {
  const s = String(text == null ? "" : text);
  const span = el("span", cls);
  const i = ql ? s.toLowerCase().indexOf(ql) : -1;
  if (i < 0) { span.textContent = s; return span; }
  span.appendChild(document.createTextNode(s.slice(0, i)));
  span.appendChild(el("mark", null, s.slice(i, i + ql.length)));
  span.appendChild(document.createTextNode(s.slice(i + ql.length)));
  return span;
}

/* ---- Tooltip ---------------------------------------------------------------
   One #tip element for the whole page, with two placement modes: showTip +
   moveTip follow the cursor (wires, rows, histogram bars); anchorTip centres
   the tip under an element (glossary terms). Content is a DOM node or plain
   text, never an HTML string. */

const tip = el("div");
tip.id = "tip";
tip.hidden = true;
document.body.appendChild(tip);

function showTip(content, event) {
  if (!content) return hideTip();
  tip.replaceChildren(content);
  tip.hidden = false;
  if (event) moveTip(event);
}

function moveTip(event) {
  const pad = 7;
  const box = tip.getBoundingClientRect();
  const x = Math.min(event.clientX + pad, window.innerWidth - box.width - 8);
  const y = Math.min(event.clientY + pad, window.innerHeight - box.height - 8);
  tip.style.left = `${Math.max(8, x)}px`;
  tip.style.top = `${Math.max(8, y)}px`;
}

/* Centred below `at`, or above it when there is no room below. */
function anchorTip(content, at) {
  tip.replaceChildren(content);
  tip.hidden = false;
  const r = at.getBoundingClientRect();
  const w = tip.offsetWidth;
  const h = tip.offsetHeight;
  const x = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, window.innerWidth - w - 8));
  const y = r.bottom + h + 8 > window.innerHeight ? r.top - h - 8 : r.bottom + 8;
  tip.style.left = `${x}px`;
  tip.style.top = `${Math.max(8, y)}px`;
}

function hideTip() {
  tip.hidden = true;
}

/* A heading naming the thing in code face, with an optional aside. */
function tipHead(codeText, subText) {
  const head = el("div", "tip-head");
  head.appendChild(el("code", null, codeText));
  if (subText) head.appendChild(el("span", "tip-sub", subText));
  return head;
}

/* ---- Escape ------------------------------------------------------------
   One dispatcher for the whole page. Handlers register with a priority and run
   in that order until one consumes the key, lowest first: 10 an overlay, 20
   leaving the current page, 30 a focused search box, 40 a view's own state. */

const escapeActions = [];

// `action` returns true when it consumed the key. Returns an unregister
// function, so a component effect can register for only as long as it lives.
function onEscape(priority, action) {
  const entry = { priority, action };
  escapeActions.push(entry);
  escapeActions.sort((a, b) => a.priority - b.priority);
  return () => {
    const i = escapeActions.indexOf(entry);
    if (i >= 0) escapeActions.splice(i, 1);
  };
}

document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;
  for (const { action } of [...escapeActions]) {
    if (action(event)) {
      event.preventDefault();
      return;
    }
  }
});

<script>
// The dictionary page's own plumbing: the embedded dictionary, the glossary,
// and the prose renderer that annotates prose with it. Loaded only by
// index.html, which is the only page that has a dictionary to read.
//
// Depends on shared.js for `el`, `marked` and the tooltip.

/* Rebindable rather than constant so `render --live` can swap a rebuilt
   dictionary in without reloading the page; everything derived from it is
   rebuilt by `loadDict` in the same breath. */
let DICT, glossItems, GLOSS_DEFS, GLOSS_RE;

function loadDict(next) {
  DICT = next;
  window.DICT = next;
  glossItems = (DICT.glossary || []).map((g) => [g.term, g.definition]);
  GLOSS_DEFS = {};
  glossItems.forEach(([term, def]) => {
    GLOSS_DEFS[term.toLowerCase()] = String(def).replace(/\s+/g, " ").trim();
  });
  /* Longest first so "size bucket" wins over "size", "HIDI lead" over "lead". */
  const terms = glossItems.map(([term]) => term).sort((a, b) => b.length - a.length);
  GLOSS_RE = terms.length
    ? new RegExp("\\b(" + terms.map(termPattern).join("|") + ")\\b", "g")
    : null;
}

const quoteRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

/* Much a glossary term in prose:

   * lower case terms are an ordinary words/phrases, and should be matched
     regardless of capitilisation or pluralisation (approximately)
   * mixed case terms (e.g. PWS) only match exactly
 */
function termPattern(term) {
  if (term !== term.toLowerCase()) return quoteRe(term);
  const core = [...term]
    .map((ch) => {
      const upper = ch.toUpperCase();
      return upper === ch || upper.length !== 1 ? quoteRe(ch) : `[${quoteRe(ch)}${quoteRe(upper)}]`;
    })
    .join("");
  return term.length > 5 ? core + "[a-z]{0,3}" : core;
}

/* The glossary term behind a regex match. */
function baseTerm(match) {
  const lower = match.toLowerCase();
  for (let cut = 0; cut <= 3; cut++) {
    const candidate = lower.slice(0, lower.length - cut);
    if (GLOSS_DEFS[candidate] !== undefined) return candidate;
  }
  return lower;
}

loadDict(JSON.parse(document.getElementById("dict").textContent));

/* ---- Glossary annotations ------------------------------------------------
   Any glossary term appearing in prose gets a dotted underline and a tooltip.
   Matching is on word boundaries, so identifiers (account_tiles_data,
   active_arr) and longer words (percentile) are left alone. The lookup and
   the pattern are built by `loadDict` above. -------------------------------- */

/* One text run -> glossary terms wrapped (unless literal) and search hits marked. */
function annotate(s, hl, literal) {
  const frag = document.createDocumentFragment();
  if (literal || !GLOSS_RE) { frag.appendChild(marked(s, hl)); return frag; }
  let last = 0, mm;
  GLOSS_RE.lastIndex = 0;
  while ((mm = GLOSS_RE.exec(s)) !== null) {
    if (mm.index > last) frag.appendChild(marked(s.slice(last, mm.index), hl));
    const term = el("abbr", "gterm");
    term.dataset.term = mm[0];
    term.dataset.def = GLOSS_DEFS[baseTerm(mm[0])] || "";
    term.appendChild(marked(mm[0], hl));
    frag.appendChild(term);
    last = mm.index + mm[0].length;
  }
  if (last < s.length) frag.appendChild(marked(s.slice(last), hl));
  return frag;
}

/* Prose fields — description, details, glossary definitions — arrive from
   the export already rendered from Markdown to HTML (with any raw HTML in
   the source escaped). Placing it is innerHTML; then every text run is
   decorated with glossary underlines and search marks. Code spans and links
   are left literal — no glossary underlines inside them.

   This builds real DOM rather than vnodes so the annotation walk can use the
   parsed tree; the `Prose` component in components.js mounts it via a ref. */
function prose(html, hl) {
  const span = el("span", "prose");
  const s = String(html == null ? "" : html).trim();
  if (!s) return span;
  span.innerHTML = s;
  const walker = document.createTreeWalker(span, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach((node) => {
    const literal = !!(node.parentElement && node.parentElement.closest("code, a"));
    node.parentNode.replaceChild(annotate(node.nodeValue, hl, literal), node);
  });

/* An HTML prose field as its text alone, for search matching. */
const plainScratch = el("div");
function plain(html) {
  plainScratch.innerHTML = String(html == null ? "" : html);
  const text = plainScratch.textContent;
  plainScratch.textContent = "";
  return text;
}

/* A paragraph of the export's rendered prose, for the shared tooltip. */
function tipProse(text) {
  const p = el("p");
  p.appendChild(prose(text));
  return p;
}

/* What a join is for and the key it joins on. One chip can stand for more than
   one relationship — two tables joined two different ways — so each is
   reported in turn. The cardinality is the one the dictionary declared, since
   that is the orientation the join text reads in. */
function joinTip(rels) {
  const box = el("div");
  for (const rel of rels) {
    box.appendChild(tipHead(rel.join, rel.declared_cardinality));
    if (rel.description) box.appendChild(tipProse(rel.description));
    /* a chip is the only place a relationship appears, so its `todo` has no
       icon of its own to hover and rides along here instead */
    if (rel.todo) box.appendChild(todoNote(rel.todo));
  }
  return box;
}

/* A `todo` inside a tooltip that is already about something else, labelled so
   it doesn't read as part of the description above it. */
function todoNote(source) {
  const box = el("div", "tip-todo tip-todo-note");
  box.appendChild(el("span", "tip-todo-lbl", "todo"));
  box.appendChild(prose(source));
  return box;
}

/* What a `todo` records. The note arrives as rendered HTML and is usually a
   list of tasks rather than a sentence, so it is placed as prose rather than
   squeezed onto the head's line. */
function todoTip(source) {
  const box = el("div", "tip-todo");
  box.appendChild(tipHead("todo", "unresolved"));
  box.appendChild(prose(source));
  return box;
}

/* Glossary terms in prose get their definition in the shared tooltip,
   anchored under the term, wherever the prose was placed. The definition
   arrives as rendered HTML. */
document.addEventListener("mouseover", (e) => {
  const t = e.target.closest && e.target.closest("abbr.gterm");
  if (!t) return;
  const content = el("span");
  content.appendChild(el("span", "gt-term", t.dataset.term + " "));
  if (t.dataset.def) {
    const def = el("span", "gt-def");
    def.innerHTML = t.dataset.def;
    content.appendChild(def);
  }
  anchorTip(content, t);
});
document.addEventListener("mouseout", (e) => {
  if (e.target.closest && e.target.closest("abbr.gterm")) hideTip();
});

   table, a column. The note itself can run to several tasks, so it opens in the
   shared tooltip, anchored under the icon, rather than taking a line of its own
   on a page that is mostly settled fact. Focusable so the note is reachable
   without a pointer. */
function TodoFlag({ source }) {
  const ref = useRef(null);
  if (!source) return null;
  const show = () => anchorTip(todoTip(source), ref.current);
  return html`<span class="todo-flag" ref=${ref} tabIndex="0" role="note"
    aria-label="Unresolved todo"
    onMouseEnter=${show} onMouseLeave=${hideTip}
    onFocus=${show} onBlur=${hideTip}
    dangerouslySetInnerHTML=${{ __html: ICONS.todo }} />`;
}

/* "name: label" — the name keeps the mono face of its children; the label is
   plain body text beside it. */
function NameLabel({ label, children }) {
  if (!label) return children;
  return html`<span>${children}<span class="name-label">: ${label}</span></span>`;
}

/* `details` is always tucked behind a disclosure rather than shown inline.
   A search hit inside it forces the expando open, so a match is never hidden. */
function DetailsBlock({ source, hl }) {
  const open = !!(hl && plain(source).toLowerCase().includes(hl));
  return html`<details class="xdetails" open=${open}>
    <summary>Details</summary>
    <div class="xdetails-body"><${Prose} source=${source} hl=${hl} /></div>
  </details>`;
}

/* ---- metadata lines ------------------------------------------------------ */

/* A run of values on a meta line. An enum's allowed values, the constraints the
   column is under, the examples the dictionary gives, and the values sampled
   from the data are all facts rather than prose, so each is set off in its own
   chip; the page's text face keeps them readable, which a code face would not
   for a long label. */
/* Long values would swamp the line, so a chip shows at most this many
   characters; a cut value expands in place on click (the full text can be far
   too long for a tooltip). */
const VAL_MAX = 70;

function Chip({ value, hl }) {
  const s = String(value);
  const cut = s.length > VAL_MAX;
  const [open, setOpen] = useState(false);
  const shown = cut && !open ? s.slice(0, VAL_MAX - 1) + "…" : s;
  if (!cut) return html`<span class="val"><${Marked} text=${s} ql=${hl} /></span>`;
  return html`<button type="button" class="val cut ${open ? "open" : ""}"
    title=${open ? "Click to collapse" : "Click to see the full value"}
    onClick=${() => setOpen(!open)}><${Marked} text=${shown} ql=${hl} /></button>`;
}

function ValueList({ items, hl }) {
  return items.map((v, i) => html`${i ? " " : ""}<${Chip} value=${v} hl=${hl} />`);
}

function MetaLine({ label, items, hl }) {
  return html`<div class="col-meta">
    ${label && html`<span class="lbl">${label}:</span>`}
    <${ValueList} items=${items} hl=${hl} />
  </div>`;
}

/* A meta line carrying a single value — a range, a count, a unit. It is a value
   like any other on these lines, so it wears the same chip. */
function MetaText({ label, text }) {
  return html`<div class="col-meta">
    <span class="lbl">${label}:</span><span class="val">${text}</span>
  </div>`;
}

/* An enum written as a map gives every value a label, which is a definition
   list: what may appear on the left, what it means on the right. */
function ValueDefs({ values, labels, hl }) {
  return html`<div class="col-meta">
    <span class="lbl">values:</span>
    <dl class="val-defs">
      ${values.map((v) => html`
        <dt><${Chip} value=${v} hl=${hl} /></dt>
        <dd><${Marked} text=${labels[v] ?? ""} ql=${hl} /></dd>`)}
    </dl>
  </div>`;
}

/* How many sampled values a column shows before you ask for the rest. */
const SAMPLES_SHOWN = 6;

/* Values seen in the data, read like examples. The profile carries far more
   than fits on one line, so the tail is revealed on demand. */
function SampleValues({ values, hl }) {
  const [all, setAll] = useState(false);
  const shown = all ? values : values.slice(0, SAMPLES_SHOWN);
  return html`<div class="col-meta">
    <span class="lbl">sample values:</span>
    <${ValueList} items=${shown} hl=${hl} />
    ${values.length > SAMPLES_SHOWN &&
      html`<button type="button" class="more-less" onClick=${() => setAll(!all)}>
        ${all ? "less" : "more"}
      </button>`}
  </div>`;
}

/* ---- formatting ---------------------------------------------------------- */

function fmtNum(x) {
