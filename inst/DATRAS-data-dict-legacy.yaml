    range: [1, 12]
    details: >-
      Retyped from enum to number(ordinal) 2026-08-29, mirroring the same change in
      inst/DATRAS-data-dict.yaml, for the same reason as Quarter above. The former
      values: map ('1' -> January) is a calendar convention, not DATRAS-specific
      knowledge, so dropping it loses nothing. icesVocab's TS_Month also resolves
      this field. Against the real archive: HH uses all 12 codes, LT 11 of 12.
    description: >-
      Sampling month, as part of the calendar date.
  - name: Day
    type: number(ordinal)
    range:
    - 1
    - 31
    constraints:
    - required
    description: >-
      Sampling day, as part of the calendar date
  - name: TimeShot
    type: string
    examples:
    - '0000'
    - '0600'
    - '1159'
    - '1759'
    - '2359'
    details: >-
      1,440 distinct values, always populated (145,958/145,958). Field's
      own description implies a fixed 4-digit HHMM ('E.g. 10:15=1015'); real values
      are zero-padded to 4 digits (e.g. '0730', not '730'), confirmed against
      the full archive: 100% 4-char, 0 true nulls in either table. Only present in
      HH and LT, same as {StatisticalRectangle or StatRec} below.
    description: >-
      Start time (GMT) of haul (HHMM), 4 digits. E.g. 10:15=1015
  - name: HaulDur
    type: number(quantity)
    units: min
    range:
    - 1
    - 120
    details: >-
      A haul cannot take zero or negative time; 217 rows recorded as exactly
      0 and 2 as negative (-514, -238) are excluded, most likely unrecorded/placeholder
      rather than a genuine instantaneous haul. Upper bound set at 2 hours: DATRAS
      carries no passive/soak gear, so a longer tow is highly suspect -- observed
      values run as high as 1470 min with no repeating marker pattern (i.e. not a
      clean sentinel, just unreliable).
    description: >-
      Haul duration in minutes. Start time is the moment when the gear
      settles at the bottom at the stated towing speed. Stop is defined as the start
      of hauling of the gear.
  - name: StatRec
    type: string
    examples:
    - '37F8'
    - '35F5'
    - '36F7'
    - '32F3'
    - '36F6'
    details: >-
      Real ICES statistical rectangle codes (0.5 deg lat x 1 deg lon grid),
      not a fixed enum given the size of the grid -- independently corroborated by
      ICES's own field-description spreadsheet, which describes this field via the
      same geometric grid rule rather than a code list. Only present in HH and LT
      -- consistent with LT's assessment output joining in a set of HH-style columns.
      Of 145,958 HH rows (685 distinct values), -9 accounts for exactly 12,235, not
      a null.
    description: >-
      Intended ICES statistical area rectangle (0.5 degrees latitude, 1
      degree longitude)
  - name: Depth
    type: number(quantity)
    units: m
    range:
    - 1
    - 3098
    details: >-
      Byte-for-byte identical to this table's own BottomDepth across all 75,310
      rows (100% populated in both, 0 differences, 0 one-sided nulls) -- a known ICES-side
      redundancy, not an opus/obus naming quirk (see Issue 6 in the issues report).
      Given the same type/units/range as BottomDepth here rather than re-derived independently,
      since it is BottomDepth.
  - name: HaulVal
    type: enum
    values:
      A: Additional valid stations not used for index calculations
      C: Calibrated (BITS only)
      I: Invalid haul
      M: Pelagic Midwater Trawl (BITS only)
      'N': No oxygen (BITS only)
      S: Standard haul
      V: Valid haul
    details: >-
      Near-total copy of HH's own HaulVal for the same haul: only 21 of 72,483
      matched non-null rows differ (0.03%), a small A<->I swap, negligible. icesVocab's
      TS_HaulVal resolves this as a controlled 7-code haul-validity list. Against
      the real archive: HH uses 6 of 7 codes, LT 4 of 7; 0 real values fall outside
      the vocab in either table.
    description: >-
      Haul validity code
  - name: DataType
    type: enum
    values:
      '-9': Invalid hauls
      C: Data calculated as CPUE (number per hour)
      P: Pseudocategory sampling
      R: Data by haul
      S: Sub sampled data
    details: >-
      icesVocab's TS_DataType gives -9 its own specific meaning: 'Invalid
      hauls' -- not a generic missing-value placeholder like most of this field's
      sibling enums (part of a full sweep of every enum field with -9 as a declared
      code; see articles/technical-notes.qmd). Low prevalence in both tables that
      carry it (HH: 39/145,958 rows, 0.03%; LT: 20/75,310, 0.03%).
    description: >-
      Specification of the data aggregation in the HL record. C: CPUE
      (per hour) data; TotalNo and CatCatchWgt are adjusted per hour trawling. R (raw),
      S (subsample of the entire catch): data as recorded during the cruise, and P
      (pseudocategory sampling, only used by Scotland).
  - name: Netopening
    type: number(quantity)
    units: m
    range:
    - 0.0
    - 76.0
    details: >-
      -9 is the ICES-wide sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 75,609/145,958 rows (51.80%), LT 24,717/75,310 rows (32.82%), 0 true nulls
      in either table -- the modal value in both tables, not the exception.
    description: >-
      Mean value in metres of vertical net opening measurements. For details
      see the survey manual.
  - name: Rigging
    type: enum
    values:
      '-9': Not provided
      BC: Bobbin, tickler, chain groundrope
      BM: Bobbin, mixed metal-nylon groundrope
      BN: Bobbin, nylon groundrope
      D: Tooth tickler
      F: Flip-up rope
      FB: Flip-up rope and chain mat, poly prop net with blinder
      FM: Flip-up rope and chain mat, standard net with blinder
      FT: Flip-up rope and tickler chains
      FW: Flip-up rope and chain mat, poly prop net without blinder
      M: Chain mat
      S: Sumwing
      T: Tickler chains
      TS: Tickler and sumwing
      TT: Tickler
    details: >-
      Mostly a copy of HH's own Rigging for the same haul, but 3,419 of 72,483
      matched non-null rows (4.72%) diverge -- almost entirely a near-symmetric swap
      between just two codes (FB<->FW: 1,978 and 1,441 rows respectively), consistent
      with independent recording variance between HH's haul-time entry and LT's
      own litter-assessment-time entry, not a one-directional error. icesVocab's
      TS_Rigging resolves this as a controlled 15-code list. Against the real archive:
      HH uses 13 of 15 codes, LT 9 of 15; 0 real values fall outside the vocab in
      either table.
    description: >-
      The way the gear is rigged. Rigging depends on survey, see survey
      manuals for further details.
  - name: Tickler
    type: enum
    values:
      '-9': No ticklers are allowed
      '0': Zero ticklers
      '1': One tickler
      '10': Ten ticklers
      '11': Eleven ticklers
      '12': Twelve ticklers
      '13': Thirteen ticklers
      '14': Fourteen ticklers
      '15': Fifteen ticklers
      '16': Sixteen ticklers
      '17': Seventeen ticklers
      '18': Eighteen ticklers
      '19': Nineteen ticklers
      '2': Two ticklers
      '20': Twenty ticklers
      '21': Twenty one ticklers
      '22': Twenty two ticklers
      '23': Twenty three ticklers
      '24': Twenty four ticklers
      '25': Twenty five ticklers
      '26': Twenty six ticklers
      '27': Twenty seven ticklers
      '28': Twenty eight ticklers
      '29': Twenty nine ticklers
      '3': Three ticklers
      '30': Thirty ticklers
      '4': Four ticklers
      '5': Five ticklers
      '6': Six ticklers
      '7': Seven ticklers
      '8': Eight ticklers
      '9': Nine ticklers
    details: >-
      icesVocab's TS_Tickler resolves this as a controlled tickler-chain
      count code list (32 active codes: 0-30, plus a '-9'/'no ticklers allowed'
      sentinel) -- not an open numeric quantity. Against the real archive: HH shows
      10 distinct values (-9, 0, 1, 4, 5, 8, 10, 20, 21, 27) and LT 4 (-9, 0, 5, 8,
      a subset of HH's own); -9 is the dominant value in both (78% of HH, 41% of
      LT), not absent -- zero gaps against the vocab's 32 codes, either direction.
      Live WSDL (getHHdata) declares this field int, not string -- an accepted, permanent
      M01 divergence between the WSDL-driven archive and this curated enum spec (see
      Valid_Aphia's own note for the general pattern), not a bug to fix by changing
      either side.
    description: >-
      Amount of ticklers connected to the gear.
  - name: Warplngt
    type: number(quantity)
    units: m
    range:
    - 0
    - 4065
    details: >-
      -9 is the ICES-wide sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 53,727/145,958 rows (36.81%), LT 759/75,310 rows (1.01%), 0 true nulls in
      either table.
    description: >-
      Length of warp in metres. Defined by fishing depth. Warp/depth ratio
      is depends on survey, for further details see survey manuals.
  - name: Warpdia
    type: number(quantity)
    units: mm
    range:
    - 16
    - 30
    details: >-
      A dense, well-populated cluster runs 16-21mm and 27-30mm; isolated single-occurrence
      values below (1mm x2, 5mm x10, 12mm) and above (39, 56, 85, 88mm) sit apart
      from it with no comparable support and are treated as data-entry errors, excluded
      here. -9 is the ICES-wide sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 85,420/145,958 rows (58.52%), LT 28,755/75,310 rows (38.18%), 0 true nulls
      in either table -- the modal value in both tables, not the exception (already
      excluded by the range above, [16,30]).
    description: >-
      Warp diametre in millimetres.
  - name: WarpDen
    type: number(quantity)
    units: kg/m
    range:
    - 0
    - 26
    details: >-
      -9 is the ICES-wide sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 140,298/145,958 rows (96.12%), LT 45,440/75,310 rows (60.34%), 0 true nulls
      in either table -- the modal value in both tables, not the exception.
    description: >-
      Warp weight in kg per linear meter of warp. See survey manuals for
      more information.
  - name: DoorSurface
    type: number(quantity)
    units: m2
    range:
    - 0.0
    - 20.2
    details: >-
      -9 is the ICES-wide sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 78,096/145,958 rows (53.51%), LT 27,021/75,310 rows (35.88%), 0 true nulls
      in either table.
    description: >-
      Door surface area in square metres.
  - name: DoorWgt
    type: number(quantity)
    units: kg
    range:
    - 0
    - 1720
    details: >-
      -9 is the ICES-wide sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 77,794/145,958 rows (53.30%), LT 26,904/75,310 rows (35.72%), 0 true nulls
      in either table.
    description: >-
      Door weight in kilograms.
  - name: TowDir
    type: number(quantity)
    units: degrees
    range:
    - 0
    - 360
    details: >-
      999 (3 rows) reads as an undocumented out-of-domain 'not recorded'
      marker, the same pattern confirmed for WindDir below. A further cluster -- 450
      deg (62 rows), 520(5), 460(5), 540(3), 510, 564, 702 (1 each) -- divided by
      10 becomes ordinary bearings (45.0, 52.0, 46.0, 54.0, 51.0, 56.4, 70.2 deg).
      Both groups are outside the documented 0-360 domain and excluded here. -9 is
      the ICES-wide sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 50,625/145,958 rows (34.68%), LT 2,384/75,310 rows (3.17%), 0 true nulls
      in either table -- already excluded by the range above.
    todo: Confirm the divide-by-10 cluster (450/520/460/540/510/564/702) is a genuine
      data-entry pattern by correlating with Country/Survey -- same class of check
      already confirmed for SwellHeight via its WindSpeed co-parameter.
    description: >-
      Direction of towing in degrees. 360=direction from south to north.
  - name: GroundSpeed
    type: number(quantity)
    units: knots
    range:
    - 0.0
    - 10.0
    details: >-
      Ceiling is a domain judgment (real trawling ground speed), not an observed
      cluster boundary -- observed values run 10.8 up to a 99.9 marker with no clean
      gap, all excluded. -9 is the ICES-wide sanctioned 'no information' convention
      (data-raw/build_field_description_snapshot.R): HH 56,805/145,958 rows (38.92%),
      LT 10,224/75,310 rows (13.58%), 0 true nulls in either table -- already excluded
      by the range above.
    description: >-
      Ground speed of towing in knots. Recommended speed depends on survey,
      see survey manuals for more details
  - name: SpeedWater
    type: number(quantity)
    units: knots
    range:
    - 0.0
    - 22.0
    details: >-
      -9 is the ICES-wide sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 131,220/145,958 rows (89.90%), LT 41,502/75,310 rows (55.11%), 0 true nulls
      in either table -- the modal value in both tables, not the exception.
    description: >-
      Trawl speed on water in knots.
  - name: WindDir
    type: number(quantity)
    units: degrees
    range:
    - -1
    - 360
    details: >-
      -1 is documented ('varying direction'). 999 (57 rows) reads as an
      undocumented out-of-domain 'not recorded' marker; a handful of further single-occurrence
      values just above 360 (711, 504, 420, 365, 361) are also excluded. -9 is ALSO
      present and is the ICES-wide sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 40,431/145,958 rows (27.70%), LT 5,111/75,310 rows (6.79%), 0 true nulls
      in either table -- already excluded by the range above (unlike -1, which the
      range explicitly keeps).
    description: >-
      Direction of wind in degrees. Calm = 0,  direction from north to
      south = 360, varying direction = -1
  - name: WindSpeed
    type: number(quantity)
    units: m/s
    range:
    - 0
    - 28
    details: >-
      Ceiling follows the Beaufort 10 upper bound (28.4 m/s, storm force)
      -- no vessel would be actively trawling above this. Excluding the -9 sentinel:
      HH 1,407 of 106,109 real measurements (1.33%) exceed it, up to a max of 342
      m/s; LT 1,149 of 64,985 (1.77%), up to 77 m/s. Both tail off smoothly, consistent
      with a real distribution below and noise above.
    description: >-
      Speed of wind in metres/sec.
  - name: SwellDir
    type: number(quantity)
    units: degrees
    range:
    - 0
    - 360
    details: >-
      -9 is the ICES-wide sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 120,204/145,958 rows (82.35%), LT 28,459/75,310 rows (37.79%), 0 true nulls
      in either table -- the modal value in both tables, not the exception.
    description: >-
      Direction of swell in degrees. No movement=0, direction from south
      to north = 360, varying direction = -1
  - name: SwellHeight
    type: number(quantity)
    units: m
    range:
    - 0.0
    - 13.0
    details: >-
      See known issue swell_height_type_mismatch (DATRAS-known-issues.yaml,
      not yet filed): Same known issue as HH's own SwellHeight above (icesVocab declares
      a single unprefixed 'SwellHeight' key, an enum of H/L/M/N/NR/VH height classes
      -- the seed stage applies it here too since the key resolves the same way for
      LT). This field is not independently observed by LT: it is HH's own SwellHeight,
      recorded again on the LT record for the same haul -- joining LT to HH on the
      full 8-field composite key, 55,113 of 55,113 rows where both are non-null carry
      an identical value, zero exceptions. Range, exclusion boundary, and evidence
      (including the WindSpeed co-parameter check) are therefore HH's, not independently
      re-derived here -- see HH's own SwellHeight entry above for the full reasoning.
    description: >-
      Height of (swell) waves, in metres
  - name: CodendMesh
    type: number(quantity)
    units: mm
    range:
    - 9
    - 100
    details: >-
      0mm (202 rows) excluded as a placeholder -- a codend by definition has
      some mesh size. 250mm (1 row) sits far above the next-highest real value (100mm,
      644 rows) and is treated as a data-entry error, excluded. -9 is the ICES-wide
      sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 104,918/145,958 rows (71.88%), LT 22,672/75,310 rows (30.11%), 0 true nulls
      in either table -- the modal value in both tables, already excluded by the range
      above.
    description: >-
      Codend mesh size in mm
  - name: EEZ
    type: string
    examples:
    - United Kingdom Exclusive Economic Zone
    - 'Danish Exclusive Economic Zone'
    - French Exclusive Economic Zone
    - Spanish Exclusive Economic Zone
    - Swedish Exclusive Economic Zone
    details: >-
      Exclusive Economic Zone name, no description present. 19 distinct values,
      162 of 75,310 rows unpopulated. Not treated as a closed set -- EEZ coverage
      in a wider archive could plausibly include zones absent from this one.
  - name: NMArea
    type: string
    examples:
    - United Kingdom 12 NM
    - Swedish 12 NM
    - Spanish 12 NM
    - French 12 NM
    - 'Danish 12 NM'
    details: >-
      National 12-nautical-mile zone name (sibling concept to EEZ above), no
      description present. 17 distinct values, 49,581 of 75,310 rows unpopulated.
      Not treated as a closed set, same reasoning as EEZ.
  - name: DateofCalculation
    type: date
    details: >-
      See known issue dateofcalculation_type_mismatch (DATRAS-known-issues.yaml,
      not yet filed): ICES's WSDL declares this field character for LT's own retrieval
      operation (getLitterAssessmentOutput), while HH/HL/CA's own operations all
      declare it int/decimal -- but real LT data is the identical 8-digit YYYYMMDD
      stamp (e.g. "20260625"), just returned as a string by that one operation. Digit
      order (month before day) is consistent with HH/HL/CA. Same open-upper-bound,
      ICES-Datacenter-inserted basis as HH/HL/CA's DateofCalculation, but this table's
      OWN verified minimum (2015-11-27) is genuinely years later than theirs (2012-04-19)
      -- consistent with LT/litter reporting being a newer addition to DATRAS than
      the main haul/length/age exchange.
    range:
    - '2015-11-27'
    - .inf
  label: Litter Assessment
  description: >-
    Each row is one litter observation from a haul. Contains types and
    counts of marine debris (plastics, fishing gear, natural/organic material) recorded
    during the catch review; a separate thematic addition to the HH/HL/CA exchange.
  details: >-
    Grain: each row is one litter assessment/observation recorded during a
    haul's catch review. Population: litter records from hauls in covered surveys;
    a thematic addition to the HH/HL/CA core exchange tables with a separate collection
    protocol and scope. Linked to HH via the composite haul identifier (Survey + Year
    + Quarter + Country + Platform/Ship + Gear + StationName/StNo + HaulNumber). Note:
    CA has a verified HaulNumber/HaulNo linkage gap via a -9 sentinel (see CA table
    details); LT's own HaulNumber has no equivalent gap -- zero nulls and zero -9
    values. The full 8-field composite key is required for correct joins regardless:
    2,026 of 75,310 LT rows (2.7%) don't match any HH haul on it, but for an unrelated,
    diagnosed reason (known-issues.yaml: lt_bts_2025_q1_orphaned) -- HH's own submission
    is genuinely missing for that survey/year/quarter, not an LT-side data-quality
    problem.
  origin: data-raw/spec_02_curate_dict.R
relationships:
- join: HL.Survey = HH.Survey AND HL.Year = HH.Year AND HL.Quarter = HH.Quarter AND
    HL.Country = HH.Country AND HL.Ship = HH.Ship AND HL.Gear = HH.Gear AND HL.StNo
    = HH.StNo AND HL.HaulNo = HH.HaulNo
  cardinality: many-to-one
  conflicts:
  - RecordType
- join: CA.Survey = HH.Survey AND CA.Year = HH.Year AND CA.Quarter = HH.Quarter AND
    CA.Country = HH.Country AND CA.Ship = HH.Ship AND CA.Gear = HH.Gear AND CA.StNo
    = HH.StNo AND CA.HaulNo = HH.HaulNo
  cardinality: many-to-one
  conflicts:
  - RecordType
  description: >-
    Known gap (see CA table's own details and DATRAS-known-issues.yaml's
    ca_haulno_unlinkable_to_hh): 4.92% of CA rows (288,581 of 5,865,076) carry a -9
    sentinel in HaulNo and match no HH row on this key -- genuinely orphaned CA records,
    not a join-key problem.
- join: LT.Survey = HH.Survey AND LT.Year = HH.Year AND LT.Quarter = HH.Quarter AND
    LT.Country = HH.Country AND LT.Ship = HH.Ship AND LT.Gear = HH.Gear AND LT.StNo
    = HH.StNo AND LT.HaulNo = HH.HaulNo
  cardinality: many-to-one
  conflicts:
  - DateofCalculation
glossary:
  Haul: 'A single deployment of a trawl net. The primary unit of observation in DATRAS:
    one haul''s catch (HH record) is subsampled and analyzed into length frequencies
    (HL) and aged individuals (CA).'
  Length-stratified subsample: A subset of fish taken from a haul's catch, selected
    across the full range of observed length classes. Used in CA for cost-efficient
    age sampling without exhaustively aging every fish.
  Valid_Aphia: The ICES Datacenter's server-inserted, validated WoRMS AphiaID for
    each species. May differ from SpecCode (submitted value) due to ICES corrections
    or updates to the WoRMS taxonomy.
  DateofCalculation: The timestamp (YYYYMMDD) when the ICES Datacenter last recalculated
    and reprocessed this record. Not submitted by data providers; inserted and updated
    server-side as part of ICES's QC workflow.
  Litter Assessment: A qualitative and quantitative survey of marine debris (plastics,
    metal, rubber, natural materials, fishing gear) observed in the trawl catch. LT
    records are a thematic extension beyond HH/HL/CA's focus on fishery target species.
  Tier 1: 'The raw, per-haul exchange layer of ICES DATRAS: HH (haul), HL (length
    frequency), CA (aged individuals), and LT (litter). The primary submission format
    from national institutes to ICES.'
  Survey: 'A coordinated research program that conducts regular sampling (e.g., NS-IBTS:
    North Sea International Bottom Trawl Survey). DATRAS is the archive of submissions
    from many regional surveys with different spatial/temporal coverage.'
  icesVocab: ICES's centralized web service for controlled vocabularies (code lists
    and their meanings), keyed by prefixed/unprefixed 'code-types' (e.g. TS_HaulVal,
    Gear). Cross-domain -- DATRAS is only one of several ICES data collections it
    serves, so a key existing under a field's name is not proof it's the right one
    for DATRAS. See AGENTS.md's Key Facts.
  WSDL: 'Web Services Definition Language: the machine-readable contract ICES''s DATRASWebService.asmx
    publishes, describing each operation (getHHdata, getCAdata, etc.) and the field
    types it actually returns. opus''s primary source for field types (Working Principle
    1), generated directly from the live service rather than separately maintained.'
  WoRMS / AphiaID: 'World Register of Marine Species: the taxonomic reference ICES
    validates submitted species codes against. AphiaID is WoRMS''s own numeric species
    identifier -- HL/CA''s Valid_Aphia field carries the ICES Datacenter''s server-validated
    AphiaID, which may differ from the submitter''s own SpecCode.'
  Rule codes (M01/S24/D01/D04): 'Codes from the external data-dict CLI''s own three-tier
    validation (spec/metadata/data), not opus''s invention. S-codes check the YAML
    spec itself (S24: enum values must be quoted strings); M-codes check a column''s
    declared type against its real data (M01: type mismatch, e.g. WSDL int vs. a curated
    enum''s quoted-string values); D-codes check real data against declared constraints
    (D01: null in a required column; D04: value outside range, or not in the declared
    enum). Cited throughout this file''s `details:` as justification for an accepted,
    permanent divergence.'
  CPUE: 'Catch Per Unit Effort: catch quantity normalized by sampling effort (e.g.
    per hour towed), enabling comparison across hauls of different duration/gear.
    A Tier 2 derived product (CPUEL, CPUEA) computed from HH/HL, not part of Tier
    1''s raw exchange data.'
  OSPAR: The Convention for the Protection of the Marine Environment of the North-East
    Atlantic, and the regional body it establishes. LT's OSPARArea field records which
    OSPAR region a haul falls within, for marine-litter reporting under that convention.
  SeaDataNet: A pan-European marine data infrastructure and common-vocabulary network.
    Some ICES/DATRAS reference concepts (e.g. certain parameter codes) trace back
    to SeaDataNet-maintained vocabularies rather than being DATRAS-specific inventions.
