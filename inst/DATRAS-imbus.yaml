    range:
    - 0
    - 712
    details: >-
      Legacy field name: MaxTrawlDepth. Same inferred-unit caveat as MinTrawlDepth
      above.
    constraints:
    - assert: MaxTrawlDepth >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
  - name: DateofCalculation
    type: date
    range:
    - '2012-04-19'
    - .inf
    details: >-
      Legacy field name: DateofCalculation. 8-digit YYYYMMDD stamp, digit
      order (month before day) verified consistent across all four Tier 1 tables.
      Upper bound deliberately left open: a live, continuously-advancing ICES Datacenter
      'last recalculated' stamp, not submitted by data providers, so a fixed max
      would go stale immediately. Lower bound is this table's own verified minimum
      -- NOT forced identical across tables the way SweepLngt/HaulNo/Year are, since
      a genuine table-specific difference is plausible here (confirmed: LT's own
      minimum is years later). A -9 sentinel (11,574 rows, 7.93% of non-null; already
      excluded by the lower bound above) reads as the standard DATRAS 'not recorded'
      convention for this server-computed field -- not yet (re)calculated for this
      record.
  label: Haul Information
  description: >-
    Each row is one haul (trawl deployment). Contains haul-level metadata:
    geography, timing, gear deployment, environmental conditions, and performance
    flags.
  details: >-
    Grain: each row represents one discrete haul deployment (one trawl operation).
    Population: all hauls submitted to ICES DATRAS within the covered survey/region/timeframe.
    Join key: HL, CA, and LT tables reference haul-level data via a composite identifier
    constructed from eight fields: Survey, Year, Quarter, Country, {Platform or Ship},
    Gear, {StationName or StNo}, and HaulNumber. The naming convention differs by
    era: newer submissions use Platform/StationName/HaulNumber (new style); older
    submissions use Ship/StNo/HaulNo (old style). Note: HaulNumber alone is NOT a
    valid join key and must be paired with all seven other fields -- but even the
    full composite key doesn't recover everything: 305,276 CA rows (5.12% of 5,968,027)
    carry no haul number and match no HH haul on any subset of the 8 fields. As submitted
    these are a -9 sentinel; in the published archive HaulNumber is sentinel policy
    'strip', so they arrive as null. They are real observations attributed to an
    area rather than a haul -- 305,146 carry an Age and together they hold 599,407
    aged fish -- and must be accounted for at area grain, not dropped to make a join
    succeed. See DATRAS-known-issues.yaml (ca_haulno_unlinkable_to_hh) and CA's own
    `linkable_to_hh` definition.
  origin: data-raw/spec/spec_02_curate_dict.R
- name: HL
  columns:
  - name: RecordHeader
    type: enum
    description: >-
      Definition of the data type recorded, affecting the layout of the
      data fields included on that record. HH=Haul Information, HL=Length Frequency
      Distribution, CA=individual fish recordings with biological information, LT=
      Litter data records
    values:
      HL: Length Frequency Distribution
    label: Record Type
    constraints:
    - required
    details: >-
      Legacy field name: RecordType.
  - name: Survey
    type: string
    examples:
    - NS-IBTS
    - BTS
    - BITS
    - 'DYFS'
    - Can-Mar
    details: >-
      Legacy field name: Survey. 29 distinct values in HH's archive; ICES
      DATRAS survey acronym, an open list, not a fixed enum. icesVocab DOES resolve
      a 'Survey' key by name but it's a false lead, not this field's source: its
      133 codes are ICES's own cross-domain internal survey IDs (e.g. 'A1012'),
      a completely different scheme from DATRAS's own short acronyms -- confirmed
      by checking real codes against it directly, not assumed. Not used.
    constraints:
    - required
    - foreign_key
  - name: Quarter
    type: number(ordinal)
    description: >-
      Cruise quarter. Hauls outside of the calendar quarter can be reported
      with the same quarter reference, if agreed by the survey group.
    range:
    - 1
    - 4
    details: >-
      Legacy field name: Quarter. Retyped from enum to number(ordinal) 2026-08-29,
      resolving a standing M01: the live WSDL declares this int, the archive stores
      it int, and an enum's underlying data must be string-like (data-dict validation.md,
      "Enum membership"). The former values: map ('1' -> '1. quarter') carried
      nothing the number itself does not, so no information is lost -- unlike Tickler
      and CatIdentifier, whose code labels are load-bearing and which therefore stay
      enums stored as strings. icesVocab's TS_Quarter also resolves this field (a
      bare 'Quarter' key is separately registered too, redundant with TS_Quarter).
      Against the real archive: CA, HH, and HL each use all 4 codes; LT uses 3 of
      4. 0 real values fall outside the vocab in any table.
    constraints:
    - required
    - foreign_key
  - name: Country
    type: string
    description: >-
      ISO 3166 country codes and region codes used by ICES
    examples:
    - NL
    - 'DE'
    - GB
    - 'DK'
    - GB-SCT
    details: >-
      Legacy field name: Country. 22 distinct values in HH's archive; 'GB-SCT'
      illustrates that this is ISO 3166 codes PLUS ICES's own sub-national region
      codes (per the field's own description), not plain ISO 3166 alone. icesVocab
      DOES resolve a 'TS_Country' key by name but it's a false lead too, same as
      Survey above: its 25 codes are 3-letter (e.g. 'BEL', 'DEN', 'ENG'), a
      different scheme entirely from this field's own 2-letter-plus-region codes
      -- confirmed by checking real codes against it directly. Not used.
    constraints:
    - required
    - foreign_key
  - name: Platform
    type: string
    description: >-
      SeaDataNet Ship and Platform Codes
    examples:
    - '74E9'
    - '26D4'
    - 748S
    - 64SS
    - 18NE
    details: >-
      Legacy field name: Ship. 110 distinct values in HH's archive; SeaDataNet
      ship/platform codes, an open list, not a fixed enum.
    constraints:
    - required
    - foreign_key
  - name: Gear
    type: enum
    description: >-
      Gear type code
    values:
      ABD: Aberdeen 18 ft trawl
      BAK: Baka trawl
      BOT: Bottom Trawl
      BT12: Beam Trawl 12 meters
      BT3: Beam trawl 3 meters
      BT4A: Four m Beam trawl, aft
      BT4AI: Four m Beam trawl, aft - in IrishSea q3 BTS
      BT4P: Four m Beam Trawl, port
      BT4S: Four m Beam Trawl, starboard
      BT6: Beam trawl 6 meters
      BT7: Seven m Beam trawl
      BT8: Eight m Beam trawl
      CAM: Unspecified Gear
      CAR: Bottom trawl FGAV019
      CHP: Cod Hopper
      DHT: Dutch Herring Trawl
      DSD: Danish Sandeel dredge, used at the Danish Sandeel survey
      DT: Russian bottom trawl
      EGY: Unspecified Gear
      ESB: Estonian small bottom trawl
      EXP: EXPO trawl - winged midwater trawl
      FOT: Foto midwater trawl
      GOV: GOV Trawl
      GRT: Granton trawl
      H12: Herring Bottom Trawl 120 feet
      H18: Herring Bottom Trawl 180 feet
      H20: Herring ground trawl (HG20/25)
      HAK: Hake-4M
      HOB: High Opening Bottom Trawl
      HT: Herring Bottom Trawl
      JDT: Jackson Trawl, modified otter trawl
      JTDS: Jackson Trawl Downscaled
      JTFS: Jackson Trawl Full Scale
      KAB: Pelagic trawl net Kabeljaubomber
      LBT: Latvian Bottom Trawl
      LPT: Latvian Pelagic Trawl
      NCT: Norwegian Campell Trawl 1800/96
      P20: Herring Bottom Trawl (P20/25)
      PEL: Pelagic midwater trawl
      PG1: Pelagic trawl Gloria 1024 SW
      PG2: Pelagic trawl Gloria 2048 HO
      PG3: Pelagic trawl Gloria 2560 HO
      PORB: Porcupine Baka
      RAPIA: Modified beam trawl with a rigid mouth (Width-3.5 m Weight-225 kg Four
        120-mm wide skids 46-mm codend mesh size)
      ROT: Rock hopper otter trawl
      SON: Sonderborg trawl
      SOV: SOV-NET
      TVCOD: Trawl model TV112-24-646
      TVL: Large TV trawl
      TVM: Bottom trawl TV3-280x80
      TVS: Small TV trawl
      US4: US 4 Seam 3 Bridle
      VIN: Vinge trawl
      W2A: Western IIA
      Y36: 'Yankee #36'
    details: >-
      Legacy field name: Gear. All 99 active icesVocab Gear Type codes (deprecated
      code OTG excluded). 55 confirmed used in DATRAS archive; 44 additional codes
      are valid ICES definitions (may be used in future submissions or by other surveys).
      Each code has a full description in icesVocab. Validation: enum restricts submissions
      to these codes. values: restricted to the 55 code(s) observed in this table's
      published archive (icesVocab's Gear defines 99 in total). A value outside this
      list in new data fails D04 enum validation and needs review: data error or a
      genuinely new code.
    constraints:
    - required
    - foreign_key
  - name: SweepLength
    type: number(quantity)
    description: >-
      Length of sweep in metres. Recommended values depend on survey and
      quarter, see survey manuals for further details
    units: m
    range:
    - 0
    - 850
    constraints:
    - assert: SweepLength >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
    details: >-
      Legacy field name: SweepLngt.
  - name: GearExceptions
    type: enum
    description: >-
      Deviations of the standard gear. Depends on survey, see survey manuals
      for further details.
    values:
      B: Bobbins
      D: Double sweeps
      DB: Double beam, catch from two beam trawls put together
      I2: Groundgear D with 16" bobbins
      R: Rockhopper
      S: Standard
      S2: Groundgear with 16" hoppers
      SB: Single beam, catch from one beam trawl
    details: >-
      Legacy field name: GearEx. icesVocab's TS_GearEx resolves this as a
      controlled 13-code gear-exception list (AC_GearExceptions also registered, a
      1-code subset -- never the right prefix for a DATRAS field, Issue 8). Against
      the real archive: CA uses 11 of 13 codes, HH and HL 9 of 13 each, LT 8 of 13;
      0 real values fall outside the vocab in any table. values: restricted to the
      8 code(s) observed in this table's published archive (icesVocab's TS_GearEx
      defines 13 in total). A value outside this list in new data fails D04 enum validation
      and needs review: data error or a genuinely new code.
  - name: DoorType
    type: enum
    description: >-
      Type of door used
    values:
      F: Flat
      P: Polyvalent
      PE: Portuguese Euronete round nose
      PI: Poly Ice Oval
      R: Rectangle
      T: Thyboroen Trawl Doors Type 2
      T4: Thyboroen Trawl Doors Type 4
      T6: Thyboroen Type 16 straight oval doors
      V: Vee
      WR: Wooden rectangular doors
    details: >-
      Legacy field name: DoorType. icesVocab's TS_DoorType resolves this
      as a controlled 12-code gear-door-type list (AC_DoorType also registered, never
      the right prefix for a DATRAS field -- Issue 8). Against the real archive: CA
      and HH each use 11 of 12 codes, HL 11 of 12, LT 6 of 12; 0 real values fall
      outside the vocab in any table. values: restricted to the 10 code(s) observed
      in this table's published archive (icesVocab's TS_DoorType defines 12 in total).
      A value outside this list in new data fails D04 enum validation and needs review:
      data error or a genuinely new code.
  - name: StationName
    type: string
    description: >-
      Station number. National coding system, not defined by ICES.
    examples:
    - '1'
    - '2'
    - '22'
    - '9'
    - '17'
    details: >-
      Legacy field name: StNo. Field's own description says this is a national
      coding system, not defined by ICES -- examples show the common shape (short
      numeric-looking strings), not an exhaustive domain; not a coded field, so no
      icesVocab entry is expected (none of the 580 registered vocab keys match). Of
      150,217 HH rows (24,484 distinct values), -9 accounts for exactly 6,899, stripped
      to null in the published archive. ICES's own field-description spreadsheet
      confirms the ICES-wide '-9 = no information' convention applies here, same
      as HaulNo above. Unlike HaulNo's own -9 sentinel, this isn't an orphaning
      problem: CA's own matching StNo=-9 rows for these same hauls (191,893 rows)
      join HH successfully via the other 7 composite-key fields, since both sides
      consistently carry -9 for the same haul rather than disagreeing.
    constraints:
    - required
    - foreign_key
  - name: HaulNumber
    type: number(ordinal)
    description: >-
      Sequential numbering of hauls during cruise.
    range:
    - 0
    - 82483
    constraints:
    - required
    - foreign_key
    details: >-
      Legacy field name: HaulNo. Sequential per-cruise numbering, but countries
      vary in whether it resets each cruise or runs continuously -- the archive-wide
      range spans many cruises' own counts pooled together, not one cruise's own
      haul tally. No icesVocab entry exists under any name or prefix (none of the
      580 registered vocab keys match) -- expected for a plain sequential identifier,
      not a coded field. ICES's own field-description spreadsheet confirms Mandatory:
      Yes and documents an ICES-wide convention applicable to any field with a header:
      submit -9 for 'no information' -- so the -9 sentinel seen in CA (see known-issues.yaml:
      ca_haulno_unlinkable_to_hh) is a sanctioned value, not an undocumented one.
  - name: Year
    type: number(ordinal)
    description: >-
      Cruise year (YYYY)
    range:
    - 1965
    - 2026
    constraints:
    - required
    - foreign_key
    details: >-
      Legacy field name: Year.
  - name: SpeciesCodeType
    type: enum
    description: >-
      Type of species code used for species definition at the record. Use
      'W' for WoRMS AphiaID
    values:
      T: TSN code - should not be used for data submissions
      W: WoRMS AphiaID code
    details: >-
      Legacy field name: SpecCodeType. icesVocab's TS_SpecCodeType resolves
      this as a controlled 2-code species-code-type list. Against the real archive:
      both CA and HL use both codes, a clean bidirectional match.
    constraints:
    - required
  - name: SpeciesCode
    type: number(id)
    description: >-
      Official WoRMS AphiaID code of species reported at the record.
    examples:
    - 55
    - 122388
    - 127196
    - 159048
    - 1789435
    constraints:
    - required
    details: >-
      Legacy field name: SpecCode. Official WoRMS AphiaID as submitted by
      the data provider -- contrast with Valid_Aphia, the ICES Datacenter's own validated/corrected
      version of the same concept, inserted server-side (see Valid_Aphia's own details
      below).
    label: Species (WoRMS AphiaID)
  - name: SpeciesValidity
    type: enum
    description: >-
      Validity of species records, e.g. to specify if species has only
      been counted, measured, weighed, etc.
    values:
      '0': 'Invalid information. Use in data products: no.'
      '1': 'Representative length information (length measurements, numbers and category
        catch weights). Use in data products: yes.'
      '10': 'Length measurements and numbers only. No category catch weights. Use
        in data products: yes.'
      '2': 'Representative length information only for commercial/assessed species.
        Full set of species to be completed next year after a two-years ban to allow
        national data use. Use in data products: yes, only for commercial/assessed
        species.'
      '4': 'Total number only. No length measurements or category catch weight. Use
        in data products: yes.'
      '5': 'Presence/absence only. No length measurements, numbers or category catch
        weights. Use in DATRAS products: yes.'
      '6': 'Category catch weight only. No length measurements or numbers. Use in
        DATRAS products: yes.'
      '7': 'Numbers and category catch weights only. No length measurements. Use in
        DATRAS products: yes.'
    details: >-
      Legacy field name: SpecVal. icesVocab's TS_SpecVal resolves this as
      a controlled 10-code species-validity list. Against the real HL archive: 8 of
      10 codes in use, 0 real values outside the vocab. values: restricted to the
      8 code(s) observed in this table's published archive (icesVocab's TS_SpecVal
      defines 10 in total). A value outside this list in new data fails D04 enum validation
      and needs review: data error or a genuinely new code.
    constraints:
    - required
  - name: SpeciesSex
    type: enum
    description: >-
      Gender of the described species category. In CA-records should be
      defined by dissection. If no determination was performed, report '-9'. If determination
      failed, report 'U'.
    values:
      B: Berried
      F: Female
      M: Male
      U: Unidentified
    details: >-
      Legacy field name: Sex. icesVocab's TS_Sex resolves this as a controlled
      7-code list (AC_Sex also registered, never the right prefix for a DATRAS field
      -- Issue 8). Against the real archive: both CA and HL use 5 of the 7 codes;
      0 real values fall outside the vocab in either table. values: restricted to
      the 4 code(s) observed in this table's published archive (icesVocab's TS_Sex
      defines 7 in total). A value outside this list in new data fails D04 enum validation
      and needs review: data error or a genuinely new code.
  - name: TotalNumber
    type: number(quantity)
    description: >-
      Total number of specimens per category (unique combination of cruise
      haul, species, sex, devstage and subsampling category identifier). For data
      type C, values should be standardised to 60 minutes. TotalNo=SUM(HLNoAtLngt).
    range:
    - 0.0
    - 3581592.0
    details: >-
      Legacy field name: TotalNo. Per the field's own description, TotalNo=SUM(HLNoAtLngt);
      values in the hundreds of thousands and non-integer values (7.7% of populated
      rows) both trace to the same documented mechanism -- DataType C records are
      standardised to 60 minutes, which can inflate very abundant small-bodied catches
      to large, non-integer counts. Top values all have real support (9-30 occurrences
      each, a smooth tail), not isolated errors.
    constraints:
    - assert: TotalNumber >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
  - name: SpeciesCategory
    type: enum
    description: >-
      Subsampling category by size for same species in the haul. If DataType
      is C, CatIdentifier is always 1. Further details on survey specific subsampling
      categories are available in the survey manuals.
    values:
      '1': 1. Level
      '11': 11. Level
      '12': 12. Level
      '13': 13. Level
      '14': 14. Level
      '2': 2. Level
      '21': 21. Level
      '22': 22. Level
      '23': 23. Level
      '3': 3. Level
      '31': 31. Level
      '4': 4. Level
      '5': 5. Level
    details: >-
      Legacy field name: CatIdentifier. icesVocab's TS_CatIdentifier resolves
      this as a controlled, leveled code list (56 active codes: '1. Level' through
      '55. Level', plus a '-9'/'Unknown' sentinel) -- not an open numeric ID,
      confirming this field's own already-documented shape (a coded scheme, not a
      sequence). 14 real distinct values (-9, 1-5, 11-14, 21-23, 31), zero gaps against
      the vocab's 56 codes either direction; 42 of the 56 are valid ICES definitions
      not yet observed in this archive. Live WSDL (getHLdata) declares this field
      int, not string -- an accepted, permanent M01 divergence between the WSDL-driven
      archive and this curated enum spec (see Valid_Aphia's own note for the general
      pattern), not a bug to fix by changing either side. values: restricted to the
      13 code(s) observed in this table's published archive (icesVocab's TS_CatIdentifier
      defines 56 in total). A value outside this list in new data fails D04 enum validation
      and needs review: data error or a genuinely new code.
    label: Species Category
    constraints:
    - required
  - name: SubsampledNumber
    type: number(quantity)
    description: |-
      Number of measured specimens per category (unique combination of cruise haul, species, sex, and subsampling category identifier and devstage). For data type C, values should be standardised to 60 minutes.
      NoMeas=Sum(HLNoAtLngt).
    range:
    - 0
    - 578731
    details: >-
      Legacy field name: NoMeas. Same DataType C standardisation basis as
      TotalNo above; top values are all well-supported (4-10 occurrences each), not
      isolated errors.
    todo: ICES's field-description spreadsheet marks this Mandatory, but 18.3% of
      HL's real archive rows are null -- a genuine gap between documented and actual
      submission behavior, not yet added as `required` pending review (see data-raw/audit/build_field_gap_audit.R).
    constraints:
    - assert: SubsampledNumber >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
  - name: SubsamplingFactor
    type: number(quantity)
    description: >-
      Sub-sampling factor. If 1/6 of the catch was measured, report 6.
      If DataType is C, it should be reported as 1. If DataType is S, it is always
      &gt;1. If DataType is R, the SubFactor is = 1 or &gt;1 for different species
      depending on whether they were subsampled.
    range:
    - 1.0
    - 10997.1834
    details: >-
      Legacy field name: SubFactor. 144,663 of 14,423,771 rows (1.00%) carry
      the -9 sentinel, which reads as a sub-1 value at face value; it is stripped
      to null in the published archive, leaving 372 genuine sub-1 anomalies (0.0026%),
      contradicting the field's own description (documented as always >=1, for every
      DataType) -- excluded. The high end is genuine, not an error: top values cluster
      at power-of-2-like numbers (4096 recurs 133 times; 8192, 5120, 6144 also recur
      with real support), consistent with repeatedly halving a very abundant catch
      to reach a manageable subsample.
    todo: ICES's field-description spreadsheet marks this Mandatory, but 1.0% of HL's
      real archive rows are null -- a genuine gap between documented and actual submission
      behavior, not yet added as `required` pending review (see data-raw/audit/build_field_gap_audit.R).
    constraints:
    - assert: SubsamplingFactor >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
  - name: SubsampleWeight
    type: number(quantity)
    description: >-
      Weight of the subsample in grams.
    units: g
    range:
    - 0
    - 3519200
    constraints:
    - assert: SubsampleWeight >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
    details: >-
      Legacy field name: SubWgt.
  - name: SpeciesCategoryWeight
    type: number(quantity)
    description: >-
      For datatype R or S: Catch weight in grams per category (for the
      unique combination of cruise haul, species, sex, devstage and subsampling category
      identifier). For datatype C, values should be standardised to 60 minutes.
    units: g
    range:
    - 0
    - 35568000
    details: >-
      Legacy field name: CatCatchWgt. -900 (2562 rows) and -100 (1 row) are
      excluded as a 'not weighed' placeholder, the same pattern seen in several
      HH fields. The high end is genuine: top values all have real support (3-18 occurrences
      each).
    todo: ICES's field-description spreadsheet marks this Mandatory, but 23.7% of
      HL's real archive rows are null -- a genuine gap between documented and actual
      submission behavior, not yet added as `required` pending review (see data-raw/audit/build_field_gap_audit.R).
    constraints:
    - assert: SpeciesCategoryWeight >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
  - name: LengthCode
    type: enum
    description: >-
      Measurement accuracy used for the LngtClass (mm, 0.5 cm, cm, 5 cm).
      Survey and species specific, see survey manuals for further details. When measured
      to the mm or 0.5 below: report LngtClass as mm (10.1=101), for cm and 5 cm report
      cm in LngtClass
    values:
      '.': '1 mm length class, reporting units: mm'
      '0': '0.5 cm length class, reporting units: mm'
      '1': '1 cm length class, reporting units: cm'
      '5': '5 cm length class, reporting units: cm'
    todo: ICES's field-description spreadsheet marks this Mandatory, but 2.6% of HL's
      real archive rows are null -- a genuine gap between documented and actual submission
      behavior, not yet added as `required` pending review (see data-raw/audit/build_field_gap_audit.R).
    details: >-
      Legacy field name: LngtCode. icesVocab's TS_LngtCode resolves this
      as a controlled 7-code length-measurement-type list. Against the real archive:
      CA uses 4 of 7 codes, HL uses 5 of 7; 0 real values fall outside the vocab in
      either table. values: restricted to the 4 code(s) observed in this table's
      published archive (icesVocab's TS_LngtCode defines 7 in total). A value outside
      this list in new data fails D04 enum validation and needs review: data error
      or a genuinely new code.
  - name: LengthClass
    type: number(quantity)
    description: >-
      Lower length boundary of the Length class. In cm or mm depending
      on the LngtCode. E.g. 10-11 cm=10
    range:
    - 0
    - 4500
    details: >-
      Legacy field name: LngtClass. Unit varies by the sibling LngtCode field
      (mm or cm; see LngtCode's own values map), so no fixed units here. Two isolated
      outliers excluded: 11930 (LngtCode '.', i.e. 11.93m) and 900 (LngtCode '1',
      i.e. 9m) -- each a lone occurrence far above the next-highest real value. Everything
      else, including a cluster around 420-460 under LngtCode '1' (4.2-4.6m -- large
      but not implausible for occasional large elasmobranch/tuna bycatch), is kept
      as-is: this is a first curation pass from data patterns alone, not a domain-expert
      review, and a tighter bound wasn't asserted without one. CA's own LngtClass
      is curated separately (a different sampling population, not assumed identical
      -- see CA's own pass).
    todo: ICES's field-description spreadsheet marks this Mandatory, but 2.6% of HL's
      real archive rows are null -- a genuine gap between documented and actual submission
      behavior, not yet added as `required` pending review (see data-raw/audit/build_field_gap_audit.R).
    label: Length Class (cm)
    constraints:
    - assert: LengthClass >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
  - name: NumberAtLength
    type: number(quantity)
    description: >-
      Number of measured fish for the length class per category (unique
      combination of cruise haul, species, sex, devstage and category identifier).
      For data type C, values should be standardised to 60 minutes.
    range:
    - 0.0
    - 940339.35
    details: >-
      Legacy field name: HLNoAtLngt. Same DataType C standardisation basis
      as TotalNo above. Top values are each a unique one-off but decline smoothly
      with no marker/gap pattern, consistent with genuine (if rare) very large hauls
      of abundant small-bodied species. CA's own NumberAtLength (CANoAtLngt) is curated
      separately (a different sampling population -- aged individuals only, not the
      whole catch -- so not assumed identical).
    label: Count at Length
    todo: ICES's field-description spreadsheet marks this Mandatory, but 2.6% of HL's
      real archive rows are null -- a genuine gap between documented and actual submission
      behavior, not yet added as `required` pending review (see data-raw/audit/build_field_gap_audit.R).
    constraints:
    - assert: NumberAtLength >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
  - name: DevelopmentStage
    type: enum
    description: >-
      Development or maturity stage defined by non-invasive observations
    values:
      B: Berried
      E: Egg
      J: Juvenile
    todo: Confirm whether -9 (99.80% of non-null rows) is a genuine DevelopmentStage
      code or just the generic missing-value sentinel -- no icesVocab key resolves
      for this field under either name, so nothing external confirms it either way.
    details: >-
      Legacy field name: DevStage. icesVocab's TS_DevStage resolves this
      as a controlled 4-code development-stage list. Against the real HL archive:
      all 4 codes in use, a clean bidirectional match. values: restricted to the 3
      code(s) observed in this table's published archive (icesVocab's TS_DevStage
      defines 4 in total). A value outside this list in new data fails D04 enum validation
      and needs review: data error or a genuinely new code.
  - name: LengthType
    type: enum
    description: >-
      Type of length measurement
    values:
      '1': Total Length, linear
      '10': Shell Width
      '2': Standard Length
      '3': Pre Supra-Caudal Fin Length
      '4': Pre Anal-Fin Length
      '5': Mantle Length
      '6': Carapace Length
      '7': Carapace Width
      '8': Second Dorsal Fin Length
      '9': Shell Height
    todo: Confirm whether -9 (71.59% of non-null rows) is a genuine LengthType code
      or just the generic missing-value sentinel -- no icesVocab key resolves for
      this field under either name, so nothing external confirms it either way.
    details: >-
      Legacy field name: LenMeasType. icesVocab's TS_LenMeasType resolves
      this as a controlled 14-code length-measurement-type list. Against the real
      HL archive: 11 of 14 codes in use, 0 real values outside the vocab. values:
      restricted to the 10 code(s) observed in this table's published archive (icesVocab's
      TS_LenMeasType defines 14 in total). A value outside this list in new data fails
      D04 enum validation and needs review: data error or a genuinely new code.
  - name: DateofCalculation
    type: date
    range:
    - '2012-04-19'
    - .inf
    details: >-
      Legacy field name: DateofCalculation. 8-digit YYYYMMDD stamp, digit
      order (month before day) verified consistent across all four Tier 1 tables.
      Upper bound deliberately left open: a live, continuously-advancing ICES Datacenter
      'last recalculated' stamp, not submitted by data providers, so a fixed max
      would go stale immediately. Lower bound is this table's own verified minimum
      -- NOT forced identical across tables the way SweepLngt/HaulNo/Year are, since
      a genuine table-specific difference is plausible here (confirmed: LT's own
      minimum is years later). A -9 sentinel (1,050,496 rows, 7.64% of non-null; already
      excluded by the lower bound above) reads as the standard DATRAS 'not recorded'
      convention for this server-computed field -- not yet (re)calculated for this
      record.
  - name: Valid_Aphia
    type: number(id)
    details: >-
      Legacy field name: Valid_Aphia. See known issue valid_aphia_type_mismatch
      (DATRAS-known-issues.yaml, not yet filed): ICES's WSDL declares this field
      character, but the live service always returns it numeric -- it's a WoRMS AphiaID
      (an identifier, hence number(id), not a quantity).
    examples:
    - 55
    - 117258
    - 126757
    - 140474
    - 1895010
  label: Length Frequency Distribution
  description: >-
    Each row is a length class within a haul's catch. Contains the count
    of fish in each length bin, without individual-level age/sex data; the length-aggregated
    summary layer of Tier 1.
  details: >-
    Grain: each row is a (haul, species, length class) combination with a
    count of fish in that length bin. Population: length-frequency summaries for all
    species caught in surveyed hauls, aggregated by length class. Linked to HH via
    the composite haul identifier (Survey + Year + Quarter + Country + Platform/Ship
    + Gear + StationName/StNo + HaulNumber). Note: CA (not HL) has a verified HaulNumber/HaulNo
    linkage gap -- 5.12% of CA rows carry no haul number (a -9 sentinel as submitted,
    null in the published archive) and match no HH haul even via the full composite
    key (see HH table details). The full 8-field composite key is required for correct
    joins regardless.
  origin: data-raw/spec/spec_02_curate_dict.R
  definitions:
  - name: count_at_length
    description: >-
      Number of fish this row represents in the whole catch: the recorded
      count scaled back up by the row's own subsampling factor.
    details: |-
      This is the row-level product that any catch total must be built from, and it is applied per row and only then summed -- never sum(NumberAtLength) times some haul-level factor. SubsamplingFactor varies *within* a haul when a catch was size-stratified (predominantly GB-SCT vessels on DataType P and DK vessels on DataType R), so a haul-level factor is simply wrong for those hauls, and wrong silently.
      Both inputs are sentinel policy 'strip' (op_sentinel_policy("HL")), so a not-recorded value arrives as null, not as -9: of 14,423,771 rows, NumberAtLength is null in 377,784 (2.62%) and SubsamplingFactor in 144,663 (1.00%), and neither holds a literal -9. The product is therefore null for those rows rather than a bogus negative -- but note the R translation of any aggregate over it carries na.rm = TRUE, which drops them silently. Filter explicitly if their exclusion needs to be visible.
    expr: NumberAtLength * SubsamplingFactor
  - name: total_number
    description: >-
      Total number of fish caught, over whatever rows it is evaluated against.
    details: |-
      An aggregate, so the grouping is the caller's to supply (dplyr's `.by =`, SQL's GROUP BY); grouped by the 8-field composite haul key it gives catch per haul, ungrouped it gives the total over the rows given.
      Correct as a raw count only where HH.DataType is 'R' or 'S'. On DataType 'C' the submitted numbers are already CPUE (number per hour) rather than counts, so summing them yields neither a count nor a valid CPUE; on 'P' (pseudocategory sampling) interpretation depends on the category structure. DataType lives in HH, not here, so this definition cannot test it -- join HH and check before treating the result as a count. 97,321 of 150,217 hauls are 'R', 49,717 are 'C', 2,170 'P', 969 'S', 40 the kept -9 (invalid haul).
    expr: SUM(count_at_length)
- name: CA
  columns:
  - name: RecordHeader
    type: enum
    description: >-
      Definition of the data type recorded, affecting the layout of the
      data fields included on that record. HH=Haul Information, HL=Length Frequency
      Distribution, CA=individual fish recordings with biological information, LT=
      Litter data records
    values:
      CA: individual fish recordings with biological information
    label: Record Type
    constraints:
    - required
    details: >-
      Legacy field name: RecordType.
  - name: Survey
    type: string
    examples:
    - NS-IBTS
    - BTS
    - BITS
    - 'DYFS'
    - Can-Mar
    details: >-
      Legacy field name: Survey. 29 distinct values in HH's archive; ICES
      DATRAS survey acronym, an open list, not a fixed enum. icesVocab DOES resolve
      a 'Survey' key by name but it's a false lead, not this field's source: its
      133 codes are ICES's own cross-domain internal survey IDs (e.g. 'A1012'),
      a completely different scheme from DATRAS's own short acronyms -- confirmed
      by checking real codes against it directly, not assumed. Not used.
    constraints:
    - required
    - foreign_key
  - name: Quarter
    type: number(ordinal)
    description: >-
      Cruise quarter. Hauls outside of the calendar quarter can be reported
      with the same quarter reference, if agreed by the survey group.
    range:
    - 1
    - 4
    details: >-
      Legacy field name: Quarter. Retyped from enum to number(ordinal) 2026-08-29,
      resolving a standing M01: the live WSDL declares this int, the archive stores
      it int, and an enum's underlying data must be string-like (data-dict validation.md,
      "Enum membership"). The former values: map ('1' -> '1. quarter') carried
      nothing the number itself does not, so no information is lost -- unlike Tickler
      and CatIdentifier, whose code labels are load-bearing and which therefore stay
      enums stored as strings. icesVocab's TS_Quarter also resolves this field (a
      bare 'Quarter' key is separately registered too, redundant with TS_Quarter).
      Against the real archive: CA, HH, and HL each use all 4 codes; LT uses 3 of
      4. 0 real values fall outside the vocab in any table.
    constraints:
    - required
    - foreign_key
  - name: Country
    type: string
    description: >-
      ISO 3166 country codes and region codes used by ICES
    examples:
    - NL
    - 'DE'
    - GB
    - 'DK'
    - GB-SCT
    details: >-
      Legacy field name: Country. 22 distinct values in HH's archive; 'GB-SCT'
      illustrates that this is ISO 3166 codes PLUS ICES's own sub-national region
      codes (per the field's own description), not plain ISO 3166 alone. icesVocab
      DOES resolve a 'TS_Country' key by name but it's a false lead too, same as
      Survey above: its 25 codes are 3-letter (e.g. 'BEL', 'DEN', 'ENG'), a
      different scheme entirely from this field's own 2-letter-plus-region codes
      -- confirmed by checking real codes against it directly. Not used.
    constraints:
    - required
    - foreign_key
  - name: Platform
    type: string
    description: >-
      SeaDataNet Ship and Platform Codes
    examples:
    - '74E9'
    - '26D4'
    - 748S
    - 64SS
    - 18NE
    details: >-
      Legacy field name: Ship. 110 distinct values in HH's archive; SeaDataNet
      ship/platform codes, an open list, not a fixed enum.
    constraints:
    - required
    - foreign_key
  - name: Gear
    type: enum
    description: >-
      Gear type code
    values:
      ABD: Aberdeen 18 ft trawl
      BAK: Baka trawl
      BOT: Bottom Trawl
      BT12: Beam Trawl 12 meters
      BT3: Beam trawl 3 meters
      BT4A: Four m Beam trawl, aft
      BT4AI: Four m Beam trawl, aft - in IrishSea q3 BTS
      BT4P: Four m Beam Trawl, port
      BT4S: Four m Beam Trawl, starboard
      BT6: Beam trawl 6 meters
      BT7: Seven m Beam trawl
      BT8: Eight m Beam trawl
      CAR: Bottom trawl FGAV019
      CHP: Cod Hopper
      DHT: Dutch Herring Trawl
      DSD: Danish Sandeel dredge, used at the Danish Sandeel survey
      DT: Russian bottom trawl
      ESB: Estonian small bottom trawl
      EXP: EXPO trawl - winged midwater trawl
      FOT: Foto midwater trawl
      GOV: GOV Trawl
      GRT: Granton trawl
      H12: Herring Bottom Trawl 120 feet
      H18: Herring Bottom Trawl 180 feet
      H20: Herring ground trawl (HG20/25)
      HAK: Hake-4M
      HOB: High Opening Bottom Trawl
      HT: Herring Bottom Trawl
      JDT: Jackson Trawl, modified otter trawl
      JTDS: Jackson Trawl Downscaled
      JTFS: Jackson Trawl Full Scale
      KAB: Pelagic trawl net Kabeljaubomber
      LBT: Latvian Bottom Trawl
      LPT: Latvian Pelagic Trawl
      NCT: Norwegian Campell Trawl 1800/96
      P20: Herring Bottom Trawl (P20/25)
      PG1: Pelagic trawl Gloria 1024 SW
      PG2: Pelagic trawl Gloria 2048 HO
      PG3: Pelagic trawl Gloria 2560 HO
      PORB: Porcupine Baka
      RAPIA: Modified beam trawl with a rigid mouth (Width-3.5 m Weight-225 kg Four
        120-mm wide skids 46-mm codend mesh size)
      ROT: Rock hopper otter trawl
      SON: Sonderborg trawl
      SOV: SOV-NET
      TVCOD: Trawl model TV112-24-646
      TVL: Large TV trawl
      TVM: Bottom trawl TV3-280x80
      TVS: Small TV trawl
      US4: US 4 Seam 3 Bridle
      VIN: Vinge trawl
      W2A: Western IIA
      Y36: 'Yankee #36'
    details: >-
      Legacy field name: Gear. All 99 active icesVocab Gear Type codes (deprecated
      code OTG excluded). 55 confirmed used in DATRAS archive; 44 additional codes
      are valid ICES definitions (may be used in future submissions or by other surveys).
      Each code has a full description in icesVocab. Validation: enum restricts submissions
      to these codes. values: restricted to the 52 code(s) observed in this table's
      published archive (icesVocab's Gear defines 99 in total). A value outside this
      list in new data fails D04 enum validation and needs review: data error or a
      genuinely new code.
    constraints:
    - required
    - foreign_key
  - name: SweepLength
    type: number(quantity)
    description: >-
      Length of sweep in metres. Recommended values depend on survey and
      quarter, see survey manuals for further details
    units: m
    range:
    - 0
    - 850
    constraints:
    - assert: SweepLength >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
    details: >-
      Legacy field name: SweepLngt.
  - name: GearExceptions
    type: enum
    description: >-
      Deviations of the standard gear. Depends on survey, see survey manuals
      for further details.
    values:
      B: Bobbins
      D: Double sweeps
      DB: Double beam, catch from two beam trawls put together
      I2: Groundgear D with 16" bobbins
      MN: Without multisampler
      MY: With multisampler
      R: Rockhopper
      S: Standard
      S2: Groundgear with 16" hoppers
      SB: Single beam, catch from one beam trawl
    details: >-
      Legacy field name: GearEx. Mostly a copy of HH's own GearExceptions
      for the same haul (92.27% of 5,563,036 matched non-null rows identical), but
      in 430,289 rows (7.73%) CA carries a real code (S, SB, B, D, MY, R, or MN) where
      HH has only the generic '-9' placeholder for the same haul -- CA never contradicts
      a real HH code, only supplements HH's own '-9' with something more specific.
      Not forced identical to HH's spec as a result (contrast SwellHeight above,
      a genuine byte-for-byte copy): this field carries real information HH's own
      copy doesn't have. icesVocab's TS_GearEx resolves this as a controlled 13-code
      gear-exception list (AC_GearExceptions also registered, a 1-code subset -- never
      the right prefix for a DATRAS field, Issue 8). Against the real archive: CA
      uses 11 of 13 codes, HH and HL 9 of 13 each, LT 8 of 13; 0 real values fall
      outside the vocab in any table. values: restricted to the 10 code(s) observed
      in this table's published archive (icesVocab's TS_GearEx defines 13 in total).
      A value outside this list in new data fails D04 enum validation and needs review:
      data error or a genuinely new code.
  - name: DoorType
    type: enum
    description: >-
      Type of door used
    values:
      F: Flat
      P: Polyvalent
      PE: Portuguese Euronete round nose
      PI: Poly Ice Oval
      R: Rectangle
      T: Thyboroen Trawl Doors Type 2
      T4: Thyboroen Trawl Doors Type 4
      T6: Thyboroen Type 16 straight oval doors
      V: Vee
      WR: Wooden rectangular doors
    details: >-
      Legacy field name: DoorType. icesVocab's TS_DoorType resolves this
      as a controlled 12-code gear-door-type list (AC_DoorType also registered, never
      the right prefix for a DATRAS field -- Issue 8). Against the real archive: CA
      and HH each use 11 of 12 codes, HL 11 of 12, LT 6 of 12; 0 real values fall
      outside the vocab in any table. values: restricted to the 10 code(s) observed
      in this table's published archive (icesVocab's TS_DoorType defines 12 in total).
      A value outside this list in new data fails D04 enum validation and needs review:
      data error or a genuinely new code.
  - name: StationName
    type: string
    description: >-
      Station number. National coding system, not defined by ICES.
    examples:
    - '1'
    - '2'
    - '22'
    - '9'
    - '17'
    details: >-
      Legacy field name: StNo. Field's own description says this is a national
      coding system, not defined by ICES -- examples show the common shape (short
      numeric-looking strings), not an exhaustive domain; not a coded field, so no
      icesVocab entry is expected (none of the 580 registered vocab keys match). Of
      150,217 HH rows (24,484 distinct values), -9 accounts for exactly 6,899, stripped
      to null in the published archive. ICES's own field-description spreadsheet
      confirms the ICES-wide '-9 = no information' convention applies here, same
      as HaulNo above. Unlike HaulNo's own -9 sentinel, this isn't an orphaning
      problem: CA's own matching StNo=-9 rows for these same hauls (191,893 rows)
      join HH successfully via the other 7 composite-key fields, since both sides
      consistently carry -9 for the same haul rather than disagreeing.
    constraints:
    - required
    - foreign_key
  - name: HaulNumber
    type: number(ordinal)
    description: >-
      Sequential numbering of hauls during cruise.
    range:
    - 0
    - 82483
    constraints:
    - required
    - foreign_key
    details: >-
      Legacy field name: HaulNo. Sequential per-cruise numbering, but countries
      vary in whether it resets each cruise or runs continuously -- the archive-wide
      range spans many cruises' own counts pooled together, not one cruise's own
      haul tally. No icesVocab entry exists under any name or prefix (none of the
      580 registered vocab keys match) -- expected for a plain sequential identifier,
      not a coded field. ICES's own field-description spreadsheet confirms Mandatory:
      Yes and documents an ICES-wide convention applicable to any field with a header:
      submit -9 for 'no information' -- so the -9 sentinel seen in CA (see known-issues.yaml:
      ca_haulno_unlinkable_to_hh) is a sanctioned value, not an undocumented one.
  - name: Year
    type: number(ordinal)
    description: >-
      Cruise year (YYYY)
    range:
    - 1965
    - 2026
    constraints:
    - required
    - foreign_key
    details: >-
      Legacy field name: Year.
  - name: SpeciesCodeType
    type: enum
    description: >-
      Type of species code used for species definition at the record. Use
      'W' for WoRMS AphiaID
    values:
      T: TSN code - should not be used for data submissions
      W: WoRMS AphiaID code
    details: >-
      Legacy field name: SpecCodeType. icesVocab's TS_SpecCodeType resolves
      this as a controlled 2-code species-code-type list. Against the real archive:
      both CA and HL use both codes, a clean bidirectional match.
    constraints:
    - required
  - name: SpeciesCode
    type: number(id)
    description: >-
      Official WoRMS AphiaID code of species reported at the record.
    examples:
    - 213
    - 126326
    - 127118
    - 158513
    - 1667212
    constraints:
    - required
    details: >-
      Legacy field name: SpecCode. Official WoRMS AphiaID as submitted by
      the data provider -- contrast with Valid_Aphia, the ICES Datacenter's own validated/corrected
      version of the same concept, inserted server-side (see Valid_Aphia's own details
      below).
    label: Species (WoRMS AphiaID)
  - name: AreaType
    type: string
    description: >-
      Age sampling aggregation level
    examples:
    - '0'
    - '13'
    - '2'
    - '12'
    - '6'
    details: >-
      Legacy field name: AreaType. Field's own description ('Age sampling
      aggregation level') doesn't explain what the codes themselves mean, but icesVocab's
      TS_AreaType resolves them: '0'=ICES Statistical Rectangles, '2'=Standard
      NS Roundfish Areas, '6'=EVHOE areas, '12'=Spanish North Areas, '13'=ICES
      Divisions. Not retyped enum because TS_AreaType has 27 official codes total,
      over the seed's own VOCAB_CODE_LIMIT (20, data-raw/spec/spec_01_seed_dict.R)
      for a usable `values` map -- and the true domain genuinely is wider than what's
      observed here (17 of 27 codes appear in this archive). Of 5,968,027 rows, the
      -9 sentinel is substantial (1,978,894 rows, 33.16%), 0 true nulls as submitted;
      null in the published archive.
    todo: ICES's field-description spreadsheet marks this Mandatory, but 33.2% of
      CA's real archive rows are null -- a genuine gap between documented and actual
      submission behavior, not yet added as `required` pending review (see data-raw/audit/build_field_gap_audit.R).
  - name: AreaCode
    type: string
    description: >-
      Area coding according to AreaType
    examples:
    - VIa
    - 38G3
    - 43G1
    - 37G1
    - 44G0
    details: >-
      Legacy field name: AreaCode. Field's own description says coding is
      'according to AreaType' (its sibling field) -- meaning depends on that field's
      own value, same pattern as LngtClass/LngtCode. Codes mix ICES-area style (VIIg)
      and rectangle-like style (38G3). Of 5,968,027 rows, the -9 sentinel is dominant
      (1,894,960 rows, 31.75%); null in the published archive. No icesVocab entry
      exists for this field under any name.
    todo: ICES's field-description spreadsheet marks this Mandatory, but 31.8% of
      CA's real archive rows are null -- a genuine gap between documented and actual
      submission behavior, not yet added as `required` pending review (see data-raw/audit/build_field_gap_audit.R).
  - name: LengthCode
    type: enum
    description: >-
      Measurement accuracy used for the LngtClass (mm, 0.5 cm, cm, 5 cm).
      Survey and species specific, see survey manuals for further details. When measured
      to the mm or 0.5 below: report LngtClass as mm (10.1=101), for cm and 5 cm report
      cm in LngtClass
    values:
      '.': '1 mm length class, reporting units: mm'
      '0': '0.5 cm length class, reporting units: mm'
      '1': '1 cm length class, reporting units: cm'
      '5': '5 cm length class, reporting units: cm'
    todo: Confirm whether -9 is a genuine LengthCode code or just the generic missing-value
      sentinel -- no icesVocab key resolves for this field under either name, so nothing
      external confirms it either way.
    details: >-
      Legacy field name: LngtCode. icesVocab's TS_LngtCode resolves this
      as a controlled 7-code length-measurement-type list. Against the real archive:
      CA uses 4 of 7 codes, HL uses 5 of 7; 0 real values fall outside the vocab in
      either table. values: restricted to the 4 code(s) observed in this table's
      published archive (icesVocab's TS_LngtCode defines 7 in total). A value outside
      this list in new data fails D04 enum validation and needs review: data error
      or a genuinely new code.
    constraints:
    - required
  - name: LengthClass
    type: number(quantity)
    description: >-
      Lower length boundary of the Length class. In cm or mm depending
      on the LngtCode. E.g. 10-11 cm=10
    range:
    - 0
    - 5630
    details: >-
      Legacy field name: LngtClass. Unit varies by the sibling LngtCode field
      (mm or cm; see LngtCode's own values map), so no fixed units here. One isolated
      outlier excluded: 932 (LngtCode '1', i.e. 9.32m) -- a lone occurrence with
      a 2.3x gap to the next-highest value (405). Curated separately from HL's own
      LngtClass: CA's population is aged individuals only, a different (and differently
      distributed) subset from HL's whole-catch length-frequency tally, so the two
      are not assumed identical.
    label: Length Class (cm)
    constraints:
    - required
    - assert: LengthClass >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
  - name: IndividualSex
    type: enum
    description: >-
      Gender of the described species category. In CA-records should be
      defined by dissection. If no determination was performed, report '-9'. If determination
      failed, report 'U'.
    values:
      B: Berried
      F: Female
      M: Male
      U: Unidentified
    details: >-
      Legacy field name: Sex. icesVocab's TS_Sex resolves this as a controlled
      7-code list (AC_Sex also registered, never the right prefix for a DATRAS field
      -- Issue 8). Against the real archive: both CA and HL use 5 of the 7 codes;
      0 real values fall outside the vocab in either table. values: restricted to
      the 4 code(s) observed in this table's published archive (icesVocab's TS_Sex
      defines 7 in total). A value outside this list in new data fails D04 enum validation
      and needs review: data error or a genuinely new code.
  - name: IndividualMaturity
    type: string
    description: >-
      Sexual maturation of the individual(s) measured. Often needs dissection,
      but not for e.g. male elasmobranchs. MaturityScale should be filled in when
      filling in Maturity.
    examples:
    - '61'
    - '62'
    - '1'
    - '2'
    - 'B'
    details: >-
      Legacy field name: Maturity. Field's own description says the scheme
      depends on the sibling MaturityScale field ('MaturityScale should be filled
      in when...') -- explains the observed mix of numeric (61, 62, 1, 2) and letter
      (B, A) codes, different maturity scales using different code sets, not an inconsistency.
      Of 5,968,027 rows: the -9 sentinel is dominant (3,174,127 rows, 53.19%) -- 0
      true nulls as submitted; null in the published archive.
  - name: AgePlusGroup
    type: enum
    description: >-
      Records with high age categories can be grouped into the Plus group.
      If the plus group age is specified, no higher ages can be reported for the species
      in the haul.
    values:
      '-9': No plus group
      +: Age plus group
    todo: Confirm whether -9 (99.92% of non-null rows) is a genuine AgePlusGroup code
      or just the generic missing-value sentinel -- the resolved vocab key (AC_AgePlusGroup)
      has no -9 code at all, so nothing external confirms it either way.
    details: >-
      Legacy field name: PlusGr. icesVocab's TS_PlusGr resolves this as a
      controlled 2-code list. Against the real CA archive: both codes in use, 0 real
      values outside the vocab.
  - name: Age
    type: number(quantity)
    units: years
    range:
    - 0
    - 99
    details: >-
      Legacy field name: Age. -9 (2,049,182 rows, 34.34% of all 5,968,027
      CA rows) reads as the standard DATRAS 'not recorded' convention and is excluded
      on the same basis as the -1/-5/-95 cluster below, just far larger. -1 (1757
      rows) reads as a systematic, undocumented 'not determined' sentinel; -5 and
      -95 (1 row each) are isolated anomalies -- all three excluded. 99 (54 rows)
      is kept: real, repeated support, not a fluke -- reads like a plus-group/max-age
      reporting convention, though that mechanism isn't confirmed here, just noted
      as an observation. ICES's getDatrasFieldList documents a field 'IndividualAge'
      for CA, paired with old-name 'AgeRings' -- but 'AgeRings' is not a real
      CA field (the real field is 'Age', used here). Since that row's old-name
      half is already wrong, its proposed new name isn't trusted either.
    todo: Confirm with a domain expert whether Age=99 (54 rows) is a genuine plus-group/max-age
      reporting convention, or should be treated as a placeholder like the -1/-5/-9/-95
      sentinels above.
    constraints:
    - assert: Age >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
  - name: NumberAtLength
    type: number(quantity)
    description: >-
      Amount of fish at the given category (per haul, species, length class,
      sex, maturity, age).
    range:
    - 1
    - 218
    details: >-
      Legacy field name: CANoAtLngt. Distinct population from HL's own NumberAtLength
      (HLNoAtLngt): this counts aged individuals only, not the whole catch, hence
      the much smaller scale -- not assumed identical.
    constraints:
    - required
    - assert: NumberAtLength >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
  - name: IndividualWeight
    type: number(quantity)
    description: >-
      Measured individual weight of the fish (grams)
    units: g
    range:
    - 0.0
    - 97000.0
    constraints:
    - assert: IndividualWeight >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
    details: >-
      Legacy field name: IndWgt.
  - name: FishID
    type: string
    description: >-
      Fish identification number - running sampling number of the specimen
    examples:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    details: >-
      Legacy field name: FishID. Field's own description ('Fish identification
      number - running sampling number of the specimen') confirms a real per-specimen
      sequence, open-ended and illustrative only, not an exhaustive domain. Of 5,968,027
      rows, the -9 sentinel is dominant (4,849,351 rows, 81.26%), null in the published
      archive; real per-specimen IDs make up the remaining ~19%. No icesVocab entry
      exists for this field under any name -- expected for a plain sequential identifier,
      not a coded field.
  - name: GeneticSamplingFlag
    type: enum
    description: >-
      Flag whether genetic sample was taken
    values:
    - 'Y'
    - 'N'
    details: >-
      Legacy field name: GenSamp. Field's own description ('Flag whether
      genetic sample was taken') confirms boolean intent. Of 5,968,027 rows: the
      -9 sentinel is dominant (5,124,687 rows, 85.87%, null in the published archive);
      N: 829,547 (13.90%); Y: 13,793 (0.23%); zero other values. No icesVocab entry
      exists for this field under either name -- -9 reads as the standard generic-missing
      sentinel, the only meaning a simple boolean flag has room for. values: restricted
      to the 2 code(s) observed in this table's published archive. A value outside
      this list in new data fails D04 enum validation and needs review: data error
      or a genuinely new code.
  - name: StomachSamplingFlag
    type: enum
    description: >-
      Flag whether stomach sampling was performed
    values:
    - 'Y'
    - 'N'
    details: >-
      Legacy field name: StomSamp. Field's own description ('Flag whether
      stomach sampling was performed') confirms boolean intent. Of the full CA archive:
      -9 is present and dominant (4,910,588 rows, 82.28%); N: 964,090 (16.4%); Y:
      39,403 (0.67%); zero other values. Same 'no vocab exists' / generic-missing
      reasoning as GenSamp above. values: restricted to the 2 code(s) observed in
      this table's published archive. A value outside this list in new data fails
      D04 enum validation and needs review: data error or a genuinely new code.
  - name: AgeSource
    type: enum
    description: >-
      Biological sample type
    values:
      otolith: Otolith
    details: >-
      Legacy field name: AgeSource. Seeded from TS_AgeSource (name-match to
      the field), but that key's OWN icesVocab description is a redirect: 'see SampleType',
      not an authoritative code list in its own right. Real CA archive data: only
      -9 (4,757,200 rows) and the literal word 'otolith' (1,107,876 rows, lowercase)
      appear -- zero overlap with TS_AgeSource's own LB/OT/SC/VR codes. SampleType
      (bare prefix, the redirect target) resolves the discrepancy exactly: its own
      code list includes 'otolith' verbatim, lowercase, as the code itself (not
      just the description) -- an exact match, not a coincidence. Not an ICES-reportable
      gap in the vocab's actual coverage, since icesVocab does have the right codes
      once the redirect is followed. values: restricted to the 1 code(s) observed
      in this table's published archive (icesVocab's SampleType defines 21 in total).
      A value outside this list in new data fails D04 enum validation and needs review:
      data error or a genuinely new code.
    label: Age Determination Method
  - name: AgePreparationMethod
    type: enum
    description: >-
      Preparation method of the sampled tissue
    values:
      AL: Whole untreated
      ALEt: Whole in Ethanol
      ALR: Whole in resin
      BB: Broken and burnt
      Br: Broken
      Se: Sectioned
      SS: Sectioned and stained
    details: >-
      Legacy field name: AgePrepMet. Same redirect pattern as AgeSource above:
      seeded from TS_AgePrepMet (name-match), but that key's own icesVocab description
      says 'see PreparationMethod', not an authoritative list itself. Real CA archive
      data: -9, AL, ALEt, ALR, BB, Br, SS, Se -- zero overlap with TS_AgePrepMet's
      own codes. PreparationMethod (bare prefix, the redirect target, 48 codes) contains
      every one of these real values exactly -- an opus-side vocab-key resolution
      fix, not an ICES-reportable gap. values: restricted to the 7 code(s) observed
      in this table's published archive (icesVocab's PreparationMethod defines 47
      in total). A value outside this list in new data fails D04 enum validation and
      needs review: data error or a genuinely new code.
    label: Specimen Preparation for Aging
  - name: OtolithGrading
    type: enum
    description: >-
      Grading of the otolith reading
    values:
      '1': Rings can be counted with certainty
      '2': Rings can be counted, but with difficulty and some doubt
      '3': Rings can not be counted, the calcified structure is considered unreadable
        (no age assigned).
      '4': Rings can not be counted, the calcified structure is considered unreadable,
        age assigned for QA purposes only.
    details: >-
      Legacy field name: OtGrading. icesVocab's TS_OtGrading resolves this
      as a controlled 5-code otolith-grading list. Against the real CA archive: all
      5 codes in use, a clean bidirectional match. values: restricted to the 4 code(s)
      observed in this table's published archive (icesVocab's TS_OtGrading defines
      5 in total). A value outside this list in new data fails D04 enum validation
      and needs review: data error or a genuinely new code.
  - name: ParasiteSamplingFlag
    type: enum
    description: >-
      Flag whether parasites sampling was performed
    values:
    - 'Y'
    - 'N'
    details: >-
      Legacy field name: ParSamp. Field's own description ('Flag whether
      parasites sampling was performed') confirms boolean intent. Of the full CA
      archive: -9 is present and dominant (4,997,617 rows, 83.74%); N: 839,844 (14.3%);
      Y: 76,620 (1.31%); zero other values. Same 'no vocab exists' / generic-missing
      reasoning as GenSamp above. values: restricted to the 2 code(s) observed in
      this table's published archive. A value outside this list in new data fails
      D04 enum validation and needs review: data error or a genuinely new code.
  - name: MaturityScale
    type: enum
    description: >-
      Maturity scale type used in the Maturity field. From 2021 only M6
      and SMSF will be accepted for new submissions.
    values:
      M6: Six-stage international maturity scale
      R1: RIVO 4-stage scale - OLD
      R2: RIVO 4-stage scale - NEW
      SMSF: WKASMSF 2018 scale
    details: >-
      Legacy field name: MaturityScale. icesVocab's TS_MaturityScale resolves
      this as a controlled 11-code maturity-scale-identifier list. Against the real
      CA archive: 5 of 11 codes in use, 0 real values outside the vocab. values: restricted
      to the 4 code(s) observed in this table's published archive (icesVocab's TS_MaturityScale
      defines 11 in total). A value outside this list in new data fails D04 enum validation
      and needs review: data error or a genuinely new code.
    todo: ICES's field-description spreadsheet marks this Mandatory, but 80.0% of
      CA's real archive rows are null -- a genuine gap between documented and actual
      submission behavior, not yet added as `required` pending review (see data-raw/audit/build_field_gap_audit.R).
  - name: DateofCalculation
    type: date
    range:
    - '2012-04-19'
    - .inf
    details: >-
      Legacy field name: DateofCalculation. 8-digit YYYYMMDD stamp, digit
      order (month before day) verified consistent across all four Tier 1 tables.
      Upper bound deliberately left open: a live, continuously-advancing ICES Datacenter
      'last recalculated' stamp, not submitted by data providers, so a fixed max
      would go stale immediately. Lower bound is this table's own verified minimum
      -- NOT forced identical across tables the way SweepLngt/HaulNo/Year are, since
      a genuine table-specific difference is plausible here (confirmed: LT's own
      minimum is years later). A -9 sentinel (337,562 rows, 5.76% of non-null; already
      excluded by the lower bound above) reads as the standard DATRAS 'not recorded'
      convention for this server-computed field -- not yet (re)calculated for this
      record.
  - name: Valid_Aphia
    type: number(id)
    details: >-
      Legacy field name: Valid_Aphia. See known issue valid_aphia_type_mismatch
      (DATRAS-known-issues.yaml, not yet filed): ICES's WSDL declares this field
      character, but the live service always returns it numeric -- it's a WoRMS AphiaID
      (an identifier, hence number(id), not a quantity). Same concept as HL's Valid_Aphia
      (ICES Datacenter's validated AphiaID) but a different sampling population (aged
      individuals only), so queried independently rather than assumed identical to
      HL's own. 667 distinct values, 0 unpopulated (always present).
    examples:
    - 213
    - 105872
    - 126412
    - 141452
    - 1667212
  label: Age Composition (Individual)
  description: >-
    Each row is one aged fish specimen from a haul. Contains individual-level
    biological measurements (length, weight, age, sex, maturity) on a subsample of
    the catch; linked to HH via the composite haul identifier.
  details: >-
    Grain: each row is one biological specimen (a single aged fish) from a
    haul. Population: individual organisms sampled and measured from hauls within
    covered surveys, not the full catch — a subsample. Linked to HH via the composite
    haul identifier (Survey + Year + Quarter + Country + Platform/Ship + Gear + StationName/StNo
    + HaulNumber). Note (see DATRAS-known-issues.yaml issue ca_haulno_unlinkable_to_hh):
    as submitted, HaulNumber/HaulNo contains 0 true nulls -- 305,276 rows (5.12% of
    5,968,027) instead carry a -9 sentinel, which violates the column's declared
    range ([0, 82483]; a D04_range violation, confirmed via op_flag_violations()),
    not the required constraint (D01 never fires here). These rows match no HH haul
    on the full 8-field composite key, or on the 7 non-HaulNumber fields alone --
    not a join-key problem, but genuinely orphaned CA records. A separate, much smaller
    residual (700 rows, 0.01%) with a plausible HaulNumber also fails to match HH.
  origin: data-raw/spec/spec_02_curate_dict.R
  todo: 'Diagnose the 700-row (0.01%) HaulNumber tail-mismatch residual (known-issues.yaml:
    ca_haulno_tail_mismatch) -- distinct from the -9 sentinel issue above, cause not
    yet found.'
  definitions:
  - name: linkable_to_hh
    description: >-
      Rows carrying a haul number, and so joinable to a single HH haul
      via the 8-field composite key. Names which rows a haul-level join reaches; it
      is NOT a data-quality filter, and the rows it excludes must not be discarded.
    details: |-
      What the excluded rows actually are: 305,276 of 5,968,027 CA rows (5.12%) have no HaulNumber, and they are real observations, not damaged records. 305,146 of them carry an Age, all 305,276 carry a NumberAtLength, and together they hold 599,407 aged fish across 6 surveys and the years 1965-2021. Every one of them has a non-null AreaType -- they are attributed to an area rather than to a haul, which is a coarser grain, not a defect. Filtering them away to make a join work silently deletes those fish from any total computed afterwards. Account for them at area grain; do not drop them.
      Tests IS NOT NULL, not != -9, because this describes the *published archive* rather than the submitted exchange file. HaulNumber is sentinel policy 'strip' (op_sentinel_policy("CA")), so the -9s are already null by the time anything reads this, and zero rows hold a literal -9. The former `HaulNumber != -9` matched nothing it was written to match; it still filtered correctly only by accident, because null propagates through != and both dplyr and SQL then drop the row -- and it would have started silently keeping those rows the moment the policy changed to 'keep'. Corrected 2026-08-29, found by cross-checking this definition against the sentinel policy now embedded in the same parquet footer.
    expr: HaulNumber IS NOT NULL
- name: LT
  columns:
  - name: Survey
    type: string
    examples:
    - NS-IBTS
    - BTS
    - BITS
    - 'DYFS'
    - Can-Mar
    details: >-
      Legacy field name: Survey. 29 distinct values in HH's archive; ICES
      DATRAS survey acronym, an open list, not a fixed enum. icesVocab DOES resolve
      a 'Survey' key by name but it's a false lead, not this field's source: its
      133 codes are ICES's own cross-domain internal survey IDs (e.g. 'A1012'),
      a completely different scheme from DATRAS's own short acronyms -- confirmed
      by checking real codes against it directly, not assumed. Not used.
    constraints:
    - required
    - foreign_key
  - name: Quarter
    type: number(ordinal)
    description: >-
      Cruise quarter. Hauls outside of the calendar quarter can be reported
      with the same quarter reference, if agreed by the survey group.
    range:
    - 1
    - 4
    details: >-
      Legacy field name: Quarter. Retyped from enum to number(ordinal) 2026-08-29,
      resolving a standing M01: the live WSDL declares this int, the archive stores
      it int, and an enum's underlying data must be string-like (data-dict validation.md,
      "Enum membership"). The former values: map ('1' -> '1. quarter') carried
      nothing the number itself does not, so no information is lost -- unlike Tickler
      and CatIdentifier, whose code labels are load-bearing and which therefore stay
      enums stored as strings. icesVocab's TS_Quarter also resolves this field (a
      bare 'Quarter' key is separately registered too, redundant with TS_Quarter).
      Against the real archive: CA, HH, and HL each use all 4 codes; LT uses 3 of
      4. 0 real values fall outside the vocab in any table.
    constraints:
    - required
    - foreign_key
  - name: Year
    type: number(ordinal)
    description: >-
      Cruise year (YYYY)
    range:
    - 1965
    - 2026
    constraints:
    - required
    - foreign_key
    details: >-
      Legacy field name: Year.
  - name: Platform
    type: string
    examples:
    - '74E9'
    - '26D4'
    - 748S
    - 64SS
    - 18NE
    details: >-
      Legacy field name: Ship. 110 distinct values in HH's archive; SeaDataNet
      ship/platform codes, an open list, not a fixed enum.
    description: >-
      SeaDataNet Ship and Platform Codes
    constraints:
    - required
    - foreign_key
  - name: Gear
    type: enum
    description: >-
      Gear type code
    values:
      BAK: Baka trawl
      BT4A: Four m Beam trawl, aft
      BT4AI: Four m Beam trawl, aft - in IrishSea q3 BTS
      BT4P: Four m Beam Trawl, port
      BT4S: Four m Beam Trawl, starboard
      BT6: Beam trawl 6 meters
      BT7: Seven m Beam trawl
      BT8: Eight m Beam trawl
      GOV: GOV Trawl
      JTDS: Jackson Trawl Downscaled
      NCT: Norwegian Campell Trawl 1800/96
      PORB: Porcupine Baka
      TVL: Large TV trawl
      TVS: Small TV trawl
    details: >-
      Legacy field name: Gear. All 99 active icesVocab Gear Type codes (deprecated
      code OTG excluded). 55 confirmed used in DATRAS archive; 44 additional codes
      are valid ICES definitions (may be used in future submissions or by other surveys).
      Each code has a full description in icesVocab. Validation: enum restricts submissions
      to these codes. values: restricted to the 14 code(s) observed in this table's
      published archive (icesVocab's Gear defines 99 in total). A value outside this
      list in new data fails D04 enum validation and needs review: data error or a
      genuinely new code.
    constraints:
    - required
    - foreign_key
  - name: Country
    type: string
    description: >-
      ISO 3166 country codes and region codes used by ICES
    examples:
    - NL
    - 'DE'
    - GB
    - 'DK'
    - GB-SCT
    details: >-
      Legacy field name: Country. 22 distinct values in HH's archive; 'GB-SCT'
      illustrates that this is ISO 3166 codes PLUS ICES's own sub-national region
      codes (per the field's own description), not plain ISO 3166 alone. icesVocab
      DOES resolve a 'TS_Country' key by name but it's a false lead too, same as
      Survey above: its 25 codes are 3-letter (e.g. 'BEL', 'DEN', 'ENG'), a
      different scheme entirely from this field's own 2-letter-plus-region codes
      -- confirmed by checking real codes against it directly. Not used.
    constraints:
    - required
    - foreign_key
  - name: StationName
    type: string
    examples:
    - '1'
    - '2'
    - '22'
    - '9'
    - '17'
    details: >-
      Legacy field name: StNo. Field's own description says this is a national
      coding system, not defined by ICES -- examples show the common shape (short
      numeric-looking strings), not an exhaustive domain; not a coded field, so no
      icesVocab entry is expected (none of the 580 registered vocab keys match). Of
      150,217 HH rows (24,484 distinct values), -9 accounts for exactly 6,899, stripped
      to null in the published archive. ICES's own field-description spreadsheet
      confirms the ICES-wide '-9 = no information' convention applies here, same
      as HaulNo above. Unlike HaulNo's own -9 sentinel, this isn't an orphaning
      problem: CA's own matching StNo=-9 rows for these same hauls (191,893 rows)
      join HH successfully via the other 7 composite-key fields, since both sides
      consistently carry -9 for the same haul rather than disagreeing.
    description: >-
      Station number. National coding system, not defined by ICES.
    constraints:
    - required
    - foreign_key
  - name: HaulNumber
    type: number(ordinal)
    range:
    - 0
    - 82483
    constraints:
    - required
    - foreign_key
    details: >-
      Legacy field name: HaulNo. Sequential per-cruise numbering, but countries
      vary in whether it resets each cruise or runs continuously -- the archive-wide
      range spans many cruises' own counts pooled together, not one cruise's own
      haul tally. No icesVocab entry exists under any name or prefix (none of the
      580 registered vocab keys match) -- expected for a plain sequential identifier,
      not a coded field. ICES's own field-description spreadsheet confirms Mandatory:
      Yes and documents an ICES-wide convention applicable to any field with a header:
      submit -9 for 'no information' -- so the -9 sentinel seen in CA (see known-issues.yaml:
      ca_haulno_unlinkable_to_hh) is a sanctioned value, not an undocumented one.
    description: >-
      Sequential numbering of hauls during cruise.
  - name: ShootLatitude
    type: number(quantity)
    units: decimal degrees
    range:
    - 36.0013
    - 76.2117
    description: >-
      Decimal latitude position on the shooting location
    details: >-
      Legacy field name: ShootLat.
  - name: ShootLongitude
    type: number(quantity)
    units: decimal degrees
    range:
    - -67.7115
    - 24.4333
    details: >-
      Legacy field name: ShootLong. A genuine value of exactly -9.0000 degrees
      (9 deg W, an ordinary DATRAS longitude off Ireland/Iberia) would be indistinguishable
      from missing here: icesDatras's fetch pipeline scrubs literal -9 to NA for
      every numeric column, not just where -9 is a documented sentinel.
    description: >-
      Decimal longitude position on the shooting location
  - name: HaulLatitude
    type: number(quantity)
    units: decimal degrees
    range:
    - 36.0013
    - 65.0
    details: >-
      Legacy field name: HaulLat. 3 rows record exactly 0 degrees (the equator),
      categorically outside any DATRAS survey area -- excluded; the lower bound instead
      matches ShootLat's own clean minimum for the same archive.
    description: >-
      Decimal latitude position on the hauling location
  - name: HaulLongitude
    type: number(quantity)
    units: decimal degrees
    range:
    - -67.6762
    - 45.8753
    details: >-
      Legacy field name: HaulLong. Same -9-as-missing caveat as ShootLong
      above (0 degrees, the Prime Meridian, is a genuine North Sea value here and
      is kept).
    description: >-
      Decimal longitude position on the hauling location
  - name: OSPARArea
    type: string
    examples:
    - II
    - III
    - IV
    - V
    details: >-
      Legacy field name: OSPARArea. OSPAR maritime area code (Roman-numeral
      regions); 4 distinct values observed, 14,498 of 79,451 rows unpopulated. No
      description present to confirm whether this is the complete official OSPAR region
      set.
  - name: MSFDArea
    type: string
    examples:
    - North-east Atlantic Ocean
    - Baltic Sea
    details: >-
      Legacy field name: MSFDArea. Marine Strategy Framework Directive region
      name; only 2 distinct values observed, 4,295 of 79,451 rows unpopulated. The
      EU MSFD framework has more than two regions overall -- DATRAS's own survey
      coverage may simply never reach the others, so not treated as a closed/exhaustive
      set.
  - name: BottomDepth
    type: number(quantity)
    units: m
    range:
    - 1.0
    - 3098.0
    details: >-
      Legacy field name: BottomDepth. -9 is the ICES-wide sanctioned 'no
      information' convention (data-raw/audit/build_field_description_snapshot.R):
      163 of 79,451 rows (0.21%), 0 true nulls as submitted; null in the published
      archive. Not a rename -- BottomDepth is already the raw ICES field name in LT's
      archive. It sits alongside this table's own separate Depth field, byte-for-byte
      identical to it (see Depth's own details): a known ICES-side redundancy, not
      a rename relationship (see Issue 6 in the issues report).
    description: >-
      Sampling depth in metres, measured from the water surface.
    constraints:
    - assert: BottomDepth >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
  - name: Distance
    type: number(quantity)
    units: m
    range:
    - 0
    - 59995
    details: >-
      Legacy field name: Distance. -9 is the ICES-wide sanctioned 'no information'
      convention (data-raw/audit/build_field_description_snapshot.R): HH 25,874/150,217
      rows (17.22%), LT 2,707/79,451 rows (3.41%), 0 true nulls as submitted, so these
      counts are the -9s, stripped to null in the published archive.
    description: >-
      Distance in metres between haul start and haul end point.
    constraints:
    - assert: Distance >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
  - name: DoorSpread
    type: number(quantity)
    units: m
    range:
    - 1.0
    - 250.0
    details: >-
      Legacy field name: DoorSpread. 0m (9 rows) is excluded as a placeholder
      -- a rigged, towing trawl cannot have zero door spread. Three single-occurrence
      values (762, 767, 778m) sit far above everything else in the archive (next highest
      is 250m) and are treated as data-entry errors, excluded; a real, well-populated
      value at 3.6m (1128 rows, likely a fixed beam-trawl spread) is kept. -9 is the
      ICES-wide sanctioned 'no information' convention (data-raw/audit/build_field_description_snapshot.R):
      HH 85,063/150,217 rows (56.63%), LT 34,982/79,451 rows (44.03%), 0 true nulls
      as submitted, so these counts are the -9s, stripped to null in the published
      archive -- already excluded by the range above.
    description: >-
      Mean value in metres of door spread measurements.
    constraints:
    - assert: DoorSpread >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
  - name: WingSpread
    type: number(quantity)
    units: m
    range:
    - 4.0
    - 50.0
    details: >-
      Legacy field name: WingSpread. 0m (9 rows), 1.8m and 2m (1 row each)
