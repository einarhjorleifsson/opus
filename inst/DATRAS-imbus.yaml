      Legacy field name: TowDir. 999 (3 rows) reads as an undocumented out-of-domain
      'not recorded' marker, the same pattern confirmed for WindDir below. A further
      cluster -- 450 deg (62 rows), 520(5), 460(5), 540(3), 510, 564, 702 (1 each)
      -- divided by 10 becomes ordinary bearings (45.0, 52.0, 46.0, 54.0, 51.0, 56.4,
      70.2 deg). Both groups are outside the documented 0-360 domain and excluded
      here. -9 is the ICES-wide sanctioned 'no information' convention (data-raw/audit/build_field_description_snapshot.R):
      HH 51,855/150,217 rows (34.52%), LT 6,851/79,451 rows (8.62%), 0 true nulls
      as submitted, so these counts are the -9s, stripped to null in the published
      archive -- already excluded by the range above.
    todo: Confirm the divide-by-10 cluster (450/520/460/540/510/564/702) is a genuine
      data-entry pattern by correlating with Country/Survey -- same class of check
      already confirmed for SwellHeight via its WindSpeed co-parameter.
    description: >-
      Direction of towing in degrees. 360=direction from south to north.
  - name: SpeedGround
    type: number(quantity)
    units: knots
    range:
    - 0.0
    - 10.0
    details: >-
      Legacy field name: GroundSpeed. Ceiling is a domain judgment (real trawling
      ground speed), not an observed cluster boundary -- observed values run 10.8
      up to a 99.9 marker with no clean gap, all excluded. -9 is the ICES-wide sanctioned
      'no information' convention (data-raw/audit/build_field_description_snapshot.R):
      HH 58,306/150,217 rows (38.81%), LT 14,867/79,451 rows (18.71%), 0 true nulls
      as submitted, so these counts are the -9s, stripped to null in the published
      archive -- already excluded by the range above.
    description: >-
      Ground speed of towing in knots. Recommended speed depends on survey,
      see survey manuals for more details
    constraints:
    - assert: SpeedGround >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
  - name: SpeedWater
    type: number(quantity)
    units: knots
    range:
    - 0.0
    - 22.0
    details: >-
      Legacy field name: SpeedWater. -9 is the ICES-wide sanctioned 'no information'
      convention (data-raw/audit/build_field_description_snapshot.R): HH 134,829/150,217
      rows (89.76%), LT 67,354/79,451 rows (84.77%), 0 true nulls as submitted, so
      these counts are the -9s, stripped to null in the published archive -- the modal
      value in both tables, not the exception.
    description: >-
      Trawl speed on water in knots.
    constraints:
    - assert: SpeedWater >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
  - name: WindDirection
    type: number(quantity)
    units: degrees
    range:
    - -1
    - 360
    details: >-
      Legacy field name: WindDir. -1 is documented ('varying direction').
      999 (57 rows) reads as an undocumented out-of-domain 'not recorded' marker;
      a handful of further single-occurrence values just above 360 (711, 504, 420,
      365, 361) are also excluded. -9 is ALSO present and is the ICES-wide sanctioned
      'no information' convention (data-raw/audit/build_field_description_snapshot.R):
      HH 41,830/150,217 rows (27.85%), LT 12,326/79,451 rows (15.51%), 0 true nulls
      as submitted, so these counts are the -9s, stripped to null in the published
      archive -- already excluded by the range above (unlike -1, which the range explicitly
      keeps).
    description: >-
      Direction of wind in degrees. Calm = 0,  direction from north to
      south = 360, varying direction = -1
  - name: WindSpeed
    type: number(quantity)
    units: m/s
    range:
    - 0
    - 28
    details: >-
      Legacy field name: WindSpeed. Ceiling follows the Beaufort 10 upper
      bound (28.4 m/s, storm force) -- no vessel would be actively trawling above
      this. Excluding the -9 sentinel: HH 1,407 of 106,109 real measurements (1.33%)
      exceed it, up to a max of 342 m/s; LT 1,149 of 64,985 (1.77%), up to 77 m/s.
      Both tail off smoothly, consistent with a real distribution below and noise
      above.
    description: >-
      Speed of wind in metres/sec.
    constraints:
    - assert: WindSpeed >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
  - name: SwellDirection
    type: number(quantity)
    units: degrees
    range:
    - 0
    - 360
    details: >-
      Legacy field name: SwellDir. -9 is the ICES-wide sanctioned 'no information'
      convention (data-raw/audit/build_field_description_snapshot.R): HH 123,921/150,217
      rows (82.49%), LT 52,150/79,451 rows (65.64%), 0 true nulls as submitted, so
      these counts are the -9s, stripped to null in the published archive -- the modal
      value in both tables, not the exception.
    description: >-
      Direction of swell in degrees. No movement=0, direction from south
      to north = 360, varying direction = -1
  - name: SwellHeight
    type: number(quantity)
    units: m
    range:
    - 0.0
    - 13.0
    details: >-
      Legacy field name: SwellHeight. See known issue swell_height_type_mismatch
      (DATRAS-known-issues.yaml, not yet filed): Same known issue as HH's own SwellHeight
      above (icesVocab declares a single unprefixed 'SwellHeight' key, an enum of
      H/L/M/N/NR/VH height classes -- the seed stage applies it here too since the
      key resolves the same way for LT). This field is not independently observed
      by LT: it is HH's own SwellHeight, recorded again on the LT record for the
      same haul -- joining LT to HH on the full 8-field composite key, 38,100 of 38,100
      rows where both are non-null carry an identical value, zero exceptions. Range,
      exclusion boundary, and evidence (including the WindSpeed co-parameter check)
      are therefore HH's, not independently re-derived here -- see HH's own SwellHeight
      entry above for the full reasoning.
    description: >-
      Height of (swell) waves, in metres
    constraints:
    - assert: SwellHeight >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
  - name: CodendMesh
    type: number(quantity)
    units: mm
    range:
    - 9
    - 100
    details: >-
      Legacy field name: CodendMesh. 0mm (202 rows) excluded as a placeholder
      -- a codend by definition has some mesh size. 250mm (1 row) sits far above the
      next-highest real value (100mm, 644 rows) and is treated as a data-entry error,
      excluded. -9 is the ICES-wide sanctioned 'no information' convention (data-raw/audit/build_field_description_snapshot.R):
      HH 107,827/150,217 rows (71.78%), LT 55,200/79,451 rows (69.48%), 0 true nulls
      as submitted, so these counts are the -9s, stripped to null in the published
      archive -- the modal value in both tables, already excluded by the range above.
    description: >-
      Codend mesh size in mm
    constraints:
    - assert: CodendMesh >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
  - name: EEZ
    type: string
    examples:
    - United Kingdom Exclusive Economic Zone
    - 'Danish Exclusive Economic Zone'
    - French Exclusive Economic Zone
    - Spanish Exclusive Economic Zone
    - Swedish Exclusive Economic Zone
    details: >-
      Legacy field name: EEZ. Exclusive Economic Zone name, no description
      present. 19 distinct values, 162 of 79,451 rows unpopulated. Not treated as
      a closed set -- EEZ coverage in a wider archive could plausibly include zones
      absent from this one.
  - name: NMArea
    type: string
    examples:
    - United Kingdom 12 NM
    - Swedish 12 NM
    - Spanish 12 NM
    - French 12 NM
    - 'Danish 12 NM'
    details: >-
      Legacy field name: NMArea. National 12-nautical-mile zone name (sibling
      concept to EEZ above), no description present. 17 distinct values, 53,303 of
      79,451 rows unpopulated. Not treated as a closed set, same reasoning as EEZ.
  - name: DateofCalculation
    type: date
    details: >-
      Legacy field name: DateofCalculation. See known issue dateofcalculation_type_mismatch
      (DATRAS-known-issues.yaml, not yet filed): ICES's WSDL declares this field
      character for LT's own retrieval operation (getLitterAssessmentOutput), while
      HH/HL/CA's own operations all declare it int/decimal -- but real LT data is
      the identical 8-digit YYYYMMDD stamp (e.g. "20260625"), just returned as a string
      by that one operation. Digit order (month before day) is consistent with HH/HL/CA.
      Same open-upper-bound, ICES-Datacenter-inserted basis as HH/HL/CA's DateofCalculation,
      but this table's OWN verified minimum (2015-11-27) is genuinely years later
      than theirs (2012-04-19) -- consistent with LT/litter reporting being a newer
      addition to DATRAS than the main haul/length/age exchange.
    range:
    - '2015-11-27'
    - .inf
  label: Litter Assessment
  description: >-
    Each row is one litter observation from a haul. Contains types and
    counts of marine debris (plastics, fishing gear, natural/organic material) recorded
    during the catch review; a separate thematic addition to the HH/HL/CA exchange.
  details: >-
    Grain: each row is one litter assessment/observation recorded during a
    haul's catch review. Population: litter records from hauls in covered surveys;
    a thematic addition to the HH/HL/CA core exchange tables with a separate collection
    protocol and scope. Linked to HH via the composite haul identifier (Survey + Year
    + Quarter + Country + Platform/Ship + Gear + StationName/StNo + HaulNumber). Note:
    CA has a verified HaulNumber/HaulNo linkage gap via a -9 sentinel (see CA table
    details); LT's own HaulNumber has no equivalent gap -- zero nulls and zero -9
    values. The full 8-field composite key is required for correct joins regardless:
    852 of 79,451 LT rows (1.07%) don't match any HH haul on it (down from 2,026
    of 75,310 when first measured -- ICES has since supplied part of the missing HH
    submission), but for an unrelated, diagnosed reason (known-issues.yaml: lt_bts_2025_q1_orphaned)
    -- HH's own submission is genuinely missing for that survey/year/quarter, not
    an LT-side data-quality problem.
  origin: data-raw/spec/spec_02_curate_dict.R
relationships:
- join: HL.Survey = HH.Survey AND HL.Year = HH.Year AND HL.Quarter = HH.Quarter AND
    HL.Country = HH.Country AND HL.Platform = HH.Platform AND HL.Gear = HH.Gear AND
    HL.StationName = HH.StationName AND HL.HaulNumber = HH.HaulNumber
  cardinality: many-to-one
  conflicts:
  - RecordHeader
- join: CA.Survey = HH.Survey AND CA.Year = HH.Year AND CA.Quarter = HH.Quarter AND
    CA.Country = HH.Country AND CA.Platform = HH.Platform AND CA.Gear = HH.Gear AND
    CA.StationName = HH.StationName AND CA.HaulNumber = HH.HaulNumber
  cardinality: many-to-one
  conflicts:
  - RecordHeader
  description: >-
    Known gap (see CA table's own details and DATRAS-known-issues.yaml's
    ca_haulno_unlinkable_to_hh): 4.92% of CA rows (288,581 of 5,865,076) carry a -9
    sentinel in HaulNo and match no HH row on this key -- genuinely orphaned CA records,
    not a join-key problem.
- join: LT.Survey = HH.Survey AND LT.Year = HH.Year AND LT.Quarter = HH.Quarter AND
    LT.Country = HH.Country AND LT.Platform = HH.Platform AND LT.Gear = HH.Gear AND
    LT.StationName = HH.StationName AND LT.HaulNumber = HH.HaulNumber
  cardinality: many-to-one
  conflicts:
  - DateofCalculation
glossary:
  Haul: 'A single deployment of a trawl net. The primary unit of observation in DATRAS:
    one haul''s catch (HH record) is subsampled and analyzed into length frequencies
    (HL) and aged individuals (CA).'
  Length-stratified subsample: A subset of fish taken from a haul's catch, selected
    across the full range of observed length classes. Used in CA for cost-efficient
    age sampling without exhaustively aging every fish.
  Valid_Aphia: The ICES Datacenter's server-inserted, validated WoRMS AphiaID for
    each species. May differ from SpecCode (submitted value) due to ICES corrections
    or updates to the WoRMS taxonomy.
  DateofCalculation: The timestamp (YYYYMMDD) when the ICES Datacenter last recalculated
    and reprocessed this record. Not submitted by data providers; inserted and updated
    server-side as part of ICES's QC workflow.
  Litter Assessment: A qualitative and quantitative survey of marine debris (plastics,
    metal, rubber, natural materials, fishing gear) observed in the trawl catch. LT
    records are a thematic extension beyond HH/HL/CA's focus on fishery target species.
  Tier 1: 'The raw, per-haul exchange layer of ICES DATRAS: HH (haul), HL (length
    frequency), CA (aged individuals), and LT (litter). The primary submission format
    from national institutes to ICES.'
  Survey: 'A coordinated research program that conducts regular sampling (e.g., NS-IBTS:
    North Sea International Bottom Trawl Survey). DATRAS is the archive of submissions
    from many regional surveys with different spatial/temporal coverage.'
  icesVocab: ICES's centralized web service for controlled vocabularies (code lists
    and their meanings), keyed by prefixed/unprefixed 'code-types' (e.g. TS_HaulVal,
    Gear). Cross-domain -- DATRAS is only one of several ICES data collections it
    serves, so a key existing under a field's name is not proof it's the right one
    for DATRAS. See AGENTS.md's Key Facts.
  WSDL: 'Web Services Definition Language: the machine-readable contract ICES''s DATRASWebService.asmx
    publishes, describing each operation (getHHdata, getCAdata, etc.) and the field
    types it actually returns. opus''s primary source for field types (Working Principle
    1), generated directly from the live service rather than separately maintained.'
  WoRMS / AphiaID: 'World Register of Marine Species: the taxonomic reference ICES
    validates submitted species codes against. AphiaID is WoRMS''s own numeric species
    identifier -- HL/CA''s Valid_Aphia field carries the ICES Datacenter''s server-validated
    AphiaID, which may differ from the submitter''s own SpecCode.'
  Rule codes (M01/S24/D01/D04): 'Codes from the external data-dict CLI''s own three-tier
    validation (spec/metadata/data), not opus''s invention. S-codes check the YAML
    spec itself (S24: enum values must be quoted strings); M-codes check a column''s
    declared type against its real data (M01: type mismatch, e.g. WSDL int vs. a curated
    enum''s quoted-string values); D-codes check real data against declared constraints
    (D01: null in a required column; D04: value outside range, or not in the declared
    enum). Cited throughout this file''s `details:` as justification for an accepted,
    permanent divergence.'
  CPUE: 'Catch Per Unit Effort: catch quantity normalized by sampling effort (e.g.
    per hour towed), enabling comparison across hauls of different duration/gear.
    A Tier 2 derived product (CPUEL, CPUEA) computed from HH/HL, not part of Tier
    1''s raw exchange data.'
  OSPAR: The Convention for the Protection of the Marine Environment of the North-East
    Atlantic, and the regional body it establishes. LT's OSPARArea field records which
    OSPAR region a haul falls within, for marine-litter reporting under that convention.
  SeaDataNet: A pan-European marine data infrastructure and common-vocabulary network.
    Some ICES/DATRAS reference concepts (e.g. certain parameter codes) trace back
    to SeaDataNet-maintained vocabularies rather than being DATRAS-specific inventions.
