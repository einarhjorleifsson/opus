  - name: AreaType
    type: string
    description: >-
      Age sampling aggregation level
    examples:
    - '0'
    - '13'
    - '2'
    - '12'
    - '6'
    details: >-
      Field's own description ('Age sampling aggregation level') doesn't
      explain what the codes themselves mean, but icesVocab's TS_AreaType resolves
      them: '0'=ICES Statistical Rectangles, '2'=Standard NS Roundfish Areas,
      '6'=EVHOE areas, '12'=Spanish North Areas, '13'=ICES Divisions. Not retyped
      enum because TS_AreaType has 27 official codes total, over the seed's own VOCAB_CODE_LIMIT
      (20, data-raw/spec_01_seed_dict.R) for a usable `values` map -- and the true
      domain genuinely is wider than what's observed here (17 of 27 codes appear
      in this archive). Of 5,865,076 rows, -9 is present and substantial (1,968,019
      rows, 33.55%), 0 true nulls.
    constraints:
    - required
  - name: AreaCode
    type: string
    description: >-
      Area coding according to AreaType
    examples:
    - VIa
    - 38G3
    - 43G1
    - 37G1
    - 44G0
    details: >-
      Field's own description says coding is 'according to AreaType' (its sibling
      field) -- meaning depends on that field's own value, same pattern as LngtClass/LngtCode.
      Codes mix ICES-area style (VIIg) and rectangle-like style (38G3). Of 5,865,076
      rows, -9 is present and dominant (1,891,107 rows, 32.24%), not a null. No icesVocab
      entry exists for this field under any name.
    constraints:
    - required
  - name: LngtCode
    type: enum
    description: >-
      Measurement accuracy used for the LngtClass (mm, 0.5 cm, cm, 5 cm).
      Survey and species specific, see survey manuals for further details. When measured
      to the mm or 0.5 below: report LngtClass as mm (10.1=101), for cm and 5 cm report
      cm in LngtClass
    values:
      '-9': Missing Value
      '.': '1 mm length class, reporting units: mm'
      '0': '0.5 cm length class, reporting units: mm'
      '1': '1 cm length class, reporting units: cm'
      '2': '2 cm length class, reporting units: cm'
      '5': '5 cm length class, reporting units: cm'
      '9': + group
    todo: Confirm whether -9 is a genuine LengthCode code or just the generic missing-value
      sentinel -- no icesVocab key resolves for this field under either name, so nothing
      external confirms it either way.
    details: >-
      icesVocab's TS_LngtCode resolves this as a controlled 7-code length-measurement-type
      list. Against the real archive: CA uses 4 of 7 codes, HL uses 5 of 7; 0 real
      values fall outside the vocab in either table.
    constraints:
    - required
  - name: LngtClass
    type: number(quantity)
    description: >-
      Lower length boundary of the Length class. In cm or mm depending
      on the LngtCode. E.g. 10-11 cm=10
    range:
    - 0
    - 5630
    details: >-
      Unit varies by the sibling LngtCode field (mm or cm; see LngtCode's
      own values map), so no fixed units here. One isolated outlier excluded: 932
      (LngtCode '1', i.e. 9.32m) -- a lone occurrence with a 2.3x gap to the next-highest
      value (405). Curated separately from HL's own LngtClass: CA's population is
      aged individuals only, a different (and differently distributed) subset from
      HL's whole-catch length-frequency tally, so the two are not assumed identical.
    label: Length Class (cm)
    constraints:
    - required
  - name: Sex
    type: enum
    description: >-
      Gender of the described species category. In CA-records should be
      defined by dissection. If no determination was performed, report '-9'. If determination
      failed, report 'U'.
    values:
      '-9': not sampled
      B: Berried
      F: Female
      M: Male
      'N': Not included when calculating data
      T: Neutral
      U: Unidentified
    details: >-
      icesVocab's TS_Sex resolves this as a controlled 7-code list (AC_Sex
      also registered, never the right prefix for a DATRAS field -- Issue 8). Against
      the real archive: both CA and HL use 5 of the 7 codes; 0 real values fall outside
      the vocab in either table.
  - name: Maturity
    type: string
    description: >-
      Sexual maturation of the individual(s) measured. Often needs dissection,
      but not for e.g. male elasmobranchs. MaturityScale should be filled in when
      filling in Maturity.
    examples:
    - '61'
    - '62'
    - '1'
    - '2'
    - 'B'
    details: >-
      Field's own description says the scheme depends on the sibling MaturityScale
      field ('MaturityScale should be filled in when...') -- explains the observed
      mix of numeric (61, 62, 1, 2) and letter (B, A) codes, different maturity scales
      using different code sets, not an inconsistency. Of 5,865,076 rows: -9 is present
      and dominant (3,100,723 rows, 52.87%), not a null -- 0 true nulls.
  - name: PlusGr
    type: enum
    description: >-
      Records with high age categories can be grouped into the Plus group.
      If the plus group age is specified, no higher ages can be reported for the species
      in the haul.
    values:
      +: Age plus group
      '-9': No plus group
    todo: Confirm whether -9 (99.92% of non-null rows) is a genuine AgePlusGroup code
      or just the generic missing-value sentinel -- the resolved vocab key (AC_AgePlusGroup)
      has no -9 code at all, so nothing external confirms it either way.
    details: >-
      icesVocab's TS_PlusGr resolves this as a controlled 2-code list. Against
      the real CA archive: both codes in use, 0 real values outside the vocab.
  - name: Age
    type: number(quantity)
    units: years
    range:
    - 0
    - 99
    details: >-
      -9 (1,995,814 rows, 34.03% of all 5,865,076 CA rows) reads as the standard
      DATRAS 'not recorded' convention and is excluded on the same basis as the
      -1/-5/-95 cluster below, just far larger. -1 (1757 rows) reads as a systematic,
      undocumented 'not determined' sentinel; -5 and -95 (1 row each) are isolated
      anomalies -- all three excluded. 99 (54 rows) is kept: real, repeated support,
      not a fluke -- reads like a plus-group/max-age reporting convention, though
      that mechanism isn't confirmed here, just noted as an observation. ICES's
      getDatrasFieldList documents a field 'IndividualAge' for CA, paired with old-name
      'AgeRings' -- but 'AgeRings' is not a real CA field (the real field is 'Age',
      used here). Since that row's old-name half is already wrong, its proposed new
      name isn't trusted either.
    todo: Confirm with a domain expert whether Age=99 (54 rows) is a genuine plus-group/max-age
      reporting convention, or should be treated as a placeholder like the -1/-5/-9/-95
      sentinels above.
