      in real data (a colour code plus an attached-organisms flag, tilde-joined),
      which is why 79 distinct values are observed here despite only 22 base codes
      existing -- a combinable/multi-value scheme, not a flat single-select list,
      confirming the earlier guess. Not retyped enum: even the 22-code base list is
      past the seed''s VOCAB_CODE_LIMIT of 20, and the combinable form isn''t a plain
