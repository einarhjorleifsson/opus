$version: 0.1.0
$learn_more: http://data-dict.tidyverse.org/
name: datras_exchange
label: ICES DATRAS Exchange Data (Tier 1 -- raw haul-grain submissions)
description: >-
  Direct per-haul submissions to ICES DATRAS: HH (haul), HL (length),
  CA (age), LT (litter). Curated from data-raw/seed/DATRAS-exchange-dict-seed.yaml
  -- see data-raw/spec_02_curate_dict.R for the corrections and field-spec fills applied
  and why. Keyed by ICES's own legacy (real, on-the-wire) field names -- see data-raw/spec_03_translate_new_names.R
  for the curated/new-named version this package actually ships.
origin: data-raw/spec_01_seed_dict.R -> data-raw/spec_02_curate_dict.R
version:
  date: '2026-08-20'
tables:
- name: HH
  columns:
  - name: RecordType
    type: enum
    description: >-
      Definition of the data type recorded, affecting the layout of the
      data fields included on that record. HH=Haul Information, HL=Length Frequency
      Distribution, CA=individual fish recordings with biological information, LT=
      Litter data records
    values:
      HH: Haul Information
    label: Record Type
    constraints:
    - required
  - name: Survey
    type: string
    examples:
    - NS-IBTS
    - BTS
    - BITS
    - 'DYFS'
    - Can-Mar
    details: >-
      29 distinct values in HH's archive; ICES DATRAS survey acronym, an
      open list, not a fixed enum. icesVocab DOES resolve a 'Survey' key by name
      but it's a false lead, not this field's source: its 133 codes are ICES's
      own cross-domain internal survey IDs (e.g. 'A1012'), a completely different
      scheme from DATRAS's own short acronyms -- confirmed by checking real codes
      against it directly, not assumed. Not used.
    constraints:
    - primary_key
  - name: Quarter
    type: number(ordinal)
    range: [1, 4]
    description: >-
      Cruise quarter. Hauls outside of the calendar quarter can be reported
      with the same quarter reference, if agreed by the survey group.
    details: >-
      Retyped from enum to number(ordinal) 2026-08-29, mirroring the same change in
      inst/DATRAS-data-dict.yaml so the two dictionaries stay a pure positional
      rename of each other (op_field_spec() depends on that). The live WSDL declares
      this int, the archive stores it int, and an enum's underlying data must be
      string-like (data-dict validation.md, "Enum membership"). The former values:
      map ('1' -> '1. quarter') carried nothing the number itself does not -- unlike
      Tickler and CatIdentifier, whose code labels are load-bearing and which stay
      enums stored as strings. icesVocab's TS_Quarter also resolves this field.
      Against the real archive: CA, HH, and HL each use all 4 codes; LT uses 3 of 4.
    constraints:
    - primary_key
  - name: Country
    type: string
    description: >-
      ISO 3166 country codes and region codes used by ICES
    examples:
    - NL
    - 'DE'
    - GB
    - 'DK'
    - GB-SCT
    details: >-
      22 distinct values in HH's archive; 'GB-SCT' illustrates that this
      is ISO 3166 codes PLUS ICES's own sub-national region codes (per the field's
      own description), not plain ISO 3166 alone. icesVocab DOES resolve a 'TS_Country'
      key by name but it's a false lead too, same as Survey above: its 25 codes are
      3-letter (e.g. 'BEL', 'DEN', 'ENG'), a different scheme entirely from
      this field's own 2-letter-plus-region codes -- confirmed by checking real codes
      against it directly. Not used.
    constraints:
    - primary_key
  - name: Ship
    type: string
    description: >-
      SeaDataNet Ship and Platform Codes
    examples:
    - '74E9'
    - '26D4'
    - 748S
    - 64SS
    - 18NE
    details: >-
      110 distinct values in HH's archive; SeaDataNet ship/platform codes,
      an open list, not a fixed enum.
    constraints:
    - primary_key
  - name: Gear
    type: enum
    description: >-
      Gear type code
    values:
      AAL: Bottom trawl net Aalhopser
      ABD: Aberdeen 18 ft trawl
      BAK: Baka trawl
      BLACK854: Pelagic trawl Blacksprutte 854#
      BMT: Beam trawl
      BOT: Bottom Trawl
      BOX: Boris 'Goshawk' Box Trawl
      BT12: Beam Trawl 12 meters
      BT2: Beam trawl 2 meters
      BT3: Beam trawl 3 meters
      BT4: Beam Trawl 4 m
      BT4A: Four m Beam trawl, aft
      BT4AI: Four m Beam trawl, aft - in IrishSea q3 BTS
      BT4P: Four m Beam Trawl, port
      BT4S: Four m Beam Trawl, starboard
      BT6: Beam trawl 6 meters
      BT7: Seven m Beam trawl
      BT8: Eight m Beam trawl
      CAM: Unspecified Gear
      CAR: Bottom trawl FGAV019
      CHP: Cod Hopper
      COM: Commercial trawl with sprat bag
      D40: Dutch Herring Trawl 40 feet
      D45: Dutch Herring Trawl 45 feet
      D48: Dutch Herring Trawl 48 feet
      D63: Dutch Herring Trawl 63 feet
      D73: Dutch Herring Trawl 73 feet
      D8: Dutch Herring Trawl 8 feet
      DBT: Danish bottom trawl
      DHT: Dutch Herring Trawl
      DIV: Collected by diver
      DSD: Danish Sandeel dredge, used at the Danish Sandeel survey
      DT: Russian bottom trawl
      EGY: Unspecified Gear
      ENG1600: Pelagic trawl gear Engelnetz 1600#
      ESB: Estonian small bottom trawl
      EXP: EXPO trawl - winged midwater trawl
      FIN1600: Pelagic trawl Finflyder combi 1600'
      FOT: Foto midwater trawl
      FOT32: Pelagic trawl Fotoe 3.2
      GIL: Gill nets
      GOS: GOV small
      GOV: GOV Trawl
      GRT: Granton trawl
      H12: Herring Bottom Trawl 120 feet
      H18: Herring Bottom Trawl 180 feet
      H20: Herring ground trawl (HG20/25)
      HAK: Hake-4M
      HAN: Collected by hand
      HOB: High Opening Bottom Trawl
      HT: Herring Bottom Trawl
      INT: Industrial Trawl
      JDT: Jackson Trawl, modified otter trawl
      JTDS: Jackson Trawl Downscaled
      JTFS: Jackson Trawl Full Scale
      KAB: Pelagic trawl net Kabeljaubomber
      LBT: Latvian Bottom Trawl
      LCT: Lithuanian Cod Trawl
      LPT: Latvian Pelagic Trawl
      MACRO5A: Pelagic trawl Macro 5A:1
      MWT: Mid water trawl 664
      NCT: Norwegian Campell Trawl 1800/96
      P20: Herring Bottom Trawl (P20/25)
      PAR: Pair trawl
      PEL: Pelagic midwater trawl
      PG1: Pelagic trawl Gloria 1024 SW
      PG2: Pelagic trawl Gloria 2048 HO
      PG3: Pelagic trawl Gloria 2560 HO
      PG4: Pelagic trawl Gloria  4096
      PG5: Pelagic Trawl Gloria Helix 358
      PG6: Pelagic Trawl Gloria Helix 224
      PHT: Potuguese High Headline Trawl
      PMT_57x52: Pelagic midwater trawl 57x52
      PMT_76x70: Pelagic midwater trawl 76x70
      PORB: Porcupine Baka
      PRL: Pelagic trawl Red Lion 3072
      PRS: Purse seines
      PRT: Russian pelagic trawl (75/448)
      PSN205: PSN205 pelagic trawl gear applied on Walther Herwig III
      PSN388: Pelagic trawl PSN388 Krake
      PT154: Young Gadoid Pelagic Trawl PT154
      RAPIA: Modified beam trawl with a rigid mouth (Width-3.5 m Weight-225 kg Four
        120-mm wide skids 46-mm codend mesh size)
      ROT: Rock hopper otter trawl
      RTA: Pelagic trawl 70/300 project 0495
      RTM33S: Pelagic trawl RTM33S
      SCT: Scraping tool
      SON: Sonderborg trawl
      SOV: SOV-NET
      SRN: Seines and ring nets
      TV3: Bottom trawl TV-3 930#
      TVCOD: Trawl model TV112-24-646
      TVL: Large TV trawl
      TVM: Bottom trawl TV3-280x80
      TVS: Small TV trawl
      US4: US 4 Seam 3 Bridle
      VIN: Vinge trawl
      W2A: Western IIA
      WP53: Pelagic trawl WP35/64x4
      Y36: 'Yankee #36'
    details: >-
      All 99 active icesVocab Gear Type codes (deprecated code OTG excluded).
      55 confirmed used in DATRAS archive; 44 additional codes are valid ICES definitions
      (may be used in future submissions or by other surveys). Each code has a full
      description in icesVocab. Validation: enum restricts submissions to these codes.
    constraints:
    - primary_key
  - name: SweepLngt
    type: number(quantity)
    description: >-
      Length of sweep in metres. Recommended values depend on survey and
      quarter, see survey manuals for further details
    units: m
    range:
    - 0
    - 850
  - name: GearEx
    type: enum
    description: >-
      Deviations of the standard gear. Depends on survey, see survey manuals
      for further details.
    values:
      '-9': Not know
      B: Bobbins
      D: Double sweeps
      DB: Double beam, catch from two beam trawls put together
      I2: Groundgear D with 16" bobbins
      MN: Without multisampler
      MY: With multisampler
      R: Rockhopper
      S: Standard
      S1: Groundgear with 21" hoppers
      S2: Groundgear with 16" hoppers
      SB: Single beam, catch from one beam trawl
      ST: Strapping
    details: >-
      icesVocab's TS_GearEx resolves this as a controlled 13-code gear-exception
      list (AC_GearExceptions also registered, a 1-code subset -- never the right
      prefix for a DATRAS field, Issue 8). Against the real archive: CA uses 11 of
      13 codes, HH and HL 9 of 13 each, LT 8 of 13; 0 real values fall outside the
      vocab in any table.
  - name: DoorType
    type: enum
    description: >-
      Type of door used
    values:
      '-9': Not known
      F: Flat
      K: Karm waco
      P: Polyvalent
      PE: Portuguese Euronete round nose
      PI: Poly Ice Oval
      R: Rectangle
      T: Thyboroen Trawl Doors Type 2
      T4: Thyboroen Trawl Doors Type 4
      T6: Thyboroen Type 16 straight oval doors
      V: Vee
      WR: Wooden rectangular doors
    details: >-
      icesVocab's TS_DoorType resolves this as a controlled 12-code gear-door-type
      list (AC_DoorType also registered, never the right prefix for a DATRAS field
      -- Issue 8). Against the real archive: CA and HH each use 11 of 12 codes, HL
      11 of 12, LT 6 of 12; 0 real values fall outside the vocab in any table.
  - name: StNo
    type: string
    description: >-
      Station number. National coding system, not defined by ICES.
    examples:
    - '1'
    - '2'
    - '22'
    - '9'
    - '17'
    details: >-
      Field's own description says this is a national coding system, not
      defined by ICES -- examples show the common shape (short numeric-looking strings),
      not an exhaustive domain; not a coded field, so no icesVocab entry is expected
      (none of the 580 registered vocab keys match). Of 145,958 HH rows (20,319 distinct
      values), -9 accounts for exactly 6,899, not a null. ICES's own field-description
      spreadsheet confirms the ICES-wide '-9 = no information' convention applies
      here, same as HaulNo above. Unlike HaulNo's own -9 sentinel, this isn't an
      orphaning problem: CA's own matching StNo=-9 rows for these same hauls (191,893
      rows) join HH successfully via the other 7 composite-key fields, since both
      sides consistently carry -9 for the same haul rather than disagreeing.
    constraints:
    - primary_key
  - name: HaulNo
    type: number(ordinal)
    description: >-
      Sequential numbering of hauls during cruise.
    range:
    - 0
    - 82483
    constraints:
    - required
    - primary_key
    details: >-
      Sequential per-cruise numbering, but countries vary in whether it resets
      each cruise or runs continuously -- the archive-wide range spans many cruises'
      own counts pooled together, not one cruise's own haul tally. No icesVocab entry
      exists under any name or prefix (none of the 580 registered vocab keys match)
      -- expected for a plain sequential identifier, not a coded field. ICES's own
      field-description spreadsheet confirms Mandatory: Yes and documents an ICES-wide
      convention applicable to any field with a header: submit -9 for 'no information'
      -- so the -9 sentinel seen in CA (see known-issues.yaml: ca_haulno_unlinkable_to_hh)
      is a sanctioned value, not an undocumented one.
  - name: Year
    type: number(ordinal)
    description: >-
      Cruise year (YYYY)
    range:
    - 1965
    - 2026
    constraints:
    - required
    - primary_key
  - name: Month
    type: number(ordinal)
    range: [1, 12]
    description: >-
      Sampling month, as part of the calendar date.
    details: >-
      Retyped from enum to number(ordinal) 2026-08-29, mirroring the same change in
      inst/DATRAS-data-dict.yaml, for the same reason as Quarter above. The former
      values: map ('1' -> January) is a calendar convention, not DATRAS-specific
      knowledge, so dropping it loses nothing. icesVocab's TS_Month also resolves
      this field. Against the real archive: HH uses all 12 codes, LT 11 of 12.
    constraints:
    - required
  - name: Day
    type: number(ordinal)
    description: >-
      Sampling day, as part of the calendar date
    range:
    - 1
    - 31
    constraints:
    - required
  - name: TimeShot
    type: string
    description: >-
      Start time (GMT) of haul (HHMM), 4 digits. E.g. 10:15=1015
    examples:
    - '0000'
    - '0600'
    - '1159'
    - '1759'
    - '2359'
    details: >-
      1,440 distinct values, always populated (145,958/145,958). Field's
      own description implies a fixed 4-digit HHMM ('E.g. 10:15=1015'); real values
      are zero-padded to 4 digits (e.g. '0730', not '730'), confirmed against
      the full archive: 100% 4-char, 0 true nulls in either table. Only present in
      HH and LT, same as {StatisticalRectangle or StatRec} below.
    constraints:
    - required
  - name: DepthStratum
    type: string
    description: >-
      Depth stratum in classes. Depth strata are survey specific, see survey
      manuals for details.
    examples:
    - 'D2'
    - '10'
    - '9'
    - '11'
    - 'D1'
    details: >-
      Field's own description says depth strata are survey-specific, not
      an ICES-wide vocabulary -- examples illustrate the shape seen in practice (mix
      of letter-prefixed and bare-number codes), not an exhaustive domain. Of 145,958
      rows: -9 is present and dominant (74,509 rows, 51.05%), not a null -- 0 true
      nulls in the current archive.
    label: Depth Stratum
  - name: HaulDur
    type: number(quantity)
    description: >-
      Haul duration in minutes. Start time is the moment when the gear
      settles at the bottom at the stated towing speed. Stop is defined as the start
      of hauling of the gear.
    units: min
    range:
    - 1
    - 120
    details: >-
      A haul cannot take zero or negative time; 217 rows recorded as exactly
      0 and 2 as negative (-514, -238) are excluded, most likely unrecorded/placeholder
      rather than a genuine instantaneous haul. Upper bound set at 2 hours: DATRAS
      carries no passive/soak gear, so a longer tow is highly suspect -- observed
      values run as high as 1470 min with no repeating marker pattern (i.e. not a
      clean sentinel, just unreliable).
    label: Haul Duration (minutes)
    constraints:
    - required
  - name: DayNight
    type: enum
    description: >-
      Timing of sampling: at daytime or at night. See survey manuals for
      further details
    values:
      D: Day
      'N': Night
    details: >-
      icesVocab's TS_DayNight resolves this as a controlled 2-code list.
      Against the real HH archive: both codes in use, a clean bidirectional match.
    constraints:
    - required
  - name: ShootLat
    type: number(quantity)
    description: >-
      Decimal latitude position on the shooting location
    units: decimal degrees
    range:
    - 36.0013
    - 76.2117
    constraints:
    - required
  - name: ShootLong
    type: number(quantity)
    description: >-
      Decimal longitude position on the shooting location
    units: decimal degrees
    range:
    - -67.7115
    - 24.4333
    details: >-
      A genuine value of exactly -9.0000 degrees (9 deg W, an ordinary DATRAS
      longitude off Ireland/Iberia) would be indistinguishable from missing here:
      icesDatras's fetch pipeline scrubs literal -9 to NA for every numeric column,
      not just where -9 is a documented sentinel.
    constraints:
    - required
  - name: HaulLat
    type: number(quantity)
    description: >-
      Decimal latitude position on the hauling location
    units: decimal degrees
    range:
    - 36.0013
    - 65.0
    details: >-
      3 rows record exactly 0 degrees (the equator), categorically outside
      any DATRAS survey area -- excluded; the lower bound instead matches ShootLat's
      own clean minimum for the same archive.
    constraints:
    - required
  - name: HaulLong
    type: number(quantity)
    description: >-
      Decimal longitude position on the hauling location
    units: decimal degrees
    range:
    - -67.6762
    - 45.8753
    details: >-
      Same -9-as-missing caveat as ShootLong above (0 degrees, the Prime Meridian,
      is a genuine North Sea value here and is kept).
    constraints:
    - required
  - name: StatRec
    type: string
    description: >-
      Intended ICES statistical area rectangle (0.5 degrees latitude, 1
      degree longitude)
    examples:
    - '37F8'
    - '35F5'
    - '36F7'
    - '32F3'
    - '36F6'
    details: >-
      Real ICES statistical rectangle codes (0.5 deg lat x 1 deg lon grid),
      not a fixed enum given the size of the grid -- independently corroborated by
      ICES's own field-description spreadsheet, which describes this field via the
      same geometric grid rule rather than a code list. Only present in HH and LT
      -- consistent with LT's assessment output joining in a set of HH-style columns.
      Of 145,958 HH rows (685 distinct values), -9 accounts for exactly 12,235, not
      a null.
  - name: Depth
    type: number(quantity)
    description: >-
      Sampling depth in metres, measured from the water surface.
    units: m
    range:
    - 1
    - 3098
    constraints:
    - required
  - name: HaulVal
    type: enum
    description: >-
      Haul validity code
    values:
      A: Additional valid stations not used for index calculations
      C: Calibrated (BITS only)
      I: Invalid haul
      M: Pelagic Midwater Trawl (BITS only)
      'N': No oxygen (BITS only)
      S: Standard haul
      V: Valid haul
    details: >-
      icesVocab's TS_HaulVal resolves this as a controlled 7-code haul-validity
      list. Against the real archive: HH uses 6 of 7 codes, LT 4 of 7; 0 real values
      fall outside the vocab in either table.
    constraints:
    - required
  - name: HydroStNo
    type: string
    description: >-
      The national hydrographic station number. If possible, align with
      information submitted to ocean.ices.dk
    examples:
    - 74SC0000
    - '88888888'
    - '1'
    - '0'
    - '3'
    details: >-
      National station numbering (field's own description), so examples are
      illustrative only, not an exhaustive domain. '88888888' recurs and reads like
      an undocumented all-8s placeholder/sentinel (the same kind of pattern seen elsewhere
      in HH, e.g. HaulDuration's zeros) rather than a real station ID, but is kept
      in `examples` (unlike a `range` exclusion, `examples` isn't a validity gate)
      since a reader should know it's a real recurring value. Of 145,958 rows: 0
      true nulls -- 69,762 (47.79%) carry either -9 or the 88888888 placeholder, the
      rest a real station ID.
  - name: StdSpecRecCode
    type: enum
    description: >-
      Information on the whether standard species have been recorded. Standard
      species depend on survey, see survey manuals for details.
    values:
      '0': No standard species recorded
      '1': All standard species recorded
      '2': Pelagic standard species recorded
      '3': Roundfish standard species recorded
      '4': Individual standard species recorded
    details: >-
      icesVocab's TS_StdSpecRecCode resolves this as a controlled 5-code
      list (0=No standard species recorded, 1=All, 2=Pelagic, 3=Roundfish, 4=Individual
      standard species recorded). Against the real HH archive: 4 of 5 codes in use,
      0 real values outside the vocab.
    constraints:
    - required
  - name: BySpecRecCode
    type: enum
    description: >-
      Information on which bycatch species have been recorded.
    values:
      '0': No by-catch species recorded
      '1': Open ended by-catch list - all species, even species complexes
      '2': Closed by-catch list - All species recorded
      '3': Closed by-catch list - Gadoid species recorded
      '4': Closed by-catch list - Flatfish species recorded
      '5': Closed by-catch list - Various species recorded
      '6': Open ended fish species list and limited benthos list
    details: >-
      icesVocab's TS_BySpecRecCode resolves this as a controlled 7-code list.
      Against the real HH archive: all 7 codes in use, a clean bidirectional match.
    constraints:
    - required
  - name: DataType
    type: enum
    description: >-
      Specification of the data aggregation in the HL record. C: CPUE
      (per hour) data; TotalNo and CatCatchWgt are adjusted per hour trawling. R (raw),
      S (subsample of the entire catch): data as recorded during the cruise, and P
      (pseudocategory sampling, only used by Scotland).
    values:
      '-9': Invalid hauls
      C: Data calculated as CPUE (number per hour)
      P: Pseudocategory sampling
      R: Data by haul
      S: Sub sampled data
    details: >-
      icesVocab's TS_DataType gives -9 its own specific meaning: 'Invalid
      hauls' -- not a generic missing-value placeholder like most of this field's
      sibling enums (part of a full sweep of every enum field with -9 as a declared
      code; see articles/technical-notes.qmd). Low prevalence in both tables that
      carry it (HH: 39/145,958 rows, 0.03%; LT: 20/75,310, 0.03%).
    constraints:
    - required
  - name: Netopening
    type: number(quantity)
    description: >-
      Mean value in metres of vertical net opening measurements. For details
      see the survey manual.
    units: m
    range:
    - 0.0
    - 76.0
    details: >-
      -9 is the ICES-wide sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 75,609/145,958 rows (51.80%), LT 24,717/75,310 rows (32.82%), 0 true nulls
      in either table -- the modal value in both tables, not the exception.
  - name: Rigging
    type: enum
    description: >-
      The way the gear is rigged. Rigging depends on survey, see survey
      manuals for further details.
    values:
      '-9': Not provided
      BC: Bobbin, tickler, chain groundrope
      BM: Bobbin, mixed metal-nylon groundrope
      BN: Bobbin, nylon groundrope
      D: Tooth tickler
      F: Flip-up rope
      FB: Flip-up rope and chain mat, poly prop net with blinder
      FM: Flip-up rope and chain mat, standard net with blinder
      FT: Flip-up rope and tickler chains
      FW: Flip-up rope and chain mat, poly prop net without blinder
      M: Chain mat
      S: Sumwing
      T: Tickler chains
      TS: Tickler and sumwing
      TT: Tickler
    details: >-
      icesVocab's TS_Rigging resolves this as a controlled 15-code list.
      Against the real archive: HH uses 13 of 15 codes, LT 9 of 15; 0 real values
      fall outside the vocab in either table.
  - name: Tickler
    type: enum
    description: >-
      Amount of ticklers connected to the gear.
    values:
      '-9': No ticklers are allowed
      '0': Zero ticklers
      '1': One tickler
      '10': Ten ticklers
      '11': Eleven ticklers
      '12': Twelve ticklers
      '13': Thirteen ticklers
      '14': Fourteen ticklers
      '15': Fifteen ticklers
      '16': Sixteen ticklers
      '17': Seventeen ticklers
      '18': Eighteen ticklers
      '19': Nineteen ticklers
      '2': Two ticklers
      '20': Twenty ticklers
      '21': Twenty one ticklers
      '22': Twenty two ticklers
      '23': Twenty three ticklers
      '24': Twenty four ticklers
      '25': Twenty five ticklers
      '26': Twenty six ticklers
      '27': Twenty seven ticklers
      '28': Twenty eight ticklers
      '29': Twenty nine ticklers
      '3': Three ticklers
      '30': Thirty ticklers
      '4': Four ticklers
      '5': Five ticklers
      '6': Six ticklers
      '7': Seven ticklers
      '8': Eight ticklers
      '9': Nine ticklers
    details: >-
      icesVocab's TS_Tickler resolves this as a controlled tickler-chain
      count code list (32 active codes: 0-30, plus a '-9'/'no ticklers allowed'
      sentinel) -- not an open numeric quantity. Against the real archive: HH shows
      10 distinct values (-9, 0, 1, 4, 5, 8, 10, 20, 21, 27) and LT 4 (-9, 0, 5, 8,
      a subset of HH's own); -9 is the dominant value in both (78% of HH, 41% of
      LT), not absent -- zero gaps against the vocab's 32 codes, either direction.
      Live WSDL (getHHdata) declares this field int, not string -- an accepted, permanent
      M01 divergence between the WSDL-driven archive and this curated enum spec (see
      Valid_Aphia's own note for the general pattern), not a bug to fix by changing
      either side.
  - name: Distance
    type: number(quantity)
    description: >-
      Distance in metres between haul start and haul end point.
    units: m
    range:
    - 0
    - 59995
    details: >-
      -9 is the ICES-wide sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 23,929/145,958 rows (16.39%), LT 996/75,310 rows (1.32%), 0 true nulls in
      either table.
    constraints:
    - required
  - name: Warplngt
    type: number(quantity)
    description: >-
      Length of warp in metres. Defined by fishing depth. Warp/depth ratio
      is depends on survey, for further details see survey manuals.
    units: m
    range:
    - 0
    - 4065
    details: >-
      -9 is the ICES-wide sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 53,727/145,958 rows (36.81%), LT 759/75,310 rows (1.01%), 0 true nulls in
      either table.
  - name: Warpdia
    type: number(quantity)
    description: >-
      Warp diametre in millimetres.
    units: mm
    range:
    - 16
    - 30
    details: >-
      A dense, well-populated cluster runs 16-21mm and 27-30mm; isolated single-occurrence
      values below (1mm x2, 5mm x10, 12mm) and above (39, 56, 85, 88mm) sit apart
      from it with no comparable support and are treated as data-entry errors, excluded
      here. -9 is the ICES-wide sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 85,420/145,958 rows (58.52%), LT 28,755/75,310 rows (38.18%), 0 true nulls
      in either table -- the modal value in both tables, not the exception (already
      excluded by the range above, [16,30]).
  - name: WarpDen
    type: number(quantity)
    description: >-
      Warp weight in kg per linear meter of warp. See survey manuals for
      more information.
    units: kg/m
    range:
    - 0
    - 26
    details: >-
      -9 is the ICES-wide sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 140,298/145,958 rows (96.12%), LT 45,440/75,310 rows (60.34%), 0 true nulls
      in either table -- the modal value in both tables, not the exception.
  - name: DoorSurface
    type: number(quantity)
    description: >-
      Door surface area in square metres.
    units: m2
    range:
    - 0.0
    - 20.2
    details: >-
      -9 is the ICES-wide sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 78,096/145,958 rows (53.51%), LT 27,021/75,310 rows (35.88%), 0 true nulls
      in either table.
  - name: DoorWgt
    type: number(quantity)
    description: >-
      Door weight in kilograms.
    units: kg
    range:
    - 0
    - 1720
    details: >-
      -9 is the ICES-wide sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 77,794/145,958 rows (53.30%), LT 26,904/75,310 rows (35.72%), 0 true nulls
      in either table.
  - name: DoorSpread
    type: number(quantity)
    description: >-
      Mean value in metres of door spread measurements.
    units: m
    range:
    - 1.0
    - 250.0
    details: >-
      0m (9 rows) is excluded as a placeholder -- a rigged, towing trawl cannot
      have zero door spread. Three single-occurrence values (762, 767, 778m) sit far
      above everything else in the archive (next highest is 250m) and are treated
      as data-entry errors, excluded; a real, well-populated value at 3.6m (1128 rows,
      likely a fixed beam-trawl spread) is kept. -9 is the ICES-wide sanctioned 'no
      information' convention (data-raw/build_field_description_snapshot.R): HH 83,779/145,958
      rows (57.40%), LT 25,658/75,310 rows (34.07%), 0 true nulls in either table
      -- already excluded by the range above.
  - name: WingSpread
    type: number(quantity)
    description: >-
      Mean value in metres of wing spread measurements. For more details
      see the manual.
    units: m
    range:
    - 4.0
    - 50.0
    details: >-
      0m (9 rows), 1.8m and 2m (1 row each) are excluded as below any value
      with real support -- a well-populated cluster starts at 4m (1074 rows, likely
      a fixed beam-trawl spread). 142m (1 row) sits far above the next-highest real
      value (50m) and is treated as a data-entry error, excluded. -9 is the ICES-wide
      sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 102,696/145,958 rows (70.36%), LT 31,038/75,310 rows (41.21%), 0 true nulls
      in either table -- already excluded by the range above.
  - name: Buoyancy
    type: number(quantity)
    description: >-
      Total buoyancy of the net floats in kilograms. Recommended values
      depend on survey, see survey manuals for further details.
    units: kg
    range:
    - 0
    - 398
  - name: KiteDim
    type: number(quantity)
    description: >-
      Kite area in square metres.
    units: m2
    range:
    - 0.0
    - 1.0
    details: >-
      Coarse, equipment-spec values (0, 0.5, 0.7, 0.72, 0.8, 1) rather than
      a continuously measured quantity -- only 6 distinct values across 30,116 rows.
  - name: WgtGroundRope
    type: number(quantity)
    description: >-
      Total weight of the ground rope in kilograms. Recommended weight
      depends on survey, see survey manuals for further details.
    units: kg
    range:
    - 0
    - 2212
  - name: TowDir
    type: number(quantity)
    description: >-
      Direction of towing in degrees. 360=direction from south to north.
    units: degrees
    range:
    - 0
    - 360
    details: >-
      999 (3 rows) reads as an undocumented out-of-domain 'not recorded'
      marker, the same pattern confirmed for WindDir below. A further cluster -- 450
      deg (62 rows), 520(5), 460(5), 540(3), 510, 564, 702 (1 each) -- divided by
      10 becomes ordinary bearings (45.0, 52.0, 46.0, 54.0, 51.0, 56.4, 70.2 deg).
      Both groups are outside the documented 0-360 domain and excluded here. -9 is
      the ICES-wide sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 50,625/145,958 rows (34.68%), LT 2,384/75,310 rows (3.17%), 0 true nulls
      in either table -- already excluded by the range above.
    todo: Confirm the divide-by-10 cluster (450/520/460/540/510/564/702) is a genuine
      data-entry pattern by correlating with Country/Survey -- same class of check
      already confirmed for SwellHeight via its WindSpeed co-parameter.
  - name: GroundSpeed
    type: number(quantity)
    description: >-
      Ground speed of towing in knots. Recommended speed depends on survey,
      see survey manuals for more details
    units: knots
    range:
    - 0.0
    - 10.0
    details: >-
      Ceiling is a domain judgment (real trawling ground speed), not an observed
      cluster boundary -- observed values run 10.8 up to a 99.9 marker with no clean
      gap, all excluded. -9 is the ICES-wide sanctioned 'no information' convention
      (data-raw/build_field_description_snapshot.R): HH 56,805/145,958 rows (38.92%),
      LT 10,224/75,310 rows (13.58%), 0 true nulls in either table -- already excluded
      by the range above.
  - name: SpeedWater
    type: number(quantity)
    description: >-
      Trawl speed on water in knots.
    units: knots
    range:
    - 0.0
    - 22.0
    details: >-
      -9 is the ICES-wide sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 131,220/145,958 rows (89.90%), LT 41,502/75,310 rows (55.11%), 0 true nulls
      in either table -- the modal value in both tables, not the exception.
  - name: SurCurDir
    type: number(quantity)
    description: >-
      Surface current direction in degrees. No movement = 0, 360=direction
      from south to north.
    units: degrees
    range:
    - 0
    - 360
    details: >-
      Two single-occurrence values just above 360 (392, 390) excluded; the
      rest of the archive is densely populated right up to 360.
  - name: SurCurSpeed
    type: number(quantity)
    description: >-
      Surface current speed in m/sec.
    units: m/s
    range:
    - 0.0
    - 9.3
    details: >-
      99 (marker) and 46.3 and 16 (each a single, isolated occurrence with
      no support nearby) excluded; a smoother, better-populated tail resumes at 9.3
      (3 rows) and below.
  - name: BotCurDir
    type: number(quantity)
    description: >-
      Bottom current direction in degrees. No movement = 0, 360=direction
      from south to north.
    units: degrees
    range:
    - 0
    - 359
  - name: BotCurSpeed
    type: number(quantity)
    description: >-
      Bottom current speed in metres/sec.
    units: m/s
    range:
    - 0.0
    - 9.9
    details: >-
      9.9 (1 row) is unusually high for a bottom current and resembles the
      '9-family' marker pattern seen elsewhere in HH, but a genuinely fast tidal-race
      reading can't be ruled out -- kept in range rather than excluded, unlike the
      more clear-cut cases above.
  - name: WindDir
    type: number(quantity)
    description: >-
      Direction of wind in degrees. Calm = 0,  direction from north to
      south = 360, varying direction = -1
    units: degrees
    range:
    - -1
    - 360
    details: >-
      -1 is documented ('varying direction'). 999 (57 rows) reads as an
      undocumented out-of-domain 'not recorded' marker; a handful of further single-occurrence
      values just above 360 (711, 504, 420, 365, 361) are also excluded. -9 is ALSO
      present and is the ICES-wide sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 40,431/145,958 rows (27.70%), LT 5,111/75,310 rows (6.79%), 0 true nulls
      in either table -- already excluded by the range above (unlike -1, which the
      range explicitly keeps).
  - name: WindSpeed
    type: number(quantity)
    description: >-
      Speed of wind in metres/sec.
    units: m/s
    range:
    - 0
    - 28
    details: >-
      Ceiling follows the Beaufort 10 upper bound (28.4 m/s, storm force)
      -- no vessel would be actively trawling above this. Excluding the -9 sentinel:
      HH 1,407 of 106,109 real measurements (1.33%) exceed it, up to a max of 342
      m/s; LT 1,149 of 64,985 (1.77%), up to 77 m/s. Both tail off smoothly, consistent
      with a real distribution below and noise above.
  - name: SwellDir
    type: number(quantity)
    description: >-
      Direction of swell in degrees. No movement=0, direction from south
      to north = 360, varying direction = -1
    units: degrees
    range:
    - 0
    - 360
    details: >-
      -9 is the ICES-wide sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 120,204/145,958 rows (82.35%), LT 28,459/75,310 rows (37.79%), 0 true nulls
      in either table -- the modal value in both tables, not the exception.
  - name: SwellHeight
    type: number(quantity)
    description: >-
      Height of (swell) waves, in metres
    units: m
    range:
    - 0.0
    - 13.0
    details: >-
      See known issue swell_height_type_mismatch (DATRAS-known-issues.yaml,
      not yet filed): icesVocab declares this an enum (codes H/L/M/N/NR/VH for height
      classes), but real HH archive data shows this is a measured quantity, not a
      categorized class. Of all 145,958 rows: 0 true nulls; 108,698 (74.47%) carry
      the standard DATRAS -9 'not recorded' sentinel; the remaining 37,260 are real,
      continuous numeric measurements (0-60m). Range set to 0-13m using WindSpeed
      as an independent co-parameter check: median WindSpeed rises smoothly with SwellHeight
      through 13m (8m/24, 9m/26, 10m/22, 12m/28, 13m/24 m/s), consistent with genuine
      rough-weather readings, but breaks down sharply above it (15m/5, 16m/8, 20m/4,
      25m/13, 30m/7, 60m/16 m/s -- implausibly calm for the claimed swell height,
      matching the wind speeds already seen at 1.5m/1.6m/2.0m/2.5m/3.0m/6.0m, the
      values these look like decimal-shifted versions of). The 23 rows above 13m are
      excluded as data-entry errors on this evidence, not genuine extreme swells.
  - name: SurTemp
    type: number(quantity)
    description: >-
      Temperature at the surface water layer in Celsius degrees.
    units: degC
    range:
    - -1.5
    - 36.0
  - name: BotTemp
    type: number(quantity)
    description: >-
      Temperature at the bottom water layer in degrees Celsius
    units: degC
    range:
    - -1.0
    - 35.4
  - name: SurSal
    type: number(quantity)
    description: >-
      Salinity at the surface water layer in Practical Salinity Units (PSU).
    units: PSU
    range:
    - 0.0
    - 38.52
  - name: BotSal
    type: number(quantity)
    description: >-
      Salinity at the bottom water layer in Practical Salinity Units (PSU).
    units: PSU
    range:
    - 3.13
    - 39.93
  - name: ThermoCline
    type: enum
    description: >-
      Indication whether thermocline (min. 2 degrees temperature changes
      over 10 metres depth) was observed
    values:
      '-9': Not known
      'N': 'No'
      'Y': 'Yes'
    details: >-
      145,958 rows: 144,726 carry the -9 sentinel, 1,062 are 'Y', 167 are
      'N'. 3 rows carry a lowercase 'y' instead of 'Y' -- a real submitter case
      slip, not a separate value. icesVocab's TS_ThermoCline resolves this as a controlled
      3-code list (-9/N/Y) -- fully consistent with the case-slip already noted above:
      the archive's only values are exactly these three codes plus the lowercase
      'y' slip, not a genuine 4th value.
  - name: ThClineDepth
    type: number(quantity)
    description: >-
      Depth (metres, measured from water surface) at which the thermocline
      was found. Requires Y in Thermocline field.
    units: m
    range:
    - 0
    - 90
  - name: CodendMesh
    type: number(quantity)
    description: >-
      Codend mesh size in mm
    units: mm
    range:
    - 9
    - 100
    details: >-
      0mm (202 rows) excluded as a placeholder -- a codend by definition has
      some mesh size. 250mm (1 row) sits far above the next-highest real value (100mm,
      644 rows) and is treated as a data-entry error, excluded. -9 is the ICES-wide
      sanctioned 'no information' convention (data-raw/build_field_description_snapshot.R):
      HH 104,918/145,958 rows (71.88%), LT 22,672/75,310 rows (30.11%), 0 true nulls
      in either table -- the modal value in both tables, already excluded by the range
      above.
  - name: SecchiDepth
    type: number(quantity)
    description: >-
      Secchi depth in metres
    units: m
    range:
    - 0.0
    - 9.0
  - name: Turbidity
    type: number(quantity)
    description: >-
      Turbidity in NTU
    units: NTU
    range:
    - 0
    - 0
    details: >-
      145,756 of 145,958 rows carry the -9 sentinel; 0 true nulls. The remaining
      202 rows all carry exactly 0 -- too sparse to characterize a real range beyond
      that single value; this reflects what was actually observed, not a claim that
      Turbidity never varies.
  - name: TidePhase
    type: number(quantity)
    description: >-
      Tidal phase in minutes before the next high tide
    units: min
    range:
    - -540
    - 780
    details: >-
      Strong clustering at exact-hour multiples (e.g. 660 min: 1095 rows,
      600 min: 1093, 540 min: 949) versus sparse off-hour values reads as providers
      rounding to the nearest hour, not an error. Separately: a genuine reading of
      exactly -9 minutes (9 minutes before high tide) would be indistinguishable from
      missing, since icesDatras's fetch pipeline scrubs literal -9 to NA for every
      numeric column regardless of whether -9 is that field's own sentinel.
  - name: TideSpeed
    type: number(quantity)
    description: >-
      Speed of tide in m/s
    units: m/s
    range:
    - 0.0
    - 7.0
  - name: PelSampType
    type: enum
    description: >-
      Pelagic trawl sampling type
    values:
      '-9': Not known
      '1': Shallower than DSL, in which redfish could be acoustically identified
      '2': Shallower than 500m and within DSL
      '3': Zones deeper than 500m
    details: >-
      icesVocab's TS_PelSampType resolves this as a controlled 4-code pelagic-sampling-type
      list. Against the real HH archive: only 1 of the 4 codes is actually in use,
      but that one value is a valid code, not an outside value.
  - name: MinTrawlDepth
    type: number(quantity)
    description: >-
      Highest point of the pelagic trawling
    units: m
    range:
    - 0
    - 699
    details: >-
      Unit is inferred, not stated in ICES's own field description ('Highest
      point of the pelagic trawling') -- assumed metres by convention with the rest
      of HH's depth fields.
  - name: MaxTrawlDepth
    type: number(quantity)
    description: >-
      Lowest point of the pelagic trawling
    units: m
    range:
    - 0
    - 712
    details: >-
      Same inferred-unit caveat as MinTrawlDepth above.
  - name: DateofCalculation
    type: date
    range:
    - '2012-04-19'
    - .inf
    details: >-
      8-digit YYYYMMDD stamp, digit order (month before day) verified consistent
      across all four Tier 1 tables. Upper bound deliberately left open: a live, continuously-advancing
      ICES Datacenter 'last recalculated' stamp, not submitted by data providers,
      so a fixed max would go stale immediately. Lower bound is this table's own
      verified minimum -- NOT forced identical across tables the way SweepLngt/HaulNo/Year
      are, since a genuine table-specific difference is plausible here (confirmed:
      LT's own minimum is years later). A -9 sentinel (11,574 rows, 7.93% of non-null;
      already excluded by the lower bound above) reads as the standard DATRAS 'not
      recorded' convention for this server-computed field -- not yet (re)calculated
      for this record.
  label: Haul Information
  description: >-
    Each row is one haul (trawl deployment). Contains haul-level metadata:
    geography, timing, gear deployment, environmental conditions, and performance
    flags.
  details: >-
    Grain: each row represents one discrete haul deployment (one trawl operation).
    Population: all hauls submitted to ICES DATRAS within the covered survey/region/timeframe.
    Join key: HL, CA, and LT tables reference haul-level data via a composite identifier
    constructed from eight fields: Survey, Year, Quarter, Country, {Platform or Ship},
    Gear, {StationName or StNo}, and HaulNumber. The naming convention differs by
    era: newer submissions use Platform/StationName/HaulNumber (new style); older
    submissions use Ship/StNo/HaulNo (old style). Note: HaulNumber alone is NOT a
    valid join key and must be paired with all seven other fields -- but even the
    full composite key doesn't recover everything: 288,581 CA rows (4.92%) carry
    a -9 sentinel (not a null) in HaulNumber/HaulNo and match no HH haul on any subset
    of the 8 fields. See DATRAS-known-issues.yaml (ca_haulno_unlinkable_to_hh) and
    obus::dr_add_id for the composite ID construction logic.
  origin: data-raw/spec_02_curate_dict.R
- name: HL
  columns:
  - name: RecordType
    type: enum
    description: >-
      Definition of the data type recorded, affecting the layout of the
      data fields included on that record. HH=Haul Information, HL=Length Frequency
      Distribution, CA=individual fish recordings with biological information, LT=
      Litter data records
    values:
      HL: Length Frequency Distribution
    label: Record Type
    constraints:
    - required
  - name: Survey
    type: string
    examples:
    - NS-IBTS
    - BTS
    - BITS
    - 'DYFS'
    - Can-Mar
    details: >-
      29 distinct values in HH's archive; ICES DATRAS survey acronym, an
      open list, not a fixed enum. icesVocab DOES resolve a 'Survey' key by name
      but it's a false lead, not this field's source: its 133 codes are ICES's
      own cross-domain internal survey IDs (e.g. 'A1012'), a completely different
      scheme from DATRAS's own short acronyms -- confirmed by checking real codes
      against it directly, not assumed. Not used.
    constraints:
    - required
    - foreign_key
  - name: Quarter
    type: number(ordinal)
    range: [1, 4]
    description: >-
      Cruise quarter. Hauls outside of the calendar quarter can be reported
      with the same quarter reference, if agreed by the survey group.
    details: >-
      Retyped from enum to number(ordinal) 2026-08-29, mirroring the same change in
      inst/DATRAS-data-dict.yaml so the two dictionaries stay a pure positional
      rename of each other (op_field_spec() depends on that). The live WSDL declares
      this int, the archive stores it int, and an enum's underlying data must be
      string-like (data-dict validation.md, "Enum membership"). The former values:
      map ('1' -> '1. quarter') carried nothing the number itself does not -- unlike
      Tickler and CatIdentifier, whose code labels are load-bearing and which stay
      enums stored as strings. icesVocab's TS_Quarter also resolves this field.
      Against the real archive: CA, HH, and HL each use all 4 codes; LT uses 3 of 4.
    constraints:
    - required
    - foreign_key
  - name: Country
    type: string
    description: >-
      ISO 3166 country codes and region codes used by ICES
    examples:
    - NL
    - 'DE'
    - GB
    - 'DK'
    - GB-SCT
    details: >-
      22 distinct values in HH's archive; 'GB-SCT' illustrates that this
      is ISO 3166 codes PLUS ICES's own sub-national region codes (per the field's
      own description), not plain ISO 3166 alone. icesVocab DOES resolve a 'TS_Country'
      key by name but it's a false lead too, same as Survey above: its 25 codes are
      3-letter (e.g. 'BEL', 'DEN', 'ENG'), a different scheme entirely from
      this field's own 2-letter-plus-region codes -- confirmed by checking real codes
      against it directly. Not used.
    constraints:
    - required
    - foreign_key
  - name: Ship
    type: string
    description: >-
      SeaDataNet Ship and Platform Codes
    examples:
    - '74E9'
    - '26D4'
    - 748S
    - 64SS
    - 18NE
    details: >-
      110 distinct values in HH's archive; SeaDataNet ship/platform codes,
      an open list, not a fixed enum.
    constraints:
    - required
    - foreign_key
  - name: Gear
    type: enum
    description: >-
      Gear type code
    values:
