  - name: LTPRP
    type: string
    description: Litter properties that may be deemed important for reporting. Reporting
      of multiple codes in this field is allowed.
    examples:
    - AO
    - CL1
    - CL5
    - CL2
    - CL4
    details: 'Litter property code, no description present. icesVocab''s LTPRP list
      confirms all five as BASE codes (checked 2026-07-29): AO=Attached organisms,
      CL1=Colour-None(clear), CL2=Colour-Black, CL4=Colour-Blue, CL5=Colour-White
