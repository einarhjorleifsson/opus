      S2: Groundgear with 16" hoppers
      SB: Single beam, catch from one beam trawl
      ST: Strapping
    details: >-
      Mostly a copy of HH's own GearExceptions for the same haul (92.27%
      of 5,563,036 matched non-null rows identical), but in 430,289 rows (7.73%) CA
      carries a real code (S, SB, B, D, MY, R, or MN) where HH has only the generic
      '-9' placeholder for the same haul -- CA never contradicts a real HH code,
      only supplements HH's own '-9' with something more specific. Not forced identical
      to HH's spec as a result (contrast SwellHeight above, a genuine byte-for-byte
      copy): this field carries real information HH's own copy doesn't have. icesVocab's
      TS_GearEx resolves this as a controlled 13-code gear-exception list (AC_GearExceptions
      also registered, a 1-code subset -- never the right prefix for a DATRAS field,
      Issue 8). Against the real archive: CA uses 11 of 13 codes, HH and HL 9 of 13
      each, LT 8 of 13; 0 real values fall outside the vocab in any table.
