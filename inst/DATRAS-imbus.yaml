$version: 0.1.0
$learn_more: http://data-dict.tidyverse.org/
name: datras_exchange
label: ICES DATRAS Exchange Data (Tier 1 -- raw haul-grain submissions)
description: >-
  Direct per-haul submissions to ICES DATRAS: HH (haul), HL (length),
  CA (age), LT (litter), as they actually exist in the published archive. The IMBUS/archive-side
  dictionary: curated from ICES's own sources and verified against real submissions
  (enum values restricted to archive-observed codes; physical non-negativity bounds
  expressed as assertions). Keyed by opus's current field names; each column's details
  carries the legacy on-the-wire name. See data-raw/spec/spec_02_curate_dict.R for
  the corrections and field-spec fills applied and why. For ICES's own documented
  view of the same format, see inst/DATRAS-ices.yaml.
origin: data-raw/spec/spec_01_seed_dict.R -> data-raw/spec/spec_02_curate_dict.R ->
  data-raw/spec/spec_03_translate_new_names.R
version:
  date: '2026-09-15'
tables:
- name: HH
  columns:
  - name: RecordHeader
    type: enum
    description: >-
      Definition of the data type recorded, affecting the layout of the
      data fields included on that record. HH=Haul Information, HL=Length Frequency
      Distribution, CA=individual fish recordings with biological information, LT=
      Litter data records
    values:
      HH: Haul Information
    label: Record Type
    constraints:
    - required
    details: >-
      Legacy field name: RecordType.
  - name: Survey
    type: string
    examples:
    - NS-IBTS
    - BTS
    - BITS
    - 'DYFS'
    - Can-Mar
    details: >-
      Legacy field name: Survey. 29 distinct values in HH's archive; ICES
      DATRAS survey acronym, an open list, not a fixed enum. icesVocab DOES resolve
      a 'Survey' key by name but it's a false lead, not this field's source: its
      133 codes are ICES's own cross-domain internal survey IDs (e.g. 'A1012'),
      a completely different scheme from DATRAS's own short acronyms -- confirmed
      by checking real codes against it directly, not assumed. Not used.
    constraints:
    - primary_key
  - name: Quarter
    type: number(ordinal)
    description: >-
      Cruise quarter. Hauls outside of the calendar quarter can be reported
      with the same quarter reference, if agreed by the survey group.
    range:
    - 1
    - 4
    details: >-
      Legacy field name: Quarter. Retyped from enum to number(ordinal) 2026-08-29,
      resolving a standing M01: the live WSDL declares this int, the archive stores
      it int, and an enum's underlying data must be string-like (data-dict validation.md,
      "Enum membership"). The former values: map ('1' -> '1. quarter') carried
      nothing the number itself does not, so no information is lost -- unlike Tickler
      and CatIdentifier, whose code labels are load-bearing and which therefore stay
      enums stored as strings. icesVocab's TS_Quarter also resolves this field (a
      bare 'Quarter' key is separately registered too, redundant with TS_Quarter).
      Against the real archive: CA, HH, and HL each use all 4 codes; LT uses 3 of
      4. 0 real values fall outside the vocab in any table.
    constraints:
    - primary_key
  - name: Country
    type: string
    description: >-
      ISO 3166 country codes and region codes used by ICES
    examples:
    - NL
    - 'DE'
    - GB
    - 'DK'
    - GB-SCT
    details: >-
      Legacy field name: Country. 22 distinct values in HH's archive; 'GB-SCT'
      illustrates that this is ISO 3166 codes PLUS ICES's own sub-national region
      codes (per the field's own description), not plain ISO 3166 alone. icesVocab
      DOES resolve a 'TS_Country' key by name but it's a false lead too, same as
      Survey above: its 25 codes are 3-letter (e.g. 'BEL', 'DEN', 'ENG'), a
      different scheme entirely from this field's own 2-letter-plus-region codes
      -- confirmed by checking real codes against it directly. Not used.
    constraints:
    - primary_key
  - name: Platform
    type: string
    description: >-
      SeaDataNet Ship and Platform Codes
    examples:
    - '74E9'
    - '26D4'
    - 748S
    - 64SS
    - 18NE
    details: >-
      Legacy field name: Ship. 110 distinct values in HH's archive; SeaDataNet
      ship/platform codes, an open list, not a fixed enum.
    constraints:
    - primary_key
  - name: Gear
    type: enum
    description: >-
      Gear type code
    values:
      ABD: Aberdeen 18 ft trawl
      BAK: Baka trawl
      BOT: Bottom Trawl
      BT12: Beam Trawl 12 meters
      BT3: Beam trawl 3 meters
      BT4A: Four m Beam trawl, aft
      BT4AI: Four m Beam trawl, aft - in IrishSea q3 BTS
      BT4P: Four m Beam Trawl, port
      BT4S: Four m Beam Trawl, starboard
      BT6: Beam trawl 6 meters
      BT7: Seven m Beam trawl
      BT8: Eight m Beam trawl
      CAM: Unspecified Gear
      CAR: Bottom trawl FGAV019
      CHP: Cod Hopper
      DHT: Dutch Herring Trawl
      DSD: Danish Sandeel dredge, used at the Danish Sandeel survey
      DT: Russian bottom trawl
      EGY: Unspecified Gear
      ESB: Estonian small bottom trawl
      EXP: EXPO trawl - winged midwater trawl
      FOT: Foto midwater trawl
      GOV: GOV Trawl
      GRT: Granton trawl
      H12: Herring Bottom Trawl 120 feet
      H18: Herring Bottom Trawl 180 feet
      H20: Herring ground trawl (HG20/25)
      HAK: Hake-4M
      HOB: High Opening Bottom Trawl
      HT: Herring Bottom Trawl
      JDT: Jackson Trawl, modified otter trawl
      JTDS: Jackson Trawl Downscaled
      JTFS: Jackson Trawl Full Scale
      KAB: Pelagic trawl net Kabeljaubomber
      LBT: Latvian Bottom Trawl
      LPT: Latvian Pelagic Trawl
      NCT: Norwegian Campell Trawl 1800/96
      P20: Herring Bottom Trawl (P20/25)
      PEL: Pelagic midwater trawl
      PG1: Pelagic trawl Gloria 1024 SW
      PG2: Pelagic trawl Gloria 2048 HO
      PG3: Pelagic trawl Gloria 2560 HO
      PORB: Porcupine Baka
      RAPIA: Modified beam trawl with a rigid mouth (Width-3.5 m Weight-225 kg Four
        120-mm wide skids 46-mm codend mesh size)
      ROT: Rock hopper otter trawl
      SON: Sonderborg trawl
      SOV: SOV-NET
      TVCOD: Trawl model TV112-24-646
      TVL: Large TV trawl
      TVM: Bottom trawl TV3-280x80
      TVS: Small TV trawl
      US4: US 4 Seam 3 Bridle
      VIN: Vinge trawl
      W2A: Western IIA
      Y36: 'Yankee #36'
    details: >-
      Legacy field name: Gear. All 99 active icesVocab Gear Type codes (deprecated
      code OTG excluded). 55 confirmed used in DATRAS archive; 44 additional codes
      are valid ICES definitions (may be used in future submissions or by other surveys).
      Each code has a full description in icesVocab. Validation: enum restricts submissions
      to these codes. values: restricted to the 55 code(s) observed in this table's
      published archive (icesVocab's Gear defines 99 in total). A value outside this
      list in new data fails D04 enum validation and needs review: data error or a
      genuinely new code.
    constraints:
    - primary_key
  - name: SweepLength
    type: number(quantity)
    description: >-
      Length of sweep in metres. Recommended values depend on survey and
      quarter, see survey manuals for further details
    units: m
    range:
    - 0
    - 850
    constraints:
    - assert: SweepLength >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
    details: >-
      Legacy field name: SweepLngt.
  - name: GearExceptions
    type: enum
    description: >-
      Deviations of the standard gear. Depends on survey, see survey manuals
      for further details.
    values:
      B: Bobbins
      D: Double sweeps
      DB: Double beam, catch from two beam trawls put together
      I2: Groundgear D with 16" bobbins
      R: Rockhopper
      S: Standard
      S2: Groundgear with 16" hoppers
      SB: Single beam, catch from one beam trawl
    details: >-
      Legacy field name: GearEx. icesVocab's TS_GearEx resolves this as a
      controlled 13-code gear-exception list (AC_GearExceptions also registered, a
      1-code subset -- never the right prefix for a DATRAS field, Issue 8). Against
      the real archive: CA uses 11 of 13 codes, HH and HL 9 of 13 each, LT 8 of 13;
      0 real values fall outside the vocab in any table. values: restricted to the
      8 code(s) observed in this table's published archive (icesVocab's TS_GearEx
      defines 13 in total). A value outside this list in new data fails D04 enum validation
      and needs review: data error or a genuinely new code.
  - name: DoorType
    type: enum
    description: >-
      Type of door used
    values:
      F: Flat
      P: Polyvalent
      PE: Portuguese Euronete round nose
      PI: Poly Ice Oval
      R: Rectangle
      T: Thyboroen Trawl Doors Type 2
      T4: Thyboroen Trawl Doors Type 4
      T6: Thyboroen Type 16 straight oval doors
      V: Vee
      WR: Wooden rectangular doors
    details: >-
      Legacy field name: DoorType. icesVocab's TS_DoorType resolves this
      as a controlled 12-code gear-door-type list (AC_DoorType also registered, never
      the right prefix for a DATRAS field -- Issue 8). Against the real archive: CA
      and HH each use 11 of 12 codes, HL 11 of 12, LT 6 of 12; 0 real values fall
      outside the vocab in any table. values: restricted to the 10 code(s) observed
      in this table's published archive (icesVocab's TS_DoorType defines 12 in total).
      A value outside this list in new data fails D04 enum validation and needs review:
      data error or a genuinely new code.
  - name: StationName
    type: string
    description: >-
      Station number. National coding system, not defined by ICES.
    examples:
    - '1'
    - '2'
    - '22'
    - '9'
    - '17'
    details: >-
      Legacy field name: StNo. Field's own description says this is a national
      coding system, not defined by ICES -- examples show the common shape (short
      numeric-looking strings), not an exhaustive domain; not a coded field, so no
      icesVocab entry is expected (none of the 580 registered vocab keys match). Of
      150,217 HH rows (24,484 distinct values), -9 accounts for exactly 6,899, stripped
      to null in the published archive. ICES's own field-description spreadsheet
      confirms the ICES-wide '-9 = no information' convention applies here, same
      as HaulNo above. Unlike HaulNo's own -9 sentinel, this isn't an orphaning
      problem: CA's own matching StNo=-9 rows for these same hauls (191,893 rows)
      join HH successfully via the other 7 composite-key fields, since both sides
      consistently carry -9 for the same haul rather than disagreeing.
    constraints:
    - primary_key
  - name: HaulNumber
    type: number(ordinal)
    description: >-
      Sequential numbering of hauls during cruise.
    range:
    - 0
    - 82483
    constraints:
    - required
    - primary_key
    details: >-
      Legacy field name: HaulNo. Sequential per-cruise numbering, but countries
      vary in whether it resets each cruise or runs continuously -- the archive-wide
      range spans many cruises' own counts pooled together, not one cruise's own
      haul tally. No icesVocab entry exists under any name or prefix (none of the
      580 registered vocab keys match) -- expected for a plain sequential identifier,
      not a coded field. ICES's own field-description spreadsheet confirms Mandatory:
      Yes and documents an ICES-wide convention applicable to any field with a header:
      submit -9 for 'no information' -- so the -9 sentinel seen in CA (see known-issues.yaml:
      ca_haulno_unlinkable_to_hh) is a sanctioned value, not an undocumented one.
  - name: Year
    type: number(ordinal)
    description: >-
      Cruise year (YYYY)
    range:
    - 1965
    - 2026
    constraints:
    - required
    - primary_key
    details: >-
      Legacy field name: Year.
  - name: Month
    type: number(ordinal)
    description: >-
      Sampling month, as part of the calendar date.
    range:
    - 1
    - 12
    details: >-
      Legacy field name: Month. Retyped from enum to number(ordinal) 2026-08-29,
      for the same reason as Quarter above: the live WSDL declares this int, the archive
      stores it int, and an enum's underlying data must be string-like. The former
      values: map ('1' -> January) is a calendar convention, not DATRAS-specific
      knowledge, so dropping it loses nothing. icesVocab's TS_Month also resolves
      this field (a bare 'Month' key is separately registered too, redundant with
      TS_Month). Against the real archive: HH uses all 12 codes, LT 11 of 12; 0 real
      values fall outside the vocab in either table.
    constraints:
    - required
  - name: Day
    type: number(ordinal)
    description: >-
      Sampling day, as part of the calendar date
    range:
    - 1
    - 31
    constraints:
    - required
    details: >-
      Legacy field name: Day.
  - name: StartTime
    type: string
    description: >-
      Start time (GMT) of haul (HHMM), 4 digits. E.g. 10:15=1015
    examples:
    - '0000'
    - '0600'
    - '1159'
    - '1759'
    - '2359'
    details: >-
      Legacy field name: TimeShot. 1,440 distinct values, always populated
      (HH 150,217/150,217, LT 79,451/79,451). Field's own description implies a fixed
      4-digit HHMM ('E.g. 10:15=1015'); real values are zero-padded to 4 digits
      (e.g. '0730', not '730'), confirmed against the full archive: 100% 4-char,
      0 true nulls as submitted, so these counts are the -9s, stripped to null in
      the published archive. Only present in HH and LT, same as {StatisticalRectangle
      or StatRec} below.
    constraints:
    - required
  - name: DepthStratum
    type: string
    description: >-
      Depth stratum in classes. Depth strata are survey specific, see survey
      manuals for details.
    examples:
    - 'D2'
    - '10'
    - '9'
    - '11'
    - 'D1'
    details: >-
      Legacy field name: DepthStratum. Field's own description says depth
      strata are survey-specific, not an ICES-wide vocabulary -- examples illustrate
      the shape seen in practice (mix of letter-prefixed and bare-number codes), not
      an exhaustive domain. Of 150,217 rows: the -9 sentinel is dominant (74,465 rows,
      49.57%) -- 0 true nulls as submitted, so this count is the -9s, stripped to
      null in the published archive.
    label: Depth Stratum
  - name: HaulDuration
    type: number(quantity)
    description: >-
      Haul duration in minutes. Start time is the moment when the gear
      settles at the bottom at the stated towing speed. Stop is defined as the start
      of hauling of the gear.
    units: min
    range:
    - 1
    - 120
    details: >-
      Legacy field name: HaulDur. A haul cannot take zero or negative time;
      217 rows recorded as exactly 0 and 2 as negative (-514, -238) are excluded,
      most likely unrecorded/placeholder rather than a genuine instantaneous haul.
      Upper bound set at 2 hours: DATRAS carries no passive/soak gear, so a longer
      tow is highly suspect -- observed values run as high as 1470 min with no repeating
      marker pattern (i.e. not a clean sentinel, just unreliable).
    label: Haul Duration (minutes)
    constraints:
    - required
    - assert: HaulDuration >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
  - name: DayNight
    type: enum
    description: >-
      Timing of sampling: at daytime or at night. See survey manuals for
      further details
    values:
      D: Day
      'N': Night
    details: >-
      Legacy field name: DayNight. icesVocab's TS_DayNight resolves this
      as a controlled 2-code list. Against the real HH archive: both codes in use,
      a clean bidirectional match.
    constraints:
    - required
  - name: ShootLatitude
    type: number(quantity)
    description: >-
      Decimal latitude position on the shooting location
    units: decimal degrees
    range:
    - 36.0013
    - 76.2117
    constraints:
    - required
    details: >-
      Legacy field name: ShootLat.
  - name: ShootLongitude
    type: number(quantity)
    description: >-
      Decimal longitude position on the shooting location
    units: decimal degrees
    range:
    - -67.7115
    - 24.4333
    details: >-
      Legacy field name: ShootLong. A genuine value of exactly -9.0000 degrees
      (9 deg W, an ordinary DATRAS longitude off Ireland/Iberia) would be indistinguishable
      from missing here: icesDatras's fetch pipeline scrubs literal -9 to NA for
      every numeric column, not just where -9 is a documented sentinel.
    constraints:
    - required
  - name: HaulLatitude
    type: number(quantity)
    description: >-
      Decimal latitude position on the hauling location
    units: decimal degrees
    range:
    - 36.0013
    - 65.0
    details: >-
      Legacy field name: HaulLat. 3 rows record exactly 0 degrees (the equator),
      categorically outside any DATRAS survey area -- excluded; the lower bound instead
      matches ShootLat's own clean minimum for the same archive.
    todo: ICES's field-description spreadsheet marks this Mandatory, but 20.6% of
      HH's real archive rows are null -- a genuine gap between documented and actual
      submission behavior, not yet added as `required` pending review (see data-raw/audit/build_field_gap_audit.R).
  - name: HaulLongitude
    type: number(quantity)
    description: >-
      Decimal longitude position on the hauling location
    units: decimal degrees
    range:
    - -67.6762
    - 45.8753
    details: >-
      Legacy field name: HaulLong. Same -9-as-missing caveat as ShootLong
      above (0 degrees, the Prime Meridian, is a genuine North Sea value here and
      is kept).
    todo: ICES's field-description spreadsheet marks this Mandatory, but 20.7% of
      HH's real archive rows are null -- a genuine gap between documented and actual
      submission behavior, not yet added as `required` pending review (see data-raw/audit/build_field_gap_audit.R).
  - name: StatisticalRectangle
    type: string
    description: >-
      Intended ICES statistical area rectangle (0.5 degrees latitude, 1
      degree longitude)
    examples:
    - '37F8'
    - '35F5'
    - '36F7'
    - '32F3'
    - '36F6'
    details: >-
      Legacy field name: StatRec. Real ICES statistical rectangle codes (0.5
      deg lat x 1 deg lon grid), not a fixed enum given the size of the grid -- independently
      corroborated by ICES's own field-description spreadsheet, which describes this
      field via the same geometric grid rule rather than a code list. Only present
      in HH and LT -- consistent with LT's assessment output joining in a set of
      HH-style columns. Of 150,217 HH rows (700 distinct values), -9 accounts for
      exactly 12,235, stripped to null in the published archive.
  - name: BottomDepth
    type: number(quantity)
    description: >-
      Sampling depth in metres, measured from the water surface.
    units: m
    range:
    - 1
    - 3098
    todo: ICES's field-description spreadsheet marks this Mandatory, but 1.2% of HH's
      real archive rows are null -- a genuine gap between documented and actual submission
      behavior, not yet added as `required` pending review (see data-raw/audit/build_field_gap_audit.R).
    constraints:
    - assert: BottomDepth >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
    details: >-
      Legacy field name: Depth.
  - name: HaulValidity
    type: enum
    description: >-
      Haul validity code
    values:
      A: Additional valid stations not used for index calculations
      C: Calibrated (BITS only)
      I: Invalid haul
      M: Pelagic Midwater Trawl (BITS only)
      'N': No oxygen (BITS only)
      V: Valid haul
    details: >-
      Legacy field name: HaulVal. icesVocab's TS_HaulVal resolves this as
      a controlled 7-code haul-validity list. Against the real archive: HH uses 6
      of 7 codes, LT 4 of 7; 0 real values fall outside the vocab in either table.
      values: restricted to the 6 code(s) observed in this table's published archive
      (icesVocab's TS_HaulVal defines 7 in total). A value outside this list in new
      data fails D04 enum validation and needs review: data error or a genuinely new
      code.
    constraints:
    - required
  - name: HydrographicStationID
    type: string
    description: >-
      The national hydrographic station number. If possible, align with
      information submitted to ocean.ices.dk
    examples:
    - 74SC0000
    - '88888888'
    - '1'
    - '0'
    - '3'
    details: >-
      Legacy field name: HydroStNo. National station numbering (field's own
      description), so examples are illustrative only, not an exhaustive domain. '88888888'
      recurs and reads like an undocumented all-8s placeholder/sentinel (the same
      kind of pattern seen elsewhere in HH, e.g. HaulDuration's zeros) rather than
      a real station ID, but is kept in `examples` (unlike a `range` exclusion, `examples`
      isn't a validity gate) since a reader should know it's a real recurring value.
      Of 150,217 rows: 0 true nulls as submitted -- 72,526 (48.28%) carry either the
      -9 sentinel (70,891, stripped to null in the published archive) or the 88888888
      placeholder (1,635, retained as a real code), the rest a real station ID.
  - name: StandardSpeciesCode
    type: enum
    description: >-
      Information on the whether standard species have been recorded. Standard
      species depend on survey, see survey manuals for details.
    values:
      '0': No standard species recorded
      '1': All standard species recorded
      '3': Roundfish standard species recorded
      '4': Individual standard species recorded
    details: >-
      Legacy field name: StdSpecRecCode. icesVocab's TS_StdSpecRecCode resolves
      this as a controlled 5-code list (0=No standard species recorded, 1=All, 2=Pelagic,
      3=Roundfish, 4=Individual standard species recorded). Against the real HH archive:
      4 of 5 codes in use, 0 real values outside the vocab. values: restricted to
      the 4 code(s) observed in this table's published archive (icesVocab's TS_StdSpecRecCode
      defines 5 in total). A value outside this list in new data fails D04 enum validation
      and needs review: data error or a genuinely new code.
    constraints:
    - required
  - name: BycatchSpeciesCode
    type: enum
    description: >-
      Information on which bycatch species have been recorded.
    values:
      '0': No by-catch species recorded
      '1': Open ended by-catch list - all species, even species complexes
      '2': Closed by-catch list - All species recorded
      '3': Closed by-catch list - Gadoid species recorded
      '4': Closed by-catch list - Flatfish species recorded
      '5': Closed by-catch list - Various species recorded
      '6': Open ended fish species list and limited benthos list
    details: >-
      Legacy field name: BySpecRecCode. icesVocab's TS_BySpecRecCode resolves
      this as a controlled 7-code list. Against the real HH archive: all 7 codes in
      use, a clean bidirectional match.
    constraints:
    - required
  - name: DataType
    type: enum
    description: >-
      Specification of the data aggregation in the HL record. C: CPUE
      (per hour) data; TotalNo and CatCatchWgt are adjusted per hour trawling. R (raw),
      S (subsample of the entire catch): data as recorded during the cruise, and P
      (pseudocategory sampling, only used by Scotland).
    values:
      '-9': Invalid hauls
      C: Data calculated as CPUE (number per hour)
      P: Pseudocategory sampling
      R: Data by haul
      S: Sub sampled data
    details: >-
      Legacy field name: DataType. icesVocab's TS_DataType gives -9 its own
      specific meaning: 'Invalid hauls' -- not a generic missing-value placeholder
      like most of this field's sibling enums (part of a full sweep of every enum
      field with -9 as a declared code; see articles/technical-notes.qmd). Low prevalence
      in both tables that carry it (HH: 40/150,217 rows, 0.03%; LT: 21/79,451, 0.03%)
      -- DataType is sentinel policy 'keep', so these remain literal -9s.
    constraints:
    - required
  - name: NetOpening
    type: number(quantity)
    description: >-
      Mean value in metres of vertical net opening measurements. For details
      see the survey manual.
    units: m
    range:
    - 0.0
    - 76.0
    details: >-
      Legacy field name: Netopening. -9 is the ICES-wide sanctioned 'no information'
      convention (data-raw/audit/build_field_description_snapshot.R): HH 76,448/150,217
      rows (50.89%), LT 32,465/79,451 rows (40.86%), 0 true nulls as submitted, so
      these counts are the -9s, stripped to null in the published archive -- the modal
      value in both tables, not the exception.
    constraints:
    - assert: NetOpening >= 0
      description: >-
        Physically non-negative quantity; a negative value can only be
        a data error.
  - name: Rigging
    type: enum
    description: >-
      The way the gear is rigged. Rigging depends on survey, see survey
      manuals for further details.
    values:
      BC: Bobbin, tickler, chain groundrope
      BM: Bobbin, mixed metal-nylon groundrope
      BN: Bobbin, nylon groundrope
      D: Tooth tickler
      F: Flip-up rope
      FB: Flip-up rope and chain mat, poly prop net with blinder
      FM: Flip-up rope and chain mat, standard net with blinder
      FT: Flip-up rope and tickler chains
      FW: Flip-up rope and chain mat, poly prop net without blinder
      M: Chain mat
      T: Tickler chains
      TS: Tickler and sumwing
    details: >-
      Legacy field name: Rigging. icesVocab's TS_Rigging resolves this as
      a controlled 15-code list. Against the real archive: HH uses 13 of 15 codes,
      LT 9 of 15; 0 real values fall outside the vocab in either table. values: restricted
      to the 12 code(s) observed in this table's published archive (icesVocab's
      TS_Rigging defines 15 in total). A value outside this list in new data fails
      D04 enum validation and needs review: data error or a genuinely new code.
  - name: Tickler
    type: enum
    description: >-
      Amount of ticklers connected to the gear.
    values:
      '-9': No ticklers are allowed
      '0': Zero ticklers
      '1': One tickler
      '10': Ten ticklers
      '20': Twenty ticklers
      '21': Twenty one ticklers
      '27': Twenty seven ticklers
      '4': Four ticklers
      '5': Five ticklers
      '8': Eight ticklers
    details: >-
      Legacy field name: Tickler. icesVocab's TS_Tickler resolves this as
      a controlled tickler-chain count code list (32 active codes: 0-30, plus a '-9'/'no
      ticklers allowed' sentinel) -- not an open numeric quantity. Against the real
      archive: HH shows 10 distinct values (-9, 0, 1, 4, 5, 8, 10, 20, 21, 27) and
      LT 4 (-9, 0, 5, 8, a subset of HH's own); -9 is the dominant value in both
      (78% of HH, 41% of LT), not absent -- zero gaps against the vocab's 32 codes,
      either direction. Live WSDL (getHHdata) declares this field int, not string
      -- an accepted, permanent M01 divergence between the WSDL-driven archive and
      this curated enum spec (see Valid_Aphia's own note for the general pattern),
      not a bug to fix by changing either side. values: restricted to the 10 code(s)
      observed in this table's published archive (icesVocab's TS_Tickler defines
      32 in total). A value outside this list in new data fails D04 enum validation
      and needs review: data error or a genuinely new code.
