    details: 'Litter (plastic) type code, no description present. icesVocab''s TYPPL
      list confirms all five (checked 2026-07-29): PE=Polyethylene, PET=Polyethylene
      terephthalate, PP=Polypropylene, PS=Polystyrene, UPL=Undefined plastic. 6 of
